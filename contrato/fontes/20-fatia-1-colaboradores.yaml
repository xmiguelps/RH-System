# Fatia 1: colaboradores e base transversal.
# Telas com print: RH 01, 02, 03, 09, 10, 29, 30, 31 e gestor 52 (aba Dados).
# Telas sem print (descritas aqui): convite, redefinição e troca de senha, "Meus documentos".
# As abas Ponto, Férias, Holerites, Treinamentos e Advertências da ficha são de outras fatias.
tags:
  - name: Colaboradores
    description: Lista, cadastro, ficha (aba Dados), edição, desligamento agendado, readmissão e a equipe do gestor.
  - name: Documentos do colaborador
    description: Aba Documentos da ficha (RH) e a tela "Meus documentos" (a própria pessoa).
  - name: Cadastros de apoio
    description: Cargos, setores, gestores (com a marcação de gestor ausente) e benefícios do catálogo.
  - name: Empresa
    description: Configuração da empresa (nome, UF, município, horário padrão e dia de pagamento), em Cadastros, Empresa (só o RH altera).
  - name: Usuários do sistema
    description: Logins de acesso ao portal, com convite, ativar e desativar.
  - name: Auditoria
    description: Log de tudo o que acontece no portal (só leitura) e exportação em CSV.
  - name: Senha e convite
    description: Convite de acesso, "esqueci minha senha" e troca de senha.

paths:
  # ------------------------------------------------------------------
  # Colaboradores (RH)
  # ------------------------------------------------------------------
  /api/rh/funcionarios:
    get:
      tags: [Colaboradores]
      operationId: listarFuncionarios
      summary: Lista os colaboradores, com busca e filtros por situação, setor e contrato.
      description: |
        Tela 01 (Colaboradores). Só o perfil `RH`.

        **Busca (`busca`):** procura no nome (parte do nome, sem diferenciar maiúsculas nem acentos), no CPF
        (só os dígitos contam; pontos e traço são ignorados) e na matrícula.

        **Situação (`situacao`)** corresponde às abas da tela: `ATIVO` (padrão: pessoas ativas cuja admissão já
        começou, **inclusive** quem está de férias ou com atestado), `EM_ADMISSAO` (ativas com data de admissão
        no futuro; não existe coluna para isso, é só a data) e `INATIVO`. Cada linha traz a mesma `situacao`.

        **Etiqueta "Situação hoje" de cada linha** (duas partes, para não haver duas definições da mesma coisa):
        `situacao` (cadastral, acima) e `situacaoHoje`, que é o `SituacaoHoje` de `CONVENCOES.md`, seção 10
        (`TRABALHANDO`, `FERIAS`, `ATESTADO`, `SEM_REGISTRO`, `AINDA_NAO_COMECOU`, `SEM_EXPEDIENTE`). `situacaoHoje`
        vem `null` quando `situacao` não é `ATIVO` (pessoa em admissão ou inativa não tem expediente a considerar).
        **A etiqueta que a tela mostra:** `situacao = INATIVO` mostra "Inativo"; `EM_ADMISSAO` mostra "Em admissão";
        para `ATIVO`, `situacaoHoje = FERIAS` mostra "Férias", `ATESTADO` mostra "Atestado" e qualquer outro valor
        mostra "Ativo".

        **Totais (`totais`)** são da empresa inteira e **ignoram** todos os filtros: alimentam a frase
        "101 ativos, 3 em admissão e 7 inativos" e os números das abas (o Figma mostra "2 em admissão"; o cenário de
        demonstração de hoje tem 3, porque duas pessoas foram importadas hoje, ver `ELENCO.md`). `total` (da paginação)
        respeita os filtros. Os três totais contam **cadastros**: quem volta à empresa pela readmissão sai de `inativos`
        e passa a `emAdmissao` ou `ativos`, conforme a nova data de admissão. No cenário de demonstração a aba "Em
        admissão" tem 3 pessoas: Rafael Torres (104, começa em 2026-10-13), Tiago Nogueira (105) e Aline Carvalho (202),
        estes dois importados hoje (fatia 2) e com início em 2026-10-19.

        Ordenação padrão: `NOME` crescente. A etiqueta "Experiência" do Figma **não existe** (decisão do dono).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
        - name: situacao
          in: query
          description: Aba da lista. Padrão `ATIVO`.
          schema: { $ref: '#/components/schemas/FuncionarioSituacao' }
        - name: setorId
          in: query
          description: Só as pessoas deste setor.
          schema: { type: integer }
        - name: tipoContrato
          in: query
          description: Só as pessoas com este tipo de contrato.
          schema: { $ref: '#/components/schemas/FuncionarioTipoContrato' }
        - name: ordenarPor
          in: query
          description: Coluna da ordenação. Padrão `NOME`.
          schema: { type: string, enum: [NOME, DATA_ADMISSAO], default: NOME }
        - $ref: '#/components/parameters/Direcao'
      responses:
        '200':
          description: Uma página de colaboradores e os totais por situação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioListaRespostaRh' }
              example:
                itens:
                  - id: 12
                    nome: Bruno Lima
                    emailCorporativo: bruno.lima@empresa.com.br
                    cargo: Analista pleno
                    setor: Financeiro
                    dataAdmissao: '2022-03-14'
                    situacao: ATIVO
                    situacaoHoje: ATESTADO
                  - id: 4
                    nome: Carla Mendes
                    emailCorporativo: carla.mendes@empresa.com.br
                    cargo: Assistente administrativa
                    setor: Administrativo
                    dataAdmissao: '2023-08-02'
                    situacao: ATIVO
                    situacaoHoje: SEM_REGISTRO
                  - id: 2
                    nome: Sofia Ramos
                    emailCorporativo: sofia.ramos@empresa.com.br
                    cargo: Analista de RH
                    setor: Recursos Humanos
                    dataAdmissao: '2020-11-11'
                    situacao: ATIVO
                    situacaoHoje: TRABALHANDO
                pagina: 1
                tamanhoPagina: 20
                total: 101
                totalPaginas: 6
                totais: { ativos: 101, emAdmissao: 3, inativos: 7 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Colaboradores]
      operationId: criarFuncionario
      summary: Cadastra um colaborador e, se marcado, envia o convite de acesso.
      description: |
        Tela 02 (Adicionar colaborador, painel lateral). Só o perfil `RH`.

        Grava o colaborador, os dados pessoais (CPF e telefone), os benefícios escolhidos e, com
        `enviarConvite = true`, cria o login e coloca o e-mail de convite na fila (ver "Senha e convite").
        Tudo na mesma transação. **Ninguém recebe senha:** o login nasce sem senha utilizável.
        O convite depende das **tabelas novas da aplicação** de convite (`V033`, com a marca de senha provisória `V032`) e de
        fila de e-mails (`V035`).

        **Regras**
        - A **matrícula** é **gerada pelo sistema** (contador `SEQUENCIAS`, script `V030`) e é somente leitura (não vem no corpo).
        - O **gestor** é o gestor do setor escolhido (a tela mostra o nome, que vem de `GET /api/rh/setores`).
          Setor sem gestor deixa o colaborador sem gestor (os pedidos de ponto e de férias dele vão direto ao RH,
          `CONVENCOES.md`, seção 9).
        - Cargo, setor e benefícios precisam existir (senão 400 no campo).
        - CPF: 11 dígitos sem pontuação, com os dígitos verificadores corretos (a tela mostra a máscara).
        - O banco é a rede de segurança (422 com `regraDoBanco`): `O gestor informado e um funcionario inativo.`
          (gestor do setor inativo, `codigo: GESTOR_DO_SETOR_INATIVO`), `CPF invalido.`,
          `Nao e possivel ativar beneficio para funcionario inativo.`.
        - Em admissão: se `dataAdmissao` for futura, a pessoa aparece em "Em admissão" até o dia.
        - **Quem já trabalhou na empresa e volta não é cadastrado de novo: é readmitido** (decisão do dono, 2026-10-30;
          `POST /api/rh/funcionarios/{funcionarioId}/readmissao`, botão "Readmitir" da ficha de quem está inativo). O banco
          exige CPF e e-mail corporativo **únicos entre todos os cadastros, inclusive os inativos**
          (`UQ_FUNCIONARIOS_DETALHES_CPF`, `Criacao_Tabelas:186`; `UQ_FUNCIONARIOS_EMAIL_CORPORATIVO`, `:102`; os dois
          `UNIQUE` não têm condição de ativo). Por isso um CPF ou e-mail que já pertence a um cadastro **inativo** dá 409
          `CPF_JA_CADASTRADO` ou `EMAIL_JA_CADASTRADO` com `cadastroExistente` (`ativo = false`), e o texto manda usar
          "Readmitir" na ficha daquela pessoa. Se o cadastro existente está ativo, o 409 só avisa do conflito.

        **Caixas "Depois de salvar" (tela 02), na mesma gravação do cadastro (tudo ou nada: se uma falhar, ninguém é cadastrado):**
        - `incluirNoOnboarding = true` ("Incluir no treinamento Onboarding 2026"): a API inscreve a pessoa em cada treinamento
          de onboarding em vigor, **com o mesmo efeito** de `POST /api/rh/funcionarios/{funcionarioId}/treinamentos/onboarding`
          (`incluirFuncionarioNoOnboarding`, fatia 6; os treinamentos em vigor vêm de `GET /api/rh/treinamentos/onboarding`,
          que o front usa para o texto da caixa e para desligá-la quando a lista vem vazia). Sem treinamento de onboarding
          em vigor: 422 `SEM_TREINAMENTO_DE_ONBOARDING`. Padrão `false`.
        - `formularioAdmissaoId` ("Enviar o formulário de admissão"): o id de um formulário de admissão **publicado**
          (o front o lista com `GET /api/rh/formularios?tipo=ADMISSAO&situacao=PUBLICADO`, fatia 5). A API inclui a pessoa
          como destinatária dele, **com o mesmo efeito** de `POST /api/rh/formularios/{formularioId}/destinatarios`
          (`adicionarDestinatariosFormulario`, fatia 5). `null` (padrão) não envia nada. Formulário que não existe, que não é
          de admissão ou que não está publicado: 400 em `formularioAdmissaoId`. Formulário que não é "para pessoas escolhidas"
          ou que já encerrou: 422 `FORMULARIO_NAO_E_POR_PESSOAS` ou `FORMULARIO_ENCERRADO` (os mesmos de
          `adicionarDestinatariosFormulario`).
        - **Nenhum e-mail sai por estas duas caixas** (lista fechada de e-mails, `CONVENCOES.md`, seção 12): a pessoa vê o
          treinamento e o formulário ao entrar no portal; o e-mail que ela recebe é o do convite de acesso.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioCriarComando' }
            example:
              nome: Rafael Torres
              cpf: '84639271069'
              dataNascimento: '1995-02-09'
              telefone: '11991234567'
              emailCorporativo: rafael.torres@empresa.com.br
              dataAdmissao: '2026-10-13'
              tipoContrato: CLT
              cargoId: 2
              setorId: 1
              perfil: Funcionario
              beneficioIds: [1, 2, 5]
              enviarConvite: true
              incluirNoOnboarding: true
              formularioAdmissaoId: 11
      responses:
        '201':
          description: Colaborador cadastrado. Devolve a ficha completa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaRh' }
              example:
                id: 104
                matricula: '00503'
                nome: Rafael Torres
                emailCorporativo: rafael.torres@empresa.com.br
                cpf: '84639271069'
                telefone: '11991234567'
                dataNascimento: '1995-02-09'
                rg: null
                rgOrgaoEmissor: null
                emailPessoal: null
                endereco: { cep: null, logradouro: null, numero: null, complemento: null, bairro: null, cidade: null, uf: null }
                cargo: { id: 2, nome: Vendedor }
                setor: { id: 1, nome: Comercial }
                gestor: { gestorId: 1, funcionarioId: 7, nome: Carlos Ribeiro }
                tipoContrato: CLT
                jornadaSemanalHoras: 44
                dataAdmissao: '2026-10-13'
                perfil: Funcionario
                ativo: true
                situacao: EM_ADMISSAO
                situacaoHoje: null
                desligamento: null
                beneficios:
                  - { beneficioId: 1, nome: Vale-refeição, quantidadeDependentes: 0 }
                  - { beneficioId: 2, nome: Plano de saúde, quantidadeDependentes: 0 }
                  - { beneficioId: 5, nome: Seguro de vida, quantidadeDependentes: 0 }
                acesso: { situacao: CONVITE_ENVIADO, ativo: true }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '409': { $ref: '#/components/responses/Erro409ColaboradorDuplicado' }
        '422':
          description: Regra de negócio ou do banco. Nada foi cadastrado. Os códigos conhecidos estão em `examples`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                gestorInativo:
                  summary: O gestor do setor está inativo
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: O gestor do setor escolhido está inativo. Troque o gestor do setor em Cadastros antes de continuar.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: GESTOR_DO_SETOR_INATIVO
                    regraDoBanco: O gestor informado e um funcionario inativo.
                semOnboarding:
                  summary: A caixa de onboarding está marcada, mas nenhum treinamento de onboarding está publicado
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Não há treinamento de onboarding publicado. Desmarque a caixa ou publique o treinamento.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: SEM_TREINAMENTO_DE_ONBOARDING
                formularioEncerrado:
                  summary: O formulário de admissão escolhido já encerrou
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: O formulário de admissão escolhido já foi encerrado. Escolha outro.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FORMULARIO_ENCERRADO
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/funcionarios/{funcionarioId}:
    get:
      tags: [Colaboradores]
      operationId: obterFichaDoFuncionario
      summary: Mostra a ficha do colaborador (aba Dados), com CPF e telefone completos.
      description: |
        Tela 03 (Ficha, aba Dados). Só o perfil `RH`; vê **tudo**, inclusive CPF e telefone **completos, sem
        máscara** (decisão do dono, 2026-10-30; o Figma mostra máscara, vale o documento).

        Cabeçalho da tela: "cargo, setor, matrícula" (a matrícula é gerada pelo sistema e só se lê) e a etiqueta de
        situação, que sai de `situacao` e `situacaoHoje` pela mesma regra da lista (`GET /api/rh/funcionarios`: inativo,
        em admissão, férias, atestado ou ativo). `jornadaSemanalHoras` é a carga
        semanal do cargo (o horário é o da empresa, em `GET /api/eu/empresa`). Os cartões de resumo da aba
        (banco de horas, férias etc.) vêm de `GET .../indicadores`. As outras abas são de outras fatias.
        O campo "Unidade" do Figma **não existe** (sem unidades).

        **Botões do cabeçalho conforme `situacao`:** "Inativar" (`POST .../desligamento`) só para quem **não** está
        `INATIVO`; "Readmitir" (`POST .../readmissao`) **só** para quem está `INATIVO` (o Figma só desenha o
        "Inativar"; o "Readmitir" é novo, decisão do dono, 2026-10-30).

        Quem foi criado antes da fatia 1 (o administrador do seed) pode não ter dados pessoais: `cpf` vem `null`
        e a edição o exige.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: A ficha do colaborador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaRh' }
              example:
                id: 12
                matricula: '00482'
                nome: Bruno Lima
                emailCorporativo: bruno.lima@empresa.com.br
                cpf: '12348237130'
                telefone: '11987654410'
                dataNascimento: '1990-06-18'
                rg: '45.678.912-3'
                rgOrgaoEmissor: SSP-SP
                emailPessoal: bruno.lima@email.com
                endereco:
                  cep: '01310100'
                  logradouro: Avenida Paulista
                  numero: '1578'
                  complemento: apto 42
                  bairro: Bela Vista
                  cidade: São Paulo
                  uf: SP
                cargo: { id: 8, nome: Analista pleno }
                setor: { id: 2, nome: Financeiro }
                gestor: { gestorId: 2, funcionarioId: 8, nome: Marina Costa }
                tipoContrato: CLT
                jornadaSemanalHoras: 44
                dataAdmissao: '2022-03-14'
                perfil: Funcionario
                ativo: true
                situacao: ATIVO
                situacaoHoje: ATESTADO
                desligamento: null
                beneficios:
                  - { beneficioId: 1, nome: Vale-refeição, quantidadeDependentes: 0 }
                  - { beneficioId: 2, nome: Plano de saúde, quantidadeDependentes: 1 }
                  - { beneficioId: 4, nome: Vale-transporte, quantidadeDependentes: 0 }
                  - { beneficioId: 5, nome: Seguro de vida, quantidadeDependentes: 0 }
                acesso: { situacao: SENHA_DEFINIDA, ativo: true }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    put:
      tags: [Colaboradores]
      operationId: editarFuncionario
      summary: Altera os dados cadastrais do colaborador (botão "Editar dados").
      description: |
        Tela 03, botão "Editar dados". Só o perfil `RH` (o gestor **não** edita cadastro). É uma substituição
        completa dos campos editáveis: o front carrega a ficha, a pessoa altera e o front devolve tudo.

        Mesmas regras do cadastro (CPF válido e único, e-mail corporativo único). Efeitos:
        - Trocar o **e-mail corporativo** troca o e-mail de login (a pessoa precisa usar o novo).
        - Trocar o **setor** refaz o gestor da pessoa (o gestor do novo setor); se o gestor do novo setor for a
          própria pessoa, ela fica sem gestor (o banco recusa "gestor de si mesmo").
        - `beneficioIds` é a lista de benefícios **ativos** desejada: os que entram são ativados (aprovados),
          os que saem são desativados. Pedidos de adesão pendentes (fatia 7) não são tocados.
        - Quem não tinha dados pessoais (administrador do seed) passa a tê-los ao salvar.
        - Não existe edição de matrícula, de situação nem de nível de acesso do **próprio** RH logado
          (`422 NAO_PODE_ALTERAR_O_PROPRIO_PERFIL`), para ninguém tirar o próprio acesso sem querer.
        - Quem **gerencia um setor** precisa ter o nível `Gestor`: trocar o `perfil` dessa pessoa para outro valor dá
          422 `GESTOR_PRECISA_TER_PERFIL_GESTOR` (o RH tira a pessoa do setor antes, em `PUT /api/rh/setores/{setorId}`).
        - Inativar é feito em `/desligamento`; quem está inativo e volta à empresa é **readmitido** em `/readmissao`
          (esta rota não reativa ninguém).
        Erros de trigger possíveis (422 com `regraDoBanco`): `O gestor informado e um funcionario inativo.`,
        `CPF invalido.`, `Nao e possivel ativar beneficio para funcionario inativo.`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioEditarComando' }
            example:
              nome: Bruno Lima
              cpf: '12348237130'
              dataNascimento: '1990-06-18'
              telefone: '11987654410'
              emailCorporativo: bruno.lima@empresa.com.br
              emailPessoal: bruno.lima@email.com
              rg: '45.678.912-3'
              rgOrgaoEmissor: SSP-SP
              endereco:
                cep: '01310100'
                logradouro: Avenida Paulista
                numero: '1578'
                complemento: apto 42
                bairro: Bela Vista
                cidade: São Paulo
                uf: SP
              dataAdmissao: '2022-03-14'
              tipoContrato: CLT
              cargoId: 8
              setorId: 2
              perfil: Funcionario
              beneficioIds: [1, 2, 4, 5]
      responses:
        '200':
          description: Dados alterados. Devolve a ficha atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaRh' }
              example:
                id: 12
                matricula: '00482'
                nome: Bruno Lima
                emailCorporativo: bruno.lima@empresa.com.br
                cpf: '12348237130'
                telefone: '11987654410'
                dataNascimento: '1990-06-18'
                rg: '45.678.912-3'
                rgOrgaoEmissor: SSP-SP
                emailPessoal: bruno.lima@email.com
                endereco:
                  cep: '01310100'
                  logradouro: Avenida Paulista
                  numero: '1578'
                  complemento: apto 42
                  bairro: Bela Vista
                  cidade: São Paulo
                  uf: SP
                cargo: { id: 8, nome: Analista pleno }
                setor: { id: 2, nome: Financeiro }
                gestor: { gestorId: 2, funcionarioId: 8, nome: Marina Costa }
                tipoContrato: CLT
                jornadaSemanalHoras: 44
                dataAdmissao: '2022-03-14'
                perfil: Funcionario
                ativo: true
                situacao: ATIVO
                situacaoHoje: ATESTADO
                desligamento: null
                beneficios:
                  - { beneficioId: 1, nome: Vale-refeição, quantidadeDependentes: 0 }
                  - { beneficioId: 2, nome: Plano de saúde, quantidadeDependentes: 1 }
                  - { beneficioId: 4, nome: Vale-transporte, quantidadeDependentes: 0 }
                  - { beneficioId: 5, nome: Seguro de vida, quantidadeDependentes: 0 }
                acesso: { situacao: SENHA_DEFINIDA, ativo: true }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409ColaboradorDuplicado' }
        '422':
          description: Regra de negócio ou do banco. Os códigos conhecidos estão em `examples`.
          content:
