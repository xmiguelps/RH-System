      operationId: obterIndicadoresDoFuncionario
      summary: Mostra os cartões de resumo da ficha (banco de horas, férias, advertências, próximo pagamento).
      description: |
        Tela 03: os quatro cartões abaixo dos dados pessoais, na aba Dados. Só o perfil `RH`.

        **Cada número é calculado por outra fatia; esta rota só os junta** (para a aba Dados ter um lugar só de onde ler).
        O valor é o mesmo da rota indicada, e cada campo vem `null` enquanto a fatia que o calcula não existir (o front
        mostra "—"). Nenhuma dessas fatias define este schema; elas só preenchem o que está aqui.

        | Campo | Fatia | De onde vem (mesmo valor) |
        |---|---|---|
        | `bancoDeHorasMinutos` | 3 (ponto) | `saldoMinutos` de `GET /api/rh/funcionarios/{funcionarioId}/ponto/banco-de-horas` |
