  # ------------------------------------------------------------------
  # Empresa
  # ------------------------------------------------------------------
  /api/eu/empresa:
    get:
      tags: [Empresa]
      operationId: obterEmpresa
      summary: Mostra a configuração da empresa (nome, UF, município, horário padrão, dia de pagamento).
      description: |
        Qualquer pessoa logada. O **nome** aparece no menu de todas as telas ("Portal de RH, [Nome da empresa]"); o
        horário padrão é usado pelo ponto; o dia de pagamento, pelo "próximo pagamento". Nada aqui é sigiloso.
        Fica em `/api/eu` por ser lida por todos os perfis; só o RH altera (`PUT /api/rh/empresa`), na tela
        Cadastros, Empresa.

        A tabela nasce **vazia**: enquanto o RH não configurar (a demonstração já vem configurada pelo seed),
        **ler** a empresa responde 404 com `codigo: EMPRESA_NAO_CONFIGURADA`; o front mostra "Portal de RH" sem o nome.
        Uma **outra** operação que precisa da empresa (por exemplo, registrar ponto) responde **422** com o mesmo
        `codigo` (`CONVENCOES.md`, seção 11).
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: A configuração.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaConfiguracao' }
              example:
                nomeEmpresa: Comercial Aurora Ltda
                uf: SP
                municipio: São Paulo
                horarioEntrada: '08:00'
                horarioSaida: '17:48'
                toleranciaAtrasoMinutos: 10
                diaPagamento: 6
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404':
          description: A empresa ainda não foi configurada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Não encontrado.
                status: 404
                detail: A empresa ainda não foi configurada.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMPRESA_NAO_CONFIGURADA
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/empresa:
    put:
      tags: [Empresa]
      operationId: salvarEmpresa
      summary: Cria ou altera a configuração da empresa.
      description: |
        Só o perfil `RH`. A empresa tem **uma única configuração**: o primeiro `PUT` a cria, os seguintes a
        substituem. A **tela não existe no Figma**; decidido (dono, 2026-10-30): fica em **Cadastros, Empresa** (um item novo
        do menu lateral de Cadastros, só para o RH), com um formulário simples com estes campos.

        - `uf` escolhe os feriados estaduais; `municipio`, os municipais (valem para todos: **sem unidades**).
        - `horarioEntrada` e `horarioSaida`: o horário padrão de **todos** (formato `HH:mm`); a saída pode ser
          menor que a entrada (turno que atravessa a meia-noite), por isso a API não compara.
        - `toleranciaAtrasoMinutos`: de 0 a 120; o atraso é medido contra a entrada mais a tolerância.
        - `diaPagamento`: dia do mês da regra padrão (mês sem esse dia: vale o último; fim de semana ou feriado:
          antecipa para o dia útil anterior; as exceções por mês são da fatia 7).
        Entra na auditoria.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaConfiguracao' }
            example:
              nomeEmpresa: Comercial Aurora Ltda
              uf: SP
              municipio: São Paulo
              horarioEntrada: '08:00'
              horarioSaida: '17:48'
              toleranciaAtrasoMinutos: 10
              diaPagamento: 6
      responses:
        '200':
          description: Configuração salva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaConfiguracao' }
              example:
                nomeEmpresa: Comercial Aurora Ltda
                uf: SP
                municipio: São Paulo
                horarioEntrada: '08:00'
                horarioSaida: '17:48'
                toleranciaAtrasoMinutos: 10
                diaPagamento: 6
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

