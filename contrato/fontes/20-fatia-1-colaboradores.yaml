  /api/rh/funcionarios/{funcionarioId}/desligamento:
    post:
      tags: [Colaboradores]
      operationId: inativarFuncionario
      summary: Inativa o colaborador (botão "Inativar"), a partir do último dia de trabalho.
      description: |
        Tela 03, botão "Inativar". Só o perfil `RH`. O front pede a data do **último dia de trabalho** (padrão: hoje).

        **Confirmação na tela:** a tela pede que a pessoa que está desligando **digite "desativar"** para confirmar.
        É proteção **só da interface**: a API **não** recebe nem confere essa palavra (não há campo no corpo).

        **Como funciona (decidido: regra do roadmap, fatia 1):** o banco inativa a pessoa assim que há data de desligamento
        e então recusa a batida de ponto e o lançamento do banco de horas dela. Por isso a API **guarda a data
        como desligamento agendado** e só a grava no colaborador **no dia seguinte ao último dia de trabalho**
        (a partir da fatia 3, depois de o banco de horas daquele dia fechar; se esse momento já passou, grava na
        hora). Resposta: a ficha com `desligamento.situacao = AGENDADO` ou, se já foi gravado, `EFETIVADO`.
        O desligamento agendado e a tarefa que o efetiva no dia seguinte são **tabelas novas da aplicação** (desligamento
        agendado, script `V034`; tarefas agendadas, script `V036`).

        Ao efetivar, o banco faz sozinho o que o grupo definiu: desativa o login, desativa os benefícios e cancela
        as férias futuras (`SOLICITADA` ou `APROVADA`), **sem aviso à pessoa e sem registro próprio dessas
        consequências** (decisão do dono, 2026-10-28). Nada é apagado: a pessoa continua no banco com o histórico.
        **Não há reativação** do cadastro por esta família de rotas: quem volta à empresa é **readmitido**
        (`POST /api/rh/funcionarios/{funcionarioId}/readmissao`, decisão do dono, 2026-10-30), sobre o mesmo cadastro
        (o CPF e o e-mail continuam ocupados por ele, por isso não se cadastra de novo).

        Se a pessoa é **gestor de um setor**, o setor continua apontando para ela depois de inativa: ao **efetivar**, os
        pedidos de ponto e de férias que **já esperavam por ela** passam para a etapa do RH, e os pedidos novos da equipe
        vão direto ao RH (`CONVENCOES.md`, seção 9, "gestor desligado") até o RH escolher outro gestor em
        `PUT /api/rh/setores/{setorId}`.

        O último dia não pode ser anterior à data de admissão (400 em `ultimoDiaDeTrabalho`).
        Já inativa ou com desligamento já registrado: 409.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioInativarComando' }
            example: { ultimoDiaDeTrabalho: '2026-11-13' }
      responses:
        '200':
          description: Desligamento registrado. Devolve a ficha atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaRh' }
              example:
                id: 12
                matricula: '00482'
                nome: Bruno Lima
                emailCorporativo: bruno.lima@empresa.com.br
                cpf: '12348237130'
                telefone: '11987654410'
                dataNascimento: '1990-06-18'
                rg: '45.678.912-3'
                rgOrgaoEmissor: SSP-SP
                emailPessoal: bruno.lima@email.com
                endereco:
                  cep: '01310100'
                  logradouro: Avenida Paulista
                  numero: '1578'
                  complemento: apto 42
                  bairro: Bela Vista
                  cidade: São Paulo
                  uf: SP
                cargo: { id: 8, nome: Analista pleno }
                setor: { id: 2, nome: Financeiro }
                gestor: { gestorId: 2, funcionarioId: 8, nome: Marina Costa }
                tipoContrato: CLT
                jornadaSemanalHoras: 44
                dataAdmissao: '2022-03-14'
                perfil: Funcionario
                ativo: true
                situacao: ATIVO
                situacaoHoje: ATESTADO
                desligamento: { ultimoDiaDeTrabalho: '2026-11-13', situacao: AGENDADO }
                beneficios:
                  - { beneficioId: 1, nome: Vale-refeição, quantidadeDependentes: 0 }
                  - { beneficioId: 2, nome: Plano de saúde, quantidadeDependentes: 1 }
                  - { beneficioId: 4, nome: Vale-transporte, quantidadeDependentes: 0 }
                  - { beneficioId: 5, nome: Seguro de vida, quantidadeDependentes: 0 }
                acesso: { situacao: SENHA_DEFINIDA, ativo: true }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409':
          description: A pessoa já está inativa ou já tem desligamento registrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Conflito.
                status: 409
                detail: Este colaborador já está inativo ou já tem um desligamento registrado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: DESLIGAMENTO_JA_REGISTRADO
        '500': { $ref: '#/components/responses/Erro500Interno' }
    delete:
      tags: [Colaboradores]
      operationId: cancelarDesligamentoAgendado
      summary: Cancela um desligamento agendado que ainda não foi gravado.
      description: |
        Só o perfil `RH`. Funciona **só** enquanto `desligamento.situacao = AGENDADO`. Depois de `EFETIVADO`
        a pessoa já está inativa: não se cancela, e quem volta à empresa é **readmitido** (`POST .../readmissao`,
        decisão do dono, 2026-10-30); responde 422.
      x-perfis: [RH]
