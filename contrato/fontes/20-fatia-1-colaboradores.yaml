        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/funcionarios/{funcionarioId}/readmissao:
    post:
      tags: [Colaboradores]
      operationId: readmitirFuncionario
      summary: Readmite um colaborador inativo (botão "Readmitir"), com nova data de admissão.
      description: |
        Ficha de quem está **inativo** (tela 03, botão "Readmitir"; o botão não existe no Figma, decisão do dono,
        2026-10-30). Só o perfil `RH`. É uma **nova admissão sobre o mesmo cadastro**: o mesmo `id`, o mesmo CPF, o mesmo
        e-mail corporativo e a mesma matrícula; o histórico (ponto, férias, holerites, advertências, documentos,
        treinamentos) **continua na ficha**. É por isso que o CPF e o e-mail de quem está inativo não se cadastram de novo:
        `POST /api/rh/funcionarios` dá 409 e manda usar esta rota.

        **O que a API faz (tudo ou nada, na mesma gravação):**
        - o cadastro volta a ficar ativo com a nova `dataAdmissao`, o `cargoId`, o `setorId` e o `tipoContrato` do corpo; o
          gestor é o do setor escolhido, como no cadastro; o desligamento anterior sai do cadastro (as datas do vínculo
          anterior, admissão e último dia de trabalho, ficam **só no log de auditoria**, em "o que mudou", porque o banco
          guarda um único par de datas por cadastro). Data de admissão futura: a pessoa fica em "Em admissão" até o dia
          (`situacao = EM_ADMISSAO`);
        - **não restaura** os benefícios nem as férias cancelados na inativação: a pessoa volta **sem benefícios** (o RH os
          dá de novo em "Editar dados") e sem férias futuras;
        - o nível de acesso é o que a pessoa tinha, exceto `Gestor`, que volta como `Funcionario`; se algum setor ainda
          apontava para ela como gestora, o apontamento é desfeito (o RH escolhe o gestor do setor de novo, se quiser, em
          `PUT /api/rh/setores/{setorId}`);
        - `incluirNoOnboarding` e `formularioAdmissaoId` valem como no cadastro (`POST /api/rh/funcionarios`: mesmo efeito,
          mesmos erros 400 e 422, **nenhum e-mail** por essas caixas);
        - entra na auditoria como `ALTEROU` da área `COLABORADORES`.

        **O login não volta sozinho:** a inativação o desativou, e quem o libera é o botão "Ativar" de Usuários do sistema
        (`POST /api/rh/usuarios/{funcionarioId}/ativar`, que passa a valer porque o cadastro está ativo de novo). O **convite só
        se reenvia a quem nunca definiu a senha** (`acesso.situacao` diferente de `SENHA_DEFINIDA`): para essas pessoas,
        `enviarConvite = true` faz de uma vez o "Ativar" e o "Reenviar convite" (o link do convite não valeria com o login
        desativado), com o e-mail de convite na fila. Quem já definiu a senha entra com ela depois do "Ativar", e
        `enviarConvite = true` para ela dá 422 `SENHA_JA_DEFINIDA` (o front só mostra a caixa quando faz sentido). Padrão
        `false`. O convite depende das **tabelas novas da aplicação** de convite (`V033`, com a marca de senha provisória `V032`) e de
        fila de e-mails (`V035`).

        **Erros:** a nova `dataAdmissao` não pode ser anterior ao último dia de trabalho do vínculo anterior (400 em
        `dataAdmissao`); cadastro que **já está ativo** (inclusive com desligamento só agendado: cancele-o antes): 409
        `FUNCIONARIO_JA_ATIVO`; gestor do setor escolhido inativo: 422 `GESTOR_DO_SETOR_INATIVO`; sem treinamento de
        onboarding quando a caixa está marcada: 422 `SEM_TREINAMENTO_DE_ONBOARDING`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioReadmitirComando' }
            example:
              dataAdmissao: '2026-11-03'
              cargoId: 2
              setorId: 1
              tipoContrato: CLT
              incluirNoOnboarding: true
              formularioAdmissaoId: null
              enviarConvite: false
      responses:
        '200':
          description: Colaborador readmitido. Devolve a ficha atualizada (o exemplo mostra a pessoa logo depois de readmitida, com a nova data no futuro e o login ainda desativado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaRh' }
              example:
                id: 201
                matricula: '00417'
                nome: Henrique Alves
                emailCorporativo: henrique.alves@empresa.com.br
                cpf: '29384756083'
                telefone: '11994411208'
                dataNascimento: '1988-04-25'
                rg: '33.215.874-0'
                rgOrgaoEmissor: SSP-SP
                emailPessoal: henrique.alves@email.com
                endereco:
                  cep: '04538132'
                  logradouro: Avenida Brigadeiro Faria Lima
                  numero: '2277'
                  complemento: null
                  bairro: Jardim Paulistano
                  cidade: São Paulo
                  uf: SP
                cargo: { id: 2, nome: Vendedor }
                setor: { id: 1, nome: Comercial }
                gestor: { gestorId: 1, funcionarioId: 7, nome: Carlos Ribeiro }
                tipoContrato: CLT
                jornadaSemanalHoras: 44
                dataAdmissao: '2026-11-03'
                perfil: Funcionario
                ativo: true
                situacao: EM_ADMISSAO
                situacaoHoje: null
                desligamento: null
                beneficios: []
                acesso: { situacao: SENHA_DEFINIDA, ativo: false }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409':
          description: O cadastro já está ativo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Conflito.
                status: 409
                detail: Este colaborador já está ativo. Só se readmite quem está inativo.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_JA_ATIVO
        '422':
          description: Regra de negócio ou do banco. Nada foi alterado. Os códigos conhecidos estão em `examples`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                gestorInativo:
                  summary: O gestor do setor escolhido está inativo
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: O gestor do setor escolhido está inativo. Troque o gestor do setor em Cadastros antes de continuar.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: GESTOR_DO_SETOR_INATIVO
                    regraDoBanco: O gestor informado e um funcionario inativo.
                senhaJaDefinida:
                  summary: Convite pedido para quem já definiu a senha
                  value:
