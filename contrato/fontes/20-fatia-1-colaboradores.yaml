                funcionarioId: 12
                nome: Bruno Lima
                emailCorporativo: bruno.lima@empresa.com.br
                perfil: Funcionario
                situacao: SENHA_DEFINIDA
                ativo: true
                ultimoLoginEmUtc: '2026-10-07T11:58:00Z'
                conviteEnviadoEmUtc: '2022-03-14T12:00:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422': { $ref: '#/components/responses/Erro422FuncionarioInativo' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/usuarios/{funcionarioId}/desativar:
    post:
      tags: [Usuários do sistema]
      operationId: desativarUsuarioDoSistema
      summary: Bloqueia o login de um colaborador (botão "Desativar").
      description: |
        Tela 29, botão "Desativar". Só o perfil `RH`. O login fica bloqueado e as sessões abertas da pessoa são
        encerradas (os refresh tokens são revogados). **Não apaga nada**; "Ativar" desfaz. Quem tenta entrar com a
        senha certa vê "Seu acesso está desativado. Fale com o RH." (403 do login). O RH **não** desativa o
        próprio login (422 `NAO_PODE_DESATIVAR_A_SI_MESMO`). Sem login (`SEM_CONVITE`): 422 `SEM_USUARIO`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: Login bloqueado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioSistemaItem' }
              example:
                funcionarioId: 12
                nome: Bruno Lima
                emailCorporativo: bruno.lima@empresa.com.br
                perfil: Funcionario
                situacao: SENHA_DEFINIDA
                ativo: false
                ultimoLoginEmUtc: '2026-10-07T11:58:00Z'
                conviteEnviadoEmUtc: '2022-03-14T12:00:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A pessoa não tem login, ou o RH tentou desativar o próprio login.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                semUsuario:
                  summary: Ainda não tem login
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Esta pessoa ainda não tem login. Envie o convite primeiro.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: SEM_USUARIO
                proprioLogin:
