      summary: Devolve um link temporário para ver o documento (botão "Ver").
      description: |
        Tela 09, botão "Ver". Só o perfil `RH`. Devolve `LinkTemporario` (o arquivo nunca passa pela API de
        negócio; o link vale poucos minutos e baixa como anexo). O download entra na auditoria.
