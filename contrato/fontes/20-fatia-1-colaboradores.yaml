        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Auditoria
  # ------------------------------------------------------------------
  /api/rh/auditoria:
    get:
      tags: [Auditoria]
      operationId: listarEventosDeAuditoria
      summary: Lista os eventos do log de auditoria, do mais recente ao mais antigo.
      description: |
        Tela 31 (Log de auditoria). Só o perfil `RH`. **Só leitura**: não existe rota para editar nem apagar um
        evento; o texto da tela diz "Nenhuma tela do sistema edita ou apaga estes registros" (decisão do dono).

        **Filtros:** período (`de` e `ate`, datas de calendário no fuso -03:00, **inclusive**; sem eles, vale o
        padrão "Últimos 7 dias" até hoje), `busca` (procura no nome de quem fez e na descrição do registro),
        `area` e `acao`. O rodapé "Mostrando 12 de 1.284 registros dos últimos 7 dias" usa `total`.
        Ordem fixa: do mais recente para o mais antigo.

        **`apenasAlteracoes` (painel do RH):** com `apenasAlteracoes = true` a lista traz só o que **mudou algum dado** e
        deixa de fora as **marcações de ponto** (`area = PONTO` com `acao = REGISTROU`), os **downloads** (`BAIXOU`), os
        **logins** (`ENTROU`) e os **acessos negados** (`ACESSO_NEGADO`); o resto entra (criou, alterou, excluiu, inativou,
        pediu ajuste, aprovou, recusou, publicou, importou e o envio de e-mail da lista fechada). Combina com os demais
        filtros. A tela 31 **não** tem esse filtro; quem o usa é o quadro "Últimas alterações" do painel do RH (tela 00), que
        chama `GET /api/rh/auditoria?apenasAlteracoes=true` e mostra as primeiras linhas (a fatia 7 só cita a rota, não
        copia o schema).

        **O que entra:** criar, alterar e excluir (com antes e depois), login e acesso negado, ponto, envio de
        e-mail (da lista fechada de e-mails, `CONVENCOES.md`, seção 12), importação e download de arquivos, de **todas as
        fatias** (cada fatia registra os seus eventos). Os cancelamentos automáticos da inativação **não** têm registro
        próprio (decisão do dono). **Nunca** aparecem senha, hash nem token; valores de colunas sensíveis não são
        gravados (ver `AuditoriaMudanca.valorOculto`). O log é uma **tabela nova da aplicação** (auditoria; script `V037`).

        **Formulário anônimo (privacidade, decisão do dono, 2026-10-30):** a auditoria **não pode permitir descobrir quem
        respondeu nem quem ainda não participou**. Por isso:
        - o lembrete de um formulário anônimo (o manual do RH e o automático de 7 dias antes do prazo) entra **só como o
          fato de ter sido enviado** ("Lembrete do formulário anônimo ... enviado"): **nunca** o nome de quem recebeu **nem
          quantas pessoas receberam**, nem em `descricao` nem em `registroAfetado` nem em `mudancas`;
        - **responder** e **participar** de um formulário anônimo **não geram evento** com nome e hora (a participação
          existe no banco sem ligar a pessoa à resposta; a auditoria não pode refazer essa ligação);
        - o que o RH faz com o formulário (criar, publicar, encerrar, excluir) entra normalmente, com o autor.
        Nos demais formulários, o lembrete pode trazer o nome do destinatário.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
        - name: de
          in: query
          description: Primeiro dia do período (inclusive). Padrão 6 dias antes de `ate`.
          schema: { type: string, format: date }
        - name: ate
          in: query
          description: Último dia do período (inclusive). Padrão hoje.
          schema: { type: string, format: date }
        - name: area
          in: query
          description: Só eventos desta área ("Todas as áreas" = sem o parâmetro).
          schema: { $ref: '#/components/schemas/AuditoriaArea' }
        - name: acao
          in: query
          description: Só eventos desta ação ("Todas as ações" = sem o parâmetro).
          schema: { $ref: '#/components/schemas/AuditoriaAcao' }
        - name: apenasAlteracoes
          in: query
          description: |
            `true`: só eventos que mudam algum dado, **sem** marcação de ponto (`PONTO` com `REGISTROU`), download (`BAIXOU`),
            login (`ENTROU`) nem acesso negado (`ACESSO_NEGADO`). Usado pelo quadro "Últimas alterações" do painel do RH.
            Padrão `false` (tudo o que o filtro de período mostra).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Uma página de eventos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditoriaListaResposta' }
              example:
                itens:
                  - id: 48215
                    quandoUtc: '2026-10-07T12:41:44Z'
                    ator: { funcionarioId: 1, nome: Ana Souza, tipo: PESSOA, perfil: RH, desligado: false }
                    area: IMPORTACAO
                    acao: IMPORTOU
                    descricao: 'Planilha novos-colaboradores-outubro-corrigido.xlsx (2 colaboradores cadastrados)'
                  - id: 48213
                    quandoUtc: '2026-10-07T12:38:12Z'
                    ator: { funcionarioId: 1, nome: Ana Souza, tipo: PESSOA, perfil: RH, desligado: false }
                    area: COLABORADORES
                    acao: ALTEROU
                    descricao: Cargo de Bruno Lima
                  - id: 48212
                    quandoUtc: '2026-10-07T12:12:03Z'
                    ator: { funcionarioId: 2, nome: Sofia Ramos, tipo: PESSOA, perfil: RH, desligado: false }
                    area: CADASTROS
                    acao: CRIOU
                    descricao: Setor Compras
                  - id: 48199
                    quandoUtc: '2026-10-07T01:47:20Z'
                    ator: { funcionarioId: 201, nome: Henrique Alves, tipo: PESSOA, perfil: Funcionario, desligado: true }
                    area: ACESSO
                    acao: ACESSO_NEGADO
                    descricao: Tentativa de login com usuário bloqueado
                pagina: 1
                tamanhoPagina: 20
                total: 1284
                totalPaginas: 65
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/auditoria/exportacao:
    get:
      tags: [Auditoria]
      operationId: exportarAuditoria
      summary: Baixa o log de auditoria filtrado em CSV (botão "Exportar CSV").
      description: |
        Tela 31, botão "Exportar CSV". Só o perfil `RH`. Aceita os **mesmos filtros da tela** (`de`, `ate`,
        `busca`, `area`, `acao`; o `apenasAlteracoes` é só do painel e não existe aqui), mas **sem paginação**: exporta
        todos os eventos do filtro. Devolve o arquivo com
        `Content-Disposition: attachment`. A exportação entra na auditoria. O nome da rota segue o padrão
        `.../exportacao` das exportações (`CONVENCOES.md`, seção 11; antes era `/exportar`).

        Formato (escolha da sessão): UTF-8 com BOM, separador `;` (abre direto no Excel em português), primeira
        linha com os títulos `Quando;Quem;Perfil;Área;Ação;O que aconteceu;Registro afetado;Origem;IP`. `Quando`
        no fuso -03:00 (`dd/MM/yyyy HH:mm:ss`); `Perfil`, `Área`, `Ação` e `Origem` com os **rótulos da tela**
        ("Colaborador", "Colaboradores", "Alterou", "Portal no navegador" ou "Automático"), não com os códigos. Célula que começa com `=`, `+`, `-` ou `@` é neutralizada
        (decisão 9 do roadmap).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Busca'
        - name: de
          in: query
          description: Primeiro dia do período (inclusive). Padrão 6 dias antes de `ate`.
          schema: { type: string, format: date }
        - name: ate
          in: query
          description: Último dia do período (inclusive). Padrão hoje.
          schema: { type: string, format: date }
        - name: area
          in: query
          description: Só eventos desta área.
          schema: { $ref: '#/components/schemas/AuditoriaArea' }
        - name: acao
          in: query
          description: Só eventos desta ação.
          schema: { $ref: '#/components/schemas/AuditoriaAcao' }
      responses:
        '200':
          description: O arquivo CSV.
          headers:
            Content-Disposition:
              description: 'Anexo, por exemplo `attachment; filename="auditoria-2026-10-07.csv"`.'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
              example: |
                Quando;Quem;Perfil;Área;Ação;O que aconteceu;Registro afetado;Origem;IP
                07/10/2026 09:38:12;Ana Souza;RH;Colaboradores;Alterou;Cargo de Bruno Lima;Colaborador Bruno Lima, matrícula 00482;Portal no navegador;10.0.4.23
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/auditoria/{eventoId}:
    get:
      tags: [Auditoria]
      operationId: obterEventoDeAuditoria
      summary: Mostra os detalhes de um evento (registro afetado, origem e o que mudou).
      description: |
        Tela 31, botão "Detalhes" (a linha se expande). Só o perfil `RH`. `mudancas` traz a tabela
        Campo / Antes / Depois (vazia quando o evento não altera dados, como um login).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamAuditoriaEventoId'
      responses:
        '200':
          description: O evento com os detalhes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditoriaEventoDetalhe' }
              example:
                id: 48213
                quandoUtc: '2026-10-07T12:38:12Z'
                ator: { funcionarioId: 1, nome: Ana Souza, tipo: PESSOA, perfil: RH, desligado: false }
                area: COLABORADORES
                acao: ALTEROU
                descricao: Cargo de Bruno Lima
                registroAfetado: Colaborador Bruno Lima, matrícula 00482
                origem: { canal: PORTAL, ip: 10.0.4.23 }
                mudancas:
                  - { campo: Cargo, antes: Analista, depois: Analista pleno, valorOculto: false }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Senha e convite (telas que não existem no Figma)
  # ------------------------------------------------------------------
  /api/auth/senha/esqueci:
    post:
      tags: [Senha e convite]
      operationId: solicitarRedefinicaoDeSenha
      summary: Pede um link por e-mail para redefinir a senha ("Esqueci minha senha").
      description: |
        Tela "Esqueci minha senha" (**não existe no Figma**: um campo de e-mail e um botão, a partir do login).
        Pública. **Resposta uniforme:** sempre 202, exista o e-mail ou não, esteja a pessoa ativa ou não (a tela
        diz "Se o e-mail estiver cadastrado, enviaremos um link"). Quando o e-mail pertence a um colaborador
        ativo com login, o e-mail com o link é colocado na fila; o link vale **1 hora** e é de **uso único**
        (um pedido novo invalida o anterior). O e-mail tem o botão "Definir nova senha" apontando para
        `<endereço do front>/definir-senha?token=<token>`. Limite de 5 pedidos por minuto por IP (429). O link de
        redefinição e a fila de e-mails são **tabelas novas da aplicação** (token de convite e de redefinição, `V033`; fila de
        e-mails, `V035`).
      x-perfis: [Publico]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteEsqueciSenhaComando' }
            example: { email: bruno.lima@empresa.com.br }
      responses:
        '202': { description: 'Pedido recebido (sempre a mesma resposta).' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/auth/senha/validar-link:
    post:
      tags: [Senha e convite]
      operationId: validarLinkDeSenha
      summary: Confere se o link do convite ou da redefinição ainda vale.
      description: |
        Tela "Definir senha" (**não existe no Figma**): o front a chama ao abrir `/definir-senha?token=...`, antes
        de mostrar o formulário. Pública. Não gasta o link. O `tipo` diz qual texto mostrar: `CONVITE` ("Bem-vindo,
        defina a sua senha") ou `REDEFINICAO` ("Defina uma nova senha"). Link inexistente, já usado ou vencido
        recebem a **mesma** resposta 422 `LINK_INVALIDO_OU_VENCIDO` (não revela qual). O token do convite vale
        **7 dias**; o da redefinição, 1 hora. Limite de 5 tentativas por minuto por IP (429). Os dois tokens vivem na
        **tabela nova da aplicação** de convite e redefinição (script `V033`).
      x-perfis: [Publico]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteLinkValidarComando' }
            example: { token: 9d3f1c7a4b8e42f1a6c05d2e7b9a3f10c4e8d6b2a1f7035e9c8b4a6d2e1f0a37 }
      responses:
        '200':
          description: O link vale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConviteLinkInfo' }
              example:
                tipo: CONVITE
                nome: Rafael Torres
                emailCorporativo: rafael.torres@empresa.com.br
                expiraEmUtc: '2026-10-12T15:30:00Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '422': { $ref: '#/components/responses/Erro422LinkDeSenhaInvalido' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/auth/senha/definir:
    post:
      tags: [Senha e convite]
      operationId: definirSenhaPeloLink
      summary: Define a senha usando o link do convite ou da redefinição.
      description: |
        Tela "Definir senha" (**não existe no Figma**: nova senha, confirmação feita só no front, botão
        "Salvar senha"). Pública. Consome o link (**uso único**: usar de novo dá 422 `LINK_INVALIDO_OU_VENCIDO`)
        e grava o hash da nova senha. No convite, o login passa a `SENHA_DEFINIDA`. Na redefinição, as sessões
        abertas da pessoa são encerradas. Devolve 204; a pessoa então **entra** pela tela de login (não há login
        automático). Se a pessoa estiver inativa ou o login desativado, o link não vale (422, mesma resposta).
        Limite de 5 tentativas por minuto por IP (429). O token consumido é o da **tabela nova da aplicação** de convite
        e redefinição (script `V033`).
      x-perfis: [Publico]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteDefinirSenhaComando' }
            example:
              token: 9d3f1c7a4b8e42f1a6c05d2e7b9a3f10c4e8d6b2a1f7035e9c8b4a6d2e1f0a37
              novaSenha: Aurora#2026Forte
      responses:
        '204': { description: 'Senha definida. A pessoa entra pela tela de login.' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '422': { $ref: '#/components/responses/Erro422LinkDeSenhaInvalido' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/senha:
    post:
      tags: [Senha e convite]
      operationId: trocarMinhaSenha
      summary: Troca a senha de quem está logado (informando a senha atual).
      description: |
        Tela "Trocar senha" (**não existe no Figma**: senha atual, nova senha, confirmação só no front). Qualquer
        pessoa logada. Senha atual errada: 422 `SENHA_ATUAL_INCORRETA` (o front **não** desloga). Com sucesso
        devolve 204; as **outras** sessões da pessoa são encerradas (os outros refresh tokens são revogados) e a
        sessão atual continua. Senhas e hashes nunca aparecem na auditoria. **Limite de tentativas:** 5 tentativas
        de senha atual errada por minuto por pessoa (429), para um token de acesso roubado não servir para
        adivinhar a senha.
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SenhaTrocarComando' }
            example: { senhaAtual: Senha#Forte123, novaSenha: Aurora#2026Forte }
      responses:
        '204': { description: 'Senha trocada.' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '422':
          description: A senha atual está errada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: A senha atual está incorreta.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: SENHA_ATUAL_INCORRETA
        '500': { $ref: '#/components/responses/Erro500Interno' }

components:
  parameters:
    ParamColaboradorId:
      name: funcionarioId
      in: path
      required: true
      description: Id do colaborador.
      schema: { type: integer }
    ParamDocumentoColaboradorId:
      name: documentoId
      in: path
      required: true
      description: Id do documento do colaborador.
      schema: { type: integer }
    ParamCargoId:
      name: cargoId
      in: path
      required: true
      description: Id do cargo.
      schema: { type: integer }
    ParamSetorId:
      name: setorId
      in: path
      required: true
      description: Id do setor.
      schema: { type: integer }
    ParamGestorId:
      name: gestorId
      in: path
      required: true
      description: Id do gestor (o `gestorId` da lista de gestores, não o do colaborador).
      schema: { type: integer }
    ParamBeneficioCatalogoId:
      name: beneficioId
      in: path
      required: true
      description: Id do benefício no catálogo.
      schema: { type: integer }
    ParamAuditoriaEventoId:
      name: eventoId
      in: path
      required: true
      description: Id do evento de auditoria.
      schema: { type: integer, format: int64 }

  responses:
    Erro409ColaboradorDuplicado:
      description: |
        CPF ou e-mail corporativo já pertence a outro cadastro. `cadastroExistente` diz qual (e se está ativo). Quando o
        cadastro existente está **inativo**, o texto manda usar "Readmitir" na ficha dele
        (`POST /api/rh/funcionarios/{funcionarioId}/readmissao`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ColaboradorDuplicadoProblema' }
          examples:
            cpf:
              summary: CPF repetido (cadastro ativo)
              value:
                title: Conflito.
                status: 409
                detail: Já existe um colaborador com este CPF.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: CPF_JA_CADASTRADO
                cadastroExistente: { funcionarioId: 12, nome: Bruno Lima, ativo: true }
            email:
              summary: E-mail corporativo repetido (cadastro ativo)
              value:
                title: Conflito.
                status: 409
                detail: Já existe um colaborador com este e-mail corporativo.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMAIL_JA_CADASTRADO
                cadastroExistente: { funcionarioId: 12, nome: Bruno Lima, ativo: true }
            cpfInativo:
              summary: CPF de um cadastro inativo (usar Readmitir)
              value:
                title: Conflito.
                status: 409
                detail: Este CPF pertence a um cadastro inativo (Henrique Alves). Se a pessoa está voltando à empresa, use "Readmitir" na ficha dela.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: CPF_JA_CADASTRADO
                cadastroExistente: { funcionarioId: 201, nome: Henrique Alves, ativo: false }
            emailInativo:
              summary: E-mail corporativo de um cadastro inativo (usar Readmitir)
              value:
                title: Conflito.
                status: 409
                detail: Este e-mail corporativo pertence a um cadastro inativo (Henrique Alves). Se a pessoa está voltando à empresa, use "Readmitir" na ficha dela.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMAIL_JA_CADASTRADO
                cadastroExistente: { funcionarioId: 201, nome: Henrique Alves, ativo: false }
    Erro409CadastroNomeRepetido:
      description: Já existe um registro com este nome (cargo, setor ou benefício; sem diferenciar maiúsculas).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: Conflito.
            status: 409
            detail: Já existe um cadastro com este nome.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: NOME_JA_CADASTRADO
    Erro409Setor:
      description: Já existe um setor com este nome, ou o gestor escolhido já responde por outro setor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            nomeRepetido:
              summary: Nome de setor repetido (sem diferenciar maiúsculas)
              value:
                title: Conflito.
                status: 409
                detail: Já existe um cadastro com este nome.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: NOME_JA_CADASTRADO
            gestorEmOutroSetor:
              summary: O gestor escolhido já responde por outro setor (um gestor responde por um setor só)
              value:
                title: Conflito.
                status: 409
                detail: Carlos Ribeiro já é o gestor do setor Comercial. Tire-o de lá antes de escolhê-lo aqui.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: GESTOR_JA_RESPONDE_POR_OUTRO_SETOR
    Erro422Setor:
      description: A pessoa escolhida como gestor está inativa (regra do banco) ou não tem o nível `Gestor` (é do RH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            funcionarioInativo:
              summary: A pessoa escolhida está inativa
              value:
                title: Operação recusada.
                status: 422
                detail: A pessoa escolhida está inativa.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_INATIVO
                regraDoBanco: Nao e possivel cadastrar como gestor um funcionario inativo.
            gestorPrecisaTerPerfilGestor:
              summary: A pessoa escolhida é do RH (só quem tem o nível Gestor gerencia um setor)
              value:
                title: Operação recusada.
                status: 422
                detail: Ana Souza tem o nível RH. Só quem tem o nível Gestor pode gerenciar um setor.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: GESTOR_PRECISA_TER_PERFIL_GESTOR
    Erro422FuncionarioInativo:
      description: A pessoa escolhida está inativa (regra do banco).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Operação recusada.
            status: 422
            detail: A pessoa escolhida está inativa.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: FUNCIONARIO_INATIVO
            regraDoBanco: Nao e possivel cadastrar como gestor um funcionario inativo.
    Erro422LinkDeSenhaInvalido:
      description: O link não existe, já foi usado ou venceu (a API não diz qual dos três).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Link inválido ou vencido.
            status: 422
            detail: Este link não vale mais. Peça um novo ao RH ou use "Esqueci minha senha".
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: LINK_INVALIDO_OU_VENCIDO

  schemas:
    # ---------------- colaboradores: enums ----------------
    FuncionarioSituacao:
      type: string
      description: |
        Situação **cadastral** da pessoa, e as abas da lista de colaboradores. `ATIVO`: ativa e com admissão já
        começada (inclui quem está de férias ou com atestado); `EM_ADMISSAO`: ativa e com admissão no futuro; `INATIVO`.
        Não confundir com a situação **de hoje** (`SituacaoHoje`, em `00-base.yaml`, `CONVENCOES.md`, seção 10), que
        diz se a pessoa está trabalhando, de férias, sem registro etc.
      enum: [ATIVO, EM_ADMISSAO, INATIVO]
      default: ATIVO
    FuncionarioTipoContrato:
      type: string
      description: Tipo de contrato. `CLT` e `ESTAGIO` (o Figma só mostra estes dois).
      x-provisorio: >-
        Quais são os tipos de contrato? O banco guarda texto livre (`TIPO_CONTRATO`, sem CHECK) e o dono ainda não
        decidiu a lista. Construído com `CLT` e `ESTAGIO`; mais valores = valor novo no enum (versão menor) e um
        CHECK novo no banco.
      enum: [CLT, ESTAGIO]
    FuncionarioDesligamentoSituacao:
      type: string
      description: |
        `AGENDADO`: o último dia de trabalho foi registrado, mas a pessoa ainda está ativa (a data só é gravada no
        dia seguinte). `EFETIVADO`: já foi gravado e a pessoa está inativa.
      enum: [AGENDADO, EFETIVADO]

    # ---------------- colaboradores: partes ----------------
    CargoReferencia:
      type: object
      description: Identificação curta de um cargo.
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }
    SetorReferencia:
      type: object
      description: Identificação curta de um setor.
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }
    GestorReferencia:
      type: object
      description: O gestor de um setor ou de uma pessoa.
      required: [gestorId, funcionarioId, nome]
      properties:
        gestorId: { type: integer, description: 'Id na lista de gestores (Cadastros).' }
        funcionarioId: { type: integer, description: 'Id do colaborador que é o gestor.' }
        nome: { type: string }
    FuncionarioEndereco:
      type: object
      description: |
        Endereço de casa. O próprio colaborador o completa no formulário de admissão (fatia 5); o RH também edita.
        Todos os campos podem vir `null`.
      required: [cep, logradouro, numero, complemento, bairro, cidade, uf]
      properties:
        cep: { type: [string, 'null'], pattern: '^[0-9]{8}$', description: '8 dígitos, sem hífen.' }
        logradouro: { type: [string, 'null'], maxLength: 150 }
        numero: { type: [string, 'null'], maxLength: 10 }
        complemento: { type: [string, 'null'], maxLength: 100 }
        bairro: { type: [string, 'null'], maxLength: 100 }
        cidade: { type: [string, 'null'], maxLength: 100 }
        uf: { type: [string, 'null'], pattern: '^[A-Z]{2}$', description: 'Sigla do estado, em maiúsculas.' }
    FuncionarioBeneficioItem:
      type: object
      description: Um benefício **ativo** da pessoa (as "pílulas" da ficha, como "Plano de saúde + 1 dependente").
      required: [beneficioId, nome, quantidadeDependentes]
      properties:
        beneficioId: { type: integer }
        nome: { type: string }
        quantidadeDependentes: { type: integer, minimum: 0, description: 'Dependentes aprovados ligados a este benefício (vêm da fatia 7; antes dela, 0).' }
    FuncionarioDesligamento:
      type: object
      description: Desligamento registrado.
      required: [ultimoDiaDeTrabalho, situacao]
      properties:
        ultimoDiaDeTrabalho: { type: string, format: date }
        situacao: { $ref: '#/components/schemas/FuncionarioDesligamentoSituacao' }
    FuncionarioAcesso:
      type: object
      description: 'Situação do login da pessoa (para o menu "..." da ficha: reenviar convite).'
      required: [situacao, ativo]
      properties:
        situacao: { $ref: '#/components/schemas/UsuarioSistemaSituacao' }
        ativo: { type: boolean, description: 'O login está liberado (`false` quando `SEM_CONVITE` ou desativado).' }

    ColaboradorDuplicadoProblema:
      description: Erro 409 de CPF ou e-mail corporativo repetido, com o cadastro que já usa o dado.
      allOf:
        - $ref: '#/components/schemas/ProblemaDeApi'
        - type: object
          required: [cadastroExistente]
          properties:
            cadastroExistente:
              type: object
              description: O cadastro que já tem o CPF ou o e-mail (o RH vê todos os cadastros). Com `ativo = false`, o caminho é "Readmitir".
              required: [funcionarioId, nome, ativo]
              properties:
                funcionarioId: { type: integer }
                nome: { type: string }
                ativo: { type: boolean }

    # ---------------- colaboradores: lista ----------------
    FuncionarioListaItemRh:
      type: object
      description: Uma linha da lista de colaboradores (tela 01).
      required: [id, nome, emailCorporativo, cargo, setor, dataAdmissao, situacao, situacaoHoje]
      properties:
        id: { type: integer }
        nome: { type: string }
        emailCorporativo: { type: [string, 'null'] }
        cargo: { type: [string, 'null'], description: 'Nome do cargo.' }
        setor: { type: [string, 'null'], description: 'Nome do setor.' }
        dataAdmissao: { type: string, format: date }
        situacao: { $ref: '#/components/schemas/FuncionarioSituacao' }
        situacaoHoje:
          description: |
            Situação de hoje (`SituacaoHoje`, `CONVENCOES.md`, seção 10). `null` quando `situacao` não é `ATIVO`.
            A etiqueta da tela sai das duas: ver `GET /api/rh/funcionarios`.
          oneOf:
            - $ref: '#/components/schemas/SituacaoHoje'
            - { type: 'null' }
    FuncionarioListaTotais:
      type: object
      description: Totais da empresa inteira por situação (ignoram os filtros da lista).
      required: [ativos, emAdmissao, inativos]
      properties:
        ativos: { type: integer, minimum: 0 }
        emAdmissao: { type: integer, minimum: 0 }
        inativos: { type: integer, minimum: 0 }
    FuncionarioEquipeItem:
      description: Uma pessoa da equipe do gestor, com a situação de hoje.
      allOf:
        - $ref: '#/components/schemas/FuncionarioResumo'
        - type: object
          required: [situacaoHoje]
          properties:
            situacaoHoje:
              description: Situação de hoje (`SituacaoHoje`, `CONVENCOES.md`, seção 10).
              allOf:
                - $ref: '#/components/schemas/SituacaoHoje'
    FuncionarioEquipeResposta:
      type: object
      description: A equipe do gestor (sem paginação), com as contagens de hoje.
      required: [setor, total, diaUtil, contagensHoje, itens]
      properties:
        setor:
          description: O setor do gestor; `null` se ele não gerencia nenhum.
          oneOf:
            - $ref: '#/components/schemas/SetorReferencia'
            - { type: 'null' }
        total: { type: integer, minimum: 0, description: 'Quantas pessoas há na equipe (`itens.length`); a tela 51 diz "8 pessoas".' }
        diaUtil: { type: boolean, description: 'Hoje tem expediente. `false` em sábado, domingo ou feriado (quem já bateu entrada continua `TRABALHANDO`; os demais ficam `SEM_EXPEDIENTE`).' }
        contagensHoje:
          description: Quantas pessoas da equipe estão em cada situação de hoje. A soma dos seis valores é o `total`.
          allOf:
            - $ref: '#/components/schemas/PresencaContagens'
        itens:
          type: array
          description: Ordem alfabética do nome.
          items: { $ref: '#/components/schemas/FuncionarioEquipeItem' }
    FuncionarioListaRespostaRh:
      description: Página de colaboradores com os totais por situação.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, totais]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/FuncionarioListaItemRh' }
            totais: { $ref: '#/components/schemas/FuncionarioListaTotais' }

    # ---------------- colaboradores: comandos ----------------
    FuncionarioCriarComando:
      type: object
      description: |
        Cadastro mínimo do colaborador (tela 02). O restante (endereço e outros) a própria pessoa completa no
        formulário de admissão. **Não há** matrícula, gestor nem unidade no corpo: a matrícula é gerada e o gestor é
        o do setor escolhido.
      x-provisorio: >-
        `FUNCIONARIOS.ID_GESTOR` pode ser diferente do gestor do setor? Construído: sempre o gestor do setor (a
        tela mostra o gestor como campo informativo). Se puder diferir, entra `gestorId` opcional no comando.
      required: [nome, cpf, dataNascimento, telefone, emailCorporativo, dataAdmissao, tipoContrato, cargoId, setorId, perfil]
      properties:
        nome: { type: string, minLength: 1, maxLength: 150, description: 'Nome completo, como está no documento.' }
        cpf: { type: string, pattern: '^[0-9]{11}$', description: '11 dígitos sem pontuação, com os dígitos verificadores corretos.' }
        dataNascimento: { type: string, format: date, description: 'Não pode ser no futuro.' }
        telefone: { type: string, pattern: '^[0-9]{10,11}$', description: 'Só dígitos, com DDD (10 ou 11 dígitos).' }
        emailCorporativo: { type: string, format: email, maxLength: 150, description: 'Único; é o e-mail de login.' }
        dataAdmissao: { type: string, format: date, description: 'Pode ser futura ("Em admissão").' }
        tipoContrato: { $ref: '#/components/schemas/FuncionarioTipoContrato' }
        cargoId: { type: integer }
        setorId: { type: integer }
        perfil:
          allOf:
            - $ref: '#/components/schemas/Perfil'
          description: Nível de acesso (campo "Nível de acesso"; `Funcionario` aparece como "Colaborador").
        beneficioIds:
          type: array
          description: Benefícios do catálogo que a pessoa já recebe (caixas "Benefícios"). Sem repetição. Padrão `[]`.
          uniqueItems: true
          default: []
          items: { type: integer }
        enviarConvite:
          type: boolean
          default: true
          description: Caixa "Enviar convite de acesso ao portal" (marcada por padrão).
        incluirNoOnboarding:
          type: boolean
          default: false
          description: |
            Caixa "Incluir no treinamento Onboarding 2026". `true` inscreve a pessoa em cada treinamento de onboarding em
            vigor (mesmo efeito de `incluirFuncionarioNoOnboarding`, fatia 6). Sem treinamento em vigor: 422
            `SEM_TREINAMENTO_DE_ONBOARDING` e ninguém é cadastrado. Sem e-mail.
        formularioAdmissaoId:
          type: [integer, 'null']
          default: null
          description: |
            Caixa "Enviar o formulário de admissão": id de um formulário de admissão **publicado** (fatia 5). A pessoa
            passa a ser destinatária dele (mesmo efeito de `adicionarDestinatariosFormulario`). `null` não envia nada.
            Sem e-mail (o e-mail que a pessoa recebe é o do convite).
    FuncionarioEditarComando:
      type: object
      description: |
        Substituição completa dos campos editáveis (botão "Editar dados"). Tudo vem sempre; os campos que podem
        ser vazios aceitam `null`. A matrícula e a situação não se editam aqui.
      required: [nome, cpf, dataNascimento, telefone, emailCorporativo, emailPessoal, rg, rgOrgaoEmissor, endereco, dataAdmissao, tipoContrato, cargoId, setorId, perfil, beneficioIds]
      properties:
        nome: { type: string, minLength: 1, maxLength: 150 }
        cpf: { type: string, pattern: '^[0-9]{11}$', description: '11 dígitos sem pontuação, com os dígitos verificadores corretos.' }
        dataNascimento: { type: string, format: date }
        telefone: { type: string, pattern: '^[0-9]{10,11}$', description: 'Só dígitos, com DDD.' }
        emailCorporativo: { type: string, format: email, maxLength: 150 }
        emailPessoal: { type: [string, 'null'], format: email, maxLength: 150 }
        rg: { type: [string, 'null'], maxLength: 20 }
        rgOrgaoEmissor: { type: [string, 'null'], maxLength: 20 }
        endereco: { $ref: '#/components/schemas/FuncionarioEndereco' }
        dataAdmissao: { type: string, format: date }
        tipoContrato: { $ref: '#/components/schemas/FuncionarioTipoContrato' }
        cargoId: { type: integer }
        setorId: { type: integer }
        perfil: { $ref: '#/components/schemas/Perfil' }
        beneficioIds:
          type: array
          description: Benefícios **ativos** desejados (os que saem são desativados).
          uniqueItems: true
          items: { type: integer }
    FuncionarioReadmitirComando:
      type: object
      description: |
        Nova admissão de quem está inativo (botão "Readmitir"). O CPF, o e-mail corporativo, a matrícula e os dados
        pessoais continuam os do cadastro; o que muda é o vínculo novo. O nível de acesso, os benefícios e as férias **não**
        vêm no corpo (ver `POST /api/rh/funcionarios/{funcionarioId}/readmissao`).
      required: [dataAdmissao, cargoId, setorId, tipoContrato]
      properties:
        dataAdmissao: { type: string, format: date, description: 'Data da nova admissão. Não pode ser anterior ao último dia de trabalho do vínculo anterior; pode ser futura ("Em admissão").' }
        cargoId: { type: integer }
        setorId: { type: integer }
        tipoContrato: { $ref: '#/components/schemas/FuncionarioTipoContrato' }
        incluirNoOnboarding:
          type: boolean
          default: false
          description: Caixa "Incluir no treinamento Onboarding 2026", com o mesmo efeito do cadastro (`FuncionarioCriarComando`). Sem e-mail.
        formularioAdmissaoId:
          type: [integer, 'null']
          default: null
          description: Caixa "Enviar o formulário de admissão", com o mesmo efeito do cadastro (`FuncionarioCriarComando`). `null` não envia nada. Sem e-mail.
        enviarConvite:
          type: boolean
          default: false
          description: |
            Só para quem **nunca definiu a senha**: libera o login e coloca o convite na fila (o mesmo que "Ativar" mais
            "Reenviar convite"). Quem já definiu a senha recebe 422 `SENHA_JA_DEFINIDA` com `true`; ela entra com a senha
            que já tinha depois do "Ativar" de Usuários do sistema.
    FuncionarioInativarComando:
      type: object
      required: [ultimoDiaDeTrabalho]
      properties:
        ultimoDiaDeTrabalho:
          type: string
          format: date
          description: Último dia em que a pessoa trabalha. Não pode ser anterior à data de admissão; pode ser hoje, futuro ou passado.

    # ---------------- colaboradores: fichas ----------------
    FuncionarioFichaRh:
      type: object
      description: Ficha completa do colaborador, **só para o RH** (CPF e telefone sem máscara).
      required: [id, matricula, nome, emailCorporativo, cpf, telefone, dataNascimento, rg, rgOrgaoEmissor, emailPessoal, endereco, cargo, setor, gestor, tipoContrato, jornadaSemanalHoras, dataAdmissao, perfil, ativo, situacao, situacaoHoje, desligamento, beneficios, acesso]
      properties:
        id: { type: integer }
        matricula:
          type: [string, 'null']
          description: |
            Texto (não número, para manter o zero à esquerda). **Gerada pelo sistema e somente leitura** (decidido pelo dono,
            2026-10-30): sequencial, 5 dígitos (`00482`); não vem no corpo de criar nem de editar.
        nome: { type: string }
        emailCorporativo: { type: [string, 'null'] }
        cpf: { type: [string, 'null'], pattern: '^[0-9]{11}$', description: '11 dígitos, sem máscara. `null` só para quem ainda não tem dados pessoais (administrador do seed).' }
        telefone: { type: [string, 'null'], pattern: '^[0-9]{10,11}$', description: 'Só dígitos, sem máscara.' }
        dataNascimento: { type: [string, 'null'], format: date, description: 'O front mostra "Aniversário, 18 de junho".' }
        rg: { type: [string, 'null'] }
        rgOrgaoEmissor: { type: [string, 'null'] }
        emailPessoal: { type: [string, 'null'] }
        endereco: { $ref: '#/components/schemas/FuncionarioEndereco' }
        cargo:
          oneOf:
            - $ref: '#/components/schemas/CargoReferencia'
            - { type: 'null' }
        setor:
          oneOf:
            - $ref: '#/components/schemas/SetorReferencia'
            - { type: 'null' }
        gestor:
          description: O gestor da pessoa (o do setor). `null` quando o setor não tem gestor ou a pessoa é o gestor.
          oneOf:
            - $ref: '#/components/schemas/GestorReferencia'
            - { type: 'null' }
        tipoContrato:
          oneOf:
            - $ref: '#/components/schemas/FuncionarioTipoContrato'
            - { type: 'null' }
        jornadaSemanalHoras: { type: [number, 'null'], description: 'Carga semanal do cargo ("44 h semanais").' }
        dataAdmissao: { type: string, format: date }
        perfil:
          description: Nível de acesso. `null` quando a pessoa não tem nível configurado (não consegue entrar).
          oneOf:
            - $ref: '#/components/schemas/Perfil'
            - { type: 'null' }
        ativo: { type: boolean }
        situacao: { $ref: '#/components/schemas/FuncionarioSituacao' }
        situacaoHoje:
          description: |
            Situação de hoje (`SituacaoHoje`, `CONVENCOES.md`, seção 10). `null` quando `situacao` não é `ATIVO`
            (em admissão ou inativa). A etiqueta do cabeçalho da ficha sai das duas: ver `GET /api/rh/funcionarios`.
          oneOf:
            - $ref: '#/components/schemas/SituacaoHoje'
            - { type: 'null' }
        desligamento:
          description: Desligamento registrado (agendado ou efetivado); `null` se não há.
          oneOf:
            - $ref: '#/components/schemas/FuncionarioDesligamento'
            - { type: 'null' }
        beneficios:
          type: array
          items: { $ref: '#/components/schemas/FuncionarioBeneficioItem' }
        acesso: { $ref: '#/components/schemas/FuncionarioAcesso' }
    FuncionarioFichaGestor:
      type: object
      description: |
        Ficha **do gestor** (aba Dados). Sem CPF, RG, endereço, e-mail pessoal, matrícula, benefícios e documentos;
        telefone mascarado. Só de quem é da equipe (ativo, admissão já começada), por isso a situação de hoje nunca vem vazia.
      required: [id, nome, cargo, setor, ativo, situacaoHoje, emailCorporativo, telefoneMascarado, dataAdmissao, tipoContrato, jornadaSemanalHoras]
      properties:
        id: { type: integer }
        nome: { type: string }
        cargo: { type: [string, 'null'] }
        setor: { type: [string, 'null'] }
        ativo: { type: boolean }
        situacaoHoje: { $ref: '#/components/schemas/SituacaoHoje' }
        emailCorporativo: { type: [string, 'null'] }
        telefoneMascarado:
          type: [string, 'null']
          description: 'DDD e os 4 últimos dígitos: `(11) 9****-7783` (11 dígitos) ou `(11) ****-7783` (10 dígitos).'
        dataAdmissao: { type: string, format: date }
        tipoContrato:
          oneOf:
            - $ref: '#/components/schemas/FuncionarioTipoContrato'
            - { type: 'null' }
        jornadaSemanalHoras: { type: [number, 'null'] }
    FuncionarioIndicadoresRh:
      type: object
      description: |
        Os quatro cartões da aba Dados da ficha do RH. Cada valor é calculado por **outra fatia** e vem `null` até ela
        existir (a tabela com as rotas de origem está em `GET /api/rh/funcionarios/{funcionarioId}/indicadores`).
      required: [bancoDeHorasMinutos, feriasDisponiveisDias, advertenciasQuantidade, proximoPagamento]
      properties:
        bancoDeHorasMinutos: { type: [integer, 'null'], description: 'Saldo do banco de horas, em minutos, com sinal (+380 = "+6h20"). **Fatia 3**: `saldoMinutos` de `GET /api/rh/funcionarios/{funcionarioId}/ponto/banco-de-horas`.' }
        feriasDisponiveisDias: { type: [integer, 'null'], minimum: 0, description: 'Dias de férias disponíveis. **Fatia 7**: `resumo.diasDisponiveis` de `GET /api/rh/funcionarios/{funcionarioId}/ferias`.' }
        advertenciasQuantidade: { type: [integer, 'null'], minimum: 0, description: 'Advertências **não canceladas do ano corrente (2026)**. **Fatia 4** (a mesma regra em todas as fatias).' }
        proximoPagamento: { type: [string, 'null'], format: date, description: 'Data do próximo pagamento (da empresa, igual para todos). **Fatia 7**: `pagamento.data` de `GET /api/eu/pagamento/proximo`.' }
    FuncionarioIndicadoresGestor:
      type: object
      description: |
        Os quatro cartões da aba Dados da ficha da equipe. Cada valor é calculado por **outra fatia** e vem `null` até ela
        existir (a tabela com as rotas de origem está em `GET /api/gestor/equipe/{funcionarioId}/indicadores`).
      required: [bancoDeHorasMinutos, feriasDisponiveisDias, treinamentosPendentes, advertenciasQuantidade]
      properties:
        bancoDeHorasMinutos: { type: [integer, 'null'], description: 'Saldo do banco de horas, em minutos, com sinal (-225 = "-3h45"). **Fatia 3**: `resumo.saldoBancoHorasMinutos` de `GET /api/gestor/equipe/{funcionarioId}/ponto`.' }
        feriasDisponiveisDias: { type: [integer, 'null'], minimum: 0, description: '**Fatia 7**: `resumo.diasDisponiveis` de `GET /api/gestor/equipe/{funcionarioId}/ferias`.' }
        treinamentosPendentes: { type: [integer, 'null'], minimum: 0, description: 'Obrigatórios não concluídos (treinamento não tem prazo). **Fatia 6**: `resumo.pendentes` de `GET /api/gestor/equipe/{funcionarioId}/treinamentos`.' }
        advertenciasQuantidade: { type: [integer, 'null'], minimum: 0, description: 'Advertências **não canceladas do ano corrente (2026)**. **Fatia 4** (a mesma regra em todas as fatias).' }

    # ---------------- documentos do colaborador ----------------
    DocumentoColaboradorTipo:
      type: string
      description: |
        Tipo do documento. Rótulos da tela: `IDENTIDADE` "Documento de identidade (RG ou CNH)", `CPF` "CPF",
        `CARTEIRA_DE_TRABALHO` "Carteira de trabalho digital", `COMPROVANTE_DE_RESIDENCIA` "Comprovante de
        residência", `CONTRATO_ASSINADO` "Contrato assinado", `EXAME_ADMISSIONAL` "Exame admissional (ASO)",
        `OUTRO` "Outro" (a descrição diz o que é).
      x-provisorio: >-
        Quais são os tipos de documento? O dono ainda não decidiu a lista (o banco guarda texto livre).
        Construído com os seis que o Figma mostra mais `OUTRO`; mudar a lista muda este enum (versão menor).
      enum: [IDENTIDADE, CPF, CARTEIRA_DE_TRABALHO, COMPROVANTE_DE_RESIDENCIA, CONTRATO_ASSINADO, EXAME_ADMISSIONAL, OUTRO]
    DocumentoColaboradorSituacao:
      type: string
      description: '`PENDENTE`: o RH pediu e a pessoa ainda não enviou (sem arquivo). `ENVIADO`: tem arquivo.'
      enum: [PENDENTE, ENVIADO]
    DocumentoColaboradorModo:
      type: string
      description: '`ANEXAR_AGORA` ("Você já tem o arquivo") ou `PEDIR_PARA_ENVIAR` (a pessoa envia pelo portal; **sem e-mail**, ver `POST /api/rh/funcionarios/{funcionarioId}/documentos`).'
      enum: [ANEXAR_AGORA, PEDIR_PARA_ENVIAR]
    DocumentoColaborador:
      type: object
      description: Um documento da pessoa. O arquivo em si só se baixa pela rota de download (link temporário).
      required: [id, tipo, descricao, dataValidade, situacao, nomeArquivoOriginal, pedidoEmUtc, enviadoEmUtc]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/DocumentoColaboradorTipo' }
        descricao: { type: [string, 'null'], maxLength: 255 }
        dataValidade: { type: [string, 'null'], format: date, description: 'Validade (opcional); alimenta o aviso de documento vencendo.' }
        situacao: { $ref: '#/components/schemas/DocumentoColaboradorSituacao' }
        nomeArquivoOriginal: { type: [string, 'null'], description: 'Nome que a pessoa deu ao arquivo; `null` enquanto pendente.' }
        pedidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Quando o RH pediu ("Atualização pedida em 01/10"); `null` se foi anexado direto.' }
        enviadoEmUtc: { type: [string, 'null'], format: date-time, description: 'Coluna "Enviado em"; `null` enquanto pendente.' }
    DocumentoColaboradorListaResposta:
      type: object
      description: Lista curta, sem paginação.
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/DocumentoColaborador' }
    DocumentoColaboradorNovoForm:
      type: object
      description: Formulário `multipart/form-data` do modal "Adicionar documento".
      required: [modo, tipo]
      properties:
        modo: { $ref: '#/components/schemas/DocumentoColaboradorModo' }
        tipo: { $ref: '#/components/schemas/DocumentoColaboradorTipo' }
        descricao: { type: string, maxLength: 255, description: 'Opcional. Ex.: comprovante de residência atualizado.' }
        dataValidade: { type: string, format: date, description: 'Opcional.' }
        arquivo:
          type: string
          format: binary
          description: PDF, JPG ou PNG, até 10 MB. **Obrigatório** com `ANEXAR_AGORA`; **proibido** com `PEDIR_PARA_ENVIAR`.
    DocumentoColaboradorEnvioForm:
      type: object
      description: Formulário `multipart/form-data` de "Meus documentos".
      required: [arquivo]
      properties:
        arquivo: { type: string, format: binary, description: 'PDF, JPG ou PNG, até 10 MB.' }

    # ---------------- cargos, setores, gestores, benefícios ----------------
    CargoItem:
      type: object
      required: [id, nome, descricao, cargaSemanalHoras, quantidadePessoas]
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: [string, 'null'] }
        cargaSemanalHoras: { type: number, description: 'Carga horária semanal (ex.: 44).' }
        quantidadePessoas: { type: integer, minimum: 0, description: 'Pessoas ativas com este cargo.' }
    CargoListaResposta:
      description: Página de cargos.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/CargoItem' }
    CargoComando:
      type: object
      required: [nome, descricao, cargaSemanalHoras]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100, description: 'Único (sem diferenciar maiúsculas).' }
        descricao: { type: [string, 'null'], maxLength: 255, description: 'O que a pessoa faz no dia a dia.' }
        cargaSemanalHoras: { type: number, exclusiveMinimum: 0, maximum: 168, description: 'Horas por semana (até 2 casas decimais), ex.: 44.' }
    SetorItem:
      type: object
      required: [id, nome, descricao, gestor, quantidadePessoas]
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: [string, 'null'] }
        gestor:
          oneOf:
            - $ref: '#/components/schemas/GestorReferencia'
            - { type: 'null' }
        quantidadePessoas: { type: integer, minimum: 0, description: 'Pessoas ativas do setor com a admissão já começada, inclusive o gestor.' }
    SetorListaResposta:
      description: Página de setores.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/SetorItem' }
    SetorComando:
      type: object
      required: [nome, descricao, gestorFuncionarioId]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100, description: 'Único (sem diferenciar maiúsculas).' }
        descricao: { type: [string, 'null'], maxLength: 255 }
        gestorFuncionarioId: { type: [integer, 'null'], description: 'Id do **colaborador** que gerencia o setor (não o `gestorId`); `null` = sem gestor.' }
    GestorItem:
      type: object
      description: |
        Um gestor (quem tem linha em Gestores): ou **gestor de um setor** (nível `Gestor`, responde por **um** setor), ou
        a pessoa do RH cadastrada **só para decidir pedidos de gestores** (`soDecidePedidosDeGestores = true`, sem setor).
      required: [gestorId, funcionario, setor, soDecidePedidosDeGestores, quantidadeEquipe, ausente, ausenteAte, ausenteHoje]
      properties:
        gestorId: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        setor:
          description: O setor que ele gerencia; `null` para a pessoa do RH que só decide pedidos de gestores.
          oneOf:
            - $ref: '#/components/schemas/SetorReferencia'
            - { type: 'null' }
        soDecidePedidosDeGestores:
          type: boolean
          description: |
            `true`: a pessoa é do RH e tem linha em Gestores **só** para poder decidir os pedidos de gestores (o trigger do
            banco exige essa linha); não gerencia setor, não tem equipe e não usa `/api/gestor/...`. `false`: gerencia um setor.
        quantidadeEquipe: { type: integer, minimum: 0, description: 'A equipe dele (`GET /api/gestor/equipe`): pessoas ativas do setor com a admissão já começada, sem ele. 0 sem setor.' }
        ausente: { type: boolean, description: 'O RH marcou o gestor como ausente (a etapa dele é aprovada sozinha nos pedidos novos).' }
        ausenteAte: { type: [string, 'null'], format: date, description: 'Data de volta do gestor (opcional); a marcação vale até o dia anterior.' }
        ausenteHoje: { type: boolean, description: 'A marcação vale hoje: `ausente` e, se há data de volta, hoje antes dela. É o que a tela mostra como "Ausente".' }
    GestorListaResposta:
      type: object
      description: Lista curta, sem paginação.
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/GestorItem' }
    GestorCadastrarComando:
      type: object
      required: [funcionarioId]
      properties:
        funcionarioId: { type: integer, description: 'Id do colaborador (ativo e com o nível `RH`) a cadastrar como gestor sem setor, só para decidir pedidos de gestores.' }
    GestorAusenciaComando:
      type: object
      required: [ausente, ausenteAte]
      properties:
        ausente: { type: boolean, description: '`true` marca o gestor como ausente; `false` desmarca.' }
        ausenteAte:
          type: [string, 'null']
          format: date
          description: Data de volta do gestor, **depois de hoje**. Só com `ausente = true`; `null` = sem data de volta (vale até o RH desmarcar). Com `ausente = false` precisa vir `null`.
    GestorAusenciaResposta:
      description: O gestor com a marcação nova, mais quantos pedidos pararam de esperar por ele agora.
      allOf:
        - $ref: '#/components/schemas/GestorItem'
        - type: object
          required: [pedidosAprovadosAgora]
          properties:
            pedidosAprovadosAgora:
              type: object
              description: |
                Pedidos que já estavam esperando o gestor e tiveram a etapa dele aprovada **nesta chamada** (só ao marcar; ao
                desmarcar vêm 0). Não inclui férias com sugestão de data em andamento nem pedidos novos.
              required: [ajustesDePonto, ferias]
              properties:
                ajustesDePonto: { type: integer, minimum: 0, description: 'Pedidos de ajuste de ponto (fatia 3).' }
                ferias: { type: integer, minimum: 0, description: 'Pedidos de férias (fatia 7).' }
    BeneficioCatalogoItem:
      type: object
      required: [id, nome, descricao, opcional, aceitaDependentes, aceitaTrajeto, quantidadePessoas]
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: [string, 'null'] }
        opcional:
          type: boolean
          description: |
            A própria pessoa pode pedir este benefício (aparece em "Disponíveis para você", tela 44). `false`: só o RH o dá.
            **Exige o script SQL `V031`**: coluna `OPCIONAL` em `BENEFICIOS`.
        aceitaDependentes:
          type: boolean
          description: |
            O pedido deixa incluir dependentes (como o plano de saúde). **Exige o script SQL `V031`**: coluna `ACEITA_DEPENDENTES`
            em `BENEFICIOS`.
        aceitaTrajeto:
          type: boolean
          description: |
            O pedido pede o trajeto (como o vale-transporte). **Exige o script SQL `V031`**: coluna `ACEITA_TRAJETO` em `BENEFICIOS`.
        quantidadePessoas: { type: integer, minimum: 0, description: 'Pessoas com o benefício ativo.' }
    BeneficioCatalogoListaResposta:
      description: Página de benefícios do catálogo.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/BeneficioCatalogoItem' }
    BeneficioCatalogoComando:
      type: object
      required: [nome, descricao, opcional, aceitaDependentes, aceitaTrajeto]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100, description: 'Único (sem diferenciar maiúsculas).' }
        descricao: { type: [string, 'null'], maxLength: 255 }
        opcional: { type: boolean, description: 'A própria pessoa pode pedir o benefício (ver `BeneficioCatalogoItem`). **Exige o script SQL `V031`**.' }
        aceitaDependentes: { type: boolean, description: 'O pedido deixa incluir dependentes. **Exige o script SQL `V031`**.' }
        aceitaTrajeto: { type: boolean, description: 'O pedido pede o trajeto. **Exige o script SQL `V031`**.' }

    # ---------------- empresa ----------------
    EmpresaUf:
      type: string
      description: Sigla da UF. O banco só confere o formato; a API confere que a sigla existe.
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    EmpresaConfiguracao:
      type: object
      description: Configuração da empresa (uma só linha no banco).
      required: [nomeEmpresa, uf, municipio, horarioEntrada, horarioSaida, toleranciaAtrasoMinutos, diaPagamento]
      properties:
        nomeEmpresa: { type: string, minLength: 1, maxLength: 150 }
        uf: { $ref: '#/components/schemas/EmpresaUf' }
        municipio: { type: string, minLength: 1, maxLength: 100 }
        horarioEntrada: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Horário padrão de entrada, `HH:mm`, sem fuso.' }
        horarioSaida: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Horário padrão de saída, `HH:mm`, sem fuso.' }
        toleranciaAtrasoMinutos: { type: integer, minimum: 0, maximum: 120 }
        diaPagamento: { type: integer, minimum: 1, maximum: 31, description: 'Dia do mês da regra padrão de pagamento.' }

    # ---------------- usuários do sistema ----------------
    UsuarioSistemaSituacao:
      type: string
      description: |
        `SEM_CONVITE`: ainda não tem login. `CONVITE_ENVIADO`: convite válido, senha ainda não definida.
        `CONVITE_EXPIRADO`: o convite venceu (reenviar). `SENHA_DEFINIDA`: já definiu a senha.
      enum: [SEM_CONVITE, CONVITE_ENVIADO, CONVITE_EXPIRADO, SENHA_DEFINIDA]
    UsuarioSistemaItem:
      type: object
      description: Uma linha de "Usuários do sistema". A linha é o colaborador; o login pode ainda não existir.
      required: [funcionarioId, nome, emailCorporativo, perfil, situacao, ativo, ultimoLoginEmUtc, conviteEnviadoEmUtc]
      properties:
        funcionarioId: { type: integer }
        nome: { type: string }
        emailCorporativo: { type: [string, 'null'] }
        perfil:
          oneOf:
            - $ref: '#/components/schemas/Perfil'
            - { type: 'null' }
        situacao: { $ref: '#/components/schemas/UsuarioSistemaSituacao' }
        ativo: { type: boolean, description: 'O login está liberado (`false` em `SEM_CONVITE`).' }
        ultimoLoginEmUtc: { type: [string, 'null'], format: date-time }
        conviteEnviadoEmUtc: { type: [string, 'null'], format: date-time, description: 'Quando o último convite foi enviado.' }
    UsuarioSistemaListaResposta:
      description: Página de logins.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/UsuarioSistemaItem' }

    # ---------------- auditoria ----------------
    AuditoriaArea:
      type: string
      description: |
        Área do evento (filtro "Todas as áreas"). Rótulos: `ACESSO` "Acesso", `COLABORADORES` "Colaboradores",
        `DOCUMENTOS` "Documentos", `CADASTROS` "Cadastros" (cargos, setores, gestores, benefícios do catálogo e
        empresa), `IMPORTACAO` "Importação", `PONTO` "Ponto", `FERIADOS` "Feriados", `FERIAS` "Férias",
        `HOLERITES` "Holerites", `ADVERTENCIAS` "Advertências", `AVISOS` "Avisos", `FORMULARIOS` "Formulários",
        `TREINAMENTOS` "Treinamentos", `BENEFICIOS` "Benefícios" (adesões, fatia 7) e `ATESTADOS` "Atestados" (fatia 3: o
        download do arquivo do atestado, `BAIXOU`, e a validação ou a recusa dele; é uma área própria, **não**
        `DOCUMENTOS`, que é a dos documentos do colaborador, nem `PONTO`; a fatia 3 não cita outra área para o atestado).
        Todas as fatias usam esta lista.
      enum: [ACESSO, COLABORADORES, DOCUMENTOS, CADASTROS, IMPORTACAO, PONTO, FERIADOS, FERIAS, HOLERITES, ADVERTENCIAS, AVISOS, FORMULARIOS, TREINAMENTOS, BENEFICIOS, ATESTADOS]
    AuditoriaAcao:
      type: string
      description: |
        Ação (filtro "Todas as ações"). Rótulos: `ENTROU` "Entrou", `ACESSO_NEGADO` "Acesso negado", `CRIOU` "Criou",
        `ALTEROU` "Alterou", `EXCLUIU` "Excluiu", `INATIVOU` "Inativou", `REGISTROU` "Registrou", `PEDIU_AJUSTE`
        "Pediu ajuste", `APROVOU` "Aprovou", `RECUSOU` "Recusou", `PUBLICOU` "Publicou", `ENVIOU_EMAIL` "Enviou
        e-mail" (só os da lista fechada de e-mails; o lembrete de formulário anônimo entra sem destinatário e sem contagem),
        `IMPORTOU` "Importou", `BAIXOU` "Baixou" (download de arquivo, como holerite e documento).
        `EXCLUIU`, `ACESSO_NEGADO` e `INATIVOU` aparecem em vermelho na tela. O filtro `apenasAlteracoes` de
        `GET /api/rh/auditoria` deixa de fora `ENTROU`, `ACESSO_NEGADO`, `BAIXOU` e `REGISTROU` da área `PONTO`.
      enum: [ENTROU, ACESSO_NEGADO, CRIOU, ALTEROU, EXCLUIU, INATIVOU, REGISTROU, PEDIU_AJUSTE, APROVOU, RECUSOU, PUBLICOU, ENVIOU_EMAIL, IMPORTOU, BAIXOU]
    AuditoriaAtor:
      type: object
      description: Quem fez. O rótulo sob o nome é "Automático" (`SISTEMA`), "Desligado" (`desligado = true`) ou o perfil (`Funcionario` aparece como "Colaborador").
      required: [funcionarioId, nome, tipo, perfil, desligado]
      properties:
        funcionarioId: { type: [integer, 'null'], description: '`null` quando foi o sistema (tarefa automática).' }
        nome: { type: string, description: 'Nome da pessoa, ou "Sistema".' }
        tipo: { type: string, enum: [PESSOA, SISTEMA] }
        perfil:
          description: 'O **perfil que a pessoa tinha na hora do evento** (o log guarda uma cópia gravada com o evento: se o perfil mudar depois, o evento antigo continua mostrando o de então). `null` para o sistema ou para quem não tinha nível.'
          oneOf:
            - $ref: '#/components/schemas/Perfil'
            - { type: 'null' }
        desligado: { type: boolean, description: 'A pessoa está inativa hoje.' }
    AuditoriaEvento:
      type: object
      description: Uma linha do log.
      required: [id, quandoUtc, ator, area, acao, descricao]
      properties:
        id: { type: integer, format: int64 }
        quandoUtc: { type: string, format: date-time }
        ator: { $ref: '#/components/schemas/AuditoriaAtor' }
        area: { $ref: '#/components/schemas/AuditoriaArea' }
        acao: { $ref: '#/components/schemas/AuditoriaAcao' }
        descricao: { type: string, description: 'Coluna "O que aconteceu", em texto simples. Nunca traz quem recebeu lembrete de formulário anônimo, nem quantos receberam, nem quem participou dele.' }
    AuditoriaListaResposta:
      description: Página de eventos de auditoria.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AuditoriaEvento' }
    AuditoriaOrigem:
      type: object
      description: De onde veio a ação ("Portal no navegador, IP 10.0.4.23").
      required: [canal, ip]
      properties:
        canal: { type: string, enum: [PORTAL, SISTEMA], description: '`PORTAL`: navegador. `SISTEMA`: tarefa automática.' }
        ip: { type: [string, 'null'], description: 'Endereço IP; `null` para tarefas do sistema.' }
    AuditoriaMudanca:
      type: object
      description: Uma linha da tabela "O que mudou".
      required: [campo, antes, depois, valorOculto]
      properties:
        campo: { type: string, description: 'Nome do campo em português ("Cargo").' }
        antes: { type: [string, 'null'] }
        depois: { type: [string, 'null'] }
        valorOculto: { type: boolean, description: 'Coluna sensível: o valor **não** é gravado; `antes` e `depois` vêm `null` e a tela mostra "valor não registrado".' }
    AuditoriaEventoDetalhe:
      description: Um evento com os detalhes que a linha expandida mostra.
      allOf:
        - $ref: '#/components/schemas/AuditoriaEvento'
        - type: object
          required: [registroAfetado, origem, mudancas]
          properties:
            registroAfetado: { type: string, description: 'Texto do campo "Registro afetado" (ex.: "Colaborador Bruno Lima, matrícula 00482").' }
            origem: { $ref: '#/components/schemas/AuditoriaOrigem' }
            mudancas:
              type: array
              description: Vazia quando o evento não altera dados.
              items: { $ref: '#/components/schemas/AuditoriaMudanca' }

    # ---------------- senha e convite ----------------
    ConviteLinkTipo:
      type: string
      description: '`CONVITE`: primeiro acesso. `REDEFINICAO`: "esqueci minha senha".'
      enum: [CONVITE, REDEFINICAO]
    ConviteEsqueciSenhaComando:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 150 }
    ConviteLinkValidarComando:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200, description: 'O valor de `token` do endereço do e-mail.' }
    ConviteLinkInfo:
      type: object
      required: [tipo, nome, emailCorporativo, expiraEmUtc]
      properties:
        tipo: { $ref: '#/components/schemas/ConviteLinkTipo' }
        nome: { type: string }
        emailCorporativo: { type: string }
        expiraEmUtc: { type: string, format: date-time }
    ConviteDefinirSenhaComando:
      type: object
      required: [token, novaSenha]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        novaSenha:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            De 8 a 128 caracteres, **sem exigir** letra maiúscula, número ou símbolo (decidido pelo dono, 2026-10-30).
            A confirmação ("repita a senha") é conferida só no front.
    SenhaTrocarComando:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, minLength: 1, maxLength: 128 }
        novaSenha:
          type: string
          minLength: 8
          maxLength: 128
          description: Mesma regra da definição de senha (de 8 a 128 caracteres, sem exigir maiúscula, número ou símbolo); precisa ser diferente da atual.
