                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: SEM_TREINAMENTO_DE_ONBOARDING
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Colaboradores (gestor): a equipe, a ficha da equipe (aba Dados)
  # ------------------------------------------------------------------
  /api/gestor/equipe:
    get:
      tags: [Colaboradores]
      operationId: listarEquipeDoGestor
      summary: Lista a equipe do gestor (as pessoas do setor dele, sem ele) com a situação de hoje de cada uma.
      description: |
        É **a lista da equipe** do contrato: as outras fatias não criam outra. Serve ao quadro "Hoje" e à tabela "Pessoas da
        equipe" da tela 51, a quem precisa **escolher uma pessoa da equipe** (por exemplo, a advertência da tela 60,
        fatia 4) e às contagens do dia. Só o perfil `Gestor`; é sempre **a equipe dele**.

        **Quem é a equipe (definição única):** as pessoas **ativas, com a admissão já começada**, do setor de que ele é o
        gestor, **sem o próprio gestor** (decidido pela tela 51: "8 pessoas"; o gestor não conta como membro da própria
        equipe). Um gestor responde por **um setor**. Quem ainda está em admissão entra na equipe no dia da admissão; quem
        é inativado sai. Sem paginação (a equipe é de um setor); ordem: nome, de A a Z.

        **`situacaoHoje`** de cada pessoa é o `SituacaoHoje` de `CONVENCOES.md`, seção 10: `TRABALHANDO` é quem **já
        registrou entrada hoje** (mesmo que já tenha saído); `SEM_REGISTRO` é quem não registrou depois do horário
        padrão de entrada mais a tolerância (`GET /api/eu/empresa`); antes disso, `AINDA_NAO_COMECOU`. Quem precisar
        só de quem está sem registro filtra os `itens` por `situacaoHoje = SEM_REGISTRO`.

        **`contagensHoje`** são os números do dia, no schema `PresencaContagens` da base (a única forma de contar situações
        de hoje, `CONVENCOES.md`, seção 10), calculados desta mesma lista: a soma dos seis valores é `total`. **`diaUtil`**
        (boolean, ao lado) diz se hoje tem expediente. **Dia sem expediente** (sábado, domingo ou feriado): `diaUtil = false`
        e quem **já bateu entrada** continua `TRABALHANDO` (a batida vence); todos os outros ficam em `SEM_EXPEDIENTE`.
        Quem usa estes números (a lista da equipe da tela 51, o quadro "Hoje" e a fatia 7) **não** repete a lista nem as
        contagens: lê daqui. As bolinhas do menu (pendências da equipe e pedidos de ajuste de ponto) **não** vêm daqui: são
        de `GET /api/gestor/contadores-do-menu` (fatia 7).

        Gestor sem setor (perfil `Gestor` que ainda não foi escolhido como gestor de um setor): `setor: null`, `total: 0`,
        todas as contagens em 0 e `itens` vazio. Quem é do RH e só decide pedidos de gestores não usa esta rota (403).
      x-perfis: [Gestor]
      responses:
        '200':
          description: A equipe e as contagens de hoje.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioEquipeResposta' }
              example:
                setor: { id: 1, nome: Comercial }
                total: 8
                diaUtil: true
                contagensHoje: { trabalhando: 6, ferias: 1, atestado: 0, semRegistro: 1, aindaNaoComecou: 0, semExpediente: 0 }
                itens:
                  - { id: 21, nome: Diego Farias, cargo: Vendedor, setor: Comercial, ativo: true, situacaoHoje: SEM_REGISTRO }
                  - { id: 25, nome: Fernanda Lopes, cargo: Executiva de contas, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
                  - { id: 26, nome: Gustavo Reis, cargo: Vendedor, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
                  - { id: 27, nome: Helena Prates, cargo: Assistente comercial, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
                  - { id: 28, nome: Igor Batista, cargo: Estagiário, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
                  - { id: 22, nome: Júlia Nunes, cargo: Vendedora, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
                  - { id: 23, nome: Larissa Moura, cargo: Vendedora, setor: Comercial, ativo: true, situacaoHoje: FERIAS }
                  - { id: 24, nome: Pedro Santos, cargo: Vendedor, setor: Comercial, ativo: true, situacaoHoje: TRABALHANDO }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/gestor/equipe/{funcionarioId}:
    get:
      tags: [Colaboradores]
      operationId: obterFichaDaEquipe
      summary: Mostra a ficha de uma pessoa da equipe (aba Dados), sem CPF e com telefone mascarado.
      description: |
        Tela 52 (Painel da equipe, ficha, aba Dados). Só o perfil `Gestor`, e só pessoas **da equipe dele** (a lista de
        `GET /api/gestor/equipe`: o setor em que ele é o gestor, pessoas ativas com a admissão já começada, **sem o próprio
        gestor**; decidido: o gestor não conta como membro da própria equipe, a equipe da tela 51 tem 8 pessoas). Fora do
        escopo (outro setor, o próprio gestor, quem ainda está em admissão ou quem já está inativo): **404**.

        Este é um schema **à parte** do do RH: não existem aqui CPF, RG, endereço, e-mail pessoal, matrícula,
        benefícios nem documentos (decisão do dono). O telefone vem em `telefoneMascarado`
        (`(11) 9****-7783`: mostra o DDD e os 4 últimos dígitos). O gestor **não edita** o cadastro: a tela diz
        "Só o RH altera dados cadastrais".

        Os cartões de resumo vêm de `GET .../indicadores`. As abas Ponto, Férias, Treinamentos e Advertências e o
        botão "Registrar advertência" são de outras fatias.
      x-perfis: [Gestor]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: A ficha (versão do gestor).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioFichaGestor' }
              example:
                id: 21
                nome: Diego Farias
                cargo: Vendedor
                setor: Comercial
                ativo: true
                situacaoHoje: SEM_REGISTRO
                emailCorporativo: diego.farias@empresa.com.br
                telefoneMascarado: '(11) 9****-7783'
                dataAdmissao: '2023-08-08'
                tipoContrato: CLT
                jornadaSemanalHoras: 44
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/gestor/equipe/{funcionarioId}/indicadores:
    get:
      tags: [Colaboradores]
      operationId: obterIndicadoresDaEquipe
      summary: Mostra os cartões de resumo da ficha da equipe (banco de horas, férias, treinamentos, advertências).
      description: |
        Tela 52: os quatro cartões no alto da aba Dados. Só o perfil `Gestor`, só a equipe dele (fora do escopo: 404).

        **Cada número é calculado por outra fatia; esta rota só os junta.** O valor é o mesmo da rota indicada, e cada
        campo vem `null` enquanto a fatia que o calcula não existir (o front mostra "—"). Ver também a nota de
        `GET /api/rh/funcionarios/{funcionarioId}/indicadores`.

        | Campo | Fatia | De onde vem (mesmo valor) |
        |---|---|---|
        | `bancoDeHorasMinutos` | 3 (ponto) | `resumo.saldoBancoHorasMinutos` de `GET /api/gestor/equipe/{funcionarioId}/ponto` |
        | `feriasDisponiveisDias` | 7 (gestão) | `resumo.diasDisponiveis` de `GET /api/gestor/equipe/{funcionarioId}/ferias` |
        | `treinamentosPendentes` | 6 (treinamentos) | `resumo.pendentes` de `GET /api/gestor/equipe/{funcionarioId}/treinamentos` (obrigatório não concluído; treinamento não tem prazo) |
        | `advertenciasQuantidade` | 4 (comunicação) | advertências **não canceladas do ano corrente (2026)** da pessoa (a mesma regra de `porPessoa` em `GET /api/gestor/advertencias/resumo`) |
      x-perfis: [Gestor]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: Os valores dos cartões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuncionarioIndicadoresGestor' }
              example:
                bancoDeHorasMinutos: -225
                feriasDisponiveisDias: 22
                treinamentosPendentes: 2
                advertenciasQuantidade: 2
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Documentos do colaborador (RH)
  # ------------------------------------------------------------------
  /api/rh/funcionarios/{funcionarioId}/documentos:
    get:
      tags: [Documentos do colaborador]
      operationId: listarDocumentosDoFuncionario
      summary: Lista os documentos da ficha do colaborador.
      description: |
        Tela 09 (Ficha, aba Documentos). Só o perfil `RH`. Lista curta, **sem paginação** (`itens` só).
        Ordem: mais recentes primeiro. "Só o RH e o próprio colaborador conseguem ver": o gestor **não** vê
        documentos (não existe rota dele). **Sem o botão "Lembrar"** nas linhas `PENDENTE` (decisão do dono, 2026-10-30:
        não existe lembrete de documento; não há rota nem e-mail para isso).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: Os documentos da pessoa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoColaboradorListaResposta' }
              example:
                itens:
                  - id: 61
                    tipo: IDENTIDADE
                    descricao: null
                    dataValidade: null
                    situacao: ENVIADO
                    nomeArquivoOriginal: rg-bruno-lima.pdf
                    pedidoEmUtc: null
                    enviadoEmUtc: '2022-03-14T13:20:00Z'
                  - id: 64
                    tipo: COMPROVANTE_DE_RESIDENCIA
                    descricao: Comprovante atualizado
                    dataValidade: '2027-10-01'
                    situacao: PENDENTE
                    nomeArquivoOriginal: null
                    pedidoEmUtc: '2026-10-01T12:00:00Z'
                    enviadoEmUtc: null
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Documentos do colaborador]
      operationId: adicionarDocumentoDoFuncionario
      summary: Anexa um documento à ficha, ou pede para a pessoa enviar.
      description: |
        Tela 10 (modal "Adicionar documento"). Só o perfil `RH`. Envio em `multipart/form-data`.

        - `modo = ANEXAR_AGORA` ("Você já tem o arquivo"): `arquivo` é obrigatório; o documento nasce `ENVIADO`.
        - `modo = PEDIR_PARA_ENVIAR`: **não** manda arquivo; o documento nasce `PENDENTE`, com a data do pedido, e a
          pessoa o vê em "Meus documentos", onde envia o arquivo. **Nenhum e-mail sai** (lista fechada de e-mails,
          `CONVENCOES.md`, seção 12: não existe e-mail de pedido nem lembrete de documento): a frase da tela 10
          "Ela recebe um aviso e envia pelo portal" deve falar só em "envia pelo portal". **Como a pessoa fica sabendo:**
          pela **bolinha no menu** ("Meus documentos"), que é `documentosPendentes` nos contadores de
          `GET /api/eu/contadores-do-menu` (fatia 7): quantos documentos `PENDENTE` ela tem.
        - Arquivo: PDF, JPG ou PNG, **até 10 MB** (o tipo é conferido pelo conteúdo, não pela extensão). O arquivo
          vai para o armazenamento de arquivos; o banco guarda só a referência. Só é gravado depois de a regra do
          banco aprovar.
        - Cada chamada cria um documento novo (não substitui um pendente do mesmo tipo).
        - O envio entra na auditoria (sem o conteúdo do arquivo).
        Erros de arquivo (tipo, tamanho, faltando ou sobrando) voltam como 400 em `arquivo`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentoColaboradorNovoForm' }
            encoding:
              arquivo: { contentType: 'application/pdf, image/jpeg, image/png' }
            example:
              modo: ANEXAR_AGORA
              tipo: COMPROVANTE_DE_RESIDENCIA
              descricao: Comprovante de residência atualizado
              dataValidade: '2027-10-01'
              arquivo: comprovante-outubro-2026.pdf
      responses:
        '201':
          description: Documento criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoColaborador' }
              example:
                id: 70
                tipo: COMPROVANTE_DE_RESIDENCIA
                descricao: Comprovante de residência atualizado
                dataValidade: '2027-10-01'
                situacao: ENVIADO
                nomeArquivoOriginal: comprovante-outubro-2026.pdf
                pedidoEmUtc: null
                enviadoEmUtc: '2026-10-07T12:38:10Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/funcionarios/{funcionarioId}/documentos/{documentoId}/download:
    get:
      tags: [Documentos do colaborador]
