    post:
      tags: [Cadastros de apoio]
      operationId: criarSetor
      summary: Cria um setor, com o gestor opcional.
      description: |
        Tela 29, cadastro "Setores". Só o perfil `RH`. Nome único: repetido dá 409 `NOME_JA_CADASTRADO`.
        `gestorFuncionarioId` (`null` = sem gestor) é a pessoa que gerencia o setor: veja a regra em
        `PUT /api/rh/setores/{setorId}` (inclusive o 409 `GESTOR_JA_RESPONDE_POR_OUTRO_SETOR`: **um gestor responde por
        um setor só**, e o 422 `GESTOR_PRECISA_TER_PERFIL_GESTOR`: **só quem tem o nível `Gestor`** gerencia um setor; quem
        é `RH` não). **Não existe exclusão de setor.**
