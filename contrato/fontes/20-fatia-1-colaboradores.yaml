  /api/rh/setores/{setorId}:
    put:
      tags: [Cadastros de apoio]
      operationId: editarSetor
      summary: Altera um setor e troca o gestor dele.
      description: |
        Tela 29, cadastro "Setores". Só o perfil `RH`. Substitui nome, descrição e gestor.

        **Trocar o gestor** (`gestorFuncionarioId`; `null` tira o gestor do setor):
        - a pessoa precisa estar ativa (senão 422 `FUNCIONARIO_INATIVO`, regra do banco);
        - **só quem tem o nível `Gestor` gerencia um setor** (`CONVENCOES.md`, seção 9): se a pessoa escolhida é do `RH`,
          422 `GESTOR_PRECISA_TER_PERFIL_GESTOR` (a pessoa do RH que decide pedidos de gestores é cadastrada, sem setor, em
          `POST /api/rh/gestores`). A API não recusa quem tem o nível `Funcionario`: ele é promovido a `Gestor`;
        - se ela ainda não está em Gestores, a API a cadastra como gestor sozinha;
        - o gestor de **todas as pessoas do setor** é refeito (menos o do próprio gestor, que fica sem gestor: o
          banco recusa "gestor de si mesmo");
        - quem **deixa de ser** gestor deste setor (porque o RH o tirou ou trocou por outra pessoa) volta ao nível
          `Funcionario` e continua no setor como membro da equipe; o gestor dele passa a ser o gestor novo do setor (ou
          fica vazio, se o setor ficou sem gestor);
        - **os pedidos de ponto e de férias que já esperavam pelo gestor antigo passam para a etapa do RH**, tanto ao tirar
          o gestor quanto ao trocar por outro (`CONVENCOES.md`, seção 9; férias com sugestão de data em andamento continuam
          esperando a resposta da pessoa e, respondida, seguem para o RH). Os pedidos já decididos não mudam, e os pedidos
          **novos** seguem o gestor novo (ou o RH, se o setor ficou sem gestor).

        **Um gestor responde por um setor só** (decidido pelo dono, 2026-10-30; antes esta rota permitia vários). O que
        isso muda no cadastro:
        - se a pessoa escolhida já é gestor de **outro** setor: 409 `GESTOR_JA_RESPONDE_POR_OUTRO_SETOR` (o RH precisa
          antes tirar o gestor do outro setor, com `gestorFuncionarioId = null` nele, ou escolher outra pessoa);
        - `GET /api/rh/gestores` traz `setor` (um objeto ou `null`), não mais uma lista de setores;
        - a regra é da API: o banco não a impõe (`SETORES.ID_GESTOR` não é único).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamSetorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetorComando' }
            example: { nome: Comercial, descricao: Vendas e relacionamento com clientes, gestorFuncionarioId: 7 }
      responses:
        '200':
          description: Setor alterado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetorItem' }
              example:
                id: 1
                nome: Comercial
                descricao: Vendas e relacionamento com clientes
                gestor: { gestorId: 1, funcionarioId: 7, nome: Carlos Ribeiro }
                quantidadePessoas: 9
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409Setor' }
        '422': { $ref: '#/components/responses/Erro422Setor' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Cadastros de apoio: gestores e "gestor ausente"
  # ------------------------------------------------------------------
  /api/rh/gestores:
    get:
      tags: [Cadastros de apoio]
      operationId: listarGestores
      summary: Lista os gestores, o setor de cada um e quem está ausente.
      description: |
        Tela 29, cadastro "Gestores" ("Quem gerencia cada setor"). Só o perfil `RH`. Lista curta, **sem paginação**, na
        ordem de `gestorId`. Cada linha: a pessoa, o **setor** que gerencia (um só; `null` para quem é gestor sem setor, como o RH que decide
        os pedidos de gestores), o tamanho da equipe (a equipe de `GET /api/gestor/equipe`: pessoas ativas do setor, com
        a admissão já começada, **sem** ele; o número do menu lateral é a quantidade de `itens`; o Figma mostra "6", o
        cenário de hoje tem 5: três gestores de setor e duas pessoas do RH) e a marcação de
        **gestor ausente** (decisão do dono, 2026-10-29, antes chamada "chave de aprovação automática"): quando o gestor
        está ausente, o RH o marca e a etapa do gestor é aprovada sozinha nos pedidos de ponto e de férias da equipe
        dele (o RH ainda decide depois). Para ligar e desligar, veja `PUT /api/rh/gestores/{gestorId}/ausencia`.

        **`soDecidePedidosDeGestores`** separa os dois tipos de linha: `false` para quem **gerencia um setor** (perfil
        `Gestor`); `true` para a pessoa do RH cadastrada **só para decidir os pedidos de gestores** (o trigger do banco
        exige uma linha em Gestores em quem decide). Essa pessoa não tem setor nem equipe, não é gestora de setor e não
        usa as rotas `/api/gestor/...`; a tela mostra, no lugar do setor, "Só decide pedidos de gestores".

        **Quem é gestor:** quem tem linha em Gestores, está ativo **e** gerencia um setor ou é do RH cadastrado para decidir
        pedidos de gestores. Não é o mesmo que o perfil `Gestor` sozinho. Quem deixou de gerenciar um setor e voltou ao
        nível `Funcionario` mantém a linha no banco (os pedidos antigos a referenciam), mas deixa de contar como gestor e
        não aparece nesta lista.

        `ausente` é a marcação do RH; `ausenteAte` é a data de volta (opcional); `ausenteHoje` diz se a marcação vale
        **hoje**: `ausente` **e** (sem data de volta **ou** hoje antes dessa data). Vale **até o dia anterior** à data de
        volta (decisão do dono). Passada a data de volta, `ausente` continua `true` no cadastro, mas `ausenteHoje` vira
        `false` (a API não desliga a marcação sozinha); a tela mostra "Ausente" só com `ausenteHoje = true`.
        O "Níveis de acesso" do Figma **não existe** (decisão do dono, 2026-10-30).
      x-perfis: [RH]
      responses:
        '200':
          description: Os gestores.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GestorListaResposta' }
              example:
                itens:
                  - gestorId: 1
                    funcionario: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                    setor: { id: 1, nome: Comercial }
                    soDecidePedidosDeGestores: false
                    quantidadeEquipe: 8
                    ausente: false
                    ausenteAte: null
                    ausenteHoje: false
                  - gestorId: 2
                    funcionario: { id: 8, nome: Marina Costa, cargo: Gerente financeira, setor: Financeiro, ativo: true }
                    setor: { id: 2, nome: Financeiro }
                    soDecidePedidosDeGestores: false
                    quantidadeEquipe: 6
                    ausente: false
                    ausenteAte: null
                    ausenteHoje: false
                  - gestorId: 3
                    funcionario: { id: 9, nome: Paulo Vieira, cargo: Gerente de logística, setor: Logística, ativo: true }
                    setor: { id: 6, nome: Logística }
                    soDecidePedidosDeGestores: false
                    quantidadeEquipe: 43
                    ausente: true
                    ausenteAte: '2026-10-19'
                    ausenteHoje: true
                  - gestorId: 4
                    funcionario: { id: 1, nome: Ana Souza, cargo: Gerente de RH, setor: Recursos Humanos, ativo: true }
                    setor: null
                    soDecidePedidosDeGestores: true
                    quantidadeEquipe: 0
                    ausente: false
                    ausenteAte: null
                    ausenteHoje: false
                  - gestorId: 5
                    funcionario: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                    setor: null
                    soDecidePedidosDeGestores: true
                    quantidadeEquipe: 0
                    ausente: false
                    ausenteAte: null
                    ausenteHoje: false
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Cadastros de apoio]
      operationId: cadastrarGestor
      summary: Cadastra uma pessoa como gestor, sem ligá-la a um setor.
      description: |
        Tela 29, cadastro "Gestores". Só o perfil `RH`. Serve para cadastrar **quem do RH vai decidir os pedidos de
        gestores**: o banco exige que quem decide seja também um gestor cadastrado (decisão do dono, 2026-10-29).
        **Só aceita quem tem o nível `RH`** (a linha nasce com `soDecidePedidosDeGestores = true`, sem setor): quem tem outro
        nível dá 422 `GESTOR_SEM_SETOR_SO_PARA_RH`. Para pôr alguém como gestor **de um setor**, use
        `PUT /api/rh/setores/{setorId}` (que cadastra sozinho e promove `Funcionario` a `Gestor`).
        A pessoa precisa estar ativa (422 `FUNCIONARIO_INATIVO`, regra do banco: `Nao e possivel cadastrar como
        gestor um funcionario inativo.`) e não pode já ser gestor (409 `GESTOR_JA_CADASTRADO`). O nível dela não muda.

        **Quem é gestor:** quem tem linha em Gestores, está ativo e gerencia um setor ou é do RH cadastrado aqui (ver
        `GET /api/rh/gestores`). É essa linha que o banco exige em quem decide um pedido; por isso quem do RH decide os
        pedidos de gestores precisa estar aqui, mesmo sem setor (`CONVENCOES.md`, seção 9). O nível `Gestor` sozinho não
        faz ninguém gerenciar um setor.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GestorCadastrarComando' }
            example: { funcionarioId: 2 }
      responses:
        '201':
          description: Gestor cadastrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GestorItem' }
              example:
                gestorId: 5
                funcionario: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                setor: null
                soDecidePedidosDeGestores: true
                quantidadeEquipe: 0
                ausente: false
                ausenteAte: null
                ausenteHoje: false
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '409':
          description: A pessoa já é gestor.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Conflito.
                status: 409
                detail: Esta pessoa já está cadastrada como gestor.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: GESTOR_JA_CADASTRADO
        '422':
          description: A pessoa está inativa ou não é do RH. Os códigos estão em `examples`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                funcionarioInativo:
                  summary: A pessoa escolhida está inativa
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: A pessoa escolhida está inativa.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_INATIVO
                    regraDoBanco: Nao e possivel cadastrar como gestor um funcionario inativo.
                soParaRh:
                  summary: A pessoa não tem o nível RH (para gerenciar um setor, use o cadastro de setores)
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Só quem é do RH é cadastrado como gestor sem setor. Para gerenciar um setor, escolha a pessoa no cadastro de Setores.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: GESTOR_SEM_SETOR_SO_PARA_RH
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/gestores/{gestorId}/ausencia:
    put:
      tags: [Cadastros de apoio]
      operationId: configurarAusenciaDoGestor
      summary: Marca ou desmarca um gestor como ausente (a etapa dele passa a ser aprovada sozinha).
      description: |
        Tela 29, cadastro "Gestores" ("gestor ausente"; antes "chave de aprovação automática"). Só o perfil `RH`.
        O RH marca quando o gestor está ausente **por qualquer motivo, a qualquer momento**: vale **por gestor** (toda a
        equipe dele) e para **pedidos de ponto e de férias** (`CONVENCOES.md`, seção 9). **Esta é a única rota dessa
        marcação**; as fatias 3 e 7 só usam o efeito dela.

        - `ausente = true`: marca; `ausenteAte` (opcional) é a **data de volta** do gestor, que precisa ser **depois de
          hoje** (senão 400 em `ausenteAte`); a marcação vale até o dia anterior a ela. Sem data, vale até o RH desmarcar.
        - `ausente = false`: desmarca; `ausenteAte` precisa vir `null` (senão 400).

        **Efeito (escolha de engenharia, a avisar o dono):**
        - **Enquanto marcado**, os pedidos **novos** da equipe dele nascem com a etapa do gestor já aprovada
          ("aprovada automaticamente"; o pedido registra que foi automática) e seguem para `etapa: RH`: quem decide é o RH,
          que ainda pode recusar (o RH pode recusar o que o gestor aprovou).
        - **Ao marcar**, a API também aprova, **na mesma operação**, a etapa do gestor dos pedidos de ponto e de férias que
          **já estavam parados esperando por ele** (`etapa: GESTOR`): eles passam para a etapa do RH. **Exceção:** pedido de
          férias com **sugestão de data em andamento** (o gestor sugeriu outra data e a pessoa ainda não respondeu) não é
          aprovado, porque depende da resposta da pessoa. A resposta diz quantos pedidos passaram assim
          (`pedidosAprovadosAgora`).
        - **Ao desmarcar** (ou ao chegar a data de volta), **só os pedidos novos** voltam ao normal; o que já foi aprovado
          automaticamente continua aprovado.
        - **Não muda** os pedidos que já não teriam etapa do gestor (de quem é gestor, de quem não tem gestor ativo e de
          quem tem gestor desligado): esses vão direto ao RH de qualquer jeito.
        - O que marcar e desmarcar entra na auditoria.

        **Só vale para quem gerencia um setor.** Para a pessoa do RH cadastrada só para decidir pedidos de gestores
        (`soDecidePedidosDeGestores = true`) não há etapa do gestor para aprovar sozinha: a marcação é recusada com 422
        `GESTOR_SEM_EQUIPE`. Marcar, desmarcar e a data de volta valem para qualquer motivo de ausência.

        No banco, a marcação é `GESTORES.APROVACAO_AUTOMATICA` e `GESTORES.APROVACAO_AUTOMATICA_ATE` (script V011; o
        nome das colunas não mudou).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamGestorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GestorAusenciaComando' }
            example: { ausente: true, ausenteAte: '2026-10-19' }
      responses:
        '200':
          description: Marcação atualizada (o exemplo é a de Paulo Vieira, feita em 2026-10-06, quando nenhum pedido esperava por ele).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GestorAusenciaResposta' }
              example:
                gestorId: 3
                funcionario: { id: 9, nome: Paulo Vieira, cargo: Gerente de logística, setor: Logística, ativo: true }
                setor: { id: 6, nome: Logística }
                soDecidePedidosDeGestores: false
                quantidadeEquipe: 43
                ausente: true
                ausenteAte: '2026-10-19'
                ausenteHoje: true
                pedidosAprovadosAgora: { ajustesDePonto: 0, ferias: 0 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A pessoa só decide pedidos de gestores e não tem equipe.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Ana Souza só decide pedidos de gestores e não tem equipe. Não há etapa do gestor para aprovar sozinha.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: GESTOR_SEM_EQUIPE
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Cadastros de apoio: benefícios do catálogo
  # ------------------------------------------------------------------
  /api/rh/beneficios:
    get:
      tags: [Cadastros de apoio]
      operationId: listarBeneficiosDoCatalogo
      summary: Lista os benefícios do catálogo ("O que a empresa oferece").
      description: |
        Tela 29, cadastro "Benefícios" (e as caixas "Benefícios" do cadastro do colaborador, com
        `tamanhoPagina = 100`). Só o perfil `RH`. `busca` procura no nome e na descrição.
        `quantidadePessoas` conta as pessoas com o benefício **ativo**. Os pedidos de adesão e os dependentes são da
        fatia 7. O número do menu lateral é o `total` (o Figma mostra "6"; o catálogo de hoje tem 7). Ordem: `id` (a
        ordem em que foram cadastrados). Os ids do catálogo de demonstração são 1 Vale-refeição,
        2 Plano de saúde, 3 Plano odontológico, 4 Vale-transporte, 5 Seguro de vida, 6 Auxílio-creche e 7 Vale-cultura
        (`ELENCO.md`); a fatia 7 só usa ids e nomes daqui.

        **O catálogo ganhou três marcas** (decisão do dono, 2026-10-30), que o RH marca em Cadastros, Benefícios, e que a
        fatia 7 usa na tela "Benefícios" do funcionário (tela 44): `opcional` (a própria pessoa pode pedir; é o que
        aparece em "Disponíveis para você"), `aceitaDependentes` (o pedido deixa incluir dependentes, como no plano de
        saúde) e `aceitaTrajeto` (o pedido pede o trajeto, como no vale-transporte). No catálogo de demonstração só os
        benefícios 3 (Plano odontológico) e 6 (Auxílio-creche) são `opcional`: são os dois "Disponíveis para você" que a
        tela 44 mostra ao Bruno, que já tem o 1, o 2, o 4 e o 5 (os "Seus benefícios" das telas 44 e 46).
        **Depende do script SQL `V031`**: três colunas booleanas em `BENEFICIOS`, `OPCIONAL`, `ACEITA_DEPENDENTES` e
        `ACEITA_TRAJETO` (a tabela tinha só nome e descrição, `Criacao_Tabelas:536-542`). Nascem `FALSE`: o benefício que já existia
        fica "só o RH concede, sem dependentes e sem trajeto", e a API grava o valor que o RH marcou.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
      responses:
        '200':
          description: Uma página de benefícios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficioCatalogoListaResposta' }
              example:
                itens:
