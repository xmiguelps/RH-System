  # ------------------------------------------------------------------
  # Cadastros de apoio: cargos
  # ------------------------------------------------------------------
  /api/rh/cargos:
    get:
      tags: [Cadastros de apoio]
      operationId: listarCargos
      summary: Lista os cargos, com a carga semanal e quantas pessoas têm cada um.
      description: |
        Tela 29, cadastro "Cargos" (e as opções do campo "Cargo" no cadastro do colaborador, com
        `tamanhoPagina = 100`). Só o perfil `RH`. `busca` procura no nome e na descrição. Ordem: nome.
        `quantidadePessoas` conta as pessoas **ativas** com o cargo. O número no menu lateral do cadastro ("14")
        é o `total` (para só saber o total, peça `tamanhoPagina = 1`).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
      responses:
        '200':
          description: Uma página de cargos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargoListaResposta' }
              example:
                itens:
                  - { id: 1, nome: Analista financeiro pleno, descricao: 'Contas a pagar e a receber, conciliação', cargaSemanalHoras: 44, quantidadePessoas: 6 }
                  - { id: 2, nome: Vendedor, descricao: Atendimento e vendas na loja, cargaSemanalHoras: 44, quantidadePessoas: 22 }
                  - { id: 7, nome: Estagiário, descricao: 'Apoio às áreas, contrato de estágio', cargaSemanalHoras: 30, quantidadePessoas: 7 }
                pagina: 1
                tamanhoPagina: 20
                total: 14
                totalPaginas: 1
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Cadastros de apoio]
      operationId: criarCargo
      summary: Cria um cargo (botão "Novo cargo").
      description: |
        Tela 30 (modal "Novo cargo"). Só o perfil `RH`. Nome único (sem diferenciar maiúsculas): repetido dá 409
        `NOME_JA_CADASTRADO`. A carga horária é **semanal** (ex.: 44) e vale para todas as pessoas do cargo; é
        com ela que o ponto calcula o saldo (o ponto de um dia usa a carga semanal dividida por 5).
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargoComando' }
            example: { nome: Analista de compras, descricao: 'Cotações, pedidos e relação com fornecedores', cargaSemanalHoras: 44 }
      responses:
        '201':
          description: Cargo criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargoItem' }
              example: { id: 15, nome: Analista de compras, descricao: 'Cotações, pedidos e relação com fornecedores', cargaSemanalHoras: 44, quantidadePessoas: 0 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '409': { $ref: '#/components/responses/Erro409CadastroNomeRepetido' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/cargos/{cargoId}:
    put:
      tags: [Cadastros de apoio]
      operationId: editarCargo
      summary: Altera um cargo (botão "Editar").
      description: |
        Tela 29, botão "Editar" (abre o mesmo modal da tela 30). Só o perfil `RH`. Substitui nome, descrição e
        carga semanal. A nova carga vale para os dias de ponto **criados depois**; os pontos já gravados não mudam.
        **Não existe exclusão de cargo** (o Figma só tem "Editar").
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamCargoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargoComando' }
            example: { nome: Vendedor, descricao: Atendimento e vendas na loja, cargaSemanalHoras: 40 }
      responses:
        '200':
          description: Cargo alterado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargoItem' }
              example: { id: 2, nome: Vendedor, descricao: Atendimento e vendas na loja, cargaSemanalHoras: 40, quantidadePessoas: 22 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409CadastroNomeRepetido' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ------------------------------------------------------------------
  # Cadastros de apoio: setores
  # ------------------------------------------------------------------
  /api/rh/setores:
    get:
      tags: [Cadastros de apoio]
      operationId: listarSetores
      summary: Lista os setores, com o gestor e quantas pessoas há em cada um.
      description: |
        Tela 29, cadastro "Setores" ("Áreas e seus gestores"), e as opções do campo "Setor" no cadastro do
        colaborador (com `tamanhoPagina = 100`; o campo "Gestor" do cadastro mostra o `gestor` do setor escolhido).
        Só o perfil `RH`. `busca` procura no nome e na descrição. Lista curta, todos os setores numa página; ordem: nome.
        `quantidadePessoas` conta as pessoas **ativas, com a admissão já começada**, do setor, **inclusive o gestor**
        (quem ainda está em admissão não conta). O número do menu lateral é o `total` (o Figma mostra "6"; o cenário de
        hoje tem 7, com Compras). Cada setor tem **um** gestor, ou nenhum, e um gestor responde por **um** setor; **só quem
        tem o nível `Gestor` gerencia um setor** (`CONVENCOES.md`, seção 9).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
      responses:
        '200':
          description: Uma página de setores.
          content:
