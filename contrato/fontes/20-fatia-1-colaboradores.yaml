  /api/rh/usuarios:
    get:
      tags: [Usuários do sistema]
      operationId: listarUsuariosDoSistema
      summary: Lista os logins de acesso ao portal, com a situação de cada um.
      description: |
        Tela 29, cadastro "Usuários do sistema" ("Logins de acesso ao portal"). Só o perfil `RH`. Decisão do dono
        (2026-10-30): **mínimo**, sem apagar. Cada linha é um **colaborador ativo ou em admissão**, inclusive quem
        ainda não recebeu convite; **inativos não aparecem** (perdem o login sozinhos; no Figma o número do menu é
        103, igual aos 101 ativos mais os 2 em admissão; o cenário de hoje tem 104, com 3 em admissão). O número do
        menu lateral é o `total`. Quem foi **readmitido** volta a aparecer aqui, com o login ainda desativado até o
        "Ativar" (`POST /api/rh/funcionarios/{funcionarioId}/readmissao`).
        `busca` procura no nome e no e-mail corporativo.

        `situacao`: `SEM_CONVITE` (ainda não tem login), `CONVITE_ENVIADO` (convite válido, senha ainda não
        definida), `CONVITE_EXPIRADO` (venceu: reenviar) e `SENHA_DEFINIDA`. `ativo` diz se o login está
        liberado (`false` em `SEM_CONVITE`). Ordem: nome.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
        - name: situacao
          in: query
          description: Só os logins nesta situação.
          schema: { $ref: '#/components/schemas/UsuarioSistemaSituacao' }
        - name: ativo
          in: query
          description: Só os logins liberados (`true`) ou só os desativados (`false`).
          schema: { type: boolean }
      responses:
        '200':
          description: Uma página de logins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioSistemaListaResposta' }
              example:
                itens:
                  - funcionarioId: 12
                    nome: Bruno Lima
                    emailCorporativo: bruno.lima@empresa.com.br
                    perfil: Funcionario
                    situacao: SENHA_DEFINIDA
                    ativo: true
                    ultimoLoginEmUtc: '2026-10-07T11:58:00Z'
                    conviteEnviadoEmUtc: '2022-03-14T12:00:00Z'
                  - funcionarioId: 104
                    nome: Rafael Torres
                    emailCorporativo: rafael.torres@empresa.com.br
                    perfil: Funcionario
                    situacao: CONVITE_ENVIADO
                    ativo: true
                    ultimoLoginEmUtc: null
                    conviteEnviadoEmUtc: '2026-10-05T15:30:00Z'
                  - funcionarioId: 200
                    nome: Lucas Prado
                    emailCorporativo: lucas.prado@empresa.com.br
                    perfil: Funcionario
                    situacao: SEM_CONVITE
                    ativo: false
                    ultimoLoginEmUtc: null
                    conviteEnviadoEmUtc: null
                pagina: 1
                tamanhoPagina: 20
                total: 104
                totalPaginas: 6
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/usuarios/{funcionarioId}/convite:
    post:
      tags: [Usuários do sistema]
      operationId: enviarConviteDeAcesso
      summary: Envia ou reenvia o convite de acesso ao portal.
      description: |
        Tela 29 ("Reenviar convite") e menu "..." da ficha. Só o perfil `RH`. Cria o login se ainda não existe
        (sem senha utilizável), invalida o convite anterior e coloca o e-mail na fila. O link vale 7 dias. Depende das
        **tabelas novas da aplicação** de convite (token, `V033`) e de fila de e-mails (`V035`), e da marca de senha provisória
        em `USUARIOS` (`V032`), que a API liga ao criar o login por convite e desliga quando a pessoa define a senha.
        A pessoa precisa estar **ativa** (422 `FUNCIONARIO_INATIVO`) e ter **e-mail corporativo** (sem ele, 422
        `FUNCIONARIO_SEM_EMAIL_CORPORATIVO`: o RH completa o cadastro antes).
        Quem já definiu a senha **não** recebe convite: 422 `SENHA_JA_DEFINIDA` (a pessoa usa "Esqueci minha
        senha"). Quem tem o **login desativado** (`ativo: false` em Usuários do sistema) também não recebe: 422
        `USUARIO_DESATIVADO` (o RH usa "Ativar" antes, porque o link de um login desativado não funcionaria).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
      responses:
        '200':
          description: Convite colocado na fila. Devolve o login atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioSistemaItem' }
              example:
                funcionarioId: 200
                nome: Lucas Prado
                emailCorporativo: lucas.prado@empresa.com.br
                perfil: Funcionario
                situacao: CONVITE_ENVIADO
                ativo: true
                ultimoLoginEmUtc: null
                conviteEnviadoEmUtc: '2026-10-07T12:40:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A pessoa está inativa, não tem e-mail corporativo ou já definiu a senha.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                inativo:
                  summary: Colaborador inativo
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Não é possível enviar convite a um colaborador inativo.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_INATIVO
                    regraDoBanco: Nao e possivel criar usuario para funcionario inativo.
                semEmailCorporativo:
                  summary: Colaborador sem e-mail corporativo
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Esta pessoa não tem e-mail corporativo cadastrado. Edite o cadastro antes de enviar o convite.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_SEM_EMAIL_CORPORATIVO
                senhaDefinida:
                  summary: Já definiu a senha
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Esta pessoa já definiu a senha. Se ela esqueceu, use "Esqueci minha senha" na tela de entrada.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: SENHA_JA_DEFINIDA
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/usuarios/{funcionarioId}/ativar:
    post:
      tags: [Usuários do sistema]
      operationId: ativarUsuarioDoSistema
      summary: Libera o login de um colaborador (botão "Ativar").
      description: |
        Tela 29, botão "Ativar". Só o perfil `RH`. Só para quem **já tem login** (`situacao` diferente de
        `SEM_CONVITE`, senão 422 `SEM_USUARIO`: envie o convite). Só reativa login de colaborador **ativo**
        (422 `FUNCIONARIO_INATIVO`, regra do banco: `Nao e possivel reativar usuario de funcionario inativo.`).
        Já liberado: devolve o login como está.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/ParamColaboradorId'
