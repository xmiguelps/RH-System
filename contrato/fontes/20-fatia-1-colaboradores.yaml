                    status: 422
                    detail: Esta pessoa já definiu a senha. Desmarque o convite e libere o acesso em Usuários do sistema (Ativar).
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: SENHA_JA_DEFINIDA
                semOnboarding:
