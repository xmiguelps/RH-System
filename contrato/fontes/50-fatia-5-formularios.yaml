            example:
              texto: Você tem disponibilidade para trabalhar aos sábados?
              tipo: MULTIPLA_ESCOLHA
              obrigatoria: true
              alternativas: [{ texto: Sim }, { texto: Não }]
      responses:
        '201':
          description: Pergunta criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerguntaFormulario' }
              example:
                id: 501
                ordem: 1
                texto: Você tem disponibilidade para trabalhar aos sábados?
                tipo: MULTIPLA_ESCOLHA
                obrigatoria: true
                alternativas:
                  - { id: 901, ordem: 1, texto: Sim }
                  - { id: 902, ordem: 2, texto: Não }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Anonimato' }
        '422': { $ref: '#/components/responses/FormularioErro422Edicao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}/perguntas/{perguntaId}:
    put:
      tags: [Formulários]
      operationId: editarPerguntaFormulario
      summary: Altera uma pergunta (botão Editar da etapa Perguntas).
      description: |
        Troca o conteúdo inteiro da pergunta. `ordem` move a pergunta de lugar (as outras se ajustam); sem `ordem`, ela
        fica onde está. `alternativas`: as que trazem `id` mantêm o `id`; as sem `id` são novas; as que sumiram da lista
        são apagadas.

        **Pergunta que já tem resposta** (qualquer pessoa ou candidato, em formulário com nome): o banco recusa mudar
        `texto`, `tipo` e apagar a pergunta (mensagem do trigger "Pergunta ja respondida: nao e possivel alterar texto,
        tipo ou formulario."), e a aplicação recusa mudar ou apagar as alternativas dela. Só `obrigatoria` e `ordem`
        ainda mudam. Erro 422 `PERGUNTA_JA_RESPONDIDA`. Em formulário `ENCERRADO`, nada muda.

        **Formulário anônimo `PUBLICADO`: as perguntas estão congeladas** (regra 2 em "Formulários"), **inclusive
        `obrigatoria` e `ordem`**. A chamada devolve sempre 409 `ANONIMO_PERGUNTAS_FIXAS`, sem olhar se a pergunta tem
        resposta: o erro `PERGUNTA_JA_RESPONDIDA` diria que alguém já respondeu, então ele nunca sai num anônimo. O trigger
        do banco acima é só a segunda barreira.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioPerguntaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerguntaComando' }
            example:
              texto: Você tem disponibilidade para trabalhar aos sábados e domingos?
              tipo: MULTIPLA_ESCOLHA
              obrigatoria: true
              alternativas:
                - { id: 901, texto: Sim }
                - { id: 902, texto: Não }
                - { texto: Só aos sábados }
      responses:
        '200':
          description: Pergunta atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerguntaFormulario' }
              example:
                id: 501
                ordem: 1
                texto: Você tem disponibilidade para trabalhar aos sábados e domingos?
                tipo: MULTIPLA_ESCOLHA
                obrigatoria: true
                alternativas:
                  - { id: 901, ordem: 1, texto: Sim }
                  - { id: 902, ordem: 2, texto: Não }
                  - { id: 903, ordem: 3, texto: Só aos sábados }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Anonimato' }
        '422': { $ref: '#/components/responses/FormularioErro422Edicao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    delete:
      tags: [Formulários]
      operationId: excluirPerguntaFormulario
      summary: Apaga uma pergunta que ainda não tem resposta.
      description: |
        As perguntas seguintes sobem uma posição. Pergunta já respondida não se apaga (trigger "Pergunta ja respondida:
        nao e possivel exclui-la."): 422 `PERGUNTA_JA_RESPONDIDA`. **Formulário anônimo `PUBLICADO`: as perguntas estão
        congeladas** (regra 2 em "Formulários"); a chamada devolve sempre 409 `ANONIMO_PERGUNTAS_FIXAS`, com ou sem
        resposta, e `PERGUNTA_JA_RESPONDIDA` nunca sai num anônimo (diria que alguém respondeu).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioPerguntaId'
      responses:
        '204': { description: Pergunta apagada. }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Anonimato' }
        '422': { $ref: '#/components/responses/FormularioErro422Edicao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}/verificacao:
    get:
      tags: [Formulários]
      operationId: verificarFormulario
      summary: Confere o formulário antes de publicar (etapa Verificação).
      description: |
        Tela 19. Devolve a lista de conferências na ordem em que aparecem. `situacao` de cada item: `OK` (marca verde),
        `AVISO` (laranja, **não impede** publicar) ou `BLOQUEIO` (impede; `podePublicar` fica falso e `publicarFormulario`
        recusa com 422 `VERIFICACAO_COM_BLOQUEIO`). Itens de `codigo` fixo:
        - `TITULO_E_DESCRICAO`: `OK` com título e descrição preenchidos; `AVISO` se a descrição está vazia.
        - `PERGUNTAS`: `OK` com "N perguntas, M obrigatórias"; `BLOQUEIO` se não há nenhuma pergunta.
        - `ALTERNATIVAS`: `BLOQUEIO` se uma pergunta de múltipla escolha tem menos de 2 alternativas.
        - `ANONIMO_SEM_ARQUIVO`: `BLOQUEIO` se o formulário é anônimo e tem pergunta de envio de arquivo.
        - `ANONIMO_RESULTADO_MINIMO`: só em formulário anônimo; `AVISO` fixo: o resultado só aparece depois de encerrar e
          só das perguntas com 3 respostas ou mais (na avaliação, também só dos avaliados com 3 respostas ou mais).
        - `ANONIMO_PUBLICO_MINIMO`: só em formulário anônimo (regra 1 em "Formulários"). Como esta etapa vem antes da
          Publicação, ela confere o público **já guardado** por `salvarPublicacaoFormulario`: `OK` com "N pessoas" se são 5
          ou mais, `BLOQUEIO` se são menos de 5 e `AVISO` ("escolha pelo menos 5 pessoas na etapa Publicação") se o público
          ainda não foi escolhido. `publicarFormulario` repete a conferência com o público do corpo.
        - `DADO_SENSIVEL`: `OK` ou `AVISO` com as perguntas que parecem pedir dado sensível (saúde, religião,
          orientação sexual).

        **Sumiram em relação ao Figma:** "A pergunta de quiz tem a resposta certa marcada e vale 2 pontos" e "A pergunta 2
        é de resposta longa: alguém do RH vai precisar dar a nota de cada candidato" (sem quiz e sem nota).
      x-provisorio: "Como a verificação de dado sensível funciona ainda não foi decidido (roadmap, fatia 5; spec 13.6). Hipótese mais simples usada aqui: a API procura palavras-chave (saúde, doença, religião, orientação sexual, etc.) no texto das perguntas e devolve AVISO, nunca BLOQUEIO. Se o dono escolher outro critério, só muda a lista de itens; o formato não muda."
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      responses:
        '200':
          description: Resultado da verificação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioVerificacao' }
              examples:
                semAvisos:
                  summary: Tudo certo
                  value:
                    podePublicar: true
                    itens:
                      - { codigo: TITULO_E_DESCRICAO, situacao: OK, mensagem: Título e descrição preenchidos., perguntaId: null }
                      - { codigo: PERGUNTAS, situacao: OK, mensagem: "4 perguntas, 3 obrigatórias.", perguntaId: null }
                      - { codigo: ALTERNATIVAS, situacao: OK, mensagem: Toda pergunta de múltipla escolha tem pelo menos 2 alternativas., perguntaId: null }
                      - { codigo: DADO_SENSIVEL, situacao: OK, mensagem: "Nenhuma pergunta pede dado sensível, como saúde, religião ou orientação sexual.", perguntaId: null }
                comAvisoEBloqueio:
                  summary: Formulário anônimo com avisos e dois bloqueios
                  value:
                    podePublicar: false
                    itens:
                      - { codigo: TITULO_E_DESCRICAO, situacao: AVISO, mensagem: O formulário não tem descrição., perguntaId: null }
                      - { codigo: PERGUNTAS, situacao: OK, mensagem: "2 perguntas, 1 obrigatória.", perguntaId: null }
                      - { codigo: ALTERNATIVAS, situacao: BLOQUEIO, mensagem: A pergunta 1 é de múltipla escolha e precisa de pelo menos 2 alternativas., perguntaId: 601 }
                      - { codigo: ANONIMO_RESULTADO_MINIMO, situacao: AVISO, mensagem: "O formulário é anônimo: o resultado só aparece depois de encerrar, e só das perguntas com 3 respostas ou mais.", perguntaId: null }
                      - { codigo: ANONIMO_PUBLICO_MINIMO, situacao: BLOQUEIO, mensagem: "O formulário anônimo está para 4 pessoas e precisa de pelo menos 5.", perguntaId: null }
                      - { codigo: DADO_SENSIVEL, situacao: AVISO, mensagem: A pergunta 2 parece pedir dado de saúde. Confira se ela é necessária., perguntaId: 602 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}/publicacao:
    put:
      tags: [Formulários]
      operationId: salvarPublicacaoFormulario
      summary: Guarda as escolhas da etapa Publicação sem publicar ("Salvar rascunho e sair").
      description: |
        Mesmo corpo de `publicarFormulario`, mas só guarda: o formulário continua `RASCUNHO` (ou `AGENDADO`, se já
        estava). Valem as mesmas regras de campo (ver `FormularioPublicacaoComando`), mas a verificação de bloqueios não
        roda e o público mínimo de 5 do formulário anônimo não é conferido aqui (só ao publicar). Não manda e-mail e não
        gera link. Não vale para `PUBLICADO` nem `ENCERRADO` (422).

        **`agendarPara` num rascunho não é guardado.** O banco só tem o dia agendado enquanto o formulário está `AGENDADO`:
        é a data de publicação preenchida (com o formulário inativo e sem encerramento) que o faz `AGENDADO`, e um rascunho
        não pode ter essa data (`V001`). Por isso, ao salvar a publicação de um formulário `RASCUNHO`, o `agendarPara` do
        corpo é aceito (valem as regras de campo), mas **não é guardado**: o formulário continua `RASCUNHO` e a resposta
        traz `publicacao.agendarPara: null`. Quem reabre o rascunho encontra a data vazia, e **a tela precisa mandar a data
        de novo ao agendar** (em `publicarFormulario`, com `agendarPara`). Os demais campos da etapa (`alvo`, setores,
        pessoas, `prazo`, `recorrencia`, `lembreteAutomatico`) são guardados normalmente.
      x-perfis: [RH]
      parameters:
