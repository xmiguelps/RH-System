                    valorEscala: null
                    arquivo: { respostaId: 8841, nome: comprovante-residencia.pdf }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422': { $ref: '#/components/responses/FormularioErro422Anonimo' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ===========================================================================
  # Público: candidato externo, sem login (página sem print)
  # ===========================================================================
  /api/publico/formularios/{token}:
    get:
      tags: [Formulário público]
      operationId: obterFormularioPublico
      summary: Abre o formulário do candidato pelo link, sem login.
      description: |
        **Esta página não existe no Figma** (roadmap, decisão 14): o front a desenha em estilo simples, como a prévia
        "Como o candidato vai ver" do assistente (cabeçalho com o nome da empresa, a etiqueta "Entrevista automática", o
        título, a descrição, barra "Pergunta 1 de 4" e "Próxima"), precedida de uma etapa de identificação (nome, e-mail,
        telefone, currículo) com o aviso de privacidade e a caixa de aceite.

        `token` é o segredo do link (`publicacao.tokenDoLink`). Token que não existe, ou de formulário em rascunho: 404
        (a mesma resposta). Agendado: 422 `FORMULARIO_AINDA_NAO_ABERTO`. Encerrado ou com o prazo vencido: 422
        `FORMULARIO_ENCERRADO`. Empresa ainda sem configuração (o cabeçalho usa o nome dela, `empresaNome`): 422
        `EMPRESA_NAO_CONFIGURADA`, o mesmo código de todas as fatias. **Limite de 30 consultas por minuto por IP** (429),
        para ninguém varrer tokens (o token é aleatório e longo demais para adivinhar, mas o limite é a segunda barreira).

        O candidato nunca vê o `id` interno do formulário nem dado de outro candidato. Perguntas de arquivo aceitam PDF
        ou Word, até 5 MB. Formulário anônimo nunca é público.
      x-provisorio: "Proteção do link público (decisão do dono pendente: limite simples ou captcha) e retenção dos dados de candidato (prazo e apagamento). Hipótese mais simples usada aqui: só limite por IP (30 consultas por minuto e 10 envios por hora, valores de partida configuráveis) e retenção de 180 dias (retencaoDias). Se for captcha, o envio ganha um campo de prova do captcha; se o dono quiser limite de respostas por link, a publicação ganha limiteDeRespostas (a coluna LINK_PUBLICO_LIMITE_RESPOSTAS já existe); se o prazo de retenção mudar, só o valor muda."
      x-perfis: [Publico]
      security: []
      parameters:
        - $ref: '#/components/parameters/FormularioTokenDoLink'
      responses:
        '200':
          description: O formulário público.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioPaginaPublica' }
              example:
                empresaNome: Comercial Aurora Ltda
                titulo: "Entrevista: auxiliar de logística"
                descricao: Responda com calma. Leva uns 10 minutos e o RH entra em contato em até 5 dias úteis.
                prazo: '2026-10-31'
                avisoDePrivacidade: "Usamos seu nome, e-mail, telefone, currículo e respostas só para avaliar a sua candidatura. Só o RH da empresa acessa esses dados. Guardamos por até 180 dias e depois apagamos. Se quiser que apaguemos antes, fale com o RH."
                retencaoDias: 180
                perguntas:
                  - id: 501
                    ordem: 1
                    texto: Você tem disponibilidade para trabalhar aos sábados?
                    tipo: MULTIPLA_ESCOLHA
                    obrigatoria: true
                    alternativas:
                      - { id: 901, ordem: 1, texto: Sim }
                      - { id: 902, ordem: 2, texto: Não }
                  - id: 502
                    ordem: 2
                    texto: Conte sobre uma vez em que você precisou organizar um estoque com prazo curto.
                    tipo: RESPOSTA_LONGA
                    obrigatoria: true
                    alternativas: []
                  - id: 503
                    ordem: 3
                    texto: De 1 a 5, como você avalia sua experiência com sistemas de estoque? (1 = nenhuma, 5 = muita)
                    tipo: ESCALA
                    obrigatoria: true
                    alternativas: []
                  - id: 504
                    ordem: 4
                    texto: Envie seu currículo (PDF ou Word, até 5 MB).
                    tipo: ARQUIVO
                    obrigatoria: false
                    alternativas: []
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422': { $ref: '#/components/responses/FormularioErro422Resposta' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/publico/formularios/{token}/respostas:
    post:
      tags: [Formulário público]
      operationId: responderFormularioPublico
      summary: Envia a candidatura e as respostas do candidato.
      description: |
        `multipart/form-data`: `nome`, `email`, `telefone` (opcional), `curriculo` (opcional: PDF ou Word, até 5 MB),
        `aceitouAvisoDePrivacidade` (precisa ser verdadeiro), `respostas` (texto JSON, como em `responderFormulario`) e
        `arquivos` (um arquivo por resposta de pergunta `ARQUIVO`, apontado por `arquivoIndice`). Tudo ou nada: o
        arquivo só é guardado depois de o banco aceitar as respostas (roadmap, decisão 7).

        Mesma regra de perguntas obrigatórias de `responderFormulario`. O mesmo e-mail só responde **uma vez** por
        formulário (409 `JA_RESPONDIDO`, o mesmo código de `responderFormulario`; regra do banco). Tipo ou tamanho de
        arquivo errado: 400 com o campo
        (`curriculo` ou `arquivos`). **Limite de 10 envios por hora por IP** (429, cabeçalho `Retry-After`).

        O arquivo enviado é servido só como anexo, por link temporário, e só ao RH (`baixarCurriculoDeCandidato`,
        `baixarArquivoDeResposta`). A auditoria não grava o valor dos dados do candidato (roadmap, decisão 13). O
        candidato é apagado pelo job de retenção depois de `retencaoDias`.
      x-provisorio: "Mesma decisão pendente de obterFormularioPublico: proteção do link público (limite simples ou captcha) e retenção dos dados de candidato."
      x-perfis: [Publico]
      security: []
      parameters:
        - $ref: '#/components/parameters/FormularioTokenDoLink'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CandidatoEnvio' }
            encoding:
              respostas: { contentType: application/json }
              curriculo: { contentType: 'application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document' }
              arquivos: { contentType: 'application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document' }
            example:
              nome: Mariana Teixeira
              email: mariana.teixeira@email.com.br
              telefone: (11) 98877-1204
              aceitouAvisoDePrivacidade: true
              respostas:
                - { perguntaId: 501, alternativaIds: [901] }
                - { perguntaId: 502, texto: Na Black Friday do ano passado reorganizei o estoque em dois dias. }
                - { perguntaId: 503, valorEscala: 4 }
      responses:
        '201':
          description: Candidatura recebida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatoRecibo' }
              example: { mensagem: Recebemos as suas respostas. Obrigado por se candidatar. }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409JaRespondeu' }
        '422': { $ref: '#/components/responses/FormularioErro422Resposta' }
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

components:
  parameters:
    FormularioId:
      name: formularioId
      in: path
      required: true
      description: Número do formulário.
      schema: { type: integer, minimum: 1 }
    FormularioPerguntaId:
      name: perguntaId
      in: path
      required: true
      description: Número da pergunta (precisa ser do formulário da rota).
      schema: { type: integer, minimum: 1 }
    FormularioFuncionarioId:
      name: funcionarioId
      in: path
      required: true
      description: Número da pessoa que respondeu.
      schema: { type: integer, minimum: 1 }
    FormularioCandidatoId:
      name: candidatoId
      in: path
      required: true
      description: Número do candidato (precisa ser do formulário da rota).
      schema: { type: integer, minimum: 1 }
    FormularioRespostaId:
      name: respostaId
      in: path
      required: true
      description: Número da resposta de arquivo (`arquivo.respostaId` das respostas).
      schema: { type: integer, minimum: 1 }
    FormularioAvaliadoIdConsulta:
      name: avaliadoId
      in: query
      description: Quem foi avaliado. Obrigatório nas avaliações e proibido nos outros tipos de formulário.
      schema: { type: integer, minimum: 1 }
    FormularioTokenDoLink:
      name: token
      in: path
      required: true
      description: Segredo do link público (`publicacao.tokenDoLink`).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' }
    FormularioConfirmar:
      name: confirmar
      in: query
      description: |
        Confirmação de quem quer seguir mesmo havendo pessoas que ainda não responderam (convenções, seção 13). Sem ela, a
        operação devolve 409 `CONFIRMACAO_NECESSARIA` com `pendentes` e nada muda; com `true`, executa.
      schema: { type: boolean, default: false }
    FormularioRespondidoEmConsulta:
      name: respondidoEmUtc
      in: query
      description: |
        Qual envio da pessoa se quer ver (o `respondidoEmUtc` da linha de `listarRespondentesFormulario`). Obrigatório na
        Sugestão, em que a mesma pessoa pode ter mandado várias vezes, e proibido nos outros tipos de formulário.
      schema: { type: string, format: date-time }

  responses:
    FormularioErro409Anonimato:
      description: |
        O formulário anônimo já está publicado e não aceita a mudança. `codigo`: `ANONIMATO_FIXO_APOS_PUBLICAR` (trocar
        `anonimo` depois de publicado, nos dois sentidos, ou mudar `tipo` ou `sentidoAvaliacao` de um anônimo publicado),
        `ANONIMO_PERGUNTAS_FIXAS` (acrescentar, editar, mover ou apagar pergunta de um anônimo publicado, com ou sem
        resposta: o erro nunca diz se alguém já respondeu) e `ANONIMO_SEM_NOVOS_DESTINATARIOS` (incluir pessoas num
        anônimo publicado). Regra 2 em "Formulários".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            trocaDeAnonimato:
              summary: Trocar o anonimato depois de publicar
              value:
                title: Conflito.
                status: 409
                detail: Depois de publicado, o formulário não muda entre anônimo e identificado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ANONIMATO_FIXO_APOS_PUBLICAR
            perguntasFixas:
              summary: Mexer nas perguntas de um anônimo publicado
              value:
                title: Conflito.
                status: 409
                detail: As perguntas de um formulário anônimo publicado não mudam.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ANONIMO_PERGUNTAS_FIXAS
            novosDestinatarios:
              summary: Incluir pessoas num anônimo publicado
              value:
                title: Conflito.
                status: 409
                detail: Um formulário anônimo publicado não recebe pessoas novas.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ANONIMO_SEM_NOVOS_DESTINATARIOS
    FormularioErro409Confirmacao:
      description: |
        Ainda há pessoas que podem responder e a chamada veio sem `confirmar=true`. `codigo`: `CONFIRMACAO_NECESSARIA`
        (convenções, seções 11 e 13). `pendentes` é o número de pessoas (nas avaliações, de avaliações) que ainda não
        responderam; **vem vazio em formulário anônimo**, para não revelar a contagem exata (regra 5 em "Formulários"), e
        nele o pedido de confirmação vem **sempre** enquanto está `PUBLICADO`, mesmo sem pendentes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FormularioConfirmacaoNecessaria' }
          examples:
            comNome:
              summary: Formulário com nome ("Pesquisa de segurança no trabalho")
              value:
                title: Confirmação necessária.
                status: 409
                detail: 63 pessoas ainda não responderam. Confirme para continuar.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: CONFIRMACAO_NECESSARIA
                pendentes: 63
            anonimo:
              summary: "Formulário anônimo (\"Pesquisa de clima 2026\"): sem número, e pedido mesmo que todos tenham participado"
              value:
                title: Confirmação necessária.
                status: 409
                detail: Num formulário anônimo o sistema não diz quantas pessoas ainda não responderam. Confirme para continuar.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: CONFIRMACAO_NECESSARIA
                pendentes: null
    FormularioErro409Resultado:
      description: |
        O resultado de um formulário anônimo só existe depois de encerrado. `codigo`: `RESULTADO_ANONIMO_INDISPONIVEL`
        (regra 3 em "Formulários").
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: Conflito.
            status: 409
            detail: O resultado de um formulário anônimo só aparece depois que ele é encerrado.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: RESULTADO_ANONIMO_INDISPONIVEL
    FormularioErro422Edicao:
      description: |
        A edição foi recusada por uma regra do formulário. `codigo`: `FORMULARIO_ENCERRADO` (formulário encerrado não muda),
        `FORMULARIO_NAO_PUBLICADO` (só publicado se encerra), `PERGUNTA_JA_RESPONDIDA` (só em formulário com nome: no
        anônimo publicado o erro é o 409 `ANONIMO_PERGUNTAS_FIXAS`), `ANONIMO_SEM_ARQUIVO`, `ANONIMO_SEM_LINK`,
        `LINK_SO_PARA_ENTREVISTA`. Pode trazer `regraDoBanco` com a mensagem original do trigger.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            perguntaRespondida:
              summary: Pergunta que já tem resposta
              value:
                title: Operação recusada.
                status: 422
                detail: Esta pergunta já foi respondida. Só dá para mudar se ela é obrigatória e a posição dela.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PERGUNTA_JA_RESPONDIDA
                regraDoBanco: "Pergunta ja respondida: nao e possivel alterar texto, tipo ou formulario."
            anonimoSemArquivo:
              summary: Pergunta de arquivo em formulário anônimo
              value:
                title: Operação recusada.
                status: 422
                detail: Formulário anônimo não pode ter pergunta de envio de arquivo.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ANONIMO_SEM_ARQUIVO
            encerrado:
              summary: Formulário encerrado
              value:
                title: Operação recusada.
                status: 422
                detail: O formulário está encerrado e não pode mais ser alterado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_ENCERRADO
    FormularioErro422Publicacao:
      description: |
        A publicação foi recusada. `codigo`: `FORMULARIO_ANONIMO_PUBLICO_PEQUENO` (anônimo para menos de 5 pessoas; é
        conferido antes da verificação), `VERIFICACAO_COM_BLOQUEIO` (há item `BLOQUEIO` em `verificarFormulario`),
        `LINK_SO_PARA_ENTREVISTA`, `ANONIMO_SEM_LINK`, `FORMULARIO_JA_PUBLICADO` (publicar o que já está publicado ou
        agendado), `FORMULARIO_ENCERRADO`, `ANONIMO_SEM_ARQUIVO` e `FUNCIONARIO_INATIVO` (uma das pessoas escolhidas está
        inativa; o mesmo código de todas as fatias).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            anonimoPublicoPequeno:
              summary: Formulário anônimo para menos de 5 pessoas
              value:
                title: Operação recusada.
                status: 422
                detail: Um formulário anônimo precisa ir para pelo menos 5 pessoas. Este vai para 4.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_ANONIMO_PUBLICO_PEQUENO
            verificacao:
              summary: A verificação tem bloqueio
              value:
                title: Operação recusada.
                status: 422
                detail: O formulário tem itens a corrigir antes de publicar. Veja a etapa Verificação.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: VERIFICACAO_COM_BLOQUEIO
            linkSoEntrevista:
              summary: Link público em formulário que não é entrevista
              value:
                title: Operação recusada.
                status: 422
                detail: Só a entrevista automática pode ser respondida por link. Escolha setores ou pessoas.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: LINK_SO_PARA_ENTREVISTA
            anonimoSemLink:
              summary: Link público em formulário anônimo
              value:
                title: Operação recusada.
                status: 422
                detail: Formulário anônimo não pode ser respondido por link público.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ANONIMO_SEM_LINK
                regraDoBanco: CHK_FORMULARIOS_ANONIMO_SEM_LINK
    FormularioErro422Alvo:
      description: |
        A rota não vale para este formulário. `codigo`: `FORMULARIO_POR_LINK` (use a lista de candidatos),
        `FORMULARIO_SEM_LINK` (use a lista de funcionários), `FORMULARIO_NAO_E_POR_PESSOAS`, `FORMULARIO_NAO_E_AVALIACAO`,
        `FORMULARIO_ENCERRADO` e `FUNCIONARIO_INATIVO` (incluir pessoa inativa; o mesmo código de todas as fatias).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            porLink:
              summary: Lista de funcionários num formulário por link
              value:
                title: Operação recusada.
                status: 422
                detail: Este formulário é respondido por link. Veja a lista de candidatos.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_POR_LINK
            naoEPorPessoas:
              summary: Incluir pessoas num formulário por setores
              value:
                title: Operação recusada.
                status: 422
                detail: Só dá para incluir pessoas em formulário feito para pessoas escolhidas.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_NAO_E_POR_PESSOAS
            funcionarioInativo:
              summary: Incluir uma pessoa inativa
              value:
                title: Operação recusada.
                status: 422
                detail: Uma das pessoas escolhidas está inativa e não pode receber o formulário.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_INATIVO
    FormularioErro422Anonimo:
      description: |
        A rota mostraria quem respondeu num formulário anônimo, ou o formulário não está aberto, ou ela não faz sentido
        na Sugestão. `codigo`: `FORMULARIO_ANONIMO`, `FORMULARIO_NAO_PUBLICADO`, `FORMULARIO_POR_LINK` (lembrete em
        formulário por link) e `FORMULARIO_SUGESTAO` (lembrete, ou "ver minhas respostas", na Sugestão).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            anonimo:
              summary: Respostas de uma pessoa num formulário anônimo
              value:
                title: Operação recusada.
                status: 422
                detail: "Este formulário é anônimo: o sistema não guarda quem respondeu o quê."
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_ANONIMO
            naoPublicado:
              summary: Lembrete em formulário que não está aberto
              value:
                title: Operação recusada.
                status: 422
                detail: Só dá para lembrar quem falta em formulário publicado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_NAO_PUBLICADO
            sugestao:
              summary: Lembrete numa Sugestão
              value:
                title: Operação recusada.
                status: 422
                detail: A caixa de sugestões é sempre aberta e ninguém é obrigado a responder, então não há quem lembrar.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_SUGESTAO
    FormularioErro422Resultado:
      description: |
        Não há resultado para mostrar ou exportar, mesmo com o formulário anônimo já encerrado. `codigo`:
        `RESULTADO_SEM_RESPOSTAS_SUFICIENTES`: na exportação, nenhuma pergunta chegou a 3 respostas (ou, na avaliação,
        nenhum avaliado chegou a 3); em `obterResultadoFormulario`, o avaliado pedido recebeu menos de 3 respostas (regra
        4 em "Formulários"). A resposta nunca diz quantas respostas houve.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            nenhumaPergunta:
              summary: Exportar um anônimo em que nenhuma pergunta chegou a 3 respostas
              value:
                title: Operação recusada.
                status: 422
                detail: Nenhuma pergunta deste formulário anônimo teve 3 respostas ou mais, então não há resultado para exportar.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: RESULTADO_SEM_RESPOSTAS_SUFICIENTES
            avaliadoAbaixoDoMinimo:
              summary: Resultado de um avaliado que recebeu menos de 3 respostas
              value:
                title: Operação recusada.
                status: 422
                detail: Esta pessoa recebeu menos de 3 avaliações, então o resultado dela não aparece.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: RESULTADO_SEM_RESPOSTAS_SUFICIENTES
    FormularioErro422Resposta:
      description: |
        O formulário não pode ser respondido (ou aberto) agora. `codigo`: `FORMULARIO_AINDA_NAO_ABERTO` (agendado),
        `FORMULARIO_ENCERRADO` (encerrado ou prazo vencido), `AVALIADO_INVALIDO`, `FUNCIONARIO_INATIVO` e, só na página
        pública, `EMPRESA_NAO_CONFIGURADA` (os dois com o mesmo código de todas as fatias). Pode trazer `regraDoBanco`
        com a mensagem original do trigger ("Pergunta obrigatoria: informe a resposta.", "Formulario inativo nao aceita
        respostas.", "Funcionario inativo nao pode responder formularios.").
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            encerrado:
              summary: Formulário encerrado ou com o prazo vencido
              value:
                title: Operação recusada.
                status: 422
                detail: Este formulário não está mais aceitando respostas.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_ENCERRADO
            aindaNaoAberto:
              summary: Formulário agendado
              value:
                title: Operação recusada.
                status: 422
                detail: Este formulário ainda não está aberto. Tente de novo a partir da data de publicação.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FORMULARIO_AINDA_NAO_ABERTO
            avaliadoInvalido:
              summary: Avaliar quem não está na lista
              value:
                title: Operação recusada.
                status: 422
                detail: Você não deve avaliar esta pessoa neste formulário.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: AVALIADO_INVALIDO
            empresaNaoConfigurada:
              summary: Página pública numa empresa ainda sem configuração
              value:
                title: Operação recusada.
                status: 422
                detail: Este formulário ainda não está disponível. Fale com o RH.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMPRESA_NAO_CONFIGURADA
    FormularioErro409JaRespondeu:
      description: |
        A pessoa (ou o e-mail do candidato) já respondeu. Um só `codigo` para os dois casos: `JA_RESPONDIDO` (funcionário
        em qualquer tipo, menos a Sugestão, que aceita várias respostas da mesma pessoa; e candidato do formulário por
        link, pelo e-mail). É o mesmo código de todas as fatias (convenções, seção 11).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            jaRespondido:
              summary: Funcionário que já respondeu
              value:
                title: Conflito.
                status: 409
                detail: Você já respondeu este formulário.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: JA_RESPONDIDO
            candidato:
              summary: E-mail de candidato que já respondeu
              value:
                title: Conflito.
                status: 409
                detail: Já recebemos uma candidatura com este e-mail.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: JA_RESPONDIDO

  schemas:
    # ----- enums -----
    FormularioTipo:
      type: string
      description: |
        Tipo do formulário, igual ao `CHECK` do banco (`CHK_FORMULARIOS_TIPO`). **Sem quiz** (decisão de 2026-10-29).
        `OUTRO` é a **Sugestão** (decisão de 2026-10-29): o front escreve "Sugestão" onde o banco diz `OUTRO`.
        Rótulos: `ENTREVISTA` "Entrevista automática", `ADMISSAO` "Formulário de admissão", `AVALIACAO` "Avaliação da equipe"
        ou "Avaliação do gestor" (conforme `sentidoAvaliacao`), `PESQUISA` "Pesquisa", `OUTRO` "Sugestão".

        **Sugestão (`OUTRO`), as regras num lugar só** (decisão do dono, 2026-10-30: caixa sempre aberta, que aceita várias
        respostas da mesma pessoa; os outros tipos aceitam uma): **sempre aberta** (`prazo` e `recorrencia` vazios, 400 se
        vierem); **nunca anônima** (400 em `errors.anonimo`); a mesma pessoa pode responder quantas vezes quiser (sem 409
        `JA_RESPONDIDO`); o cartão do funcionário fica sempre em `DISPONIVEL` e a pessoa não relê o que mandou (422
        `FORMULARIO_SUGESTAO`); ninguém "falta" (sem lembrete, sem `esperados`, fora da lista do gestor); para o RH, cada
        envio é uma linha em `listarRespondentesFormulario` e se abre com `obterRespostasDeFuncionario` e o
        `respondidoEmUtc` dele.
      x-provisorio: "Como as respostas do formulário de admissão chegam aos campos do cadastro (roadmap, decisões do dono da fatia 5). Hipótese mais simples usada aqui: não chegam; o formulário de admissão é um formulário como os outros e o RH lê as respostas (e copia o que quiser para a ficha). Se o dono quiser a cópia automática, o contrato ganha um mapeamento entre pergunta e campo do cadastro."
      enum: [ENTREVISTA, ADMISSAO, AVALIACAO, PESQUISA, OUTRO]
    FormularioSentidoAvaliacao:
      type: string
      description: |
        Quem avalia quem, só em `tipo = AVALIACAO` (`V001`). `GESTOR_AVALIA_EQUIPE` é a "Avaliação da equipe" (o gestor
        avalia cada pessoa do setor dele); `EQUIPE_AVALIA_GESTOR` é a "Avaliação do gestor" (a equipe avalia o gestor).
      enum: [GESTOR_AVALIA_EQUIPE, EQUIPE_AVALIA_GESTOR]
    FormularioSituacao:
      type: string
      description: |
        Estado do formulário (sem coluna própria: sai de `ATIVO`, `DATA_PUBLICACAO` e `DATA_ENCERRAMENTO`, `V001`).
        `RASCUNHO` não foi publicado nem agendado; `AGENDADO` tem data de publicação futura; `PUBLICADO` aceita respostas;
        `ENCERRADO` não aceita mais (por prazo vencido ou pelo RH). Rótulos: Rascunho, Agendado, Publicado, Encerrado.
      enum: [RASCUNHO, AGENDADO, PUBLICADO, ENCERRADO]
    FormularioAlvo:
      type: string
      description: |
        "Quem responde" da etapa Publicação (`FORMULARIOS.PUBLICO`): `LINK` "Candidatos, por link", `SETORES` "Todos de um ou
        mais setores", `PESSOAS` "Pessoas escolhidas".
      enum: [LINK, SETORES, PESSOAS]
    FormularioRespondenteSituacao:
      type: string
      description: Rótulos "Respondido" e "Não respondeu".
      enum: [RESPONDIDO, NAO_RESPONDEU]
    FormularioMinhaSituacao:
      type: string
      description: |
        Situação do formulário para a pessoa logada (etiquetas dos cartões das telas 39 e 40): `PARA_RESPONDER` ("Para
        responder": o RH pediu), `DISPONIVEL` ("Disponível": aberto para ela responder se quiser) e `RESPONDIDO`.
      x-provisorio: "O que separa 'Para responder' de 'Disponíveis' (tela 39) não está nos documentos. Hipótese mais simples usada aqui, só pelo tipo: ADMISSAO e AVALIACAO são 'Para responder'; PESQUISA e OUTRO (sugestão) são 'Disponíveis'. Se o dono quiser outro critério (por exemplo, formulário obrigatório ou opcional escolhido pelo RH), o banco precisa de uma coluna e o formulário ganha um campo 'obrigatório'."
      enum: [PARA_RESPONDER, DISPONIVEL, RESPONDIDO]
    PerguntaTipo:
      type: string
      description: |
        Tipo da pergunta (`FORMULARIOS_PERGUNTAS.TIPO_RESPOSTA`, texto livre no banco: os valores são definidos aqui).
        Botões "Adicionar pergunta": `RESPOSTA_CURTA` (texto de até 200 caracteres), `RESPOSTA_LONGA` (até 4000),
        `MULTIPLA_ESCOLHA` (escolher uma alternativa), `ESCALA` (nota de 1 a 5) e `ARQUIVO` (PDF ou Word, até 5 MB). Sem quiz,
        sem resposta certa, sem pontos, sem pergunta eliminatória e sem "nota dada pelo RH" (cortados em 2026-10-29).
      enum: [RESPOSTA_CURTA, RESPOSTA_LONGA, MULTIPLA_ESCOLHA, ESCALA, ARQUIVO]
    FormularioRecorrenciaUnidade:
      type: string
      enum: [DIA, SEMANA, MES]

    # ----- perguntas -----
    PerguntaAlternativa:
      type: object
      description: Uma opção de uma pergunta de múltipla escolha.
      required: [id, ordem, texto]
      properties:
        id: { type: integer }
        ordem: { type: integer, minimum: 1 }
        texto: { type: string, maxLength: 255 }
    PerguntaAlternativaComando:
      type: object
      required: [texto]
      properties:
        id:
          type: integer
          description: Número da alternativa que já existe (para manter). Sem ele, a alternativa é nova.
        texto: { type: string, minLength: 1, maxLength: 255 }
    PerguntaFormulario:
      type: object
      description: |
        Uma pergunta. `texto` é texto ou markdown, nunca HTML (roadmap, decisão 6). `alternativas` só tem itens em
        `MULTIPLA_ESCOLHA` (de 2 a 10); nos outros tipos é `[]`.
      required: [id, ordem, texto, tipo, obrigatoria, alternativas]
      properties:
        id: { type: integer }
        ordem: { type: integer, minimum: 1, description: "Posição na lista, a partir de 1." }
        texto: { type: string, maxLength: 500 }
        tipo: { $ref: '#/components/schemas/PerguntaTipo' }
        obrigatoria: { type: boolean }
        alternativas:
          type: array
          items: { $ref: '#/components/schemas/PerguntaAlternativa' }
    PerguntaComando:
      type: object
      description: |
        Corpo de criar e de editar pergunta. `alternativas` é obrigatória e com 2 a 10 itens em `MULTIPLA_ESCOLHA`, e precisa
        estar vazia nos outros tipos (400 com `errors.alternativas`). `texto` é markdown, nunca HTML.
      required: [texto, tipo, obrigatoria]
      properties:
        texto: { type: string, minLength: 1, maxLength: 500 }
        tipo: { $ref: '#/components/schemas/PerguntaTipo' }
        obrigatoria: { type: boolean }
        alternativas:
          type: array
          maxItems: 10
          default: []
          items: { $ref: '#/components/schemas/PerguntaAlternativaComando' }
        ordem:
          type: integer
          minimum: 1
          description: Posição desejada (as outras se ajustam). Sem ela, a pergunta nova vai para o fim e a editada não se move.

    # ----- formulário (RH) -----
    FormularioDetalhesComando:
      type: object
      description: Etapa Detalhes do assistente.
      required: [titulo, tipo, anonimo]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        descricao:
          type: [string, 'null']
          maxLength: 1000
          description: "\"Descrição para quem vai responder\" (markdown, nunca HTML)."
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          description: Obrigatório quando `tipo` é `AVALIACAO`; precisa ser nulo nos outros tipos.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo:
          type: boolean
          description: |
            O RH marca ao criar. **Não muda depois de publicado**, em nenhum sentido (409 `ANONIMATO_FIXO_APOS_PUBLICAR`;
            o banco é a segunda barreira depois da primeira resposta, `V001`). Antes de publicar (rascunho e agendado)
            pode mudar. Sugestão (`OUTRO`) nunca é anônima (400). As regras do anônimo estão na lista "Formulário anônimo" do
            assunto Formulários.
    FormularioRecorrencia:
      type: object
      description: |
        Formulário recorrente (decisão de 2026-10-29): reabre sozinho de tempos em tempos, para as mesmas pessoas, **apagando
        as respostas da rodada anterior** (sem histórico). A tela 20 do Figma não tem este controle: o front acrescenta um
        bloco opcional "Repetir" na etapa Publicação. **No formulário anônimo** só reabre depois de encerrado e confere de
        novo o mínimo de 5 destinatários a cada reabertura (regras 1 e 3 em "Formulários"; detalhes em `publicarFormulario`).
      x-provisorio: "O prazo da rodada nova ao reabrir e o controle na tela (o Figma não o desenha) não foram decididos. Hipótese mais simples usada aqui: ao reabrir, o prazo avança o mesmo número de dias que a rodada anterior durou; o RH pode editar o prazo depois. Se o dono quiser outra regra, só muda a descrição; o formato não muda."
      required: [intervalo, unidade]
      properties:
        intervalo: { type: integer, minimum: 1, maximum: 365, description: De quanto em quanto tempo reabre. }
        unidade: { $ref: '#/components/schemas/FormularioRecorrenciaUnidade' }
        ate:
          type: [string, 'null']
          format: date
          description: Última data em que ainda reabre. Vazio, reabre até o RH encerrar.
    FormularioPublicacaoComando:
      type: object
      description: |
        Etapa Publicação. `alvo = LINK`: `setorIds` e `funcionarioIds` precisam estar vazios. `alvo = SETORES`: `setorIds`
        com pelo menos um setor e `funcionarioIds` vazio. `alvo = PESSOAS`: o contrário. Quebrar isto é 400 com o campo
        em `errors`; pessoa inativa entre as escolhidas é 422 `FUNCIONARIO_INATIVO`. `prazo` não pode ser anterior a hoje
        nem a `agendarPara`; `agendarPara` não pode ser no passado. Sugestão (`OUTRO`) é sempre aberta: `prazo` e
        `recorrencia` precisam vir vazios (400). Os setores a escolher vêm da lista de setores e as pessoas, da lista de
        funcionários (fatia 1; cadastros de apoio em `/api/rh/setores`, convenção 2); na avaliação `GESTOR_AVALIA_EQUIPE`
        a pessoa escolhe os gestores. Formulário anônimo precisa de 5 ou mais destinatários ao publicar (ver
        `publicarFormulario`). Não tem "nota mínima", "enviar o resultado por e-mail ao RH" nem "convidar aprovados".
      required: [alvo]
      properties:
        alvo: { $ref: '#/components/schemas/FormularioAlvo' }
        setorIds:
          type: array
          default: []
          items: { type: integer, minimum: 1 }
        funcionarioIds:
          type: array
          default: []
          items: { type: integer, minimum: 1 }
        agendarPara:
          type: [string, 'null']
          format: date
          description: '"Agendar para uma data": dia da publicação (fuso -03:00). Vazio, publica agora.'
        prazo:
          type: [string, 'null']
          format: date
          description: '"Aceitar respostas até": último dia que aceita resposta. Vazio, sem prazo.'
        recorrencia:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioRecorrencia' }
        lembreteAutomatico:
          type: boolean
          default: true
          description: |
            Caixa "Lembrar quem não respondeu 7 dias antes do prazo", **ligada por padrão** (decisão do dono, 2026-10-30).
            Ligada, o sistema manda um e-mail de lembrete 7 dias antes de `prazo`, só a quem ainda não respondeu. Só tem
            efeito com `prazo` e com `alvo` `SETORES` ou `PESSOAS` (por link não há a quem lembrar); a tela esconde a caixa
            nos outros casos. Detalhes em `publicarFormulario`. O lembrete manual do RH continua à parte
            (`lembrarQuemFaltaFormulario`). **Banco:** é uma **coluna nova em `FORMULARIOS`**, `LEMBRETE_AUTOMATICO` (lembrete
            automático ligado ou desligado; script `V001`); o estado "lembrete enviado hoje" vive na **tabela de tarefas
            agendadas da aplicação** (`V001`), nunca no formulário. No anônimo o lembrete automático não guarda destinatário nem
            número (regra 6 em "Formulários").
    FormularioSetor:
      type: object
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }
    FormularioPublicacao:
      type: object
      description: O que foi escolhido na etapa Publicação e o estado dela.
      required: [alvo, setores, pessoas, agendarPara, prazo, recorrencia, lembreteAutomatico, publicadoEmUtc, encerradoEmUtc, proximaReaberturaEmUtc, tokenDoLink]
      properties:
        alvo:
          description: Vazio enquanto o RH ainda não escolheu.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioAlvo' }
        setores:
          type: array
          items: { $ref: '#/components/schemas/FormularioSetor' }
        pessoas:
          type: array
          items: { $ref: '#/components/schemas/FuncionarioResumo' }
        agendarPara:
          type: [string, 'null']
          format: date
          description: Dia agendado; só enquanto `AGENDADO`.
        prazo: { type: [string, 'null'], format: date }
        recorrencia:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioRecorrencia' }
        lembreteAutomatico:
          type: boolean
          description: A caixa do lembrete 7 dias antes do prazo (padrão ligada, gravado pela API; coluna nova em `FORMULARIOS`, `LEMBRETE_AUTOMATICO`, script `V001`). Ver `FormularioPublicacaoComando`.
        publicadoEmUtc:
          type: [string, 'null']
          format: date-time
          description: Quando foi publicado; vazio em rascunho e agendado.
        encerradoEmUtc: { type: [string, 'null'], format: date-time }
        proximaReaberturaEmUtc:
          type: [string, 'null']
          format: date-time
          description: Próxima reabertura de um formulário recorrente.
        tokenDoLink:
          type: [string, 'null']
          description: Segredo do link público; só em `alvo = LINK` depois de publicar ou agendar.
    FormularioDetalheRh:
      type: object
      description: O formulário inteiro, como o RH o edita.
      required: [id, titulo, descricao, tipo, sentidoAvaliacao, anonimo, situacao, autor, criadoEmUtc, temRespostas, perguntas, publicacao]
      properties:
        id: { type: integer }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo: { type: boolean }
        situacao: { $ref: '#/components/schemas/FormularioSituacao' }
        autor:
          description: Quem criou ("criado por Sofia Ramos"). Vazio se a pessoa foi apagada.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FuncionarioResumo' }
        criadoEmUtc: { type: string, format: date-time }
        temRespostas:
          type: [boolean, 'null']
          description: |
            Já existe resposta de pessoa ou de candidato. Trava as edições descritas em `editarFormulario`. **Vem vazio em
            formulário anônimo, em qualquer situação**: saber se já há resposta revelaria o andamento (regra 5 em
            "Formulários").
        perguntas:
          type: array
          items: { $ref: '#/components/schemas/PerguntaFormulario' }
        publicacao: { $ref: '#/components/schemas/FormularioPublicacao' }
    FormularioRhItem:
      type: object
      description: |
        Linha da lista do RH (tela 16). Nas avaliações, `respondidos` e `esperados` contam avaliações (pessoa avaliando
        pessoa). Em `alvo = LINK`, `esperados` e `taxaDeRespostaPercentual` são vazios e `respondidos` é o número de
        candidatos. Na Sugestão (`OUTRO`), `esperados` e `taxaDeRespostaPercentual` são vazios e `respondidos` conta as
        sugestões recebidas. **Formulário anônimo que ainda não foi encerrado:** `respondidos` e
        `taxaDeRespostaPercentual` são vazios (nem número exato, nem faixa) e **só `esperados` é exato** (regra 5 em
        "Formulários"). Na avaliação do gestor (`EQUIPE_AVALIA_GESTOR`) `esperados` conta só quem tem gestor.
      required: [id, titulo, tipo, sentidoAvaliacao, anonimo, situacao, alvo, quemRespondeResumo, respondidos, esperados, taxaDeRespostaPercentual, prazo, encerradoEmUtc, criadoEmUtc]
      properties:
        id: { type: integer }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo: { type: boolean }
        situacao: { $ref: '#/components/schemas/FormularioSituacao' }
        alvo:
          description: Vazio em rascunho que ainda não escolheu quem responde.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioAlvo' }
        quemRespondeResumo:
          type: string
          description: 'Texto pronto da coluna "Quem responde": "Candidatos, por link", "3 pessoas escolhidas", "Todos os setores (101 pessoas)"; nas avaliações, em avaliações ("3 gestores (24 avaliações)", "Todos os setores (24 avaliações)"). Rascunho sem escolha: "Ainda não definido".'
        respondidos:
          type: [integer, 'null']
          minimum: 0
          description: Vazio só em formulário anônimo que ainda não foi encerrado (a contagem fica escondida até encerrar).
        esperados: { type: [integer, 'null'], minimum: 0 }
        taxaDeRespostaPercentual:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Respondidos sobre esperados, arredondado. **Vazio em formulário anônimo que ainda não foi encerrado** (nem
            número exato, nem faixa). Vazio por link e na Sugestão.
        prazo: { type: [string, 'null'], format: date }
        encerradoEmUtc: { type: [string, 'null'], format: date-time }
        criadoEmUtc: { type: string, format: date-time }
    FormularioContagemPorTipo:
      type: object
      description: Números das abas da tela 16.
      required: [todos, entrevistas, admissoes, avaliacoes, pesquisas, sugestoes]
      properties:
        todos: { type: integer, minimum: 0 }
        entrevistas: { type: integer, minimum: 0 }
        admissoes: { type: integer, minimum: 0 }
        avaliacoes: { type: integer, minimum: 0 }
        pesquisas: { type: integer, minimum: 0 }
        sugestoes: { type: integer, minimum: 0, description: Formulários do tipo `OUTRO`. }
    FormularioRhLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, contagemPorTipo]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/FormularioRhItem' }
            contagemPorTipo: { $ref: '#/components/schemas/FormularioContagemPorTipo' }
    FormularioVerificacaoItem:
      type: object
      required: [codigo, situacao, mensagem, perguntaId]
      properties:
        codigo:
          type: string
          description: Um de `TITULO_E_DESCRICAO`, `PERGUNTAS`, `ALTERNATIVAS`, `ANONIMO_SEM_ARQUIVO`, `ANONIMO_RESULTADO_MINIMO`, `ANONIMO_PUBLICO_MINIMO`, `DADO_SENSIVEL`.
        situacao:
          type: string
          description: '`OK` (marca verde), `AVISO` (laranja, não impede) ou `BLOQUEIO` (impede publicar).'
          enum: [OK, AVISO, BLOQUEIO]
        mensagem: { type: string }
        perguntaId:
          type: [integer, 'null']
          description: Pergunta a que o item se refere, quando é uma só.
    FormularioVerificacao:
      type: object
      required: [podePublicar, itens]
      properties:
        podePublicar: { type: boolean, description: Falso se algum item é `BLOQUEIO`. }
        itens:
          type: array
          items: { $ref: '#/components/schemas/FormularioVerificacaoItem' }
    FormularioConfirmacaoNecessaria:
      description: |
        Corpo do 409 `CONFIRMACAO_NECESSARIA` de `encerrarFormulario` e `excluirFormulario` (convenções, seção 13): o
        `ProblemaDeApi` mais `pendentes`.
      allOf:
        - $ref: '#/components/schemas/ProblemaDeApi'
        - type: object
          required: [pendentes]
          properties:
            pendentes:
              type: [integer, 'null']
              minimum: 1
              description: |
                Quantas pessoas ainda podem responder (nas avaliações, quantas avaliações faltam). **Vazio em formulário
                anônimo**: a contagem exata é a que a regra 5 de "Formulários" esconde enquanto o formulário está aberto.
    FormularioDestinatariosComando:
      type: object
      required: [funcionarioIds]
      properties:
        funcionarioIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: integer, minimum: 1 }
    FormularioDestinatariosResultado:
      type: object
      required: [adicionados, jaEstavam]
      properties:
        adicionados: { type: integer, minimum: 0 }
        jaEstavam: { type: integer, minimum: 0, description: Pessoas que já deviam responder; foram ignoradas. }

    # ----- quem respondeu, respostas, resultado -----
    FormularioParticipacaoResumo:
      type: object
      description: |
        Os três cartões da tela 21. Em `alvo = LINK` e na Sugestão não há "faltam" nem taxa (qualquer pessoa pode
        responder; na Sugestão ninguém é obrigado). **Formulário anônimo que ainda não foi encerrado:** `respondidos`,
        `faltam` e a taxa são vazios (nem número, nem faixa) e só `esperados` é exato (regra 5 em "Formulários"); depois
        de `ENCERRADO` tudo é exato.
      required: [respondidos, faltam, esperados, taxaDeRespostaPercentual]
      properties:
        respondidos: { type: [integer, 'null'], minimum: 0 }
        faltam: { type: [integer, 'null'], minimum: 0 }
        esperados: { type: [integer, 'null'], minimum: 0 }
        taxaDeRespostaPercentual:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Respondidos sobre esperados, arredondado. Vazio em formulário anônimo que ainda não foi encerrado (nem número
            exato, nem faixa).
    FormularioRespondenteRh:
      type: object
      description: |
        Uma linha da tela 21. `avaliado` só vem nas avaliações. `respondidoEmUtc` vazio em quem não respondeu.
        `podeVerRespostas` é verdadeiro só para quem respondeu.
      required: [funcionario, avaliado, situacao, respondidoEmUtc, podeVerRespostas]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        avaliado:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FuncionarioResumo' }
        situacao: { $ref: '#/components/schemas/FormularioRespondenteSituacao' }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }
        podeVerRespostas: { type: boolean }
    FormularioRespondentesRh:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          description: Em formulário anônimo, `itens` vem sempre `[]` e `total` é 0.
          required: [anonimo, resumo, itens]
          properties:
            anonimo: { type: boolean }
            resumo: { $ref: '#/components/schemas/FormularioParticipacaoResumo' }
            itens:
              type: array
              items: { $ref: '#/components/schemas/FormularioRespondenteRh' }
    CandidatoResumo:
      type: object
      description: "Dados de quem respondeu por link (`FORMULARIOS_CANDIDATOS`). Dado pessoal: só o RH vê."
      required: [id, nome, email, telefone, temCurriculo, respondidoEmUtc]
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string }
        telefone: { type: [string, 'null'] }
        temCurriculo: { type: boolean }
        respondidoEmUtc: { type: string, format: date-time }
    CandidatoLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/CandidatoResumo' }
    RespostaFormularioArquivo:
      type: object
      description: Arquivo enviado numa pergunta `ARQUIVO`. Baixa por `baixarArquivoDeResposta`. Resposta de formulário anônimo nunca tem arquivo.
      required: [respostaId, nome]
      properties:
        respostaId: { type: integer }
        nome: { type: string, description: 'Nome original do arquivo (`FORMULARIOS_RESPOSTAS.NOME_ARQUIVO_ORIGINAL`, script `V001`). O caminho de armazenamento (`CAMINHO_ARQUIVO`) nunca é devolvido.' }
    RespostaFormularioDada:
      type: object
      description: |
        A resposta a uma pergunta. Só o campo do tipo da pergunta vem preenchido: `texto` (curta e longa), `alternativas`
        (múltipla escolha; com uma só opção), `valorEscala` (escala) ou `arquivo`. Pergunta opcional que a pessoa deixou em
        branco vem com tudo vazio.
      required: [perguntaId, ordem, perguntaTexto, tipo, texto, alternativas, valorEscala, arquivo]
      properties:
        perguntaId: { type: integer }
        ordem: { type: integer, minimum: 1 }
        perguntaTexto: { type: string }
        tipo: { $ref: '#/components/schemas/PerguntaTipo' }
        texto: { type: [string, 'null'] }
        alternativas:
          type: array
          items: { $ref: '#/components/schemas/PerguntaAlternativa' }
        valorEscala: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        arquivo:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/RespostaFormularioArquivo' }
    RespostaFormularioFuncionario:
      type: object
      description: O que uma pessoa respondeu (formulário com nome).
      required: [formularioId, titulo, funcionario, avaliado, respondidoEmUtc, respostas]
      properties:
        formularioId: { type: integer }
        titulo: { type: string }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        avaliado:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FuncionarioResumo' }
        respondidoEmUtc: { type: string, format: date-time }
        respostas:
          type: array
          items: { $ref: '#/components/schemas/RespostaFormularioDada' }
    RespostaFormularioCandidato:
      type: object
      description: O que um candidato respondeu.
      required: [formularioId, titulo, candidato, respostas]
      properties:
        formularioId: { type: integer }
        titulo: { type: string }
        candidato: { $ref: '#/components/schemas/CandidatoResumo' }
        respostas:
          type: array
          items: { $ref: '#/components/schemas/RespostaFormularioDada' }
    RespostaFormularioMinhas:
      type: object
      description: O que a pessoa logada respondeu (formulário com nome).
      required: [formularioId, titulo, avaliado, respondidoEmUtc, respostas]
      properties:
        formularioId: { type: integer }
        titulo: { type: string }
        avaliado:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FuncionarioResumo' }
        respondidoEmUtc: { type: string, format: date-time }
        respostas:
          type: array
          items: { $ref: '#/components/schemas/RespostaFormularioDada' }
    FormularioResultadoAlternativa:
      type: object
      required: [alternativaId, texto, total, percentual]
      properties:
        alternativaId: { type: integer }
        texto: { type: string }
        total: { type: integer, minimum: 0 }
        percentual: { type: number, minimum: 0, maximum: 100, description: "Sobre as respostas da pergunta, com uma casa decimal." }
    FormularioResultadoEscalaValor:
      type: object
      required: [valor, total]
      properties:
        valor: { type: integer, minimum: 1, maximum: 5 }
        total: { type: integer, minimum: 0 }
    FormularioResultadoEscala:
      type: object
      required: [media, distribuicao]
      properties:
        media: { type: number, minimum: 1, maximum: 5, description: Com uma casa decimal. }
        distribuicao:
          type: array
          description: Sempre os cinco valores, de 1 a 5, na ordem.
          items: { $ref: '#/components/schemas/FormularioResultadoEscalaValor' }
    FormularioResultadoPergunta:
      type: object
      description: |
        Resultado geral de uma pergunta. Só o campo do tipo vem com dados: `alternativas` (múltipla escolha), `escala`,
        `textos` (curta e longa, em **ordem alfabética**, nunca na ordem de gravação) ou nada além de `totalRespostas`
        (arquivo). Não há `id` nem data de resposta individual. **Em formulário anônimo a pergunta só aparece se tem 3
        respostas ou mais** (por avaliado, nas avaliações); a que tem menos **some da lista** e só entra na conta de
        `perguntasOcultas` do resultado.
      required: [perguntaId, ordem, texto, tipo, totalRespostas, alternativas, escala, textos]
      properties:
        perguntaId: { type: integer }
        ordem: { type: integer, minimum: 1 }
        texto: { type: string }
        tipo: { $ref: '#/components/schemas/PerguntaTipo' }
        totalRespostas: { type: integer, minimum: 0 }
        alternativas:
          type: array
          items: { $ref: '#/components/schemas/FormularioResultadoAlternativa' }
        escala:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioResultadoEscala' }
        textos:
          type: array
          items: { type: string }
    FormularioResultado:
      type: object
      description: |
        Resultado geral do formulário. `totalRespostas` é o número de participações (anônimo) ou de pessoas e candidatos que
        responderam (com nome); nas avaliações, só as do `avaliado`. Em formulário anônimo só existe com o formulário
        `ENCERRADO` (antes disso a rota devolve 409), e **o mínimo de 3 respostas vale por pergunta**, não pelo
        formulário todo. Na avaliação anônima o avaliado também precisa de 3 respostas (com menos, a rota devolve 422 e
        não há este corpo).

        **O que este resultado nunca traz num formulário anônimo:** quem respondeu ou quem falta, data, hora, ordem ou
        número de qualquer resposta, resposta por pessoa, por setor ou por data, e o conteúdo de pergunta com menos de 3
        respostas (a lista completa está na regra 7 de "Formulários").
      required: [formularioId, titulo, anonimo, situacao, totalRespostas, minimoPorPergunta, perguntasOcultas, avaliado, perguntas]
      properties:
        formularioId: { type: integer }
        titulo: { type: string }
        anonimo: { type: boolean }
        situacao: { $ref: '#/components/schemas/FormularioSituacao' }
        totalRespostas: { type: integer, minimum: 0 }
        minimoPorPergunta:
          type: [integer, 'null']
          minimum: 1
          description: Mínimo de respostas para uma pergunta aparecer. É 3 no anônimo e vazio no identificado (sem mínimo).
        perguntasOcultas:
          type: integer
          minimum: 0
          description: |
            Quantas perguntas ficaram de fora por terem menos de `minimoPorPergunta` respostas (para o avaliado, nas
            avaliações). Sempre 0 em formulário com nome. A tela escreve "N perguntas não aparecem porque tiveram menos de 3
            respostas".
        avaliado:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FuncionarioResumo' }
        perguntas:
          type: array
          description: As perguntas que chegaram ao mínimo (todas, em formulário com nome), na ordem de `ordem`.
          items: { $ref: '#/components/schemas/FormularioResultadoPergunta' }
    FormularioAvaliadoResumo:
      type: object
      description: Uma pessoa avaliada e quantas avaliações ela recebeu.
      required: [funcionario, totalRespostas, esperadas, resultadoLiberado]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        totalRespostas:
          type: [integer, 'null']
          minimum: 0
          description: |
            Quantas avaliações a pessoa recebeu. **Em avaliação anônima vem vazio** quando ela recebeu menos de
            `minimoPorAvaliado` respostas (a tela escreve "menos de 3 respostas"; regra 4 em "Formulários").
        esperadas: { type: integer, minimum: 0, description: Quantas pessoas deviam avaliá-la. }
        resultadoLiberado:
          type: boolean
          description: Há ao menos uma pergunta para mostrar desse avaliado (no anônimo, 3 respostas ou mais e, entre elas, uma pergunta com 3 respostas ou mais; com nome, ao menos uma resposta).
    FormularioAvaliadosLista:
      type: object
      required: [minimoPorAvaliado, itens]
      properties:
        minimoPorAvaliado:
          type: [integer, 'null']
          minimum: 1
          description: Mínimo de respostas para um avaliado ter resultado. É 3 na avaliação anônima e vazio na avaliação com nome (sem mínimo).
        itens:
          type: array
          items: { $ref: '#/components/schemas/FormularioAvaliadoResumo' }
    FormularioLembreteComando:
      type: object
      required: [funcionarioIds]
      properties:
        funcionarioIds:
          type: array
          maxItems: 200
          description: "Pessoas a lembrar. Vazio: todas que faltam."
          items: { type: integer, minimum: 1 }
    FormularioLembreteResultado:
      type: object
      description: |
        Resposta do lembrete manual (do RH ou do gestor). **Em formulário com nome**, `enviados` e `ignorados` dizem
        quantas pessoas receberam e quantas foram puladas. **Em formulário anônimo**, a resposta só diz que o lembrete
        saiu: `anonimo` verdadeiro e `enviados` e `ignorados` vazios, sempre iguais, com muita gente a lembrar, com
        pouca, com ninguém ou se o de hoje já tinha saído (regras 5 e 6 em "Formulários"). O lembrete automático não
        tem resposta.
      required: [anonimo, enviados, ignorados]
      properties:
        anonimo: { type: boolean, description: O formulário é anônimo; `enviados` e `ignorados` vêm vazios. }
        enviados: { type: [integer, 'null'], minimum: 0, description: Vazio em formulário anônimo. }
        ignorados: { type: [integer, 'null'], minimum: 0, description: "Já responderam, não deviam responder ou já receberam lembrete hoje. Vazio em formulário anônimo." }

    # ----- gestor -----
    FormularioEquipeItem:
      type: object
      description: |
        Um pedido do RH aberto na equipe do gestor (coluna "Pedidos do RH" da tela 57). Contagens só da equipe. Em
        formulário anônimo ainda aberto, `respondidos` e `taxaDeRespostaPercentual` são vazios (nem número, nem faixa) e
        só `esperados` é exato (regra 5 em "Formulários"). Não traz a avaliação do gestor (`EQUIPE_AVALIA_GESTOR`).
      required: [id, titulo, tipo, sentidoAvaliacao, anonimo, prazo, respondidos, esperados, taxaDeRespostaPercentual]
      properties:
        id: { type: integer }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo: { type: boolean }
        prazo: { type: [string, 'null'], format: date, description: Vazio é "Sem prazo". }
        respondidos: { type: [integer, 'null'], minimum: 0, description: Vazio só em formulário anônimo ainda aberto. }
        esperados: { type: integer, minimum: 0 }
        taxaDeRespostaPercentual:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Respondidos sobre esperados, arredondado; vazio em formulário anônimo ainda aberto (nem número exato, nem faixa).
    FormularioEquipeLista:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/FormularioEquipeItem' }
    FormularioEquipeRespondente:
      type: object
      required: [funcionario, observacao, situacao, respondidoEmUtc]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        observacao:
          type: [string, 'null']
          description: Aviso curto da pessoa, como "de férias até 17/10" (vem das férias aprovadas).
        situacao: { $ref: '#/components/schemas/FormularioRespondenteSituacao' }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }
    FormularioEquipeRespondentes:
      type: object
      description: |
        Em formulário anônimo, `itens` vem sempre `[]` (só os números). Enquanto o formulário anônimo não está `ENCERRADO`,
        `respondidos`, `faltam` e `taxaDeRespostaPercentual` são vazios (nem número, nem faixa) e só `esperados` é exato
        (regra 5 em "Formulários"). Não existe para a avaliação do gestor (`EQUIPE_AVALIA_GESTOR`): 404.
      required: [formularioId, titulo, anonimo, respondidos, faltam, esperados, taxaDeRespostaPercentual, itens]
      properties:
        formularioId: { type: integer }
        titulo: { type: string }
        anonimo: { type: boolean }
        respondidos: { type: [integer, 'null'], minimum: 0 }
        faltam: { type: [integer, 'null'], minimum: 0 }
        esperados: { type: integer, minimum: 0 }
        taxaDeRespostaPercentual:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Respondidos sobre esperados, arredondado; vazio em formulário anônimo ainda aberto (nem número exato, nem faixa).
        itens:
          type: array
          items: { $ref: '#/components/schemas/FormularioEquipeRespondente' }

    # ----- responder (todos os perfis) -----
    FormularioMeuItem:
      type: object
      description: Cartão das telas 39 e 40.
      required: [id, titulo, descricao, tipo, sentidoAvaliacao, anonimo, situacao, totalPerguntas, minutosEstimados, prazo, respondidos, total, respondidoEmUtc, podeVerMinhasRespostas]
      properties:
        id: { type: integer }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo: { type: boolean }
        situacao: { $ref: '#/components/schemas/FormularioMinhaSituacao' }
        totalPerguntas: { type: integer, minimum: 0 }
        minutosEstimados:
          type: integer
          minimum: 1
          description: Estimativa calculada pela API a partir do número e do tipo das perguntas (valor aproximado, regra do back-end).
        prazo: { type: [string, 'null'], format: date, description: Vazio é "Sempre aberto". }
        respondidos: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        respondidoEmUtc:
          type: [string, 'null']
          format: date-time
          description: Quando respondeu. Vazio em anônimo (não há data) e em quem não respondeu.
        podeVerMinhasRespostas: { type: boolean }
    FormularioMeusLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, contagens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/FormularioMeuItem' }
            contagens:
              type: object
              description: Números das abas. `todos` = `paraResponder` + `disponiveis`.
              required: [todos, paraResponder, disponiveis, respondidos]
              properties:
                todos: { type: integer, minimum: 0 }
                paraResponder: { type: integer, minimum: 0 }
                disponiveis: { type: integer, minimum: 0 }
                respondidos: { type: integer, minimum: 0 }
    FormularioAvaliadoParaResponder:
      type: object
      required: [funcionario, respondido]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        respondido: { type: boolean, description: A pessoa logada já avaliou esta pessoa. }
    FormularioParaResponder:
      type: object
      description: O formulário que a pessoa logada vai responder. `avaliados` é `[]` fora das avaliações.
      required: [id, titulo, descricao, tipo, sentidoAvaliacao, anonimo, prazo, minutosEstimados, perguntas, avaliados]
      properties:
        id: { type: integer }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        tipo: { $ref: '#/components/schemas/FormularioTipo' }
        sentidoAvaliacao:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FormularioSentidoAvaliacao' }
        anonimo: { type: boolean }
        prazo: { type: [string, 'null'], format: date }
        minutosEstimados: { type: integer, minimum: 1 }
        perguntas:
          type: array
          items: { $ref: '#/components/schemas/PerguntaFormulario' }
        avaliados:
          type: array
          items: { $ref: '#/components/schemas/FormularioAvaliadoParaResponder' }
    RespostaFormularioItem:
      type: object
      description: |
        Resposta a uma pergunta (um item da parte `respostas`). Usa **só o campo do tipo da pergunta**; campo de outro tipo é
        400. `RESPOSTA_CURTA`: `texto` de até 200 caracteres. `RESPOSTA_LONGA`: `texto` de até 4000. `MULTIPLA_ESCOLHA`:
        `alternativaIds` com **uma** alternativa da pergunta. `ESCALA`: `valorEscala` de 1 a 5. `ARQUIVO`: `arquivoIndice`.
        `texto` é texto ou markdown, nunca HTML. Pergunta opcional sem resposta pode ficar fora da lista.
      required: [perguntaId]
      properties:
        perguntaId: { type: integer, minimum: 1 }
        texto: { type: string, maxLength: 4000 }
        alternativaIds:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: integer, minimum: 1 }
          x-provisorio: "Se a múltipla escolha aceita mais de uma opção ainda está em aberto (V001: 'a confirmar com o dono'). Hipótese mais simples usada aqui: uma só (maxItems 1). Se o dono aceitar várias, tira-se o maxItems e a pergunta ganha um campo 'permiteVariasOpcoes'; o formato da resposta já é uma lista para isto não quebrar o front."
        valorEscala: { type: integer, minimum: 1, maximum: 5 }
        arquivoIndice:
          type: integer
          minimum: 0
          description: Posição (a partir de 0) do arquivo na parte `arquivos` do envio.
    RespostaFormularioEnvio:
      type: object
      description: Corpo `multipart/form-data` de `responderFormulario`.
      required: [respostas]
      properties:
        avaliadoId:
          type: integer
          minimum: 1
          description: Quem está sendo avaliado. Obrigatório nas avaliações; proibido nos outros tipos.
        respostas:
          type: array
          minItems: 1
          description: Parte de texto JSON com a lista de respostas.
          items: { $ref: '#/components/schemas/RespostaFormularioItem' }
        arquivos:
          type: array
          description: Os arquivos das perguntas `ARQUIVO` (PDF ou Word, até 5 MB cada), na ordem de `arquivoIndice`.
          items: { type: string, format: binary }
    RespostaFormularioRecibo:
      type: object
      required: [formularioId, participacaoId, restantes]
      properties:
        formularioId: { type: integer }
        participacaoId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: |
            Só em formulário anônimo: chave do registro de participação (`FORMULARIOS_PARTICIPACOES.ID_PARTICIPACAO`), um
            UUID versão 4 **gerado pela aplicação** (aleatório; nunca o `UUID()` do banco, que é versão 1). O front não usa
            para nada além de mostrar "Participação registrada". Vazio nos formulários com nome.
        restantes:
          type: integer
          minimum: 0
          description: Quantas avaliações ainda faltam à pessoa neste formulário ("Continuar avaliação"). 0 fora das avaliações.

    # ----- público -----
    FormularioPaginaPublica:
      type: object
      description: O que a página pública do candidato mostra. Sem `id` interno do formulário.
      required: [empresaNome, titulo, descricao, prazo, avisoDePrivacidade, retencaoDias, perguntas]
      properties:
        empresaNome: { type: string, description: Nome da empresa (configuração da empresa) para o cabeçalho. }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        prazo: { type: [string, 'null'], format: date }
        avisoDePrivacidade:
          type: string
          description: Texto (markdown) que o candidato precisa aceitar antes de enviar. Diz o que é guardado, quem vê e por quanto tempo.
        retencaoDias:
          type: integer
          minimum: 1
          description: Dias que os dados do candidato ficam guardados antes de o job apagá-los.
          x-provisorio: "O prazo de retenção dos dados de candidato (roadmap, decisão 13 e decisões do dono da fatia 5) não foi decidido. Hipótese usada aqui: 180 dias, valor de partida. Se o dono mudar, só o valor muda."
        perguntas:
          type: array
          items: { $ref: '#/components/schemas/PerguntaFormulario' }
    CandidatoEnvio:
      type: object
      description: Corpo `multipart/form-data` de `responderFormularioPublico`.
      required: [nome, email, aceitouAvisoDePrivacidade, respostas]
      properties:
        nome: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        telefone:
          type: string
          maxLength: 30
          pattern: '^[0-9()+\- ]{8,30}$'
          description: Só dígitos, espaço, parênteses, `+` e `-`.
        curriculo:
          type: string
          format: binary
          description: Currículo opcional (PDF ou Word, até 5 MB).
        aceitouAvisoDePrivacidade:
          type: boolean
          description: Precisa ser verdadeiro (a caixa de aceite do aviso de privacidade).
        respostas:
          type: array
          minItems: 1
          description: Parte de texto JSON com a lista de respostas (mesmo formato de `responderFormulario`).
          items: { $ref: '#/components/schemas/RespostaFormularioItem' }
        arquivos:
          type: array
          description: Os arquivos das perguntas `ARQUIVO` (PDF ou Word, até 5 MB cada), na ordem de `arquivoIndice`.
          items: { type: string, format: binary }
    CandidatoRecibo:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string, description: Texto de agradecimento para a tela de confirmação. }
