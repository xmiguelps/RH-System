                        podeVerMinhasRespostas: false
                      - id: 8
                        titulo: Pesquisa de clima 2026
                        descricao: Como você se sente trabalhando aqui. O RH vê só o resultado geral, sem saber quem respondeu.
                        tipo: PESQUISA
