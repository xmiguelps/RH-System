        RH: o anonimato não mostra a lista). **Enquanto o formulário não está `ENCERRADO`, os cartões não têm contagem**
        (regra 5 em "Formulários"): `respondidos`, `faltam` e `taxaDeRespostaPercentual` vêm vazios (nem número, nem
        faixa) e só `esperados` vem exato; depois de `ENCERRADO` vêm exatos (o gestor fica sabendo quantos da equipe
        participaram, sem saber quem: regra 8). Nos formulários `GESTOR_AVALIA_EQUIPE` e `EQUIPE_AVALIA_GESTOR`, 404: no
