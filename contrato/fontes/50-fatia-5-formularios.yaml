  /api/rh/formularios/{formularioId}/encerrar:
    post:
      tags: [Formulários]
      operationId: encerrarFormulario
      summary: "Encerra o formulário: ele deixa de aceitar respostas."
      description: |
        Item "Encerrar" do menu "..." da linha da lista. Só vale para `PUBLICADO` (422 `FORMULARIO_NAO_PUBLICADO` nos
        outros). Grava `encerradoEmUtc`; o formulário passa a `ENCERRADO` e fica só para consulta e exportação.
        Num formulário recorrente, encerrar à mão **cancela as próximas reaberturas**. Não há rota para reabrir.

        **Confirmação (`CONFIRMACAO_NECESSARIA`, convenções, seções 11 e 13):** se ainda há pessoas que podem responder
        (`pendentes`: destinatários que não responderam; nas avaliações, avaliações que faltam), a chamada sem
        `confirmar=true` devolve **409 `CONFIRMACAO_NECESSARIA`** com `pendentes` e nada muda; a tela pergunta "N
        pessoas ainda não responderam. Encerrar mesmo assim?" e repete com `confirmar=true`. Sem pendentes (todos
        responderam, formulário por link ou Sugestão, que ninguém é obrigado a responder), encerra direto. Em formulário
        **anônimo**, `pendentes` vem vazio (a contagem exata é a que a regra 5 de "Formulários" esconde), a tela pergunta
        sem o número e a confirmação é pedida **sempre**, mesmo quando todos já participaram (encerrar direto diria que
        não falta ninguém). Encerrar é o que libera o resultado do formulário anônimo (regra 3); como não há como reabrir,
        não há jeito de olhar o resultado parcial e voltar atrás. A auditoria registra só "Encerrou", sem contagem de
        respostas (regra 6).
