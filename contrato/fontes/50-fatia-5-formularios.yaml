                    tipo: RESPOSTA_CURTA
                    texto: Marta Lima, (11) 96655-4433
                    alternativas: []
                    valorEscala: null
                    arquivo: null
                  - perguntaId: 703
                    ordem: 3
                    perguntaTexto: Envie uma cópia do seu comprovante de residência (PDF ou Word, até 5 MB).
                    tipo: ARQUIVO
                    texto: null
