  # Gestor: só quem da equipe respondeu (tela 57)
  # ===========================================================================
  /api/gestor/formularios:
    get:
      tags: [Formulários]
      operationId: listarFormulariosDaEquipe
      summary: Lista os pedidos do RH que a equipe do gestor tem aberto (coluna Pedidos do RH).
      description: |
        Tela 57 ("Formulários do setor"), coluna da esquerda. Mostra os formulários `PUBLICADOS` em que pessoas **do
        setor do gestor** devem responder, com `respondidos` e `esperados` contados **só na equipe** (o gestor não conta
        como membro da própria equipe: 8 pessoas no Comercial de Carlos Ribeiro, como na tela 51). Não entram: formulário
        por link, **Sugestão** (ninguém é obrigado a responder), avaliação `GESTOR_AVALIA_EQUIPE` (nela quem responde é o
        próprio gestor: aparece na faixa "Sua parte", que vem de `listarMeusFormularios`), **avaliação do gestor
        `EQUIPE_AVALIA_GESTOR`** (o gestor é o avaliado: quem está sendo avaliado pela equipe não vê o andamento nem lembra
        ninguém, só o RH) e formulário encerrado. Lista curta, sem paginação, ordenada pelo prazo mais próximo e depois
        pelo título.

        **Formulário anônimo ainda aberto:** o gestor vê só `esperados` (regra 5 em "Formulários"): `respondidos` e
        `taxaDeRespostaPercentual` vêm vazios, nem número exato, nem faixa. Numa equipe de 8 pessoas, mesmo uma faixa quase
        identificaria quem faltou.

        **Mudou em relação ao Figma:** os "Quiz" não existem. A faixa laranja "Sua parte: avaliação da equipe ... Você
        avaliou 3 de 8 pessoas. O prazo é 23/10 [Continuar avaliação]" é montada pelo front com o item `AVALIACAO` /
        `GESTOR_AVALIA_EQUIPE` de `listarMeusFormularios` (`respondidos` de `total`; o botão leva à tela de responder).
        O gestor vê só **quem** respondeu, nunca o conteúdo (roadmap, fatia 5).
      x-perfis: [Gestor]
      responses:
        '200':
          description: Formulários abertos da equipe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioEquipeLista' }
              example:
                itens:
                  - { id: 8, titulo: Pesquisa de clima 2026, tipo: PESQUISA, sentidoAvaliacao: null, anonimo: true, prazo: '2026-10-31', respondidos: null, esperados: 8, taxaDeRespostaPercentual: null }
                  - { id: 14, titulo: Pesquisa de segurança no trabalho, tipo: PESQUISA, sentidoAvaliacao: null, anonimo: false, prazo: '2026-11-15', respondidos: 5, esperados: 8, taxaDeRespostaPercentual: 63 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

