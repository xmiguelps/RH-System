  /api/rh/formularios/{formularioId}/exportacao:
    get:
      tags: [Formulários]
      operationId: exportarRespostasFormulario
      summary: Baixa as respostas do formulário em CSV (botão Baixar respostas).
      description: |
        Devolve o arquivo com `Content-Disposition: attachment`. Separador `;`, UTF-8 com BOM, cabeçalho na primeira
        linha, datas no fuso -03:00. Células que começam com `=`, `+`, `-` ou `@` são neutralizadas (roadmap, decisão 9).
        - **Formulário com nome ou por link:** uma linha por resposta, com as colunas `formulario`, `respondente`,
          `email`, `setor`, `avaliado`, `pergunta`, `resposta`, `respondido_em` (candidato: `setor` vazio; pergunta de
          arquivo: o nome do arquivo).
        - **Formulário anônimo:** só o **resultado geral**, uma linha por alternativa ou por valor da escala (`pergunta`,
          `opcao`, `total`, `percentual`) e uma linha por texto, em ordem alfabética, **só das perguntas com 3 respostas
          ou mais** (nas avaliações, uma seção por avaliado, **só dos avaliados com 3 respostas ou mais**, e a regra de 3
          por pergunta dentro de cada um; os avaliados abaixo do mínimo ficam de fora do arquivo, sem aviso de quantos).
          Só **depois de encerrado** (regra 3 em "Formulários"): antes, 409 `RESULTADO_ANONIMO_INDISPONIVEL`. Se nenhuma
          pergunta chega a 3 respostas (ou, na avaliação, nenhum avaliado chega a 3): 422
          `RESULTADO_SEM_RESPOSTAS_SUFICIENTES`.
        Vale antes de reabrir um formulário recorrente, quando as respostas somem (no anônimo, a rodada precisa ter
        encerrado para o arquivo existir).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      responses:
        '200':
          description: Arquivo CSV.
          headers:
            Content-Disposition:
              description: Nome do arquivo para salvar.
              schema: { type: string }
              example: 'attachment; filename="formulario-14-respostas.csv"'
          content:
            text/csv:
              schema: { type: string }
              example: "formulario;respondente;email;setor;avaliado;pergunta;resposta;respondido_em\nPesquisa de segurança no trabalho;Júlia Nunes;julia.nunes@empresa.com.br;Comercial;;Você recebeu o equipamento de proteção que precisa para o seu trabalho?;Sim;2026-10-02 11:10\n"
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Resultado' }
        '422': { $ref: '#/components/responses/FormularioErro422Resultado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}/lembretes:
    post:
      tags: [Formulários]
      operationId: lembrarQuemFaltaFormulario
      summary: Manda um lembrete por e-mail a quem ainda não respondeu.
      description: |
        Botão "Lembrar quem falta por e-mail" (`funcionarioIds` vazio: todos que faltam) e botão "Lembrar" de uma linha
        (`funcionarioIds` com essa pessoa). É o **lembrete manual do RH**, um dos e-mails da lista fechada (convenções,
        seção 12), e é independente do lembrete automático 7 dias antes do prazo (ver `lembreteAutomatico` em
        `publicarFormulario`). Só vale para formulário `PUBLICADO` (422 `FORMULARIO_NAO_PUBLICADO`) e não vale para
        formulário por link (422 `FORMULARIO_POR_LINK`) nem para **Sugestão**, em que ninguém "falta" (422
        `FORMULARIO_SUGESTAO`). Quem já respondeu, quem foi pedido e não deve responder, ou quem já recebeu lembrete
        **hoje** deste formulário (manual ou automático), entra em `ignorados` (no máximo um lembrete por pessoa, por
        formulário, por dia; chave de idempotência do e-mail: formulário + pessoa + dia, na fila de e-mails da
        aplicação, tabela nova, script `V001`).

        **Formulário anônimo:** só vale com `funcionarioIds` vazio (mandar uma pessoa específica revelaria quem falta:
        422 `FORMULARIO_ANONIMO`); o lembrete vai a quem não participou, sem mostrar a lista. **A resposta só diz que o
        lembrete saiu:** `anonimo` verdadeiro e `enviados` e `ignorados` **vazios**, sem número de quem recebeu nem de
        quem foi pulado (regra 5 em "Formulários"). A resposta é a mesma com muita gente a lembrar, com pouca, com
        ninguém (nada sai) e quando o lembrete de hoje já tinha saído, para o contraste não revelar nada. Aqui o limite
        é **um lembrete do formulário por dia**, e não por pessoa: guardar "formulário + pessoa + dia" seria guardar
        quem ainda não participou; a marca "lembrete enviado hoje" fica na **tabela de tarefas agendadas da aplicação**
        (tabela nova, script `V001`), nunca no formulário. A auditoria registra só "lembrete enviado" (quem
        mandou e quando), **sem destinatário e sem número** (regra 6 em "Formulários"). O mesmo vale para o lembrete
        automático (ver `publicarFormulario`), que também não informa quantos nem quem. Hoje (07/10) a Pesquisa de clima
        2026 ainda não recebeu o automático: o primeiro sai em 24/10.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioLembreteComando' }
            examples:
              umaPessoa:
                summary: Lembrar uma pessoa (botão "Lembrar" da linha; formulário com nome)
                value: { funcionarioIds: [104] }
              todosQueFaltam:
                summary: Lembrar todos que faltam (formulário anônimo, sem lista)
                value: { funcionarioIds: [] }
      responses:
        '200':
          description: Lembrete colocado na fila de e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioLembreteResultado' }
              examples:
                identificado:
                  summary: 'Formulário com nome ("Admissão: outubro de 2026"), uma pessoa'
                  value: { anonimo: false, enviados: 1, ignorados: 0 }
                anonimo:
                  summary: 'Formulário anônimo ("Pesquisa de clima 2026"), só diz que o lembrete saiu'
                  value: { anonimo: true, enviados: null, ignorados: null }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422': { $ref: '#/components/responses/FormularioErro422Anonimo' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

