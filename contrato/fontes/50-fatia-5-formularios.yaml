                    total: 3
                    totalPaginas: 1
                    contagens: { todos: 3, paraResponder: 1, disponiveis: 2, respondidos: 2 }
                    itens:
                      - id: 10
                        titulo: Avaliação da sua gestora, ciclo 2026.2
                        descricao: Conte como foi trabalhar com Marina Costa neste semestre.
                        tipo: AVALIACAO
                        sentidoAvaliacao: EQUIPE_AVALIA_GESTOR
                        anonimo: true
