  /api/rh/formularios/{formularioId}/destinatarios:
    post:
      tags: [Formulários]
      operationId: adicionarDestinatariosFormulario
      summary: Acrescenta pessoas a um formulário que é para pessoas escolhidas.
      description: |
        Serve ao "Enviar formulário de admissão" do cadastro e da importação: `criarFuncionario` e `confirmarImportacao`
        (fatias 1 e 2) chamam **por dentro, com o mesmo efeito**, o que esta rota faz quando recebem
        `formularioAdmissaoId` (o front lista os formulários com `tipo=ADMISSAO` e `situacao=PUBLICADO` em
        `listarFormulariosRh` e, se não existir nenhum, avisa que o RH precisa criar e publicar um antes). Nenhuma tela
        chama esta rota diretamente.

        Só vale para formulário com `alvo = PESSOAS` e em `RASCUNHO`, `AGENDADO` ou `PUBLICADO` (422
        `FORMULARIO_NAO_E_POR_PESSOAS` e `FORMULARIO_ENCERRADO`). Pessoa já incluída é ignorada (conta em `jaEstavam`).
        **Nenhum e-mail sai**, nem de "formulário atribuído" (lista fechada, convenções, seção 12; o RH que quiser avisar
        publica um Aviso à mão): a pessoa vê o formulário em `listarMeusFormularios` ao entrar no portal. Pessoa inativa: 422 `FUNCIONARIO_INATIVO` (nada é incluído). Não vale para avaliação (os
        avaliados saem da regra de `publicarFormulario`).

        **Formulário anônimo `PUBLICADO` não recebe destinatário novo:** 409 `ANONIMO_SEM_NOVOS_DESTINATARIOS` (regra 2 em
        "Formulários"). Sem isso o público deixaria de ser a fotografia do dia da publicação e o RH poderia incluir uma
        pessoa conhecida para tentar isolar a resposta dela. Em rascunho ou agendado ainda vale, e o mínimo de 5 é
        conferido ao publicar.

        **Exemplo de hoje:** o formulário 11 ("Admissão: outubro de 2026") já tinha Rafael Torres (104); a importação das
        12:41 incluiu Tiago Nogueira (105) e Aline Carvalho (202). Ele passou a ter 3 pessoas esperadas e **ninguém
        respondeu ainda**.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioDestinatariosComando' }
            example: { funcionarioIds: [104, 105, 202] }
      responses:
        '200':
          description: Pessoas incluídas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioDestinatariosResultado' }
              example: { adicionados: 2, jaEstavam: 1 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Anonimato' }
        '422': { $ref: '#/components/responses/FormularioErro422Alvo' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ===========================================================================
  # RH: quem respondeu, respostas, resultado, exportação (tela 21)
  # ===========================================================================
  /api/rh/formularios/{formularioId}/respondentes:
    get:
      tags: [Formulários]
      operationId: listarRespondentesFormulario
      summary: Mostra quem respondeu e quem falta num formulário para funcionários (tela Quem respondeu).
      description: |
        Tela 21. Os três cartões do topo (Responderam, Faltam responder, Taxa de resposta) vêm de `resumo` e **não mudam
        com os filtros**. Os filtros são: aba (`situacao`: Responderam = `RESPONDIDO`, Faltam = `NAO_RESPONDEU`), `busca`
        (nome) e "Todos os setores" (`setorId`). Ordem: nome, de A a Z. Botões da tela: "Baixar respostas"
        (`exportarRespostasFormulario`), "Lembrar quem falta por e-mail" e "Lembrar" de cada linha
        (`lembrarQuemFaltaFormulario`), "Ver respostas" de cada linha (`obterRespostasDeFuncionario`, só quando
        `podeVerRespostas`).

        **Formulário anônimo:** a tela mostra **só os três cartões**. `anonimo` vem verdadeiro, `itens` vem sempre
        vazio (nem quem respondeu nem quem falta aparece) e `busca`, `setorId` e `situacao` são ignorados: a contagem é
        sempre geral, nunca por setor. O botão "Lembrar quem falta por e-mail" continua (vale para quem falta, sem
        mostrar a lista nem dizer quantos receberam: a resposta é só "lembrete enviado") e "Ver respostas" não existe.
        Isto segue a decisão de 2026-10-29 de que o lembrete do anônimo não mostra a lista ao RH. **Enquanto o
        formulário não está `ENCERRADO`, os cartões não têm contagem** (regra 5 em "Formulários"): `resumo.respondidos`,
        `resumo.faltam` e `resumo.taxaDeRespostaPercentual` vêm vazios (nem número, nem faixa) e só `resumo.esperados`
        vem exato. A tela mostra "Esperados" e a situação, e deixa "Responderam", "Faltam" e "Taxa de resposta" como
        "disponível ao encerrar". Depois de `ENCERRADO` os três vêm exatos.

        Formulário por link (`alvo = LINK`) não tem esta lista: use `listarCandidatosFormulario` (422
        `FORMULARIO_POR_LINK`). Nas avaliações, cada linha é **uma avaliação** (`funcionario` avaliou `avaliado`).
        Quem deve responder é calculado na hora (ver `publicarFormulario`); no formulário anônimo é a lista fixada na
        publicação.

        **Sugestão** (`tipo = OUTRO`): cada linha é **um envio**, e a mesma pessoa pode aparecer mais de uma vez, cada vez
        com o seu `respondidoEmUtc` (é ele que separa um envio do outro, ver `obterRespostasDeFuncionario`; ordem: nome e,
        para a mesma pessoa, o envio mais recente primeiro). Ninguém é
        obrigado a responder: `resumo.respondidos` conta os envios e `resumo.faltam`, `resumo.esperados` e
        `resumo.taxaDeRespostaPercentual` vêm vazios; não existe linha `NAO_RESPONDEU`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - name: situacao
          in: query
          description: Aba da tela. Sem ela, mostra todos.
          schema: { $ref: '#/components/schemas/FormularioRespondenteSituacao' }
        - name: setorId
          in: query
          description: Mostra só as pessoas deste setor.
          schema: { type: integer, minimum: 1 }
        - name: busca
          in: query
          description: Procura no nome da pessoa.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Resumo e, quando o formulário não é anônimo, a lista de pessoas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioRespondentesRh' }
              examples:
                identificado:
                  summary: "Formulário com nome (\"Admissão: outubro de 2026\"): 3 esperados, ninguém respondeu ainda"
                  value:
                    pagina: 1
                    tamanhoPagina: 20
                    total: 3
                    totalPaginas: 1
                    anonimo: false
                    resumo: { respondidos: 0, faltam: 3, esperados: 3, taxaDeRespostaPercentual: 0 }
                    itens:
                      - funcionario: { id: 202, nome: Aline Carvalho, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                        avaliado: null
                        situacao: NAO_RESPONDEU
                        respondidoEmUtc: null
                        podeVerRespostas: false
                      - funcionario: { id: 104, nome: Rafael Torres, cargo: Vendedor, setor: Comercial, ativo: true }
                        avaliado: null
                        situacao: NAO_RESPONDEU
