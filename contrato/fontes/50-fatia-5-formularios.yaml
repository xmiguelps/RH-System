        o envio não precisa conferir de novo o que a pessoa viu. Formulário que a pessoa não deve responder: 404. Encerrado ou ainda
        não aberto: 422 `FORMULARIO_ENCERRADO` ou `FORMULARIO_AINDA_NAO_ABERTO`. **Sugestão** (`OUTRO`) abre sempre, sem
        prazo, e a tela volta para a lista depois de enviar, com o formulário ainda disponível.
