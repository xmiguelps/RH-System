  # ===========================================================================
  # Todos os perfis: meus formulários (telas 39 e 40)
  # ===========================================================================
  /api/eu/formularios:
    get:
      tags: [Formulários]
      operationId: listarMeusFormularios
      summary: Lista os formulários que a pessoa logada deve ou pode responder, e os que já respondeu.
      description: |
        Telas 39 e 40 (cartões). Serve a qualquer perfil (o gestor e o RH também respondem formulários) e é de onde o
        menu tira o número da etiqueta "Formulários" (`contagens.paraResponder`). Abas: **Todos** = não manda `situacao`
        (traz `PARA_RESPONDER` e `DISPONIVEL`; os já respondidos ficam de fora), **Para responder**, **Disponíveis**,
        **Respondidos**. "Todos os tipos" = `tipo`; "Buscar formulário" = `busca` no título. `contagens` traz os quatro
        números das abas respeitando `busca` e `tipo` e ignorando `situacao`.

        Entram os formulários em que a pessoa está entre quem deve responder (por pessoa ou por setor), `PUBLICADOS`, e
        todos os que ela já respondeu (mesmo depois de encerrados). Formulário por link (candidatos) nunca aparece aqui.

        **Mudou em relação ao Figma:** sem "Quiz de treinamento", sem nota ("Sua nota foi 9,0") e, na tela 39, sem a frase
        "O RH vê os resultados agrupados por setor": no formulário anônimo a descrição diz que o RH vê só o resultado geral.
        Etiqueta do tipo no cartão: `ENTREVISTA` "Entrevista automática", `ADMISSAO` "Formulário de admissão", `AVALIACAO` com
        `GESTOR_AVALIA_EQUIPE` "Avaliação da equipe" e com `EQUIPE_AVALIA_GESTOR` "Avaliação do gestor", `PESQUISA`
        "Pesquisa", `OUTRO` "Sugestão".

        `respondidos` de `total` é a barra do cartão: `total` é 1, exceto nas avaliações `GESTOR_AVALIA_EQUIPE`, em que é o
        número de pessoas que o gestor deve avaliar (o cartão vira "Continuar", como a faixa "Sua parte" da tela 57).
        `prazo` vazio é "Sempre aberto".

        **Anônimo:** `respondidoEmUtc` vem vazio (a participação anônima não guarda data) e `podeVerMinhasRespostas` é
        falso: não existe "Ver minhas respostas" para resposta anônima.

        **Sugestão** (`OUTRO`, sempre aberta; decisão do dono, 2026-10-30: aceita várias respostas da mesma pessoa): o
        cartão **fica sempre em `DISPONIVEL`**, nunca vai para `RESPONDIDO` nem para a aba Respondidos (a pessoa pode
        mandar outra quando quiser), com `respondidos` 0 de `total` 1, `prazo` vazio e `podeVerMinhasRespostas` falso
        (a pessoa não relê o que mandou). Os demais tipos têm uma resposta por pessoa (por avaliado, nas avaliações).
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - name: situacao
