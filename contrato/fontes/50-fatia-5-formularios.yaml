                        textos:
                          - Mais clareza nas metas do trimestre.
                          - O estacionamento é pequeno para a quantidade de carros.
                          - Reuniões mais curtas e com pauta enviada antes.
                avaliadoComRespostasSuficientes:
                  summary: Avaliação anônima encerrada, Carlos Ribeiro com 8 respostas; uma pergunta opcional ficou de fora
                  value:
