  /api/eu/formularios/{formularioId}/respostas:
    post:
      tags: [Formulários]
      operationId: responderFormulario
      summary: Envia as respostas da pessoa logada.
      description: |
        `multipart/form-data` (por causa das perguntas de envio de arquivo): a parte `respostas` é um texto JSON (lista de
        `RespostaFormularioItem`), as partes `arquivos` são os arquivos (PDF ou Word, até 5 MB cada) e `avaliadoId` vem
        nas avaliações. Cada resposta de arquivo aponta o arquivo pela posição (`arquivoIndice`, a partir de 0) na lista
        `arquivos`. Tudo ou nada: se uma resposta é inválida, nada é gravado e os arquivos não são guardados.

        Regras: pergunta obrigatória precisa de resposta; ao menos uma pergunta precisa ser respondida; cada resposta
        usa só o campo do tipo da pergunta (ver `RespostaFormularioItem`); em múltipla escolha a alternativa precisa ser
        da pergunta. Erros de campo vêm em 400 com `errors` (`respostas[2].texto`, `arquivos`). A mensagem do trigger
        "Pergunta obrigatoria: informe a resposta." e a de "Formulario inativo nao aceita respostas." podem aparecer em 422
        com `regraDoBanco`; a de "Funcionario inativo nao pode responder formularios." vem com `codigo`
        `FUNCIONARIO_INATIVO` (o mesmo de todas as fatias).

        **Uma resposta por pessoa** (por avaliado, nas avaliações): responder de novo é 409 `JA_RESPONDIDO`. **Exceção: a
        Sugestão** (`OUTRO`, caixa sempre aberta; decisão do dono, 2026-10-30) **aceita várias respostas da mesma pessoa**,
        e o 409 `JA_RESPONDIDO` só existe para os outros tipos. Em formulário com nome o banco **não** impede a repetição
        (`FORMULARIOS_RESPOSTAS` não tem chave única por pessoa), então a API confere e grava na mesma transação, para
        dois envios ao mesmo tempo não passarem; no anônimo a chave única da participação (`V001`) impede (por isso a
        Sugestão nunca é anônima). Como o banco não tem tabela de "envio", a API grava **o mesmo instante** em
        `DATA_RESPOSTA` de todas as linhas de um envio, e é por pessoa e por esse instante que a Sugestão separa um envio
        do outro (`obterRespostasDeFuncionario`). Nas avaliações `avaliadoId` é obrigatório e precisa estar em
        `avaliados` (422 `AVALIADO_INVALIDO`); nos outros tipos é proibido.

        **Formulário anônimo:** a resposta é gravada **sem funcionário, sem candidato e com hora grosseira (só o dia)**
        (`V001`). A aplicação registra à parte só que a pessoa participou (`FORMULARIOS_PARTICIPACOES`, sem data nem
        ligação com a resposta), com chave `participacaoId` UUID v4 gerada pela aplicação, devolvida no recibo. **A
        auditoria não registra nada disto**: nem o autor nem a hora da resposta, nem a participação (nem com nome, nem com
        hora; regra 6 em "Formulários"). Como o anonimato não muda depois de publicado, a pessoa nunca responde achando que
        era anônimo e não ser; por isso o envio não traz um campo de conferência do anonimato visto.

        **Resposta com arquivo** (pergunta `ARQUIVO`): o arquivo fica no armazenamento e o banco guarda só a referência, na
        própria linha da resposta (`FORMULARIOS_RESPOSTAS`): `CAMINHO_ARQUIVO` (interno, nunca devolvido) e
        `NOME_ARQUIVO_ORIGINAL` (o nome que a pessoa deu, devolvido em `arquivo.nome`), sempre **os dois juntos** (`V001`). **Resposta
        anônima nunca tem arquivo:** formulário anônimo não tem pergunta `ARQUIVO` (422 `ANONIMO_SEM_ARQUIVO` ao montar o
        formulário), e, como segunda barreira, o banco recusa (`V001`) arquivo numa resposta anônima. Então, no formulário
        anônimo, não há parte `arquivos` no envio.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RespostaFormularioEnvio' }
            encoding:
              respostas: { contentType: application/json }
              arquivos: { contentType: 'application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document' }
            example:
              avaliadoId: 21
              respostas:
                - { perguntaId: 301, valorEscala: 4 }
                - { perguntaId: 302, alternativaIds: [411] }
                - { perguntaId: 303, texto: Cumpre os prazos e ajuda quem entra na equipe. }
      responses:
        '201':
          description: Respostas gravadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaFormularioRecibo' }
              examples:
                identificado:
                  summary: Avaliação com nome; restam 4 pessoas
                  value: { formularioId: 9, participacaoId: null, restantes: 4 }
                anonimo:
                  summary: Formulário anônimo
                  value: { formularioId: 8, participacaoId: 'd6a1c2f4-8b3e-4f57-9a10-2c5e7b9d4f31', restantes: 0 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409JaRespondeu' }
        '422': { $ref: '#/components/responses/FormularioErro422Resposta' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/formularios/{formularioId}/minhas-respostas:
    get:
      tags: [Formulários]
      operationId: obterMinhasRespostas
      summary: Mostra o que a pessoa logada respondeu (botão Ver minhas respostas).
      description: |
        Só para formulário **com nome**; em formulário anônimo a resposta não é da pessoa para o sistema, então 422
        `FORMULARIO_ANONIMO` (o cartão já vem com `podeVerMinhasRespostas` falso). Nas avaliações, `avaliadoId` diz de
        qual avaliação se fala; é proibido nos outros tipos (400). Quem não respondeu: 404. O arquivo que a pessoa enviou
        aparece só com o nome (não há download de volta). **Sugestão** (`OUTRO`): a pessoa não relê o que mandou (o cartão
        vem com `podeVerMinhasRespostas` falso) e a rota devolve 422 `FORMULARIO_SUGESTAO`.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioAvaliadoIdConsulta'
      responses:
        '200':
          description: As respostas da pessoa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaFormularioMinhas' }
              example:
                formularioId: 2
                titulo: Admissão
                avaliado: null
                respondidoEmUtc: '2022-03-10T15:20:00Z'
                respostas:
                  - perguntaId: 701
