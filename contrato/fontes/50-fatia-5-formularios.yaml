  /api/rh/formularios/{formularioId}/avaliados:
    get:
      tags: [Formulários]
      operationId: listarAvaliadosFormulario
      summary: Lista as pessoas avaliadas numa avaliação, com quantas respostas cada uma tem.
      description: |
        Só para `tipo = AVALIACAO` (422 `FORMULARIO_NAO_E_AVALIACAO` nos outros). Alimenta a escolha de "quem" na página de
        resultado. `resultadoLiberado` diz se aquele avaliado tem alguma pergunta para mostrar (em formulário anônimo, pelo
        menos `minimoPorAvaliado` respostas (3) e, dentro delas, ao menos uma pergunta com 3 respostas ou mais; com nome,
        ao menos uma resposta; ver `obterResultadoFormulario`). Lista curta e limitada às pessoas avaliadas: sem
        paginação, por ordem de nome. `esperadas` (quantas pessoas deviam avaliá-lo) vem sempre exato.

        **Com nome:** `totalRespostas` mostra a contagem mesmo quando o resultado não está liberado.

        **Formulário anônimo:** esta lista é, na prática, a contagem de respostas por avaliado, então só existe **depois de
        encerrado** (regra 3 em "Formulários"): antes disso, **409 `RESULTADO_ANONIMO_INDISPONIVEL`**. Mesmo depois, o
        avaliado com **menos de 3 respostas** vem com `totalRespostas` **vazio** e `resultadoLiberado` falso (regra 4): a
        tela escreve "menos de 3 respostas", sem dizer quantas.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      responses:
        '200':
          description: As pessoas avaliadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioAvaliadosLista' }
              example:
                minimoPorAvaliado: 3
                itens:
                  - { funcionario: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }, totalRespostas: 8, esperadas: 8, resultadoLiberado: true }
                  - { funcionario: { id: 8, nome: Marina Costa, cargo: Gerente financeira, setor: Financeiro, ativo: true }, totalRespostas: 4, esperadas: 5, resultadoLiberado: true }
                  - { funcionario: { id: 9, nome: Paulo Vieira, cargo: Gerente de logística, setor: Logística, ativo: true }, totalRespostas: null, esperadas: 12, resultadoLiberado: false }
