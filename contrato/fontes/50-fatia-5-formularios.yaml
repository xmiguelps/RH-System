  /api/rh/formularios/{formularioId}/respostas/funcionarios/{funcionarioId}:
    get:
      tags: [Formulários]
      operationId: obterRespostasDeFuncionario
      summary: Mostra o que uma pessoa respondeu (botão Ver respostas).
      description: |
        Só para formulário **com nome**. Em formulário anônimo não existe: 422 `FORMULARIO_ANONIMO`, porque a resposta
        anônima não guarda quem respondeu (`V001`). Nas avaliações, `avaliadoId` diz de qual avaliação se fala (uma
        pessoa responde uma vez por avaliado); é obrigatório nelas e proibido nos outros tipos (400). Pessoa que não
        respondeu: 404.

        **Sugestão** (`OUTRO`): a mesma pessoa pode ter mandado várias; `respondidoEmUtc` (o do envio que aparece em
        `listarRespondentesFormulario`) diz qual envio se quer. É obrigatório na Sugestão (400 sem ele; 404 se a pessoa
        não tem envio nesse instante) e proibido nos outros tipos (400). Todas as linhas de um mesmo envio são gravadas
        com o mesmo instante, e é assim que o envio se separa de outro da mesma pessoa (o banco não tem tabela de
        envio: a resposta com nome se agrupa por pessoa, `FORMULARIOS_RESPOSTAS`).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioFuncionarioId'
        - $ref: '#/components/parameters/FormularioAvaliadoIdConsulta'
        - $ref: '#/components/parameters/FormularioRespondidoEmConsulta'
