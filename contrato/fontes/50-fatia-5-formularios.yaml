  /api/rh/formularios/{formularioId}/publicar:
    post:
      tags: [Formulários]
      operationId: publicarFormulario
      summary: Publica o formulário agora ou agenda a publicação (botão Publicar formulário).
      description: |
        Etapa 4 (tela 20). Antes de qualquer coisa, num formulário anônimo, confere o **público mínimo** (regra 1 em
        "Formulários"): menos de 5 destinatários é 422 `FORMULARIO_ANONIMO_PUBLICO_PEQUENO`. Depois roda a verificação
        (`verificarFormulario`, com o público do corpo) e recusa se houver `BLOQUEIO`. Então:
        - **Publicar agora** (`agendarPara` vazio): vira `PUBLICADO` e `publicacao.publicadoEmUtc` é preenchido.
        - **Agendar** (`agendarPara` com uma data): vira `AGENDADO`; o agendador publica no início desse dia (fuso
          -03:00) uma única vez. Até lá, quem abrir o link recebe 422 `FORMULARIO_AINDA_NAO_ABERTO`. No anônimo, o
          agendador **confere de novo o público mínimo na hora de publicar**: se ele ficou abaixo de 5 (alguém foi
          desligado, por exemplo), não publica, o formulário continua `AGENDADO` e `verificarFormulario` mostra o
          bloqueio.
        - `alvo = LINK`: o servidor gera `publicacao.tokenDoLink` (segredo aleatório, 43 caracteres, não sequencial),
          mesmo no agendamento, para o RH copiar o link ("O link fica disponível depois de publicar", tela 20).
          Só `ENTREVISTA` pode usar link (422 `LINK_SO_PARA_ENTREVISTA`) e formulário anônimo não pode
          (422 `ANONIMO_SEM_LINK`, regra do banco).
        - `alvo = SETORES` ou `PESSOAS`: **a publicação não manda e-mail** (a lista de e-mails do sistema é fechada,
          convenções, seção 12: não há aviso de formulário publicado; se o RH quiser avisar, publica um Aviso à mão). As
          pessoas passam a ver o formulário em `listarMeusFormularios`. Setor vale para **quem está no setor agora**;
          num formulário **não anônimo**, quem for admitido ou trocar para o setor depois também passa a receber o
          formulário aberto. Num formulário **anônimo** não: o público é a fotografia do dia da publicação (regra 2 em
          "Formulários"; o back-end pode guardar uma linha por pessoa em `FORMULARIOS_DESTINATARIOS`, que o `V001`
          permite, em vez da linha do setor).
        - **Avaliações:** quem avalia quem sai de `sentidoAvaliacao` e de quem é gestor de quem (equipe = setor do
          gestor). `GESTOR_AVALIA_EQUIPE`: as pessoas escolhidas são os **gestores**, e cada um avalia cada pessoa
          da equipe dele (menos ele mesmo). `EQUIPE_AVALIA_GESTOR`: as pessoas ou o setor escolhidos são quem
          **avalia**, e cada uma avalia o gestor do seu setor; quem é de setor sem gestor (Recursos Humanos,
          Administrativo, Tecnologia e Compras, hoje) não tem quem avaliar e fica fora da conta de `esperados` e do
          mínimo de 5 destinatários do anônimo. Numa avaliação anônima, um gestor cuja equipe tem menos de 3 pessoas nunca
          chega ao mínimo de 3 respostas por avaliado (regra 4 em "Formulários"): o resultado dele não aparece.
        - `prazo` ("Aceitar respostas até"): o último dia que aceita resposta (até 23:59 no fuso -03:00). Passou, o
          agendador encerra o formulário sozinho e a lista mostra "Encerrou em ...". Sem `prazo`, fica aberto até o RH
          encerrar. **Sugestão** (`OUTRO`) é sempre aberta: `prazo` e `recorrencia` precisam estar vazios (400).
        - `lembreteAutomatico` (caixa "Lembrar quem não respondeu 7 dias antes do prazo", **ligada por padrão**): se
          ligado, o sistema manda **um** e-mail de lembrete, 7 dias antes do `prazo`, só a quem ainda não respondeu
          (é um dos e-mails da lista fechada, seção 12). Só vale com `prazo` e com `alvo` `SETORES` ou `PESSOAS` (não
          há a quem lembrar por link); se o `prazo` está a 7 dias ou menos do dia da publicação, não há lembrete
          automático; em formulário recorrente, vale em cada rodada. Segue a regra de no máximo um lembrete por pessoa,
          por formulário e por dia, que o lembrete manual também usa (ver `lembrarQuemFaltaFormulario`). **Banco:** o
          liga e desliga é uma **coluna nova em `FORMULARIOS`**, `LEMBRETE_AUTOMATICO` (script `V001`); o estado "lembrete
          enviado hoje" vive na **tabela de tarefas agendadas da aplicação** (também nova, script `V001`), nunca no
          formulário. O padrão "ligada" é da **API**: ao criar o formulário ela grava `true`; o padrão do banco é `FALSE` de
          propósito (`V001`), para que a caixa desligada nunca vire ligada por omissão do valor. **No anônimo** o lembrete vai a quem ainda não participou, sem guardar o destinatário nem contar
          quantos foram: o limite é um lembrete do formulário por dia e a auditoria só diz que o lembrete saiu (regra 6).
          Hoje (07/10) a Pesquisa de clima 2026 (anônima, prazo 31/10) ainda não recebeu lembrete automático: o primeiro
          sai em 24/10.

        **Não existem no contrato** as caixas "Nota mínima para seguir" (cortada), "Enviar o resultado por e-mail ao RH"
        e "Convidar aprovados para a entrevista" (decisão do dono, 2026-10-30; a tela 20 do Figma as mostra): o front
        **esconde as três**. Também não existe aviso automático de "formulário publicado".

        Formulário recorrente (`recorrencia`, decisão de 2026-10-29): o agendador reabre o formulário no intervalo
        escolhido, para as mesmas pessoas; **ao reabrir, as respostas da rodada anterior são apagadas** (sem histórico) e,
        no anônimo, as participações também. O front avisa o RH disso e sugere "Baixar respostas" antes
        (`exportarRespostasFormulario`).

        **Formulário recorrente anônimo** (regras 1 e 3 em "Formulários"): só reabre **depois de encerrado**. Se na data
        marcada a rodada ainda está aberta, o agendador não reabre, não apaga nada e tenta na data seguinte do intervalo. Ao
        reabrir, **confere de novo o mínimo de 5 destinatários**, contando só quem da fotografia ainda está ativo: se
        ficaram menos de 5, não reabre, o formulário continua `ENCERRADO` e a recorrência é cancelada
        (`proximaReaberturaEmUtc` vazio); o RH cria outro formulário com um público de 5 ou mais.

        A publicação agendada, o encerramento pelo prazo, a reabertura e o lembrete automático são tarefas da **tabela de
        tarefas agendadas da aplicação** (tabela nova, script `V001`).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioPublicacaoComando' }
            examples:
              porLinkAgora:
                summary: Entrevista por link, publicada agora (tela 20)
