    post:
      tags: [Formulários]
      operationId: criarFormulario
      summary: Cria o formulário em rascunho (etapa Detalhes do assistente).
      description: |
        Etapa 1 do assistente (tela 17) e também "Salvar rascunho e sair" nela. Cria sempre como `RASCUNHO`: a aplicação
        grava `ATIVO = falso` de forma explícita (o padrão do banco é verdadeiro).

        **Tipos que a tela oferece** (escolha única): Entrevista automática (`ENTREVISTA`), Formulário de admissão
        (`ADMISSAO`), Avaliação da equipe (`AVALIACAO` + `GESTOR_AVALIA_EQUIPE`), Avaliação do gestor (`AVALIACAO` +
        `EQUIPE_AVALIA_GESTOR`), **Pesquisa** (`PESQUISA`) e **Sugestão** (`OUTRO`). A tela 17 do Figma mostra só os
        quatro primeiros e o "Quiz de treinamento": **o Quiz sai; Pesquisa e Sugestão entram**.

        **Anônimo:** o RH marca aqui, ao criar (decisão de 2026-10-29). O Figma não tem esta chave: a tela ganha uma
        caixa "Respostas anônimas" na etapa Detalhes, com a explicação "o RH e o gestor veem só o resultado geral de
        cada pergunta, nunca quem respondeu". Formulário anônimo não tem envio de arquivo nem link público (as duas
        recusas vêm das etapas Perguntas e Publicação). As demais regras do anônimo (público mínimo de 5; anonimato,
        perguntas e destinatários congelados depois de publicado; sem contagem de respostas antes de encerrar; resultado
        só depois de encerrar; mínimo de 3 respostas por pergunta e, na avaliação, também de 3 por avaliado) estão na lista
        "Formulário anônimo" do assunto Formulários; a tela pode mostrá-las como texto de apoio ao lado da caixa.

        **Sugestão (`OUTRO`) nunca é anônima** (400 em `errors.anonimo`): a caixa de sugestões é sempre aberta e aceita
        várias respostas da mesma pessoa, e o resultado anônimo só sai depois de encerrar. A tela esconde a caixa
        "Respostas anônimas" (ou a deixa desligada e desabilitada) quando o tipo é Sugestão.

        `sentidoAvaliacao` é obrigatório quando `tipo = AVALIACAO` e proibido nos outros tipos. A prévia "Como o
        candidato vai ver" é montada pelo front com o que a pessoa digitou; não há rota para ela.
      x-provisorio: "Sugestão anônima: o dono decidiu que a Sugestão aceita várias respostas da mesma pessoa, mas não disse se ela pode ser anônima. Hipótese usada aqui: não pode (o resultado anônimo só sai depois de encerrar e a Sugestão é sempre aberta; o registro de participação do banco, V001, aceita uma só linha por pessoa). Se o dono quiser sugestão anônima, muda: a regra de 400 sai, a Sugestão volta a ter público mínimo de 5 e o resultado fica preso ao encerramento manual."
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioDetalhesComando' }
            example:
              titulo: Pesquisa sobre o plano de benefícios
              descricao: Conte o que você acha dos benefícios de hoje. Suas respostas são anônimas.
              tipo: PESQUISA
              sentidoAvaliacao: null
              anonimo: true
      responses:
        '201':
          description: Rascunho criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioDetalheRh' }
              example:
                id: 13
                titulo: Pesquisa sobre o plano de benefícios
                descricao: Conte o que você acha dos benefícios de hoje. Suas respostas são anônimas.
                tipo: PESQUISA
                sentidoAvaliacao: null
                anonimo: true
                situacao: RASCUNHO
                autor: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                criadoEmUtc: '2026-10-07T12:30:00Z'
                temRespostas: null
                perguntas: []
                publicacao:
                  alvo: null
                  setores: []
                  pessoas: []
                  agendarPara: null
                  prazo: null
                  recorrencia: null
                  lembreteAutomatico: true
                  publicadoEmUtc: null
                  encerradoEmUtc: null
                  proximaReaberturaEmUtc: null
                  tokenDoLink: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}:
    get:
      tags: [Formulários]
      operationId: obterFormularioRh
      summary: Mostra o formulário inteiro (detalhes, perguntas e publicação), para editar.
      description: |
        Abre o assistente com o que já foi salvo (botão "Editar" da lista) e alimenta o cabeçalho da tela 21. Qualquer
        formulário, em qualquer situação. `temRespostas` diz se já existe resposta (isso trava edições, ver
        `editarFormulario` e `editarPerguntaFormulario`); **em formulário anônimo ele não existe** (vem vazio, em qualquer
        situação: saber se já há resposta revelaria o andamento; regra 5 em "Formulários"). `publicacao.tokenDoLink` só vem depois de publicar um
        formulário por link; o front monta o link completo com o endereço do site e a rota da página pública (definida
        no plano do front).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      responses:
        '200':
          description: O formulário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioDetalheRh' }
              example:
                id: 12
                titulo: "Entrevista: auxiliar de logística"
                descricao: Responda com calma. Leva uns 10 minutos e o RH entra em contato em até 5 dias úteis.
                tipo: ENTREVISTA
                sentidoAvaliacao: null
                anonimo: false
                situacao: RASCUNHO
                autor: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                criadoEmUtc: '2026-10-06T14:05:00Z'
                temRespostas: false
                perguntas:
                  - id: 501
                    ordem: 1
                    texto: Você tem disponibilidade para trabalhar aos sábados?
                    tipo: MULTIPLA_ESCOLHA
                    obrigatoria: true
                    alternativas:
                      - { id: 901, ordem: 1, texto: Sim }
                      - { id: 902, ordem: 2, texto: Não }
                  - id: 502
                    ordem: 2
                    texto: Conte sobre uma vez em que você precisou organizar um estoque com prazo curto.
                    tipo: RESPOSTA_LONGA
                    obrigatoria: true
                    alternativas: []
