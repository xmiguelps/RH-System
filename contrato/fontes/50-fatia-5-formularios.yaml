  /api/rh/formularios/{formularioId}/resultado:
    get:
      tags: [Formulários]
      operationId: obterResultadoFormulario
      summary: "Mostra o resultado geral, pergunta por pergunta (formulário anônimo: só depois de encerrado)."
      description: |
        **Esta tela não existe no Figma.** O front monta uma página simples "Resultado", que abre de um botão "Ver
        resultado" na tela 21 (que é o jeito de o RH ler um formulário anônimo) e do menu "..." da lista. Mostra, por
        pergunta: a contagem e o percentual de cada alternativa (múltipla escolha), a média e a distribuição de 1 a 5
        (escala), a lista de textos (resposta curta e longa) e só a quantidade (envio de arquivo).

        **Formulário anônimo** (`anonimo` verdadeiro; regras 3, 4 e 7 em "Formulários", decisões de 2026-10-29 e
        2026-10-30 e do roadmap, decisão 13):
        - **Só depois de encerrado.** Com o formulário em qualquer outra situação: **409
          `RESULTADO_ANONIMO_INDISPONIVEL`**, e não há resultado parcial. O botão "Ver resultado" fica desabilitado até
          `situacao` ser `ENCERRADO` (`obterFormularioRh`). Não existe rota para reabrir, então encerrar para espiar não
          deixa voltar atrás.
        - Só o **resultado geral por pergunta**. Nunca por setor, por pessoa ou por data; o contrato não tem nenhum
          campo que identifique ou ordene uma resposta anônima (nem número, nem hora).
        - **Mínimo de 3 respostas por pergunta** (e não por formulário): a pergunta com menos de 3 respostas **não
          aparece em `perguntas`**, e `perguntasOcultas` diz quantas ficaram de fora, para a tela escrever "2 perguntas
          não aparecem porque tiveram menos de 3 respostas". Uma pergunta opcional que quase ninguém respondeu some
          sozinha, em vez de mostrar a resposta de uma pessoa. Se nenhuma pergunta chega a 3, `perguntas` vem `[]`.
        - Os textos vêm em **ordem alfabética** (sem diferenciar maiúscula, em português), nunca na ordem em que foram
          gravados.
        - `totalRespostas` é exato (o formulário já está encerrado).
        - O anonimato vale **contra quem usa a aplicação** (RH e gestor), não contra quem lê o banco ou o backup, e não
          cobre o conluio descrito na regra 8.

        Nas **avaliações** o resultado é **por avaliado**: `avaliadoId` é obrigatório nelas (use
        `listarAvaliadosFormulario` para escolher) e proibido nos outros tipos (400). **Na avaliação anônima o avaliado
        precisa de pelo menos 3 respostas** (regra 4 em "Formulários"): com menos, a chamada devolve 422
        `RESULTADO_SEM_RESPOSTAS_SUFICIENTES`, sem resultado e sem o total de respostas dele (`listarAvaliadosFormulario`
        já diz quem está liberado). Dentro de um avaliado com 3 ou mais, a pergunta ainda precisa de 3 respostas para
        aparecer. Em formulário com nome o resultado sai em qualquer situação, sem mínimo (`minimoPorPergunta` vem vazio e
        `perguntasOcultas` é 0; as respostas individuais estão em `obterRespostasDeFuncionario`).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioAvaliadoIdConsulta'
      responses:
        '200':
          description: O resultado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioResultado' }
              examples:
                anonimoEncerrado:
                  summary: Pesquisa de clima anônima, encerrada; uma pergunta ficou de fora
                  value:
                    formularioId: 4
                    titulo: Pesquisa de clima 2025
                    anonimo: true
                    situacao: ENCERRADO
                    totalRespostas: 71
                    minimoPorPergunta: 3
                    perguntasOcultas: 1
                    avaliado: null
                    perguntas:
                      - perguntaId: 801
                        ordem: 1
                        texto: Você recomendaria a empresa como um bom lugar para trabalhar?
                        tipo: MULTIPLA_ESCOLHA
                        totalRespostas: 71
                        alternativas:
                          - { alternativaId: 1001, texto: Sim, total: 55, percentual: 77.5 }
                          - { alternativaId: 1002, texto: Talvez, total: 13, percentual: 18.3 }
                          - { alternativaId: 1003, texto: Não, total: 3, percentual: 4.2 }
                        escala: null
