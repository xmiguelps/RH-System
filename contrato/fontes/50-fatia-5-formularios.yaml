# Fatia 5: formulários (entrevista por link, admissão, avaliação, pesquisa, sugestão; sem quiz).
# Telas: RH 16 a 21, funcionário 39 e 40, gestor 57 e a página pública do candidato (sem print).
# Banco (tudo no V001): FORMULARIOS, FORMULARIOS_PERGUNTAS, FORMULARIOS_RESPOSTAS (tabelas do grupo, com as colunas acrescentadas depois, inclusive o lembrete automático e o arquivo na resposta) e, das tabelas da aplicação, a fila de e-mails, as tarefas agendadas e a auditoria.
tags:
  - name: Formulários
    description: |
      Criar, publicar e acompanhar formulários (RH); responder (todos); ver quem da equipe respondeu (gestor).

      **Formulário anônimo: as regras (decididas em 2026-10-29 e 2026-10-30; valem em todas as rotas, que só remetem a esta lista).**
      1. **Só publica para 5 ou mais destinatários** (pessoas ativas que devem responder, contadas na hora de publicar;
         setor conta pelas pessoas que estão nele naquele dia; na avaliação do gestor conta quem avalia, uma avaliação por
         pessoa). Menos que isso: 422 `FORMULARIO_ANONIMO_PUBLICO_PEQUENO`. O formulário **recorrente** anônimo **confere de
         novo** esse mínimo cada vez que vai reabrir (ver `publicarFormulario`).
      2. **Depois de publicado, nada do que muda quem responde ou o que se responde muda:** o anonimato não se troca (409
         `ANONIMATO_FIXO_APOS_PUBLICAR`), as **perguntas ficam congeladas** (409 `ANONIMO_PERGUNTAS_FIXAS`: nem pergunta
         nova, nem edição, nem mudança de ordem, nem exclusão, **sem olhar se já há resposta**, para o erro nunca dizer que
         alguém respondeu) e não entram destinatários novos (409 `ANONIMO_SEM_NOVOS_DESTINATARIOS`), nem por
         `adicionarDestinatariosFormulario` nem por admissão ou troca de setor: o público é uma fotografia do dia da
         publicação. Não há exceção. Só `titulo` e `descricao` ainda mudam.
      3. **O resultado só existe depois de encerrado.** Antes, `obterResultadoFormulario`, `listarAvaliadosFormulario` e
         `exportarRespostasFormulario` devolvem 409 `RESULTADO_ANONIMO_INDISPONIVEL`.
      4. **Mínimo de 3 respostas por pergunta.** A pergunta com menos de 3 **some do resultado** (só aparece a quantidade
         de perguntas ocultas). **Na avaliação anônima há também um mínimo de 3 respostas por avaliado** (o mesmo número do
         mínimo por pergunta): quem recebeu menos de 3 não tem resultado, não entra no CSV e **não mostra o total de
         respostas dele** (`listarAvaliadosFormulario` devolve `totalRespostas` vazio). Os dois mínimos valem juntos:
         dentro de um avaliado com 3 ou mais, a pergunta ainda precisa de 3.
      5. **Antes de encerrar não há contagem de respostas, nem exata, nem em faixa:** em toda tela que mostra andamento
         (lista do RH, quem respondeu do RH e do gestor, lista do gestor), `respondidos`, `faltam` e
         `taxaDeRespostaPercentual` vêm vazios e **só `esperados` vem exato** (os destinatários não mudam depois de
         publicar), ao lado da situação do formulário. `temRespostas` **não existe** no anônimo (vem vazio, em qualquer
         situação). Depois de encerrar, os números vêm exatos. Enquanto o anônimo está `PUBLICADO`, encerrar e excluir pedem
         **sempre** a confirmação `CONFIRMACAO_NECESSARIA` (sem `pendentes`), mesmo quando todos já participaram, porque a
         falta do pedido diria isso.
      6. **Auditoria sem número e sem nome:** o lembrete de um anônimo (manual ou automático) entra na auditoria só como
         "lembrete enviado" (no manual, quem mandou e quando), **sem destinatário e sem número**; encerrar e excluir um
         anônimo que ainda não encerrou também não gravam a contagem de respostas. A participação de uma pessoa (quem já
         respondeu) **não é registrada na auditoria** nem com nome nem com hora, e a auditoria também não grava o autor nem
         a hora da resposta.
      7. **O que a API nunca devolve num formulário anônimo:** quem respondeu ou quem falta (lista), data, hora ou ordem de
         qualquer resposta, número da resposta, resposta por pessoa, por setor ou por data, o conteúdo de uma pergunta com
         menos de 3 respostas, o resultado (e o total de respostas) de um avaliado com menos de 3, a contagem de respostas
         antes de encerrar (nem exata, nem em faixa, nem `temRespostas`) e o destinatário ou o número de um lembrete.
      8. **O que esta proteção não cobre** (escrito para ninguém achar que cobre): quem lê o banco ou o backup (decisão do dono,
         2026-10-29), o que inclui a fila de e-mails, que guarda o endereço de quem vai receber o lembrete até o envio
         terminar; o conluio de duas pessoas do RH que também são destinatárias: se só elas e a pessoa que se quer
         identificar respondem, o resultado fecha com 3 respostas e o RH tira as duas dele e vê a da terceira (o mínimo de
         3 e o público de 5 não impedem isso); a conta por subtração depois de encerrar (o total do formulário menos os
         totais dos avaliados que aparecem dá o que sobrou para os escondidos, juntos); o próprio e-mail de lembrete (quem
         o recebe sabe que ainda não participou, e quem não recebeu pode contar que participou); e o gestor, que depois de
         encerrar ainda vê quantas pessoas da equipe dele participaram (sem dizer quem).

      **Quem é avaliado não acompanha:** na avaliação do gestor (`EQUIPE_AVALIA_GESTOR`) o gestor avaliado **não vê o
      andamento nem lembra ninguém**: as rotas `/api/gestor/formularios...` não listam esse formulário e devolvem 404 para
      ele. Só o RH acompanha.

      **Colunas e tabelas novas que este assunto pede (scripts já escritos em `Banco de Dados/Scripts`; o contrato só descreve
      a dependência):** a coluna do lembrete automático (ligado ou desligado) em `FORMULARIOS`, `LEMBRETE_AUTOMATICO` (`V001`);
      as colunas do arquivo enviado numa resposta em `FORMULARIOS_RESPOSTAS`, `CAMINHO_ARQUIVO` e `NOME_ARQUIVO_ORIGINAL`
      (`V001`); e as tabelas da aplicação de **tarefas agendadas** (`V001`; publicação agendada, encerramento pelo prazo,
      reabertura de formulário recorrente, lembrete automático e a marca "lembrete enviado hoje"), **fila de e-mails** (`V001`)
      e **auditoria** (`V001`).
  - name: Formulário público
    description: Página do candidato externo, aberta por link, sem login.

paths:
  # ===========================================================================
  # RH: lista, criação e edição (telas 16 a 20)
  # ===========================================================================
  /api/rh/formularios:
    get:
      tags: [Formulários]
      operationId: listarFormulariosRh
      summary: Lista os formulários, com busca e filtros por tipo e situação.
      description: |
        Tela 16. `tipo` alimenta as abas (Entrevistas, Admissão, Avaliações, Pesquisas, Sugestões); a aba "Todos" não envia
        `tipo`. "Sugestões" é `tipo=OUTRO` e "Avaliações" são os dois sentidos juntos. `situacao` alimenta "Todas as
        situações". `busca` procura no título. Ordem padrão: os mais recentes primeiro.

        `contagemPorTipo` traz os números das abas já respeitando `busca` e `situacao` e **ignorando** `tipo`, para os
        números não mudarem quando a pessoa troca de aba.

        **Mudou em relação ao Figma:** a aba "Quizzes" e o tipo "Quiz de treinamento" não existem (sem quiz, decisão de
        2026-10-29); entram as abas Pesquisas e Sugestões. O subtítulo da página deve falar de entrevistas, admissão,
        avaliações, pesquisas e sugestões.

        A coluna "Quem responde" e a barra da coluna "Respostas" vêm prontas (`quemRespondeResumo`, `respondidos`,
        `esperados`, `taxaDeRespostaPercentual`). Nas avaliações a unidade contada é a **avaliação** (uma pessoa avaliando
        outra), não a pessoa. Em formulário por link `esperados` e `taxaDeRespostaPercentual` vêm vazios (qualquer
        candidato pode responder) e `respondidos` é o número de candidatos.

        **Avaliação do gestor** (`EQUIPE_AVALIA_GESTOR`): quem avalia é quem tem gestor, então `esperados` conta só essas
        pessoas (quem é de setor sem gestor, como Recursos Humanos, Administrativo, Tecnologia e Compras, não entra) e
        `quemRespondeResumo` fala em avaliações ("Todos os setores (24 avaliações)"), igual à avaliação da equipe.

        **Formulário anônimo que ainda não foi encerrado** (regra 5 em "Formulários"): `respondidos` e
        `taxaDeRespostaPercentual` vêm vazios (nem número exato, nem faixa) e **só `esperados` vem exato**; a linha mostra
        "N esperados" e a situação, sem barra de progresso (a tela escreve "resultado ao encerrar"). Depois de `ENCERRADO`
        os três vêm exatos e a taxa é o percentual arredondado.

        **Sugestão** (`tipo = OUTRO`): é uma caixa sempre aberta, que ninguém é obrigado a responder, então `esperados` e
        `taxaDeRespostaPercentual` vêm vazios e `respondidos` conta as **sugestões recebidas** (a mesma pessoa pode mandar
        várias).
      x-perfis: [RH]
      parameters:
        - name: tipo
          in: query
          description: Mostra só os formulários deste tipo.
          schema: { $ref: '#/components/schemas/FormularioTipo' }
        - name: situacao
          in: query
          description: Mostra só os formulários nesta situação.
          schema: { $ref: '#/components/schemas/FormularioSituacao' }
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - name: ordenarPor
          in: query
          description: Campo da ordenação. Padrão `criadoEm`.
          schema: { type: string, enum: [criadoEm, titulo, prazo], default: criadoEm }
        - $ref: '#/components/parameters/Direcao'
      responses:
