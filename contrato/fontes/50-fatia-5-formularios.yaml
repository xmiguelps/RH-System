      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioPublicacaoComando' }
            example:
              alvo: LINK
              setorIds: []
              funcionarioIds: []
              agendarPara: null
              prazo: '2026-10-31'
              recorrencia: null
              lembreteAutomatico: true
      responses:
        '200':
          description: Escolhas guardadas.
          content:
