                    ordem: 3
                    texto: De 1 a 5, como você avalia sua experiência com sistemas de estoque? (1 = nenhuma, 5 = muita)
                    tipo: ESCALA
                    obrigatoria: true
                    alternativas: []
                  - id: 504
                    ordem: 4
                    texto: Envie seu currículo (PDF ou Word, até 5 MB).
                    tipo: ARQUIVO
                    obrigatoria: false
                    alternativas: []
                publicacao:
                  alvo: LINK
                  setores: []
                  pessoas: []
                  agendarPara: null
                  prazo: '2026-10-31'
                  recorrencia: null
                  lembreteAutomatico: true
                  publicadoEmUtc: null
                  encerradoEmUtc: null
                  proximaReaberturaEmUtc: null
                  tokenDoLink: null
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    put:
      tags: [Formulários]
      operationId: editarFormulario
      summary: Altera título, descrição, tipo e anonimato do formulário.
      description: |
        Etapa Detalhes. Regras por situação:
        - `RASCUNHO` e `AGENDADO`: tudo pode mudar, inclusive `anonimo` (ninguém pode responder ainda).
        - `PUBLICADO` **anônimo**: só `titulo` e `descricao` mudam, **sempre**, com ou sem resposta (a API não olha se já
          há resposta, porque dizer isso revelaria o andamento; regras 2 e 5 em "Formulários"). `anonimo`, `tipo` e
          `sentidoAvaliacao` ficam como estão: 409 `ANONIMATO_FIXO_APOS_PUBLICAR` (mudar o tipo ou o sentido mudaria quem
          responde, e o público é uma fotografia do dia da publicação). As perguntas têm rotas próprias e também estão
          congeladas (409 `ANONIMO_PERGUNTAS_FIXAS`).
        - `PUBLICADO` **com nome**: **`anonimo` não muda, em nenhum sentido e mesmo sem resposta** (409
          `ANONIMATO_FIXO_APOS_PUBLICAR`; regra 2 em "Formulários"), para ninguém responder achando que o formulário era
          de um jeito e ser de outro. O resto: **sem resposta**, tudo pode mudar, exceto que um formulário publicado por
          link (`alvo = LINK`) não sai de `ENTREVISTA` (422 `LINK_SO_PARA_ENTREVISTA`, ver `publicarFormulario`); **com
          resposta** (`temRespostas`), só `titulo` e `descricao`. O banco é a segunda barreira da troca de `anonimo` depois
          da primeira resposta (chave estrangeira composta de `V001`), mas a API responde 409 antes de chegar nele.
        - `ENCERRADO`: nada muda (422 `FORMULARIO_ENCERRADO`).
        Passar para anônimo (só em rascunho ou agendado) com uma pergunta de envio de arquivo, ou com link público, é
        recusado (422 `ANONIMO_SEM_ARQUIVO`, `ANONIMO_SEM_LINK`). Sugestão (`OUTRO`) nunca é anônima (400 em
        `errors.anonimo`).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioDetalhesComando' }
            example:
              titulo: "Entrevista: auxiliar de logística (turno da manhã)"
              descricao: Responda com calma. Leva uns 10 minutos e o RH entra em contato em até 5 dias úteis.
              tipo: ENTREVISTA
              sentidoAvaliacao: null
              anonimo: false
      responses:
        '200':
          description: Formulário atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioDetalheRh' }
              example:
                id: 12
                titulo: "Entrevista: auxiliar de logística (turno da manhã)"
                descricao: Responda com calma. Leva uns 10 minutos e o RH entra em contato em até 5 dias úteis.
                tipo: ENTREVISTA
                sentidoAvaliacao: null
                anonimo: false
                situacao: RASCUNHO
                autor: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                criadoEmUtc: '2026-10-06T14:05:00Z'
                temRespostas: false
                perguntas: []
                publicacao:
                  alvo: LINK
                  setores: []
                  pessoas: []
                  agendarPara: null
                  prazo: '2026-10-31'
                  recorrencia: null
                  lembreteAutomatico: true
                  publicadoEmUtc: null
                  encerradoEmUtc: null
                  proximaReaberturaEmUtc: null
                  tokenDoLink: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Anonimato' }
        '422': { $ref: '#/components/responses/FormularioErro422Edicao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    delete:
      tags: [Formulários]
      operationId: excluirFormulario
      summary: Exclui o formulário, em qualquer situação, com confirmação se alguém ainda pode responder.
      description: |
        Item "Excluir" do menu "..." da linha da lista (o Figma não mostra o conteúdo do menu: ele tem este item e o
        "Encerrar", ver `encerrarFormulario`). Vale em **qualquer situação** (`RASCUNHO`, `AGENDADO`, `PUBLICADO` e
        `ENCERRADO`), como diz a seção 13 das convenções ("a qualquer momento").

        **Confirmação (`CONFIRMACAO_NECESSARIA`, convenções, seções 11 e 13):** em formulário `PUBLICADO` com pessoas que
        ainda podem responder (`pendentes`; só nesta situação, nas outras ninguém está esperando), a chamada sem
        `confirmar=true` devolve **409 `CONFIRMACAO_NECESSARIA`** com `pendentes`, e nada é apagado. A tela mostra "N
        pessoas ainda não responderam. Excluir apaga as respostas. Excluir mesmo assim?" e repete a chamada com
        `confirmar=true`. Em formulário **anônimo** `pendentes` vem vazio (a contagem exata é a que a regra 5 de
        "Formulários" esconde) e a tela pergunta sem o número; enquanto ele está `PUBLICADO`, a confirmação é pedida
        **sempre**, mesmo quando todos já participaram, porque a falta do pedido diria isso. Como a exclusão apaga as
        respostas sem volta, a tela confirma também nos formulários que não pedem `confirmar`.

        **O que a exclusão faz (o que LI nos scripts do banco; a exclusão em si não foi rodada num MySQL):** nenhuma chave
        estrangeira de formulário tem `ON DELETE` (`Criacao_Tabelas` e `V001`), então o banco recusa apagar o
        formulário enquanto houver linha filha, e não há coluna de ocultação em `FORMULARIOS`: a exclusão é **física**, feita
        pela API em **uma transação**, nesta ordem: respostas (`FORMULARIOS_RESPOSTAS`, inclusive as anônimas e as de
        candidato), participações anônimas (`FORMULARIOS_PARTICIPACOES`), destinatários, candidatos, alternativas,
        perguntas e, por fim, o formulário. A ordem importa: o trigger `TRG_FORMULARIOS_PERGUNTAS_BEFORE_DELETE` recusa
        apagar pergunta que ainda tem resposta, e a resposta aponta para a alternativa, o candidato e o formulário. Não há
        trigger de exclusão em `FORMULARIOS_RESPOSTAS` nem nas tabelas novas (a lista de triggers de formulário tem só o
        insert do formulário, o update e o delete da pergunta e o insert da resposta), então apagar a resposta é permitido.
        Depois de gravar a transação, a API apaga do armazenamento os arquivos enviados (respostas de envio de arquivo e
        currículos). Formulário recorrente deixa de reabrir. A auditoria (tabela da aplicação, script `V001`)
        registra "Excluiu" com o título e **quantas** respostas foram apagadas, sem respondente; **no anônimo que ainda
        não encerrou, sem a contagem** (regra 6 em "Formulários").
      x-provisorio: "O dono falou só do formulário publicado (seção 13 das convenções diz 'a qualquer momento'). Hipótese usada aqui: o formulário encerrado também se exclui, com a mesma regra (sem confirmação, porque ninguém mais pode responder). Se o dono quiser proteger o encerrado, volta o 422 FORMULARIO_JA_PUBLICADO nele e o item Excluir some da lista para formulários encerrados."
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/FormularioConfirmar'
      responses:
        '204': { description: Formulário excluído. }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/FormularioErro409Confirmacao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/formularios/{formularioId}/perguntas:
    post:
      tags: [Formulários]
      operationId: adicionarPerguntaFormulario
      summary: Acrescenta uma pergunta ao formulário (etapa Perguntas).
      description: |
        Os botões "Adicionar pergunta" da tela 18 são: Resposta curta, Resposta longa, Múltipla escolha, Escala de 1 a 5
        e Envio de arquivo (`tipo`). **O botão "Quiz" não existe**, e a etiqueta "Eliminatória" e "Nota dada pelo RH"
        das perguntas também não (cortados em 2026-10-29): não há campo para eles.

        `ordem` é opcional: sem ela a pergunta vai para o fim; com ela, entra nessa posição e as seguintes descem uma
        (é assim que a pergunta muda de lugar, ver `editarPerguntaFormulario`).

        Em formulário **com nome** `PUBLICADO` já respondido, pergunta nova ainda pode entrar (o banco só trava a que já
        foi respondida); ela fica sem resposta nas participações anteriores. Em `ENCERRADO`, não.

        **Formulário anônimo `PUBLICADO`: as perguntas estão congeladas** (regra 2 em "Formulários"). A chamada devolve
        sempre 409 `ANONIMO_PERGUNTAS_FIXAS`, com ou sem resposta (pergunta nova também mudaria o que já foi respondido).
        Em rascunho ou agendado ainda se acrescenta; em `ENCERRADO`, 422 `FORMULARIO_ENCERRADO`. Pergunta `ARQUIVO` em
        formulário anônimo: 422 `ANONIMO_SEM_ARQUIVO`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      requestBody:
        required: true
        content:
