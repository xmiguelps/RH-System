        Nas avaliações, `avaliados` traz as pessoas que ela deve avaliar e se já avaliou cada uma ("Continuar
        avaliação"); a pessoa escolhe quem avaliar e envia uma resposta por avaliado (`responderFormulario`). Em
        `EQUIPE_AVALIA_GESTOR`, `avaliados` tem uma só pessoa: o gestor do setor dela.
        `anonimo` verdadeiro: a tela avisa "o RH e o gestor não veem quem respondeu o quê". Esse aviso é sempre verdadeiro
