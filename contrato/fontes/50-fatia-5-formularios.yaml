                descricao: Responda com calma. Leva uns 10 minutos e o RH entra em contato em até 5 dias úteis.
                tipo: ENTREVISTA
                sentidoAvaliacao: null
                anonimo: false
                situacao: RASCUNHO
                autor: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                criadoEmUtc: '2026-10-06T14:05:00Z'
                temRespostas: false
                perguntas: []
                publicacao:
                  alvo: LINK
                  setores: []
                  pessoas: []
                  agendarPara: null
                  prazo: '2026-10-31'
                  recorrencia: null
                  lembreteAutomatico: true
                  publicadoEmUtc: null
                  encerradoEmUtc: null
