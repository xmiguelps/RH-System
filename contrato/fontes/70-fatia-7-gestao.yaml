    post:
      tags: [Férias]
      operationId: pedirFerias
      summary: 'Pede férias: primeiro o gestor analisa e depois o RH confirma.'
      description: |
        Serve o painel "Pedir férias" (tela 35). Qualquer perfil pede as próprias férias.

        **Fluxo** (aprovação em duas etapas, modelo único de `CONVENCOES.md`, seção 9). O pedido nasce com
        `status: SOLICITADA`, `situacao: COM_O_GESTOR` e `etapa: GESTOR`: o gestor aprova, recusa ou sugere outra data; depois
        o RH confirma ou recusa. O gestor que recusa encerra o pedido na hora (`REJEITADA`); o RH pode recusar até o que o
        gestor aprovou (decisão do dono, 2026-10-30).

        **Sem etapa do gestor.** O pedido nasce `COM_O_RH` (`etapa: RH`, `gestorResponsavel` e `decisaoGestor` `null`) e só o RH
        decide quando quem pede:
        - é gestor, ou seja, tem linha ativa em `GESTORES` (a tabela não tem coluna de ativo: vale o `ATIVO` da pessoa dona
          da linha). **Só quem tem perfil `Gestor` é gestor de um setor** (um gestor, um setor; a fatia 1 recusa outro perfil com 422
          `GESTOR_PRECISA_TER_PERFIL_GESTOR`). Ana Souza e Sofia Ramos (perfil RH) têm linha em `GESTORES` **só** para poderem decidir os
          pedidos dos gestores: não são gestoras de setor, e os pedidos delas também só passam pelo RH;
        - não tem gestor ativo no setor (setor sem gestor, como Recursos Humanos, Administrativo, Tecnologia e Compras); ou
        - tem o gestor desligado (até o RH refazer o gestor dela, regra da fatia 1).

        **Gestor ausente.** O RH liga "gestor ausente" em `PUT /api/rh/gestores/{gestorId}/ausencia` (**rota da fatia 1**, com data
        de volta opcional; vale para qualquer pedido, a qualquer momento, em férias e em ajuste de ponto). Enquanto estiver ligado,
        a etapa do gestor já nasce aprovada (`decisaoGestor.automatica = true` e `decididaPor` `null`; `gestorResponsavel` é o gestor
        ausente) e o pedido nasce `COM_O_RH`. **Ao ligar**, os
        pedidos de férias da equipe desse gestor que já esperavam a etapa dele (`COM_O_GESTOR`) têm essa etapa aprovada na hora e
        passam para `COM_O_RH`; os que estão em `SUGESTAO_DE_DATA` (a pessoa ainda não respondeu) **não** mudam. **Ao desligar**
        (ou na data de volta), só os pedidos novos voltam ao normal.

        **Se o setor ficar sem gestor ativo** (gestor desligado, ou setor sem gestor) **ou o gestor deixar o setor** (ou for trocado)
        enquanto um pedido espera o gestor (`COM_O_GESTOR`), o pedido passa para `COM_O_RH` sem etapa do gestor (`gestorResponsavel`
        vira `null`), para não ficar parado para sempre. Escolha de engenharia, igual à do ponto (fatia 3), a avisar o dono.

        **A `etapa` é fixada na criação e só avança** (a mesma regra do ponto, fatia 3). O pedido nasce em `GESTOR` ou em `RH`
        (pelas regras acima, olhando quem é o gestor **naquele momento**) e daí em diante só anda para frente: `GESTOR` para `RH`
        para `CONCLUIDA`, nunca volta. Por isso, **se o setor ganhar um gestor depois**, o pedido que nasceu em `RH` (`COM_O_RH`)
        **continua em `RH`**, com `gestorResponsavel` e `decisaoGestor` `null`: o novo gestor não o recebe, e só o RH o decide. As
        **únicas** passagens de `GESTOR` para `RH` sem decisão do gestor são as dos parágrafos acima (gestor ausente, e setor que
        fica sem gestor ativo ou gestor que deixa o setor). A resposta da pessoa à sugestão de data também só avança o pedido.
        Os pedidos de **benefício** (adesão, dependente e trajeto) não têm `etapa`: só o RH decide, e a regra não se aplica a eles.

        **Campos de qualquer pedido de férias** (para o front habilitar os botões sem adivinhar): `status` (o do banco:
        `SOLICITADA`, `APROVADA`, `REJEITADA`, `EM_GOZO`, `CONCLUIDA` ou `CANCELADA`; nunca renomeado), `etapa` (`GESTOR`, `RH` ou
        `CONCLUIDA`), `podeDecidir` (para quem está consultando; sempre falso em `/api/eu/...`) e `motivoNaoPodeDecidir` (texto em
        português quando `podeDecidir` é falso, em qualquer rota; `null` quando pode decidir; textos em `FeriasPedido`). **Além deles**,
        `situacao`, que só acrescenta o que `status` não distingue (`COM_O_GESTOR`, `SUGESTAO_DE_DATA`, `COM_O_RH`), e a **forma única
        da decisão de cada etapa**: `gestorResponsavel` (o gestor da etapa, `FuncionarioResumo`, ou `null`), `decisaoGestor` e
        `decisaoRh` (`DecisaoDeEtapa` da base; `null` enquanto a etapa não foi decidida). **Ao recusar, o motivo (5 a 500 caracteres)
        vai em `decisaoGestor.observacao` ou `decisaoRh.observacao` e a pessoa o vê.**

        **E-mail.** **Criar** o pedido não manda e-mail (a pessoa vê o pedido no histórico de `GET /api/eu/ferias`). Depois, a pessoa
        recebe **um e-mail a cada decisão** (lista fechada, `CONVENCOES.md`, seção 12): quando o gestor aprova, recusa ou sugere outra
        data, e quando o RH confirma ou recusa (as recusas levam o motivo). A aprovação automática do "gestor ausente" não é decisão de
        ninguém e **não** manda e-mail. O e-mail entra na **fila de e-mails**, tabela nova da aplicação (script `V001`).

        **Em qual período aquisitivo entra:** o servidor escolhe o período **mais antigo** que ainda tem saldo
        suficiente para os dias do pedido (gozo mais abono). Não há campo para escolher.

        **Regras** (todas conferidas aqui; a mesma conferência, sem gravar, sai em `POST /api/eu/ferias/conferencia`):
        - Cada parte tem de 5 a 30 dias corridos (`DURACAO_DA_PARTE`); no máximo 3 partes por período aquisitivo
          (`MAXIMO_DE_3_PARTES`); depois do pedido ainda precisa ser possível ter uma parte de pelo menos 14 dias
          (`PARTE_DE_14_DIAS`).
        - Cabe no que ainda se pode pedir do período: dias de gozo mais `diasAbono` não passam de `diasDisponiveis` menos
          `diasEmPedido` (`CABE_NO_SALDO`). Abono de 1 a 10 dias (`ABONO_ATE_10_DIAS`).
        - O início precisa ser pelo menos 30 dias depois de hoje (`ANTECEDENCIA_DE_30_DIAS`; só vale para o pedido
          da própria pessoa) e depois do fim do período aquisitivo.
        - Não começa nos 2 dias que antecedem um feriado ou o descanso semanal (`NAO_COMECA_PERTO_DE_FERIADO_OU_DESCANSO`).
        - Não se sobrepõe a outro pedido da mesma pessoa que esteja em andamento, aprovado ou em gozo (`SEM_SOBREPOSICAO`).

        Erros 422: `codigo` = `FERIAS_REGRAS_NAO_ATENDIDAS` (a lista `regras` diz quais), `FUNCIONARIO_INATIVO`
        ("Funcionario inativo nao pode solicitar ferias.", do trigger) e `FERIAS_SEM_PERIODO_AQUISITIVO` (ainda não
        completou um ano de casa).
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono (roadmap, fatia 7: partes, abono, 13º, antecedência de 30 dias, 2 dias antes de feriado). Se mudarem, mudam os códigos de FeriasRegraCodigo e as mensagens da conferência; a forma das rotas não muda."
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeriasPedirComando' }
            example:
              dataInicio: '2026-11-16'
              dataFim: '2026-11-30'
              abonoPecuniario: false
              diasAbono: 0
              adiantar13Salario: false
              mensagem: Queria emendar com o feriado de 20/11.
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeriasPedido' }
              example:
                id: 340
                funcionario: { id: 12, nome: Bruno Lima, cargo: Analista pleno, setor: Financeiro, ativo: true }
                periodoAquisitivo: { inicio: '2025-03-14', fim: '2026-03-13' }
                dataInicio: '2026-11-16'
                dataFim: '2026-11-30'
                dias: 15
                abonoPecuniario: false
                diasAbono: 0
                adiantar13Salario: false
                status: SOLICITADA
                etapa: GESTOR
                podeDecidir: false
                motivoNaoPodeDecidir: Aguardando a análise do gestor.
                situacao: COM_O_GESTOR
                solicitadaEmUtc: '2026-10-07T12:20:00Z'
                observacao: Queria emendar com o feriado de 20/11.
                gestorResponsavel: { id: 8, nome: Marina Costa, cargo: Gerente financeira, setor: Financeiro, ativo: true }
                decisaoGestor: null
                decisaoRh: null
                sugestao: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '422':
          description: O pedido não cumpre uma regra de férias ou do banco.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/FeriasProblemaDeRegra' }
              example:
                title: Pedido de férias recusado.
                status: 422
                detail: O pedido não cumpre uma ou mais regras de férias.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FERIAS_REGRAS_NAO_ATENDIDAS
                regras:
                  - { codigo: CABE_NO_SALDO, atendida: false, mensagem: 'Passa do saldo disponível: faltam 4 dias.' }
                  - { codigo: ANTECEDENCIA_DE_30_DIAS, atendida: true, mensagem: Começa daqui a mais de 30 dias. }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/ferias/conferencia:
    post:
      tags: [Férias]
      operationId: conferirPedidoDeFerias
      summary: Confere as regras de um pedido de férias sem gravar nada (a lista de "vistos" do painel).
      description: |
        Serve a lista de verificações e o texto "15 dias corridos. Sobram 3 dias." do painel "Pedir férias"
        (tela 35). O front chama esta rota a cada mudança de data ou de caixa e **não reimplementa nenhuma
        regra**. Sempre responde 200, mesmo com regra não atendida; quem barra é o `POST /api/eu/ferias`.
        Com `dataInicio` ou `dataFim` ainda vazios o front não chama.
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono; ver pedirFerias."
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeriasConferenciaComando' }
            example: { dataInicio: '2026-11-16', dataFim: '2026-11-30', abonoPecuniario: false, diasAbono: 0 }
      responses:
        '200':
          description: Resultado da conferência.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeriasConferencia' }
              example:
                totalDias: 15
                diasQueSobram: 3
                podeEnviar: true
                pagamentoAte: '2026-11-14'
                regras:
                  - { codigo: DURACAO_DA_PARTE, atendida: true, mensagem: A parte tem entre 5 e 30 dias. }
                  - { codigo: CABE_NO_SALDO, atendida: true, mensagem: Cabe no saldo disponível. }
                  - { codigo: PARTE_DE_14_DIAS, atendida: true, mensagem: Tem pelo menos 14 dias seguidos. }
                  - { codigo: MAXIMO_DE_3_PARTES, atendida: true, mensagem: É a 2ª parte do período. }
                  - { codigo: ANTECEDENCIA_DE_30_DIAS, atendida: true, mensagem: Começa daqui a mais de 30 dias. }
                  - { codigo: NAO_COMECA_PERTO_DE_FERIADO_OU_DESCANSO, atendida: true, mensagem: Não começa nos 2 dias antes de um feriado ou do fim de semana. }
                  - { codigo: SEM_SOBREPOSICAO, atendida: true, mensagem: Não coincide com outras férias suas. }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/ferias/{feriasId}/sugestao/aceitar:
    post:
      tags: [Férias]
      operationId: aceitarSugestaoDeDataDasFerias
      summary: Aceita as datas que o gestor sugeriu; o pedido segue para o RH confirmar.
      description: |
        Só vale para o pedido da própria pessoa na situação `SUGESTAO_DE_DATA` (`etapa: GESTOR`, esperando a resposta dela).
        As datas sugeridas passam a ser `dataInicio` e `dataFim` do pedido e o pedido vira `COM_O_RH` (`etapa: RH`). Ao aceitar, a etapa
        do gestor se encerra: `decisaoGestor` passa a `APROVADA` (com as datas sugeridas), `decididaPor` é o gestor que sugeriu e
        `decididaEmUtc` é o momento em que a pessoa aceitou (o banco guarda `RESULTADO_GESTOR = SUGERIU_DATA`, V001: a tradução é
        da API). Enquanto a pessoa não responde, `decisaoGestor` é `null` e quem sugeriu e quando estão em `sugestao.sugeridaPor` e
        `sugestao.sugeridaEmUtc`. As regras do pedido são conferidas de novo com as datas novas, **menos** a antecedência de 30 dias
        (a data foi escolhida pelo gestor); inclusive `CABE_NO_SALDO`, porque só agora os dias das datas sugeridas passam a ser
        reservados (422 se não couberem). No exemplo (o pedido 346 de Pedro Santos, admitido em 2022-08-08, com os períodos anteriores
        sem saldo), ele tem 30 dias disponíveis no período 2025-08-08 a 2026-08-07 e o pedido 345 reserva 15: sobram 15, e os 8 dias da
        sugestão cabem (é a 2ª parte do período, e não coincide com o 345). Não manda e-mail (a decisão é da própria pessoa).
        Pedido de outra pessoa: 404. Pedido que ainda não está esperando a resposta dela (por exemplo, ainda `COM_O_GESTOR` ou já
        `COM_O_RH`): 409 `PEDIDO_ETAPA_INCORRETA`; pedido que já terminou: 409 `PEDIDO_JA_DECIDIDO`.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - { name: feriasId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Sugestão aceita.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeriasPedido' }
              example:
                id: 346
                funcionario: { id: 24, nome: Pedro Santos, cargo: Vendedor, setor: Comercial, ativo: true }
                periodoAquisitivo: { inicio: '2025-08-08', fim: '2026-08-07' }
                dataInicio: '2027-01-11'
                dataFim: '2027-01-18'
                dias: 8
                abonoPecuniario: false
                diasAbono: 0
                adiantar13Salario: false
                status: SOLICITADA
                etapa: RH
                podeDecidir: false
                motivoNaoPodeDecidir: Aguardando a análise do RH.
                situacao: COM_O_RH
                solicitadaEmUtc: '2026-10-05T14:00:00Z'
                observacao: null
                gestorResponsavel: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                decisaoGestor: { decisao: APROVADA, decididaPor: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }, decididaEmUtc: '2026-10-07T12:42:00Z', automatica: false, observacao: null }
                decisaoRh: null
                sugestao:
                  dataInicio: '2027-01-11'
                  dataFim: '2027-01-18'
                  dias: 8
                  sugeridaPor: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                  sugeridaEmUtc: '2026-10-06T13:00:00Z'
                  respostaDaPessoa: ACEITOU
                  respondidaEmUtc: '2026-10-07T12:42:00Z'
                  expiraEm: '2026-10-11'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409FeriasPedido' }
        '422':
          description: As datas sugeridas não cumprem uma regra de férias.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/FeriasProblemaDeRegra' }
              example:
                title: Pedido de férias recusado.
                status: 422
                detail: O pedido não cumpre uma ou mais regras de férias.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FERIAS_REGRAS_NAO_ATENDIDAS
                regras:
                  - { codigo: SEM_SOBREPOSICAO, atendida: false, mensagem: Coincide com outras férias suas. }
        '500': { $ref: '#/components/responses/Erro500Interno' }

