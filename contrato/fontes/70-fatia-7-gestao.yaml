                  - { feriasId: 338, funcionario: { id: 25, nome: Fernanda Lopes, cargo: Executiva de contas, setor: Comercial, ativo: true }, dataInicio: '2026-11-09', dataFim: '2026-11-23', situacao: COM_O_RH }
