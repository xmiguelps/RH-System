      summary: O gestor aprova o pedido de férias da equipe (primeira etapa); o RH confirma depois.
      description: |
        O pedido passa para a etapa do RH: `situacao: COM_O_RH` e `etapa: RH` (o `status` do banco continua `SOLICITADA`: só muda na
        decisão final do RH); `decisaoGestor` passa a `APROVADA`. Só vale para pedido da equipe em `COM_O_GESTOR`. **Manda e-mail à
        pessoa** com o resultado (lista fechada, `CONVENCOES.md`, seção 12; o e-mail entra na fila de e-mails, tabela nova da
        aplicação, script `V001`).

