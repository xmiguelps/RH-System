  /api/eu/beneficios:
    get:
      tags: [Benefícios]
      operationId: obterMeusBeneficios
      summary: Mostra os benefícios da pessoa, os que ela pode pedir e os pedidos dela.
      description: |
        Serve a tela "Benefícios" do funcionário (tela 44). O **gestor usa a mesma rota** para os benefícios **dele**
        (a tela é a mesma, dentro do menu do gestor); o gestor **não** vê benefícios, dependentes nem trajeto da equipe.
        Dependentes e trajeto do vale-transporte (origem é, em geral, o endereço de casa) só o RH e a própria pessoa veem.

        - `beneficios`: os cartões de "Seus benefícios" (adesões ativas e aprovadas), com os dependentes aprovados e o
          trajeto em vigor. Os detalhes que o Figma mostra e o banco não tem (crédito todo dia 1º, operadora, desconto de 6%,
          "Desde 2022") **não existem no contrato**: o cartão mostra o nome e a descrição do catálogo.
          Os botões "Ver regras de uso", "Ver carteirinha" e "Ver beneficiários" ficam escondidos por falta de dado;
          "Ver beneficiários" pode abrir a lista `dependentes` do cartão.
        - `disponiveis`: itens **opcionais** do catálogo (`opcional` verdadeiro, marcado pelo RH em Cadastros > Benefícios, fatia 1)
          que a pessoa ainda não tem e não está pedindo ("Disponíveis para você"). O benefício que não é opcional o RH dá direto na
          ficha e não aparece aqui. Um pedido recusado ou cancelado volta para esta lista, com o motivo em `ultimoPedido`.
        - `aceitaDependentes` e `aceitaTrajeto` (nos cartões e em `disponiveis`) vêm do catálogo (fatia 1), campos que o RH marca em
          Cadastros > Benefícios: mostram o bloco de dependentes e os campos do trajeto.
        - `pedidos`: "Seus pedidos", do mais novo para o mais antigo: adesões, inclusões de dependente e atualizações de
          trajeto, com a situação. O RH responde em até 5 dias úteis (`respostaPrevistaAte`) e a pessoa vê a resposta aqui, **sem
          e-mail** (a lista de e-mails do sistema é fechada, `CONVENCOES.md`, seção 12).
        - `dependentesCadastrados`: dependentes já aprovados em qualquer benefício, sem repetir, para o modal
          "Quem vai entrar no plano" (a pessoa marca quem entra; "Você" aparece sempre marcado).

        **Depende do script SQL `V001`**: o catálogo `BENEFICIOS` tinha só nome e descrição, e o script acrescenta `OPCIONAL`,
        `ACEITA_DEPENDENTES` e `ACEITA_TRAJETO` (decisão do dono, 2026-10-30; as três nascem `FALSE`, e a API grava o valor do RH). O
        contrato já usa os três.

        Listas curtas, sem paginação.
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: Benefícios da pessoa logada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficioAdesaoEuResposta' }
              example:
                beneficios:
                  - adesaoId: 41
                    beneficio: { id: 1, nome: Vale-refeição, descricao: Crédito no cartão para refeições }
                    aceitaDependentes: false
                    aceitaTrajeto: false
                    inicioEm: null
                    autorizaDescontoEmFolha: false
                    dependentes: []
                    trajetoAtual: null
                  - adesaoId: 42
