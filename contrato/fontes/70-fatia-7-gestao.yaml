        que têm dependente ou trajeto `PENDENTE`. Ordem: pedido mais antigo primeiro. A resposta vale em até 5 dias úteis
        (`respostaPrevistaAte`). Pedidos pendentes de quem foi inativado são cancelados pela aplicação e saem da lista.

        Dado pessoal sensível: `trajetos[].origem` é, em geral, o endereço de casa (só o RH e a própria pessoa veem).
