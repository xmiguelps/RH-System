  /api/gestor/ferias/calendario:
    get:
      tags: [Férias]
      operationId: obterCalendarioDeFeriasDaEquipe
      summary: Mostra as férias da equipe semana a semana (aprovadas e esperando o gestor).
      description: |
        Serve o quadro "Férias da equipe" do painel da equipe (tela 51): uma linha por pessoa, uma barra por período
        de férias, colunas por semana. `semanas` traz a segunda-feira de cada coluna. Sem parâmetros, começa na segunda
        da semana atual e mostra 13 semanas. Entram os períodos que encostam na janela, nas situações
        `APROVADA` (confirmadas, em gozo ou concluídas), `COM_O_RH` (o gestor já aprovou, falta o RH; o Figma não
        desenha este caso, sugestão: mesma cor das aprovadas com borda tracejada) e `AGUARDANDO_VOCE` (esperam o gestor; barra tracejada).
        Pedido em `SUGESTAO_DE_DATA` (espera a pessoa; no exemplo, o 346 do Pedro Santos) não entra. Pessoas sem férias na
        janela não vêm na lista: o front lista as pessoas da equipe (`GET /api/gestor/equipe`, fatia 1) e
        desenha as barras por `funcionario.id`.
      x-perfis: [Gestor]
