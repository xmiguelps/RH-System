        aparecem aqui (ele vê os dele em `/api/eu/ferias`; pedido de gestor só o RH decide). Pedido que espera a resposta da pessoa
        a uma sugestão (como o 346 do Pedro Santos) só vem com `situacao=SUGESTAO_DE_DATA`.

