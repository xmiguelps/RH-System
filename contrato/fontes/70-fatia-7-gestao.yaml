                    trajetoAtual: { id: 5, origem: 'Rua das Acácias, 120, Vila Mariana, São Paulo', destino: 'Av. Paulista, 1000, São Paulo', linhasMeios: 'Ônibus 175T-10 e Metrô Linha 2', situacao: APROVADO, pedidoEmUtc: '2025-08-03T12:00:00Z', respondidoEmUtc: '2025-08-05T15:00:00Z', motivoRecusa: null }
                  - adesaoId: 40
                    beneficio: { id: 5, nome: Seguro de vida, descricao: 'Cobertura em caso de morte ou invalidez, paga pela empresa' }
                    aceitaDependentes: false
