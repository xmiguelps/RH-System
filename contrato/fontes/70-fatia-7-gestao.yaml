  /api/rh/ferias/{feriasId}/recusar:
    post:
      tags: [Férias]
      operationId: recusarFeriasComoRh
      summary: O RH recusa o pedido de férias (segunda etapa); o pedido termina.
      description: |
        O pedido vira `REJEITADA` (`etapa: CONCLUIDA`). Só vale com o pedido na etapa do RH (`COM_O_RH`), **inclusive no que o gestor
        já aprovou** (o RH pode recusar o que o gestor aprovou: decisão do dono, 2026-10-30). Mesmos erros e mesma regra de quem do
        RH pode decidir de `confirmarFeriasComoRh` (o banco exige o gestor gravado também na recusa). `decisaoRh` passa a `REJEITADA`. O
        corpo traz o **`motivo`, obrigatório (5 a 500 caracteres)**: ele vai em `decisaoRh.observacao` e **a pessoa o vê** (no histórico de
        `GET /api/eu/ferias` e no e-mail). O motivo mora numa **coluna nova de `FERIAS`**, `MOTIVO_RECUSA` (script `V001`, a mesma coluna da
        recusa do gestor: quem recusa é o gestor **ou** o RH, nunca os dois). **Manda e-mail à
        pessoa** com o resultado e o motivo (lista fechada, `CONVENCOES.md`, seção 12). Erros: os de `confirmarFeriasComoRh`, mais 400
