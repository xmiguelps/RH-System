    post:
      tags: [Férias]
      operationId: registrarFeriasPeloRh
      summary: O RH registra férias para uma pessoa; já nascem aprovadas.
      description: |
        Serve o modal "Registrar férias" (tela 06). É uma ação direta do RH: **não passa** pela etapa do gestor nem pela
        confirmação (dono, 2026-10-29); o pedido nasce `APROVADA` (`etapa: CONCLUIDA`), com `gestorResponsavel`, `decisaoGestor` e `decisaoRh` `null`.
        As férias aparecem na aba Férias e no ponto como dias de férias. Sem e-mail: não há aviso à pessoa nem ao gestor dela
        (lista fechada, `CONVENCOES.md`, seção 12), então a caixa "Avisar {nome} e o gestor por e-mail" do modal fica escondida.

        Regras: as mesmas do pedido da pessoa (ver `pedirFerias`), **menos a antecedência de 30 dias** (o RH pode
        registrar férias já combinadas, até no passado). Continuam valendo as do banco: início depois do fim do período
        aquisitivo, de 5 a 30 dias, abono de 1 a 10 dias, funcionário ativo. Erros 422: como em `pedirFerias`.
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono; ver pedirFerias."
      x-perfis: [RH]
      parameters:
        - { name: funcionarioId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeriasRegistrarComando' }
            example:
              dataInicio: '2026-12-07'
              dataFim: '2026-12-24'
