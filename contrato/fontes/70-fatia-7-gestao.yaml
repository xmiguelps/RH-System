      summary: Mostra o saldo, os períodos aquisitivos e os pedidos de férias de quem está logado.
      description: |
        Serve a tela de férias do funcionário (tela 34) e, sem mudança, a do gestor (tela 48): o gestor e o RH
        usam esta mesma rota para as férias **deles**.

        - `resumo`: os quatro números do topo da tela.
        - `periodosAquisitivos`: um por ano de casa, do mais antigo para o mais novo. O período em andamento
          (`EM_AQUISICAO`) mostra `mesesTrabalhados` e a data em que os 30 dias ficam disponíveis.
        - `historico`: todos os pedidos da pessoa, do mais novo para o mais antigo (inclui os que ainda esperam
          análise e os cancelados ou recusados). A lista é curta e vem sem paginação.
        - `gestorQueAnalisa`: quem faz a primeira etapa (texto "X analisa primeiro e depois o RH confirma").
          É `null` quando a pessoa é gestora (tem linha ativa em `GESTORES`), não tem gestor ativo ou tem o gestor
          desligado: nesse caso o pedido não tem etapa do gestor, só o RH decide, e o texto deve dizer "O RH analisa o pedido".

        Cada pedido do `historico` traz `status` (o do banco), `etapa`, `situacao`, `gestorResponsavel`, `decisaoGestor` e
        `decisaoRh`, como em `CONVENCOES.md`, seção 9 (ver `pedirFerias`). Nesta rota `podeDecidir` é sempre falso (a pessoa vê o
        próprio pedido e só responde à sugestão de outra data, em rotas próprias) e `motivoNaoPodeDecidir` diz onde o pedido está,
        com os mesmos textos da fatia 3 ("Aguardando a análise do gestor.", "Aguardando a análise do RH." ou "Este pedido já foi
        decidido."; ver `FeriasPedido`). O motivo de uma recusa vem em `decisaoGestor.observacao` ou `decisaoRh.observacao`: a
        pessoa o vê.

        Os dias dos pedidos que ainda esperam resposta (`diasEmPedido`: `COM_O_GESTOR` e `COM_O_RH`) ficam **reservados**: continuam
