# Fatia 7: gestão (férias, benefícios, pagamento e painéis).
# Convenções em contrato/CONVENCOES.md. Fonte de verdade dos campos: Banco de Dados/Scripts V001
# e as tabelas FERIAS, BENEFICIOS e BENEFICIOS_FUNCIONARIOS do script de tabelas do grupo. **Dependem de scripts SQL novos, já escritos
# em `Banco de Dados/Scripts`:** os campos `opcional`, `aceitaDependentes` e `aceitaTrajeto` do catálogo `BENEFICIOS` (`V001`; decisão do
# dono, 2026-10-30); a coluna do **motivo da recusa de férias** em `FERIAS` (`V001`, `MOTIVO_RECUSA`); `TREINAMENTOS.ENCERRADO_EM`
# (`V001`; painel do RH, "Treinamentos em andamento"); e as **tabelas novas da aplicação** de fila de e-mails (`V001`; e-mail de
# resultado do pedido de férias) e de auditoria (`V001`; `ultimasAlteracoes` do painel do RH).
tags:
  - name: Férias
    description: Saldo, pedido, aprovação em duas etapas (gestor e depois RH), calendário e registro pelo RH.
  - name: Benefícios
    description: Benefícios da pessoa, pedidos de adesão, dependentes, trajeto do vale-transporte e a resposta do RH.
  - name: Pagamento
    description: Dia do pagamento, exceções por mês e calendário de pagamento.
  - name: Painéis
    description: Telas iniciais do funcionário, do gestor e do RH, com os números e listas das fatias 3 a 7.

