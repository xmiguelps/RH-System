  /api/eu/beneficios-adesoes:
    post:
      tags: [Benefícios]
      operationId: pedirAdesaoABeneficio
      summary: Pede para aderir a um benefício, com quem entra, a data de início e a autorização de desconto.
      description: |
        Serve o painel "Aderir ao ..." (tela 45) e o botão "Pedir auxílio". Qualquer perfil pede para si.

        - `dependentes`: quem entra além da própria pessoa ("Você" entra sempre). Para reaproveitar um dependente já
          cadastrado, o front reenvia os dados dele (vêm em `dependentesCadastrados`). Cada dependente vira um pedido
          que o RH decide junto com a adesão. Só é aceito em benefício com `aceitaDependentes` (campo do catálogo, fatia 1).
        - `trajeto`: só para benefício com `aceitaTrajeto` (vale-transporte). Dado pessoal sensível: a origem costuma
          ser o endereço de casa; **fica fora do log de auditoria** (o log grava só que o trajeto mudou).
        - `autorizaDescontoEmFolha`: a caixa "Autorizo o desconto mensal em folha". É guardada como prova de
          consentimento. O catálogo **não marca** quais benefícios têm desconto em folha (decisão de engenharia já tomada): a caixa
          vale para qualquer benefício, a rota aceita `false` e o RH vê o valor ao analisar.
        - Se a pessoa já teve um pedido recusado ou cancelado deste benefício, o pedido novo **reabre a mesma adesão**
          (o banco só aceita uma por pessoa e benefício): volta a `PENDENTE`, a autorização anterior fica só no log de
          auditoria e a nova autorização é a do corpo.

        O pedido nasce `PENDENTE`. O RH responde em até 5 dias úteis (`respostaPrevistaAte`); a pessoa vê a resposta em "Seus pedidos",
        sem e-mail (lista fechada, `CONVENCOES.md`, seção 12). Só se pede benefício **opcional** (`opcional` do catálogo, fatia 1);
        os demais o RH dá direto na ficha.
        Erros: 404 (benefício não existe), 409 `BENEFICIO_JA_ATIVO_OU_PENDENTE` (a pessoa já tem o benefício ou já pediu),
        422 (`BENEFICIO_NAO_OPCIONAL`, `BENEFICIO_NAO_ACEITA_DEPENDENTES`, `BENEFICIO_NAO_ACEITA_TRAJETO`, `FUNCIONARIO_INATIVO`). Os
        códigos `BENEFICIO_*` são só dos benefícios: não se reaproveita `PEDIDO_JA_DECIDIDO`, que é de ponto e de férias.
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficioAdesaoPedirComando' }
            example:
              beneficioId: 3
              dataInicioDesejada: '2026-11-01'
              autorizaDescontoEmFolha: true
              dependentes:
                - { nome: Helena Lima, parentesco: FILHA, dataNascimento: '2019-05-21' }
              trajeto: null
      responses:
        '201':
          description: Pedido criado; espera a resposta do RH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficioAdesaoPedidoResumo' }
              example: { tipo: ADESAO, id: 44, adesaoId: 44, titulo: Adesão ao plano odontológico, pedidoEmUtc: '2026-10-07T12:41:00Z', situacao: PENDENTE, motivoRecusa: null, respostaPrevistaAte: '2026-10-15' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409BeneficioPedir' }
        '422': { $ref: '#/components/responses/Erro422BeneficioAdesao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/beneficios-adesoes/{adesaoId}/dependentes:
    post:
      tags: [Benefícios]
      operationId: pedirInclusaoDeDependente
      summary: Pede a inclusão de um dependente em um benefício que a pessoa já tem.
      description: |
        Aparece em "Seus pedidos" como "Inclusão de dependente no plano de saúde". Só vale para adesão **ativa e aprovada**
        da própria pessoa (outra pessoa ou adesão que não existe: 404; adesão pendente, recusada ou inativa: 409
        `BENEFICIO_ADESAO_NAO_ATIVA`) e para benefício com `aceitaDependentes` (campo do catálogo, fatia 1; senão 422
        `BENEFICIO_NAO_ACEITA_DEPENDENTES`). Nasce `PENDENTE`; o RH responde em até 5 dias úteis. Enquanto não for
        aprovado, o dependente não tem cobertura. Dependentes só são vistos pelo RH e pela própria pessoa.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - { name: adesaoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficioAdesaoDependenteComando' }
            example: { nome: Pedro Lima, parentesco: FILHO, dataNascimento: '2021-09-03' }
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficioAdesaoPedidoResumo' }
              example: { tipo: DEPENDENTE, id: 9, adesaoId: 42, titulo: Inclusão de dependente no plano de saúde, pedidoEmUtc: '2026-10-07T12:38:00Z', situacao: PENDENTE, motivoRecusa: null, respostaPrevistaAte: '2026-10-15' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409BeneficioAdesaoInativa' }
        '422': { $ref: '#/components/responses/Erro422BeneficioDependente' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/beneficios-adesoes/{adesaoId}/trajetos:
    post:
      tags: [Benefícios]
      operationId: pedirAtualizacaoDeTrajeto
      summary: Pede a atualização do trajeto do vale-transporte.
      description: |
        Serve o botão "Atualizar trajeto" (tela 44). Cada atualização é um **pedido novo**: o trajeto em vigor
        (`trajetoAtual`) continua valendo até o RH aprovar o novo. Aparece em "Seus pedidos" como "Atualização do
        trajeto do vale-transporte". Só vale para adesão **ativa e aprovada** da própria pessoa em benefício com
        `aceitaTrajeto` (campo do catálogo, fatia 1; erros como em `pedirInclusaoDeDependente`; benefício sem trajeto: 422 `BENEFICIO_NAO_ACEITA_TRAJETO`).

        **Dado pessoal sensível:** `origem` costuma ser o endereço de casa. Só o RH e a própria pessoa veem; o gestor
        não; o log de auditoria grava que o trajeto mudou, **sem** os valores.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - { name: adesaoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficioAdesaoTrajetoComando' }
            example: { origem: 'Rua das Acácias, 120, Vila Mariana, São Paulo', destino: 'Av. Paulista, 1000, São Paulo', linhasMeios: 'Metrô Linha 1 e Linha 2' }
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficioAdesaoPedidoResumo' }
              example: { tipo: TRAJETO, id: 6, adesaoId: 43, titulo: Atualização do trajeto do vale-transporte, pedidoEmUtc: '2026-10-07T12:39:00Z', situacao: PENDENTE, motivoRecusa: null, respostaPrevistaAte: '2026-10-15' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/Erro409BeneficioAdesaoInativa' }
        '422': { $ref: '#/components/responses/Erro422BeneficioTrajeto' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

