        Serve a lista de verificações, o total de dias e o aviso laranja "O pagamento das férias precisa sair até 2 dias
        antes do início, ou seja, até 05/12" do modal "Registrar férias" (tela 06): o aviso vem de `pagamentoAte`.
        Não confere a antecedência de 30 dias (o RH está isento). Sempre responde 200.
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono; ver pedirFerias."
