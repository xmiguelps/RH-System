  /api/rh/painel:
    get:
      tags: [Painéis]
      operationId: obterPainelDoRh
      summary: Traz o painel inicial do RH (pendências, próximos dias, treinamentos, presença agora e últimas alterações).
      description: |
        Serve a tela inicial do RH (tela 00). Só o RH. Os botões "Publicar aviso", "Adicionar colaborador" e a busca
        "Buscar colaborador" usam rotas de outras fatias (avisos e colaboradores). A saudação usa o nome de `/api/auth/eu`.

        - `totalPendencias`: o "Há 10 pedidos esperando revisão" do topo; é a soma das `quantidade` de `pendencias`.
        - `pendencias`: o bloco "Precisa da sua atenção". Só vêm os tipos com `quantidade` maior que zero. Contam o que o RH
          **já pode decidir** (`etapa: RH`: pedido de ajuste e de férias que o gestor já aprovou, que o "gestor ausente" aprovou ou
          que não têm etapa do gestor). **Admissão** conta só quem **começa em até 7 dias** e ainda não respondeu o formulário de admissão
          (Rafael Torres, 13/10; Tiago Nogueira e Aline Carvalho começam em 19/10 e ainda não contam). `resumo` é uma frase pronta. O botão "Revisar" de cada cartão leva à lista do tipo (ver
          `PainelPendenciaTipo`), e `funcionarioId` e `referenciaId` dizem qual item (o mais antigo) abrir; o link "Ver todas as
          pendências" usa `GET /api/rh/painel/pendencias`.
        - `proximosDias`: o bloco "Próximos dias": feriados (`/api/rh/ponto/feriados`, fatia 3) e aniversários (a API de
          aniversariantes é `GET /api/eu/aniversariantes`, da fatia 4; esta rota só consome), nos próximos 21 dias, em ordem
          de data, no máximo 8. **Não entram** "Fim do período de experiência" nem "Treinamento presencial": **cortados** (sem
          experiência e sem turmas presenciais, decisão do dono, 2026-10-28 e 2026-10-29); o Figma os desenha e o front os esconde.
        - `treinamentosEmAndamento`: treinamentos **publicados e já liberados** (a data de início, quando há, já chegou) que o RH
          não encerrou (`TREINAMENTOS.ENCERRADO_EM` vazio: **coluna nova**, script `V001`, fatia 6). **Sem prazo**
          (`CONVENCOES.md`, seção 13). Em ordem de liberação, do mais antigo para o mais novo, no máximo 5
          ("18 de 24 concluíram"; dados da fatia 6, `/api/rh/treinamentos`). O link "Gerenciar treinamentos" é da fatia 6.
        - `presencaAgora`: o cartão "Presença agora" (ver `PainelPresencaAgora`: `contagensHoje` é o `PresencaContagens` da base, por
          `SituacaoHoje`, e `diaUtil` fica ao lado). **Sem a linha "Folga ou compensação"** (decisão do dono, 2026-10-30). A legenda
          "Ainda não começou" (o Figma não tem esse rótulo) **só aparece se `aindaNaoComecou` for maior que zero**. Em dia sem
          expediente (`diaUtil` falso) o cartão mostra só "Hoje não há expediente" (e `trabalhando`, se alguém bateu entrada). O link
          "Ver quem está sem registro" usa `GET /api/rh/painel/presenca/sem-registro`.
        - `ultimasAlteracoes`: as 4 primeiras linhas de `GET /api/rh/auditoria?apenasAlteracoes=true` (fatia 1; o parâmetro tira do log
          as marcações de ponto, os downloads, os logins e os acessos negados, e **só** este painel o usa; esta rota não copia o schema da
          auditoria), do mais novo para o mais antigo, já em frase. O log é uma **tabela nova da aplicação** (script `V001`). O
          link "Abrir log de auditoria" é da fatia 1.
      x-provisorio: "Pedidos de benefício contam como pendência do RH (o Figma só desenha quatro tipos). Pergunta ao dono: o tipo BENEFICIOS fica na lista de pendências? Se não, ele sai de `pendencias`."
      x-perfis: [RH]
      responses:
        '200':
          description: Painel do RH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelRh' }
              example:
                totalPendencias: 10
                pendencias:
                  - tipo: AJUSTE_DE_PONTO
                    quantidade: 4
                    resumo: 'O mais antigo é de Bruno Lima: saída de 02/10 sem registro'
                    funcionarioId: 12
                    referenciaId: 301
                  - tipo: FERIAS
                    quantidade: 3
                    resumo: Um deles se sobrepõe a férias já aprovadas na equipe Comercial
                    funcionarioId: 25
                    referenciaId: 338
                  - tipo: ATESTADO
                    quantidade: 2
                    resumo: Enviados hoje por Carla Mendes e João Pedro Alves
                    funcionarioId: 4
                    referenciaId: 43
                  - tipo: ADMISSAO_COM_DOCUMENTOS_PENDENTES
                    quantidade: 1
                    resumo: Rafael Torres começa em 13/10 e ainda não enviou o formulário de admissão
                    funcionarioId: 104
                    referenciaId: 104
                proximosDias:
                  - { data: '2026-10-12', tipo: FERIADO, rotulo: Feriado nacional, titulo: Nossa Senhora Aparecida }
                  - { data: '2026-10-15', tipo: ANIVERSARIO, rotulo: Aniversário, titulo: 'Marina Costa, Financeiro' }
                  - { data: '2026-10-19', tipo: ANIVERSARIO, rotulo: Aniversário, titulo: 'Pedro Santos, Comercial' }
                  - { data: '2026-10-21', tipo: ANIVERSARIO, rotulo: Aniversário, titulo: 'Sofia Ramos, Recursos Humanos' }
                  - { data: '2026-10-28', tipo: FERIADO, rotulo: Feriado municipal, titulo: Dia de São Judas Tadeu }
                treinamentosEmAndamento:
                  - { treinamentoId: 1, titulo: Onboarding 2026, concluiram: 18, total: 24 }
                  - { treinamentoId: 2, titulo: LGPD na prática, concluiram: 63, total: 101 }
                  - { treinamentoId: 3, titulo: Segurança da informação, concluiram: 41, total: 101 }
                presencaAgora:
                  atualizadoEmUtc: '2026-10-07T12:42:00Z'
                  diaUtil: true
                  total: 101
                  contagensHoje: { trabalhando: 86, ferias: 6, atestado: 2, semRegistro: 7, aindaNaoComecou: 0, semExpediente: 0 }
                ultimasAlteracoes:
                  - { quandoUtc: '2026-10-07T12:41:44Z', autor: Ana Souza (RH), descricao: Importou 2 colaboradores da planilha novos-colaboradores-outubro-corrigido.xlsx }
                  - { quandoUtc: '2026-10-07T12:38:12Z', autor: Ana Souza (RH), descricao: Alterou o cargo de Bruno Lima de Analista para Analista pleno }
                  - { quandoUtc: '2026-10-07T12:12:03Z', autor: Sofia Ramos (RH), descricao: Criou o setor Compras }
                  - { quandoUtc: '2026-10-06T20:55:00Z', autor: Carlos Ribeiro (gestor), descricao: Aprovou as férias de Júlia Nunes de 03/11 a 17/11 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/painel/pendencias:
    get:
      tags: [Painéis]
      operationId: listarPendenciasDoRh
      summary: Lista, uma a uma, as pendências que esperam o RH (o link "Ver todas as pendências").
      description: |
        Só o RH. O Figma não desenha esta lista (o front monta uma lista simples). Cada item é uma pendência do RH, do mais
        antigo para o mais novo. Os tipos e o que cada `referenciaId` aponta estão em `PainelPendenciaTipo`. O botão "Revisar"
        de cada item abre a tela que decide aquele tipo (ajuste de ponto: `/api/rh/ponto/pedidos-de-ajuste`; atestado:
        `/api/rh/ponto/atestados`, ambos da fatia 3; férias: `/api/rh/ferias`; benefícios: `/api/rh/beneficios-adesoes`;
        admissão: a ficha da pessoa, fatia 1).
      x-provisorio: "Pedidos de benefício contam como pendência do RH (o Figma só desenha quatro tipos); ver obterPainelDoRh."
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - name: tipo
          in: query
          description: Só pendências deste tipo.
          schema: { $ref: '#/components/schemas/PainelPendenciaTipo' }
      responses:
        '200':
          description: Pendências do RH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelPendenciaLista' }
              example:
                pagina: 1
                tamanhoPagina: 2
                total: 10
                totalPaginas: 5
                itens:
                  - tipo: FERIAS
                    referenciaId: 338
                    funcionario: { id: 25, nome: Fernanda Lopes, cargo: Executiva de contas, setor: Comercial, ativo: true }
                    descricao: Pediu 15 dias, de 09/11 a 23/11
                    desdeEmUtc: '2026-09-29T12:00:00Z'
                  - tipo: AJUSTE_DE_PONTO
                    referenciaId: 301
                    funcionario: { id: 12, nome: Bruno Lima, cargo: Analista pleno, setor: Financeiro, ativo: true }
                    descricao: Saída de 02/10 sem registro
                    desdeEmUtc: '2026-10-05T13:00:00Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/painel/presenca/sem-registro:
    get:
      tags: [Painéis]
      operationId: listarPessoasSemRegistroHoje
      summary: Lista as pessoas sem registro de ponto hoje (o link "Ver quem está sem registro").
      description: |
        Só o RH. Lista as pessoas contadas em `semRegistro` de `presencaAgora.contagensHoje` (`SituacaoHoje` = `SEM_REGISTRO`: dia com expediente, sem
