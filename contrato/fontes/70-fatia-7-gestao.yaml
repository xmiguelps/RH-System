                  - { tipo: TRAJETO, id: 5, adesaoId: 43, titulo: Atualização do trajeto do vale-transporte, pedidoEmUtc: '2025-08-03T12:00:00Z', situacao: APROVADO, motivoRecusa: null, respostaPrevistaAte: '2025-08-08' }
                dependentesCadastrados:
