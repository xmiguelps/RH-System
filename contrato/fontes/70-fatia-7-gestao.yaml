  /api/eu/pagamento/proximo:
    get:
      tags: [Pagamento]
      operationId: obterProximoPagamento
      summary: Mostra a data do próximo pagamento e o mês a que ele se refere.
      description: |
        Serve o cartão "Próximo pagamento" de quatro telas: a tela inicial do funcionário (32) e a do gestor (46), e as telas de
        holerites do funcionário (36) e do gestor (49); e o link "Ver holerites". É a **única definição** do dado: `GET /api/eu/painel`
        (cartão da tela inicial) devolve o mesmo `PagamentoProximo`, e as telas de holerites (fatia 4) usam esta rota.
        Vale a data de hoje em diante (se hoje é o dia do pagamento, é hoje). A data sai da regra da empresa (o `diaPagamento`
        de `GET /api/eu/empresa`, fatia 1; ver também `GET /api/rh/pagamento/calendario`); uma exceção do mês vale mais
        que a regra. Empresa sem dia de pagamento configurado: `pagamento` e `competencia` vêm `null` e o cartão fica escondido.
        É o mesmo cálculo do campo `proximoPagamento` de `/api/rh/funcionarios/{funcionarioId}/indicadores` (fatia 1), que traz
        só a data.
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: Próximo pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoProximo' }
              example:
                pagamento: { ano: 2026, mes: 11, data: '2026-11-06', origem: REGRA, ajustes: [] }
                competencia: { ano: 2026, mes: 10 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/pagamento/excecoes:
    get:
      tags: [Pagamento]
      operationId: listarExcecoesDePagamento
      summary: Lista as exceções de pagamento (a data de um mês que foge da regra do dia).
      description: |
        Só o RH. O Figma não desenha a tela de pagamento; sugestão: uma seção "Pagamento" dentro de Cadastros (tela 29), com o
        campo "Dia do pagamento" (que é o `diaPagamento` de `PUT /api/rh/empresa`, da fatia 1: **a regra padrão é única para a
        empresa toda**) e esta lista de exceções, mais a prévia de `GET /api/rh/pagamento/calendario`.

        Regra do dia (aceita pelo dono em 2026-10-29): se o mês não tem o dia, vale o último dia do mês; se a data cai em fim
        de semana ou feriado (nacional, estadual da UF da empresa, municipal ou da empresa, da fatia 3), o pagamento
        **antecipa para o dia útil anterior**. A **exceção** vale mais que a regra e a data dela vale **como está**: não antecipa
        por fim de semana ou feriado (quem escolhe é o RH).

        Sem `ano`, traz as exceções do mês atual em diante. Com `ano`, as daquele ano. Ordem de data. Lista curta, sem paginação.
      x-perfis: [RH]
      parameters:
        - name: ano
          in: query
          description: Só as exceções deste ano. Padrão é do mês atual em diante.
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: Exceções de pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoExcecaoLista' }
              example:
                itens:
                  - { ano: 2026, mes: 12, dataPagamento: '2026-12-18' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/pagamento/calendario:
    get:
      tags: [Pagamento]
      operationId: obterCalendarioDePagamento
      summary: Mostra a data efetiva de pagamento dos 12 meses de um ano.
      description: |
        Só o RH. Aplica a regra do dia (`diaPagamento` de `GET /api/eu/empresa`, fatia 1) e as exceções de `GET /api/rh/pagamento/excecoes`.
        Serve a prévia da configuração de pagamento. É a mesma conta que o sistema faz quando o RH agenda um holerite como "publicar
        no dia do pagamento" (fatia 4, `noDiaDoPagamento`). Cada mês traz a data final, se veio da regra ou de uma exceção
        e os ajustes aplicados à regra (`ULTIMO_DIA_DO_MES`, `ANTECIPADO_FIM_DE_SEMANA`, `ANTECIPADO_FERIADO`; podem vir
        dois). Empresa sem dia de pagamento configurado e mês sem exceção: o mês não vem na lista.
      x-perfis: [RH]
      parameters:
        - name: ano
          in: query
          description: Ano do calendário. Padrão é o ano atual.
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: Calendário de pagamento do ano.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoCalendario' }
              example:
                ano: 2026
                meses:
                  - { ano: 2026, mes: 9, data: '2026-09-04', origem: REGRA, ajustes: [ANTECIPADO_FIM_DE_SEMANA] }
                  - { ano: 2026, mes: 10, data: '2026-10-06', origem: REGRA, ajustes: [] }
                  - { ano: 2026, mes: 11, data: '2026-11-06', origem: REGRA, ajustes: [] }
                  - { ano: 2026, mes: 12, data: '2026-12-18', origem: EXCECAO, ajustes: [] }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/pagamento/excecoes/{ano}/{mes}:
    put:
      tags: [Pagamento]
      operationId: definirExcecaoDePagamento
      summary: Cadastra (ou troca) a data de pagamento de um mês específico.
      description: |
        Só o RH. Uma exceção por mês e ano: se já existe, é substituída. Vale só para aquele mês de aquele ano (a de março de
        2027 não se repete em 2028). A data precisa cair dentro do mês da exceção (senão 400, mesma regra do banco).
        Funciona mesmo que a empresa ainda não tenha `diaPagamento`. A regra padrão (o dia do mês) **não** é editada aqui: é o campo `diaPagamento` de `PUT /api/rh/empresa` (fatia 1).
      x-perfis: [RH]
      parameters:
        - { name: ano, in: path, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 } }
        - { name: mes, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagamentoExcecaoComando' }
            example: { dataPagamento: '2026-12-18' }
      responses:
        '200':
          description: Exceção gravada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoExcecao' }
              example: { ano: 2026, mes: 12, dataPagamento: '2026-12-18' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

    delete:
      tags: [Pagamento]
      operationId: removerExcecaoDePagamento
      summary: Remove a exceção de pagamento de um mês; o mês volta a seguir a regra.
      description: 'Só o RH. Exceção que não existe: 404. Não afeta a regra padrão (`diaPagamento`, fatia 1).'
      x-perfis: [RH]
      parameters:
        - { name: ano, in: path, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 } }
        - { name: mes, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '204': { description: Exceção removida. }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/painel:
    get:
      tags: [Painéis]
      operationId: obterPainelDoFuncionario
      summary: Traz os cartões da tela inicial (funcionário e gestor) que são da gestão, ou seja, férias, pagamento e benefícios.
      description: |
        Serve a tela inicial do funcionário (tela 32) e a do gestor (tela 46), que são iguais, com o menu do gestor. A lista
        `beneficios` segue a ordem do catálogo (Vale-refeição, Plano de saúde, Vale-transporte e Seguro de vida, no exemplo).
        Esta rota traz **só** os cartões da fatia 7: "Férias disponíveis" (e o botão "Pedir férias"), "Próximo pagamento" (o mesmo
        `PagamentoProximo` de `GET /api/eu/pagamento/proximo`, referenciado e não repetido) e "Seus benefícios". Os outros cartões
        vêm das rotas das fatias dos respectivos assuntos, que o front chama em paralelo:
        "Seu ponto hoje" e o saldo do "Banco de horas" (`GET /api/eu/ponto/hoje`, fatia 3); o aviso "Seu pedido de ajuste da
        saída de 02/10 está em análise pelo RH" (`GET /api/eu/ponto/pedidos-de-ajuste`, fatia 3); "Avisos" (`GET /api/eu/avisos`,
        fatia 4); "Aniversariantes" (`GET /api/eu/aniversariantes`, fatia 4). Na tela do gestor, o aviso "Você tem 2 pedidos de
        ajuste de ponto do setor esperando sua análise" usa `pedidosDeAjusteDePonto` de `/api/gestor/contadores-do-menu`.
        A saudação ("Olá, Bruno") usa o nome de `/api/auth/eu`.
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: Cartões da tela inicial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelFuncionario' }
              example:
                ferias: { diasDisponiveis: 18, prazoParaTirarSaldo: '2027-03-13' }
                proximoPagamento:
                  pagamento: { ano: 2026, mes: 11, data: '2026-11-06', origem: REGRA, ajustes: [] }
                  competencia: { ano: 2026, mes: 10 }
                beneficios:
                  - { adesaoId: 41, nome: Vale-refeição, detalhe: null }
                  - { adesaoId: 42, nome: Plano de saúde, detalhe: Você e 1 dependente }
                  - { adesaoId: 43, nome: Vale-transporte, detalhe: Metrô Linha 1 e Linha 2 }
                  - { adesaoId: 40, nome: Seguro de vida, detalhe: null }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/contadores-do-menu:
    get:
      tags: [Painéis]
      operationId: obterContadoresDoMenuDoFuncionario
      summary: Traz os números das bolinhas do menu (avisos não lidos, formulários pendentes e documentos pedidos pelo RH).
      description: |
        Serve as bolinhas do menu em todas as telas do funcionário e do gestor ("Avisos 2", "Formulários 1"). Leve: o front
        chama de tempos em tempos (por exemplo, a cada navegação). `avisosNaoLidos` é o mesmo número de `contagens.naoLidos` de
        `GET /api/eu/avisos` (fatia 4) e `formulariosPendentes` o de `contagens.paraResponder` de `GET /api/eu/formularios`
        (fatia 5); esta rota só os entrega sem a lista. `documentosPendentes` são os documentos que o **RH pediu e a pessoa ainda não
        enviou** (os itens `PENDENTE` de `GET /api/eu/documentos`, fatia 1): é a bolinha do item "Meus documentos" do menu, e é **a**
        forma de a pessoa saber que o RH pediu um documento (não há e-mail de pedido nem de lembrete de documento, `CONVENCOES.md`,
        seção 12). O que o gestor tem a mais está em `/api/gestor/contadores-do-menu`.
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: Contadores do menu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelContadoresFuncionario' }
              example: { avisosNaoLidos: 2, formulariosPendentes: 1, documentosPendentes: 1 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/gestor/contadores-do-menu:
    get:
      tags: [Painéis]
      operationId: obterContadoresDoMenuDoGestor
      summary: Traz os números do menu do gestor (pendências da equipe e pedidos de ajuste de ponto).
      description: |
        Serve a bolinha "Painel da equipe" do menu do gestor (tela 46 e seguintes) e o aviso "Você tem N pedidos de ajuste de
        ponto do setor esperando sua análise" da tela inicial.
        `pendenciasDaEquipe` = pedidos de férias `COM_O_GESTOR` (`etapa: GESTOR` que ele pode decidir agora; os em
        `SUGESTAO_DE_DATA` esperam a pessoa e não contam: no exemplo, o 346 do Pedro Santos fica de fora) mais pedidos de ajuste de
        ponto na etapa do gestor.
        `pedidosDeAjusteDePonto` = só os de ajuste de ponto (o mesmo `resumo.comGestor` de
        `GET /api/gestor/ponto/pedidos-de-ajuste`, fatia 3).
        Esta rota só traz as bolinhas do menu: o tamanho da equipe e quem está trabalhando, de férias ou sem registro **não** vêm
        daqui, e sim de `GET /api/gestor/equipe` (fatia 1: `total` e `contagensHoje`).
      x-perfis: [Gestor]
      responses:
        '200':
          description: Contadores do menu do gestor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelContadoresGestor' }
              example: { pendenciasDaEquipe: 3, pedidosDeAjusteDePonto: 2 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/contadores-do-menu:
    get:
      tags: [Painéis]
      operationId: obterContadoresDoMenuDoRh
      summary: Traz o número da bolinha "Ponto e feriados" do menu do RH.
      description: |
        Serve a bolinha "Ponto e feriados 4" do menu do RH (tela 00 e seguintes). `pedidosDeAjusteDePonto` = pedidos de
        ajuste que o RH já pode decidir (`etapa: RH`: o gestor já aprovou, o "gestor ausente" aprovou, ou o pedido não tem etapa do
        gestor): os `PENDENTE` na etapa do RH de `GET /api/rh/ponto/pedidos-de-ajuste` (fatia 3). É o mesmo número do cartão "Pedidos de
        ajuste de ponto" do painel do RH (`pendencias` de `GET /api/rh/painel`).
      x-perfis: [RH]
      responses:
        '200':
          description: Contadores do menu do RH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelContadoresRh' }
              example: { pedidosDeAjusteDePonto: 4 }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/gestor/painel:
    get:
      tags: [Painéis]
      operationId: obterPainelDaEquipe
      summary: Traz o painel da equipe do gestor (hoje, pedidos esperando aprovação e a tabela de pessoas).
      description: |
        Serve o "Painel da equipe" (tela 51). Só o perfil Gestor, sobre a equipe dele: as pessoas **ativas** do setor de que ele é o
        gestor (**um gestor responde por um setor**), **sem ele mesmo** (a mesma equipe de `GET /api/gestor/equipe`, fatia 1, e de
        `GET /api/gestor/ponto/equipe`, fatia 3). O quadro "Férias da equipe" vem de `GET /api/gestor/ferias/calendario`.

        - **O quadro "Hoje: 6 trabalhando, 1 de férias, 1 sem registro" não vem desta rota**: são as `contagensHoje` de
          `GET /api/gestor/equipe` (fatia 1), a definição única por `SituacaoHoje`, que o front chama em paralelo. Quem está sem
          registro aparece na tabela `pessoas` (`pontoHoje.situacaoHoje` = `SEM_REGISTRO`). O botão **"Lembrar Diego por e-mail"
          fica escondido** (decisão do dono, 2026-10-30): não existe e-mail de lembrete (lista fechada, `CONVENCOES.md`, seção 12)
          nem rota.
        - `aguardandoAprovacao`: os cartões "Esperando sua aprovação". Férias: os mesmos itens de `GET /api/gestor/ferias`
          (os botões Aprovar, "Sugerir outra data" e, se o front o mostrar, Recusar, que pede o motivo, chamam as rotas de férias do
          gestor desta fatia; `podeDecidir` diz se habilitam). Pedido do próprio gestor ou de outro gestor não aparece (só o RH
          decide). Ajustes de ponto: o
          resumo; os botões Aprovar e Recusar chamam `POST /api/gestor/ponto/pedidos-de-ajuste/{pedidoId}/aprovar` e
          `.../recusar` (fatia 3) com o `pedidoId`.
        - `avaliacao`: o botão "Avaliar a equipe (ciclo 2026.2)", que abre a avaliação `GESTOR_AVALIA_EQUIPE` aberta (fatia 5,
          o mesmo item "Sua parte" de `GET /api/eu/formularios`); `null` quando não há ciclo aberto para o gestor (o botão e a
          coluna "Avaliação" somem).
        - `pessoas`: a tabela "Pessoas da equipe", em ordem alfabética do nome; sem paginação (equipe de um setor). A coluna "Férias
          disponíveis" é `diasDisponiveis` de `GET /api/gestor/equipe/{funcionarioId}/ferias` (os dias em pedido ficam dentro dele). O botão
          "Abrir ficha" abre `/api/gestor/equipe/{funcionarioId}` (fatia 1). Se o gestor não tem setor, `setor` vem `null`,
          `totalPessoas` é 0 e as listas vêm vazias.
        - **Sem o botão "Baixar espelho do setor"** (tela 54, decisão do dono, 2026-10-30).

        Dados que o gestor **não** recebe aqui: CPF, endereço, holerite, documentos e a origem do trajeto de vale-transporte.
      x-perfis: [Gestor]
      responses:
        '200':
          description: Painel da equipe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PainelGestor' }
              example:
                setor: { id: 1, nome: Comercial }
                totalPessoas: 8
                aguardandoAprovacao:
