        `PEDIDO_ETAPA_INCORRETA` (o pedido não está com o gestor: já está com o RH, ou espera a resposta da pessoa a uma sugestão de
        data); 409 `PEDIDO_JA_DECIDIDO` (o pedido já terminou). Aqui não há `PEDIDO_PROPRIO` (422): ele só existe onde o trigger do
        banco recusa, na decisão do RH.
