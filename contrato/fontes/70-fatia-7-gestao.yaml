        Só o perfil Gestor, sobre a equipe dele (as pessoas ativas do setor de que ele é o gestor, sem ele mesmo: a mesma equipe de
        `GET /api/gestor/equipe`, fatia 1). Alimenta o bloco "Esperando sua aprovação" do painel da equipe (tela 51) e qualquer
        lista de pedidos. Sem `situacao`, devolve só os que estão `COM_O_GESTOR` (`etapa: GESTOR`, com `podeDecidir` verdadeiro).
