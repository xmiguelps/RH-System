components:
  responses:
    Erro409FeriasPedido:
      description: O pedido de férias não está na etapa de quem decide (`PEDIDO_ETAPA_INCORRETA`) ou já terminou (`PEDIDO_JA_DECIDIDO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            etapaIncorreta:
              summary: Decisão fora da vez
              value:
                title: Pedido na etapa errada.
                status: 409
                detail: Este pedido ainda não chegou à sua etapa ou já passou por ela.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_ETAPA_INCORRETA
            jaDecidido:
              summary: Pedido que já terminou
              value:
                title: Pedido já decidido.
                status: 409
                detail: Este pedido já foi decidido.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_JA_DECIDIDO
    Erro409BeneficioPedir:
      description: 'A pessoa já tem o benefício ou já pediu a adesão (`BENEFICIO_JA_ATIVO_OU_PENDENTE`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: Você já pediu este benefício.
            status: 409
            detail: Você já tem este benefício ou já pediu a adesão e o RH ainda vai responder.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: BENEFICIO_JA_ATIVO_OU_PENDENTE
    Erro409BeneficioAdesaoInativa:
      description: 'A adesão não está ativa: pendente, recusada ou inativa (`BENEFICIO_ADESAO_NAO_ATIVA`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: A adesão não está ativa.
            status: 409
            detail: Este benefício ainda não está ativo para a pessoa; o pedido só vale em adesão aprovada.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: BENEFICIO_ADESAO_NAO_ATIVA
    Erro409BeneficioPedidoDecidido:
      description: 'O pedido de adesão já foi respondido (`BENEFICIO_PEDIDO_JA_DECIDIDO`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: Pedido de benefício já respondido.
            status: 409
            detail: Este pedido de benefício já foi aprovado, recusado ou cancelado.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: BENEFICIO_PEDIDO_JA_DECIDIDO
    Erro409BeneficioDecisao:
      description: 'O RH decidiu fora da vez: a adesão não está ativa (`BENEFICIO_ADESAO_NAO_ATIVA`) ou o dependente ou trajeto já foi respondido (`BENEFICIO_PEDIDO_JA_DECIDIDO`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            adesaoNaoAtiva:
              summary: 'A adesão não está ativa (pendente, recusada ou inativa)'
              value:
                title: A adesão não está ativa.
                status: 409
                detail: Este benefício ainda não está ativo para a pessoa; o pedido só vale em adesão aprovada.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_ADESAO_NAO_ATIVA
            pedidoJaDecidido:
              summary: 'O pedido já foi respondido pelo RH'
              value:
                title: Pedido de benefício já respondido.
                status: 409
                detail: Este pedido de benefício já foi aprovado, recusado ou cancelado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_PEDIDO_JA_DECIDIDO
    Erro422BeneficioAdesao:
      description: 'O pedido de adesão fere uma regra do catálogo ou a pessoa está inativa.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            naoOpcional:
              summary: 'O benefício não é opcional'
              value:
                title: Este benefício não se pede.
                status: 422
                detail: 'Este benefício não é opcional: o RH o concede direto na ficha.'
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_NAO_OPCIONAL
            naoAceitaDependentes:
              summary: 'O benefício não aceita dependentes'
              value:
                title: Este benefício não aceita dependentes.
                status: 422
                detail: Este benefício não permite incluir dependentes.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_NAO_ACEITA_DEPENDENTES
            naoAceitaTrajeto:
              summary: 'O benefício não tem trajeto'
              value:
                title: Este benefício não tem trajeto.
                status: 422
                detail: Só o vale-transporte tem trajeto.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_NAO_ACEITA_TRAJETO
            funcionarioInativo:
              summary: 'A pessoa está inativa'
              value:
                title: Operação recusada.
                status: 422
                detail: Não é possível pedir nem ativar benefício para uma pessoa inativa.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_INATIVO
    Erro422BeneficioDependente:
      description: 'O benefício não aceita dependentes ou a pessoa está inativa.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            naoAceitaDependentes:
              summary: 'O benefício não aceita dependentes'
              value:
                title: Este benefício não aceita dependentes.
                status: 422
                detail: Este benefício não permite incluir dependentes.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_NAO_ACEITA_DEPENDENTES
            funcionarioInativo:
              summary: 'A pessoa está inativa'
              value:
                title: Operação recusada.
                status: 422
                detail: Não é possível pedir nem ativar benefício para uma pessoa inativa.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_INATIVO
    Erro422BeneficioTrajeto:
      description: 'O benefício não tem trajeto ou a pessoa está inativa.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            naoAceitaTrajeto:
              summary: 'O benefício não tem trajeto'
              value:
                title: Este benefício não tem trajeto.
                status: 422
                detail: Só o vale-transporte tem trajeto.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: BENEFICIO_NAO_ACEITA_TRAJETO
            funcionarioInativo:
              summary: 'A pessoa está inativa'
              value:
                title: Operação recusada.
                status: 422
                detail: Não é possível pedir nem ativar benefício para uma pessoa inativa.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FUNCIONARIO_INATIVO
    Erro422BeneficioAprovacao:
      description: 'A pessoa da adesão está inativa; o RH não pode aprová-la.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Operação recusada.
            status: 422
            detail: Não é possível ativar benefício para uma pessoa inativa.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: FUNCIONARIO_INATIVO
    Erro422FeriasDecisaoRh:
      description: |
        O RH não pode decidir este pedido de férias: ele é da própria pessoa que decidiria e ela é gestora (`PEDIDO_PROPRIO`), ou o
        pedido não tem etapa do gestor e quem decide não está em `GESTORES` (`PEDIDO_RH_FORA_DE_GESTORES`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            pedidoProprio:
              summary: Quem decidiria é a dona do pedido (e é gestora)
              value:
                title: Você não pode decidir o próprio pedido.
                status: 422
                detail: A operação foi recusada por uma regra do banco de dados.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_PROPRIO
                regraDoBanco: O gestor nao pode analisar as proprias ferias.
            foraDeGestores:
              summary: Pedido sem etapa do gestor e quem decide não está em Gestores
              value:
                title: Quem decide precisa ser gestor também.
                status: 422
                detail: Este pedido não tem etapa do gestor. Para decidi-lo, você precisa estar cadastrado também como gestor.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_RH_FORA_DE_GESTORES
                regraDoBanco: Informe o gestor responsavel pela analise das ferias.
  schemas:
    # ------------------------------------------------------------------
    # Férias
    # ------------------------------------------------------------------
    FeriasStatus:
      type: string
      description: |
        Status do pedido de férias, **igual ao do banco** (`FERIAS.STATUS_FERIAS`; nunca renomeado: a recusa é `REJEITADA`).
        `SOLICITADA` enquanto o pedido passa pelas duas etapas; só muda na decisão final do RH (`APROVADA` ou `REJEITADA`) ou no
        cancelamento. `EM_GOZO` e `CONCLUIDA` são postos pelo agendador nas datas.
      enum: [SOLICITADA, APROVADA, REJEITADA, EM_GOZO, CONCLUIDA, CANCELADA]
    FeriasSituacao:
      type: string
      description: |
        Situação de um pedido de férias, já pronta para o front. É um campo **extra**: `status` e `etapa` vêm sempre junto
        (`CONVENCOES.md`, seção 9). Vem do `STATUS_FERIAS` do banco mais as colunas da etapa do gestor (V001) e da sugestão de data
        (V001):

        - `COM_O_GESTOR`: `SOLICITADA`, `etapa: GESTOR`, esperando o gestor.
        - `SUGESTAO_DE_DATA`: `SOLICITADA`, `etapa: GESTOR`; o gestor sugeriu outras datas e a pessoa ainda não respondeu (ninguém
          decide até ela responder).
        - `COM_O_RH`: `SOLICITADA`, `etapa: RH`; o gestor já aprovou (ou aceitou-se a sugestão, ou o "gestor ausente" aprovou), ou
          o pedido é de quem é gestor, de quem não tem gestor ativo ou de quem tem o gestor desligado. Falta o RH.
        - `APROVADA`, `EM_GOZO`, `CONCLUIDA`: como no banco (`etapa: CONCLUIDA`). `EM_GOZO` e `CONCLUIDA` são postos pelo
          agendador nas datas.
        - `REJEITADA`: `REJEITADA` (pelo gestor ou pelo RH, nunca "recusada"; veja `decisaoGestor` e `decisaoRh`).
        - `CANCELADA`: `CANCELADA` (sugestão recusada ou expirada, início vencido sem decisão, funcionário inativado).
      enum: [COM_O_GESTOR, SUGESTAO_DE_DATA, COM_O_RH, APROVADA, EM_GOZO, CONCLUIDA, REJEITADA, CANCELADA]

    FeriasRegraCodigo:
      type: string
      description: |
        Regras de férias conferidas pela API (spec, seção 13.3; roadmap, fatia 7). O front mostra a lista que a API devolve e não
        reimplementa nada.

        - `DURACAO_DA_PARTE`: cada parte de 5 a 30 dias corridos (banco).
        - `CABE_NO_SALDO`: dias de gozo mais dias de abono cabem no que ainda se pode pedir do período aquisitivo (`diasDisponiveis`
          menos `diasEmPedido`).
        - `PARTE_DE_14_DIAS`: depois deste pedido ainda precisa ser possível ter uma parte de pelo menos 14 dias no período
          (CLT: uma parte de 14 dias e as outras de pelo menos 5).
        - `MAXIMO_DE_3_PARTES`: no máximo 3 partes por período aquisitivo.
        - `ABONO_ATE_10_DIAS`: abono de 1 a 10 dias (banco).
        - `ANTECEDENCIA_DE_30_DIAS`: o início é pelo menos 30 dias depois de hoje (só no pedido da própria pessoa).
        - `NAO_COMECA_PERTO_DE_FERIADO_OU_DESCANSO`: não começa nos 2 dias que antecedem um feriado ou o descanso semanal.
        - `SEM_SOBREPOSICAO`: não coincide com outro pedido da mesma pessoa em andamento, aprovado ou em gozo.
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono (roadmap, fatia 7)."
      enum:
        - DURACAO_DA_PARTE
        - CABE_NO_SALDO
        - PARTE_DE_14_DIAS
        - MAXIMO_DE_3_PARTES
        - ABONO_ATE_10_DIAS
        - ANTECEDENCIA_DE_30_DIAS
        - NAO_COMECA_PERTO_DE_FERIADO_OU_DESCANSO
        - SEM_SOBREPOSICAO

    FeriasRegraConferida:
      type: object
      description: Uma verificação da lista de "vistos" do pedido de férias.
      required: [codigo, atendida, mensagem]
      properties:
        codigo: { $ref: '#/components/schemas/FeriasRegraCodigo' }
        atendida: { type: boolean }
        mensagem:
          type: string
          description: Texto pronto em português, no estado atual (atendida ou não). O Figma mostra o atendido com um visto.

    FeriasPeriodoDatas:
      type: object
      required: [inicio, fim]
      properties:
        inicio: { type: string, format: date }
        fim: { type: string, format: date }

    FeriasConferenciaComando:
      type: object
      description: Dados que alimentam a conferência de um pedido ou registro de férias.
      required: [dataInicio, dataFim]
      properties:
        dataInicio: { type: string, format: date, description: 'Primeiro dia das férias.' }
        dataFim: { type: string, format: date, description: 'Último dia das férias (não pode ser antes do primeiro).' }
        abonoPecuniario:
          type: boolean
          default: false
          description: A caixa "Vender parte das férias (abono de até 10 dias)".
        diasAbono:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: |
            Quantos dias são vendidos. **0** quando `abonoPecuniario` é falso, de **1 a 10** quando é verdadeiro (regra do banco).
            O Figma desenha só a caixa; o front mostra um campo numérico "Quantos dias" quando a caixa está marcada.
          x-provisorio: "O Figma não tem o campo de quantos dias vender (só a caixa), mas o banco exige de 1 a 10. Se o dono preferir um valor fixo (por exemplo, 10), o campo some e o contrato muda."

    FeriasPedirComando:
      description: Corpo do pedido de férias da própria pessoa.
      allOf:
        - $ref: '#/components/schemas/FeriasConferenciaComando'
        - type: object
          properties:
            adiantar13Salario:
              type: boolean
              default: false
              description: A caixa "Adiantar a 1ª parcela do 13º salário".
            mensagem:
              type: [string, 'null']
              maxLength: 500
              description: A "Mensagem para {gestor} (opcional)". Fica guardada na observação do pedido (texto, nunca HTML).

    FeriasRegistrarComando:
      description: Corpo do registro de férias feito pelo RH (modal da tela 06).
      allOf:
        - $ref: '#/components/schemas/FeriasConferenciaComando'
        - type: object
          properties:
            adiantar13Salario:
              type: boolean
              default: false
              description: A caixa "Adiantar a 1ª parcela do 13º salário".
            observacao:
              type: [string, 'null']
              maxLength: 500
              description: A "Observação (opcional)" do modal (texto, nunca HTML).

    FeriasConferencia:
      type: object
      description: Resultado da conferência de um pedido ou registro de férias, sem gravar nada.
      required: [totalDias, diasQueSobram, podeEnviar, pagamentoAte, regras]
      properties:
        totalDias:
          type: integer
          description: Dias corridos de gozo, contando o primeiro e o último ("15 dias corridos").
        diasQueSobram:
          type: integer
          description: O que ainda se pode pedir do período escolhido (`diasDisponiveis` menos `diasEmPedido`) menos gozo e abono. Negativo quando passa ("Sobram 3 dias").
        podeEnviar:
          type: boolean
          description: Verdadeiro quando nenhuma regra falha. O botão "Enviar pedido" (ou "Registrar férias") só habilita assim.
        pagamentoAte:
          type: [string, 'null']
          format: date
          description: Data limite para o pagamento das férias (2 dias corridos antes do início). `null` com datas inválidas. O aviso só aparece no modal do RH.
        regras:
          type: array
          items: { $ref: '#/components/schemas/FeriasRegraConferida' }
      x-provisorio: "Regras de férias do protótipo ainda a confirmar com o dono (roadmap, fatia 7)."

    FeriasPeriodoAquisitivo:
      type: object
      description: Um ano de casa (da admissão), com os dias de férias a que dá direito.
      required: [inicio, fim, situacao, diasDeDireito, diasTirados, diasEmPedido, diasDisponiveis, prazoParaTirar, mesesTrabalhados, disponivelAPartirDe]
      properties:
        inicio: { type: string, format: date }
        fim: { type: string, format: date }
        situacao:
          type: string
          description: |
            `EM_AQUISICAO`: o ano ainda não fechou (nenhum dia disponível). `COM_SALDO`: fechou e sobram dias.
            `SEM_SALDO`: fechou e os 30 dias foram usados.
          enum: [EM_AQUISICAO, COM_SALDO, SEM_SALDO]
        diasDeDireito: { type: integer, description: '30 por período aquisitivo.' }
        diasTirados:
          type: integer
          description: Dias de gozo mais abono dos pedidos `APROVADA`, `EM_GOZO` e `CONCLUIDA`.
        diasEmPedido:
          type: integer
          description: |
            Dias de gozo mais abono dos pedidos que esperam resposta (`COM_O_GESTOR` e `COM_O_RH`). Ficam **reservados**: continuam
            dentro de `diasDisponiveis`, e o que ainda se pode pedir é `diasDisponiveis` menos `diasEmPedido` (é o que a regra
            `CABE_NO_SALDO` confere). Pedido em `SUGESTAO_DE_DATA` não reserva: as datas pedidas foram devolvidas pelo gestor e a reserva
            das datas sugeridas só vale quando a pessoa aceita.
        diasDisponiveis: { type: integer, description: 'Direito menos tirados (inclui os dias reservados em pedido, ver `diasEmPedido`); 0 enquanto `EM_AQUISICAO`.' }
        prazoParaTirar: { type: string, format: date, description: '12 meses depois do fim do período aquisitivo ("Tire até 13/03/2027").' }
        mesesTrabalhados:
          type: [integer, 'null']
          description: Só em `EM_AQUISICAO` ("7 de 12 meses trabalhados").
        disponivelAPartirDe:
          type: [string, 'null']
          format: date
          description: 'Só em `EM_AQUISICAO`: o dia seguinte ao fim do período ("ficam disponíveis a partir de 14/03/2027").'

    FeriasProximas:
      type: object
      required: [dataInicio, dataFim, dias]
      properties:
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        dias: { type: integer }

    FeriasResumo:
      type: object
      description: Os números do topo da tela de férias e da aba Férias da ficha.
      required: [diasDisponiveis, periodoDoSaldo, prazoParaTirarSaldo, periodoAquisitivoAtual, proximasFerias, pedidosEmAnalise]
      properties:
        diasDisponiveis: { type: integer, description: 'Soma dos dias disponíveis de todos os períodos fechados. É o número de "Férias disponíveis" de todas as telas (inclusive feriasDisponiveisDias dos indicadores da fatia 1).' }
        periodoDoSaldo:
          description: O período fechado **mais antigo** que ainda tem saldo ("Do período 2025 a 2026"). `null` sem saldo.
          oneOf:
            - $ref: '#/components/schemas/FeriasPeriodoDatas'
            - { type: 'null' }
        prazoParaTirarSaldo:
          type: [string, 'null']
          format: date
          description: O `prazoParaTirar` do período do saldo; `null` sem saldo.
        periodoAquisitivoAtual:
          description: O período `EM_AQUISICAO`. `null` quando a pessoa foi desligada ou não tem período em andamento.
          oneOf:
            - $ref: '#/components/schemas/FeriasPeriodoDatas'
            - { type: 'null' }
        proximasFerias:
          description: As próximas férias `APROVADA` que ainda não começaram; `null` ("Nenhuma, nada agendado ainda").
          oneOf:
            - $ref: '#/components/schemas/FeriasProximas'
            - { type: 'null' }
        pedidosEmAnalise: { type: integer, description: 'Pedidos `COM_O_GESTOR`, `SUGESTAO_DE_DATA` ou `COM_O_RH`.' }

    FeriasSugestao:
      type: object
      description: A sugestão de outras datas feita pelo gestor.
      required: [dataInicio, dataFim, dias, sugeridaPor, sugeridaEmUtc, respostaDaPessoa, respondidaEmUtc, expiraEm]
      properties:
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        dias: { type: integer }
        sugeridaPor: { $ref: '#/components/schemas/FuncionarioResumo', description: 'O gestor que sugeriu (`funcionarioId`).' }
        sugeridaEmUtc: { type: string, format: date-time, description: 'Quando o gestor sugeriu.' }
        respostaDaPessoa:
          type: [string, 'null']
          description: '`null` enquanto espera a resposta. `EXPIROU` é posto pelo agendador.'
          enum: [ACEITOU, RECUSOU, EXPIROU, null]
        respondidaEmUtc: { type: [string, 'null'], format: date-time }
        expiraEm:
          type: string
          format: date
          description: Último dia para a pessoa responder.
          x-provisorio: "Prazo da sugestão sem resposta ('expira depois de um tempo', dono, 2026-10-29). Proposta do roadmap: 5 dias corridos depois da sugestão ou 2 dias antes da data sugerida, o que vier primeiro. Se mudar, muda só este valor."

    FeriasPedido:
      type: object
      description: |
        Um pedido (ou registro) de férias, no modelo único de aprovação em duas etapas (`CONVENCOES.md`, seção 9): `status` do banco,
        `etapa`, `podeDecidir` e `motivoNaoPodeDecidir`, e mais `situacao` como campo **extra** (nunca no lugar dos outros). A decisão de
        cada etapa tem a forma única da seção 9: `gestorResponsavel`, `decisaoGestor` e `decisaoRh`. Ver `pedirFerias`.
      required: [id, funcionario, periodoAquisitivo, dataInicio, dataFim, dias, abonoPecuniario, diasAbono, adiantar13Salario, status, etapa, podeDecidir, motivoNaoPodeDecidir, situacao, solicitadaEmUtc, observacao, gestorResponsavel, decisaoGestor, decisaoRh, sugestao]
      properties:
        id: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        periodoAquisitivo: { $ref: '#/components/schemas/FeriasPeriodoDatas' }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        dias: { type: integer, description: 'Dias corridos de gozo, contando o primeiro e o último.' }
        abonoPecuniario: { type: boolean }
        diasAbono: { type: integer, minimum: 0, maximum: 10 }
        adiantar13Salario: { type: boolean }
        status: { $ref: '#/components/schemas/FeriasStatus' }
        etapa:
          description: 'Onde o pedido está (`EtapaDoPedido` da base). É **fixada na criação** (nasce em `GESTOR` ou em `RH`) e **só avança**: se o setor ganhar um gestor depois, o pedido que nasceu em `RH` continua em `RH` (ver `pedirFerias`).'
          $ref: '#/components/schemas/EtapaDoPedido'
        podeDecidir:
          type: boolean
          description: |
            Para **quem está consultando**: `true` quando pode decidir **agora** (o gestor da equipe na etapa `GESTOR`, em
            `COM_O_GESTOR`; o RH na etapa `RH`, salvo o que `confirmarFeriasComoRh` explica sobre o pedido sem etapa do gestor e o
            próprio pedido). Sempre `false` em `/api/eu/...` e nos pedidos que já terminaram.
        motivoNaoPodeDecidir:
          type: [string, 'null']
          description: |
            Texto pronto em português para mostrar junto do botão desabilitado; `null` quando `podeDecidir` é `true`. Vale em qualquer
            rota, inclusive `/api/eu/...` (onde `podeDecidir` é sempre `false`). **Os cinco textos fixos são os da fatia 3** (pedido de
            ajuste de ponto), os mesmos nas duas fatias:
            - etapa `GESTOR`, para o RH ou para a própria pessoa: "Aguardando a análise do gestor.";
            - etapa `RH`, para o gestor ou para a própria pessoa: "Aguardando a análise do RH.";
            - etapa `CONCLUIDA`: "Este pedido já foi decidido.";
            - etapa `RH` sem etapa do gestor, para quem do RH não está em `GESTORES`: "Este pedido não passa pelo gestor e o banco exige
              que quem decide também esteja cadastrado como gestor. Peça a outra pessoa do RH.";
            - etapa `RH` sem etapa do gestor, para a própria pessoa do pedido (que é gestor): "Você não pode decidir o seu próprio
              pedido." (vale antes do texto anterior).

            Só as férias têm um sexto texto, para `SUGESTAO_DE_DATA` (etapa `GESTOR`; quem decide é a própria pessoa, que responde pelas
            rotas de sugestão): "Esperando a resposta de {nome} à sugestão de outra data." (`{nome}` é quem pediu).
        situacao: { $ref: '#/components/schemas/FeriasSituacao' }
        solicitadaEmUtc: { type: string, format: date-time, description: 'A coluna "Pedido em" do histórico.' }
        observacao:
          type: [string, 'null']
          description: A mensagem da pessoa (ou a observação do RH no registro). Texto, nunca HTML.
        gestorResponsavel:
          description: |
            O gestor da etapa: enquanto o pedido espera, o gestor atual do setor; depois, o que analisou ou, na aprovação automática, o
            gestor ausente. `null` nos pedidos **sem etapa do gestor** (de quem é gestor, de setor sem gestor ativo ou de gestor
            desligado, e quando o gestor sai do setor com o pedido parado) e nos registrados direto pelo RH. O `id` é o `funcionarioId`.
          oneOf:
            - $ref: '#/components/schemas/FuncionarioResumo'
            - { type: 'null' }
        decisaoGestor:
          description: |
            A decisão da etapa do gestor (`DecisaoDeEtapa` da base); `null` enquanto ele não decidiu, nos pedidos sem etapa do gestor
            e em `SUGESTAO_DE_DATA` (a sugestão está em `sugestao`; depois que a pessoa aceita, vira `APROVADA`; se ela recusa ou a
            sugestão expira, continua `null` e o pedido é `CANCELADA`). Ao recusar, o `observacao` traz o motivo (obrigatório, 5 a 500
            caracteres). Do banco (V001): `RESULTADO_GESTOR` `APROVOU` vira `APROVADA`, `RECUSOU` vira `REJEITADA` e
            `SUGERIU_DATA` só vira `APROVADA` quando a pessoa aceita (`decididaEmUtc` é então a data da resposta dela).
          oneOf:
            - $ref: '#/components/schemas/DecisaoDeEtapa'
            - { type: 'null' }
        decisaoRh:
          description: |
            A decisão da etapa do RH (`DecisaoDeEtapa` da base); `null` enquanto o RH não decidiu (e quando o gestor recusou). Quem do
            RH decidiu está em `decididaPor`. Ao recusar, o `observacao` traz o motivo (obrigatório, 5 a 500 caracteres). O banco não
            tem coluna da decisão do RH: `APROVADA` é o pedido `APROVADA` e `REJEITADA` é o pedido `REJEITADA` com
            `ID_FUNCIONARIO_RH` preenchido (inclusive o que o gestor tinha aprovado).
          oneOf:
            - $ref: '#/components/schemas/DecisaoDeEtapa'
            - { type: 'null' }
        sugestao:
          oneOf:
            - $ref: '#/components/schemas/FeriasSugestao'
            - { type: 'null' }

    FeriasConflito:
      type: object
      description: Férias já aprovadas de outra pessoa do mesmo setor que coincidem com as datas pedidas.
      required: [funcionario, dataInicio, dataFim, diasEmComum]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        diasEmComum: { type: integer, description: 'Dias corridos em que as duas férias coincidem.' }

    FeriasPedidoAnalise:
      description: Um pedido de férias para o gestor ou o RH analisar, com o contexto da equipe.
      allOf:
        - $ref: '#/components/schemas/FeriasPedido'
        - type: object
          required: [conflitos, equipeDisponivel]
          properties:
            conflitos:
              type: array
              items: { $ref: '#/components/schemas/FeriasConflito' }
              description: Vazio quando não há coincidência (ou quando o pedido já foi decidido).
            equipeDisponivel:
              type: [integer, 'null']
              description: Pessoas do setor que ficam trabalhando no período (sem contar quem pede nem quem tem férias aprovadas). `null` quando a pessoa não tem setor.

    FeriasListaAnalise:
      description: Lista paginada de pedidos de férias para análise.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/FeriasPedidoAnalise' }

    FeriasEuResposta:
      type: object
      required: [resumo, gestorQueAnalisa, periodosAquisitivos, historico]
      properties:
        resumo: { $ref: '#/components/schemas/FeriasResumo' }
        gestorQueAnalisa:
          description: Quem faz a primeira etapa; `null` quando só o RH decide.
          oneOf:
            - $ref: '#/components/schemas/FuncionarioResumo'
            - { type: 'null' }
        periodosAquisitivos:
          type: array
          items: { $ref: '#/components/schemas/FeriasPeriodoAquisitivo' }
        historico:
          type: array
          items: { $ref: '#/components/schemas/FeriasPedido' }

    FeriasFicha:
      type: object
      description: Aba Férias da ficha de uma pessoa (do RH ou do gestor).
      required: [funcionario, resumo, periodosAquisitivos, ferias]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        resumo: { $ref: '#/components/schemas/FeriasResumo' }
        periodosAquisitivos:
          type: array
          items: { $ref: '#/components/schemas/FeriasPeriodoAquisitivo' }
        ferias:
          type: array
          items: { $ref: '#/components/schemas/FeriasPedido' }

    FeriasSugerirComando:
      type: object
      required: [dataInicio, dataFim]
      properties:
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }

    FeriasRecusarComando:
      type: object
      description: Corpo da recusa de um pedido de férias, pelo gestor ou pelo RH.
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 500
          description: |
            Obrigatório. Vai em `decisaoGestor.observacao` ou `decisaoRh.observacao` e **a pessoa o vê** (no histórico e no e-mail de
            resultado). Texto, nunca HTML. Coluna nova de `FERIAS`, `MOTIVO_RECUSA` (script `V001`): o banco confere que a recusa
            tem motivo e que ele não é vazio; os 5 a 500 caracteres são conferidos pela API.

    FeriasCalendarioItem:
      type: object
      required: [feriasId, funcionario, dataInicio, dataFim, situacao]
      properties:
        feriasId: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        situacao:
          type: string
          description: |
            `APROVADA`: confirmada pelo RH (inclui em gozo e concluída). `COM_O_RH`: o gestor já aprovou, falta o RH.
            `AGUARDANDO_VOCE`: espera a decisão do gestor (barra tracejada, "Aguardando você").
          enum: [APROVADA, COM_O_RH, AGUARDANDO_VOCE]

    FeriasCalendario:
      type: object
      required: [inicio, fim, semanas, itens]
      properties:
        inicio: { type: string, format: date, description: 'Segunda-feira da primeira semana.' }
        fim: { type: string, format: date, description: 'Domingo da última semana.' }
        semanas:
          type: array
          items: { type: string, format: date }
          description: A segunda-feira de cada coluna.
        itens:
          type: array
          items: { $ref: '#/components/schemas/FeriasCalendarioItem' }

    FeriasProblemaDeRegra:
      description: |
        Erro 422 de férias. `codigo` é `FERIAS_REGRAS_NAO_ATENDIDAS` (veja `regras`), `FUNCIONARIO_INATIVO`,
        `FERIAS_SEM_PERIODO_AQUISITIVO`, `PEDIDO_PROPRIO` ou `PEDIDO_RH_FORA_DE_GESTORES`. `regras` só vem com o primeiro.
      allOf:
        - $ref: '#/components/schemas/ProblemaDeRegraDeNegocio'
        - type: object
          properties:
            regras:
              type: array
              items: { $ref: '#/components/schemas/FeriasRegraConferida' }

    # ------------------------------------------------------------------
    # Benefícios
    # ------------------------------------------------------------------
    BeneficioAdesaoSituacao:
      type: string
      description: |
        Situação de uma adesão, de um dependente ou de um trajeto (mesmos valores nas três tabelas). `PENDENTE`: espera o RH.
        `APROVADO`. `RECUSADO` (sempre com motivo). `CANCELADO` (pedido substituído, ou cancelado pela aplicação porque a pessoa
        foi inativada ou a adesão foi recusada).
      enum: [PENDENTE, APROVADO, RECUSADO, CANCELADO]

    BeneficioAdesaoBeneficio:
      type: object
      description: Item do catálogo de benefícios (a gestão do catálogo é da fatia 1, `/api/rh/beneficios`).
      required: [id, nome, descricao]
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: [string, 'null'] }

    BeneficioAdesaoDependenteComando:
      type: object
      description: 'Dados de um dependente (aprovados pelo dono em 2026-10-29: nome, parentesco e data de nascimento).'
      required: [nome, parentesco, dataNascimento]
      properties:
        nome: { type: string, minLength: 1, maxLength: 150 }
        parentesco:
          type: string
          minLength: 1
          maxLength: 30
          description: Texto livre por enquanto (o banco não limita). Os exemplos usam FILHO, FILHA e CONJUGE.
          x-provisorio: "Os valores de parentesco ainda não foram decididos (V001: texto livre). Se o dono fechar uma lista (filho, cônjuge...), vira enum e o front mostra um seletor."
        dataNascimento: { type: string, format: date, description: 'Não pode ser futura.' }

    BeneficioAdesaoDependente:
      type: object
      description: Dependente ligado a uma adesão. Só o RH e a própria pessoa veem.
      required: [id, nome, parentesco, dataNascimento, situacao, pedidoEmUtc, respondidoEmUtc, motivoRecusa]
      properties:
        id: { type: integer }
        nome: { type: string }
        parentesco: { type: string }
        dataNascimento: { type: string, format: date }
        situacao: { $ref: '#/components/schemas/BeneficioAdesaoSituacao' }
        pedidoEmUtc: { type: string, format: date-time }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }
        motivoRecusa: { type: [string, 'null'] }

    BeneficioAdesaoTrajetoComando:
      type: object
      description: Trajeto do vale-transporte (origem, destino e linhas ou meios, aprovados pelo dono em 2026-10-29). Dado pessoal sensível.
      required: [origem, destino, linhasMeios]
      properties:
        origem:
          type: string
          minLength: 1
          maxLength: 200
          description: Em geral o endereço de casa. Fora do log de auditoria.
        destino: { type: string, minLength: 1, maxLength: 200 }
        linhasMeios: { type: string, minLength: 1, maxLength: 255, description: 'Linhas ou meios de transporte (por exemplo, "Ônibus 175T-10 e Metrô Linha 2").' }

    BeneficioAdesaoTrajeto:
      type: object
      description: Trajeto do vale-transporte ligado a uma adesão. Só o RH e a própria pessoa veem; o gestor nunca.
      required: [id, origem, destino, linhasMeios, situacao, pedidoEmUtc, respondidoEmUtc, motivoRecusa]
      properties:
        id: { type: integer }
        origem: { type: string }
        destino: { type: string }
        linhasMeios: { type: string }
        situacao: { $ref: '#/components/schemas/BeneficioAdesaoSituacao' }
        pedidoEmUtc: { type: string, format: date-time }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }
        motivoRecusa: { type: [string, 'null'] }

    BeneficioAdesaoCartao:
      type: object
      description: Um cartão de "Seus benefícios" (adesão ativa e aprovada).
      required: [adesaoId, beneficio, aceitaDependentes, aceitaTrajeto, inicioEm, autorizaDescontoEmFolha, dependentes, trajetoAtual]
      properties:
        adesaoId: { type: integer }
        beneficio: { $ref: '#/components/schemas/BeneficioAdesaoBeneficio' }
        aceitaDependentes:
          type: boolean
          description: Mostra a ação de incluir dependente. Vem do catálogo (`aceitaDependentes`, marcado pelo RH em Cadastros > Benefícios, fatia 1).
        aceitaTrajeto:
          type: boolean
          description: Mostra o trajeto e o botão "Atualizar trajeto" (vale-transporte). Vem do catálogo (`aceitaTrajeto`, fatia 1).
        inicioEm:
          type: [string, 'null']
          format: date
          description: A data de início pedida na adesão; `null` quando o RH deu o benefício direto.
        autorizaDescontoEmFolha: { type: boolean }
        dependentes:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoDependente' }
          description: Só os `APROVADO` ("Você e 1 dependente"). Os pendentes aparecem em `pedidos`.
        trajetoAtual:
          description: O trajeto `APROVADO` mais recente; `null` se não houver.
          oneOf:
            - $ref: '#/components/schemas/BeneficioAdesaoTrajeto'
            - { type: 'null' }

    BeneficioAdesaoUltimoPedido:
      type: object
      description: O pedido anterior recusado ou cancelado do mesmo benefício.
      required: [situacao, motivoRecusa, respondidoEmUtc]
      properties:
        situacao: { type: string, enum: [RECUSADO, CANCELADO] }
        motivoRecusa: { type: [string, 'null'] }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }

    BeneficioAdesaoDisponivel:
      type: object
      description: Item **opcional** do catálogo (`opcional` verdadeiro, fatia 1) que a pessoa ainda não tem e não está pedindo ("Disponíveis para você").
      required: [beneficio, aceitaDependentes, aceitaTrajeto, ultimoPedido]
      properties:
        beneficio: { $ref: '#/components/schemas/BeneficioAdesaoBeneficio' }
        aceitaDependentes: { type: boolean, description: 'Mostra o bloco "Quem vai entrar no plano". Vem do catálogo (fatia 1).' }
        aceitaTrajeto: { type: boolean, description: 'Mostra os campos do trajeto no pedido. Vem do catálogo (fatia 1).' }
        ultimoPedido:
          oneOf:
            - $ref: '#/components/schemas/BeneficioAdesaoUltimoPedido'
            - { type: 'null' }

    BeneficioAdesaoPedidoResumo:
      type: object
      description: Uma linha de "Seus pedidos" (adesão, inclusão de dependente ou atualização de trajeto).
      required: [tipo, id, adesaoId, titulo, pedidoEmUtc, situacao, motivoRecusa, respostaPrevistaAte]
      properties:
        tipo: { type: string, enum: [ADESAO, DEPENDENTE, TRAJETO] }
        id:
          type: integer
          description: O id da adesão (`ADESAO`), do dependente (`DEPENDENTE`) ou do trajeto (`TRAJETO`).
        adesaoId: { type: integer }
        titulo:
          type: string
          description: 'Texto pronto: "Adesão ao plano odontológico", "Inclusão de dependente no plano de saúde", "Atualização do trajeto do vale-transporte".'
        pedidoEmUtc: { type: string, format: date-time }
        situacao: { $ref: '#/components/schemas/BeneficioAdesaoSituacao' }
        motivoRecusa: { type: [string, 'null'] }
        respostaPrevistaAte:
          type: string
          format: date
          description: 5 dias úteis depois do pedido (contando feriados do calendário da empresa).

    BeneficioAdesaoEuResposta:
      type: object
      required: [beneficios, disponiveis, pedidos, dependentesCadastrados]
      properties:
        beneficios:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoCartao' }
        disponiveis:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoDisponivel' }
        pedidos:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoPedidoResumo' }
        dependentesCadastrados:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoDependenteComando' }

    BeneficioAdesaoPedirComando:
      type: object
      required: [beneficioId, dataInicioDesejada, autorizaDescontoEmFolha]
      properties:
        beneficioId: { type: integer }
        dataInicioDesejada: { type: string, format: date, description: 'O campo "Começar em". Não pode ser anterior a hoje.' }
        autorizaDescontoEmFolha:
          type: boolean
          description: 'A caixa "Autorizo o desconto mensal em folha".'
        dependentes:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/BeneficioAdesaoDependenteComando' }
          description: Quem entra além da própria pessoa. Padrão vazio.
        trajeto:
          description: Só para benefício com `aceitaTrajeto`. Dado pessoal sensível.
          oneOf:
            - $ref: '#/components/schemas/BeneficioAdesaoTrajetoComando'
            - { type: 'null' }

    BeneficioAdesaoRecusarComando:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
          description: Obrigatório (o banco recusa recusa sem motivo). A pessoa o vê. Texto, nunca HTML.

    BeneficioAdesaoRh:
      type: object
      description: Uma adesão, com os dependentes e os trajetos dela, para o RH analisar. Contém dado pessoal (dependentes e endereço de casa).
      required: [adesaoId, funcionario, beneficio, situacao, pedidoEmUtc, respostaPrevistaAte, dataInicioDesejada, autorizaDescontoEmFolha, respondidoPor, respondidoEmUtc, motivoRecusa, dependentes, trajetos]
      properties:
        adesaoId: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        beneficio: { $ref: '#/components/schemas/BeneficioAdesaoBeneficio' }
        situacao: { $ref: '#/components/schemas/BeneficioAdesaoSituacao' }
        pedidoEmUtc:
          type: [string, 'null']
          format: date-time
          description: '`null` quando o RH deu o benefício direto (sem pedido).'
        respostaPrevistaAte: { type: [string, 'null'], format: date }
        dataInicioDesejada: { type: [string, 'null'], format: date }
        autorizaDescontoEmFolha: { type: boolean }
        respondidoPor:
          oneOf:
            - $ref: '#/components/schemas/FuncionarioResumo'
            - { type: 'null' }
        respondidoEmUtc: { type: [string, 'null'], format: date-time }
        motivoRecusa: { type: [string, 'null'] }
        dependentes:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoDependente' }
        trajetos:
          type: array
          items: { $ref: '#/components/schemas/BeneficioAdesaoTrajeto' }

    BeneficioAdesaoRhLista:
      description: Lista paginada de adesões para o RH.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/BeneficioAdesaoRh' }

    # ------------------------------------------------------------------
    # Pagamento
    # ------------------------------------------------------------------
    PagamentoData:
      type: object
      description: A data efetiva de pagamento de um mês.
      required: [ano, mes, data, origem, ajustes]
      properties:
        ano: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }
        data: { type: string, format: date }
        origem:
          type: string
          description: '`EXCECAO`: o RH cadastrou a data deste mês. `REGRA`: veio do dia padrão.'
          enum: [REGRA, EXCECAO]
        ajustes:
          type: array
          description: |
            Só na `REGRA`. `ULTIMO_DIA_DO_MES`: o mês não tem o dia da regra. `ANTECIPADO_FIM_DE_SEMANA` e `ANTECIPADO_FERIADO`:
            a data caiu num fim de semana ou feriado e foi para o dia útil anterior. Vazio na `EXCECAO`.
          items:
            type: string
            enum: [ULTIMO_DIA_DO_MES, ANTECIPADO_FIM_DE_SEMANA, ANTECIPADO_FERIADO]

    PagamentoCompetencia:
      type: object
      required: [ano, mes]
      properties:
        ano: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }

    PagamentoProximo:
      type: object
      description: A data do próximo pagamento e o mês a que ele se refere. **Definição única**, usada por `GET /api/eu/pagamento/proximo` e por `GET /api/eu/painel` (o campo `proximoPagamento` a referencia, não a repete).
      required: [pagamento, competencia]
      properties:
        pagamento:
          description: '`null` quando a empresa não tem dia de pagamento configurado nem exceção.'
          oneOf:
            - $ref: '#/components/schemas/PagamentoData'
            - { type: 'null' }
        competencia:
          description: 'O mês do holerite ("Holerite de outubro"): **sempre o mês anterior ao do pagamento** (pagamento de 06/11, competência outubro; escolha de engenharia já tomada).'
          oneOf:
            - $ref: '#/components/schemas/PagamentoCompetencia'
            - { type: 'null' }

    PagamentoExcecao:
      type: object
      required: [ano, mes, dataPagamento]
      properties:
        ano: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }
        dataPagamento: { type: string, format: date }

    PagamentoExcecaoComando:
      type: object
      required: [dataPagamento]
      properties:
        dataPagamento: { type: string, format: date, description: 'Precisa cair dentro do ano e do mês da rota.' }

    PagamentoExcecaoLista:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/PagamentoExcecao' }

    PagamentoCalendario:
      type: object
      required: [ano, meses]
      properties:
        ano: { type: integer }
        meses:
          type: array
          items: { $ref: '#/components/schemas/PagamentoData' }

    # ------------------------------------------------------------------
    # Painéis
    # ------------------------------------------------------------------
    PainelPendenciaTipo:
      type: string
      description: |
        Tipo de pendência do RH e o que `referenciaId` aponta:

        - `AJUSTE_DE_PONTO`: id do pedido de ajuste (fatia 3) na etapa do RH (`etapa: RH`: o gestor já aprovou, o "gestor ausente" aprovou, ou o pedido não tem etapa do gestor). "Revisar" abre o modal de pedidos de ajuste de "Ponto e feriados" (`GET /api/rh/ponto/pedidos-de-ajuste`).
        - `FERIAS`: id do pedido de férias na etapa do RH (`COM_O_RH`, `etapa: RH`). "Revisar" abre `/api/rh/ferias`.
        - `ATESTADO`: id do atestado `ENVIADO` (fatia 3). "Revisar" abre a lista de atestados do RH (`GET /api/rh/ponto/atestados`, fatia 3).
        - `ADMISSAO_COM_DOCUMENTOS_PENDENTES`: `funcionarioId` de pessoa **em admissão** que **começa em até 7 dias** e ainda não
          respondeu o formulário de admissão (fatia 5). Quem começa mais adiante ainda não conta. "Revisar" abre a ficha. O
          `desdeEmUtc` deste tipo tem regra própria (ver `PainelPendenciaItem`).
        - `BENEFICIOS`: id da adesão com pedido `PENDENTE` (da adesão, de dependente ou de trajeto). "Revisar" abre `/api/rh/beneficios-adesoes`.
      x-provisorio: "`BENEFICIOS` não é um dos quatro tipos que o Figma desenha na tela 00; foi acrescentado para o RH ter por onde responder os pedidos de benefício (em até 5 dias úteis)."
      enum: [AJUSTE_DE_PONTO, FERIAS, ATESTADO, ADMISSAO_COM_DOCUMENTOS_PENDENTES, BENEFICIOS]

    PainelPendenciaResumo:
      type: object
      description: Um cartão do bloco "Precisa da sua atenção". O botão "Revisar" abre a tela do tipo; `funcionarioId` e `referenciaId` dizem **qual** item abrir (o mais antigo da fila, o que o `resumo` cita).
      required: [tipo, quantidade, resumo, funcionarioId, referenciaId]
      properties:
        tipo: { $ref: '#/components/schemas/PainelPendenciaTipo' }
        quantidade: { type: integer, minimum: 1 }
        resumo:
          type: [string, 'null']
          description: Frase pronta do cartão, por exemplo "O mais antigo é de Bruno Lima... ".
        funcionarioId:
          type: integer
          description: A pessoa do item mais antigo. Em `ADMISSAO_COM_DOCUMENTOS_PENDENTES` é a ficha que o "Revisar" abre.
        referenciaId:
          type: integer
          description: 'O mesmo `referenciaId` de `PainelPendenciaItem` (ver `PainelPendenciaTipo`), do item mais antigo: o pedido, o atestado ou a adesão que o "Revisar" destaca na lista do tipo. Em `ADMISSAO_COM_DOCUMENTOS_PENDENTES` é o próprio `funcionarioId`.'

    PainelPendenciaItem:
      type: object
      required: [tipo, referenciaId, funcionario, descricao, desdeEmUtc]
      properties:
        tipo: { $ref: '#/components/schemas/PainelPendenciaTipo' }
        referenciaId: { type: integer, description: 'Ver `PainelPendenciaTipo`.' }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        descricao: { type: string, description: 'Frase curta pronta ("Saída de 02/10 sem registro").' }
        desdeEmUtc:
          type: string
          format: date-time
          description: |
            Desde quando espera o RH.
            **Exceção, `ADMISSAO_COM_DOCUMENTOS_PENDENTES`:** não há instante guardado para ela. Li a tabela `FUNCIONARIOS`
            (`CREATE TABLE` do grupo, já com as colunas acrescentadas depois, no `V001`) e ela **não tem coluna de data de cadastro**
            (só `DATA_ADMISSAO`, um `DATE`); `FORMULARIOS_DESTINATARIOS` (`V001`, onde a pessoa é atribuída ao formulário de
            admissão) também não guarda data. Por isso, para este tipo, `desdeEmUtc` é a **data da admissão às 00:00 no fuso
            -03:00, convertida para UTC** (admissão em `2026-10-13` vira `2026-10-13T03:00:00Z`). Como só entra quem começa em
            até 7 dias, esse instante é de hoje ou do futuro: ele **ordena** a fila (quem começa antes vem primeiro), mas
            **não diz desde quando** a pessoa está pendente.

    PainelPendenciaLista:
      description: Lista paginada de pendências do RH.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/PainelPendenciaItem' }

    PainelProximoDia:
      type: object
      required: [data, tipo, rotulo, titulo]
      properties:
        data: { type: string, format: date }
        tipo: { type: string, enum: [FERIADO, ANIVERSARIO] }
        rotulo:
          type: string
          description: 'Texto pequeno acima do título: "Feriado nacional" (ou estadual, municipal, da empresa) e "Aniversário".'
        titulo:
          type: string
          description: 'O nome do feriado ("Nossa Senhora Aparecida") ou "Nome, Setor" do aniversariante.'

    PainelTreinamentoAndamento:
      type: object
      required: [treinamentoId, titulo, concluiram, total]
      properties:
        treinamentoId: { type: integer }
        titulo: { type: string }
        concluiram: { type: integer, description: 'Pessoas com o treinamento `CONCLUIDO`.' }
        total: { type: integer, description: 'Pessoas do público do treinamento.' }

    PainelPresencaAgora:
      type: object
      description: |
        O cartão "Presença agora" do RH (tela 00), por `SituacaoHoje` (`CONVENCOES.md`, seção 10; a contagem é o `PresencaContagens` da
        base, a única forma de contar situações de hoje, com `diaUtil` ao lado). Conta as pessoas **ativas e já admitidas**; cada uma
        entra em **uma** situação: `trabalhando` (já registrou entrada hoje, mesmo que já tenha saído), `ferias` (férias aprovadas que
        cobrem hoje), `atestado` (atestado validado que cobre hoje), `semRegistro` (dia com expediente, sem entrada, depois do
        horário padrão de entrada mais a tolerância), `aindaNaoComecou` (sem entrada, antes desse limite; **não** entra em "sem
        registro") e `semExpediente` (sábado, domingo ou feriado). Se mais de uma situação se aplica, vale a primeira desta ordem:
        `trabalhando`, `semExpediente`, `ferias`, `atestado`, `semRegistro`, `aindaNaoComecou` (a batida vence).

        `total` é a soma de `trabalhando`, `ferias`, `atestado`, `semRegistro` e `aindaNaoComecou` (o "de 101 colaboradores"). Às 09:42,
        `aindaNaoComecou` é 0; a legenda "Ainda não começou" só aparece quando for maior que zero. Em **dia sem expediente**
        `diaUtil` é falso, o cartão mostra só "Hoje não há expediente" e, se alguém bateu entrada, só `trabalhando`; `semExpediente`
        traz as demais pessoas e `total` vale só `trabalhando`. **Sem a categoria "Folga ou compensação"** (decisão do dono,
        2026-10-30). Aqui `semRegistro` é só o **número**: a lista de nomes tem rota própria (`GET /api/rh/painel/presenca/sem-registro`).
        O quadro "Hoje" do gestor é outro: são as `contagensHoje` de `GET /api/gestor/equipe` (fatia 1), da mesma definição de
        `SituacaoHoje`. A situação do **dia no espelho de ponto** (um dia passado) é outro conceito, com enum próprio na fatia 3.
      required: [atualizadoEmUtc, diaUtil, total, contagensHoje]
      properties:
        atualizadoEmUtc: { type: string, format: date-time, description: 'O "Atualizado às 9:42". Calculado a cada chamada.' }
        diaUtil: { type: boolean, description: 'Falso em sábado, domingo e feriado (o cartão mostra "Hoje não há expediente").' }
        total: { type: integer, minimum: 0, description: 'O "de 101 colaboradores": a soma de `trabalhando`, `ferias`, `atestado`, `semRegistro` e `aindaNaoComecou`.' }
        contagensHoje: { $ref: '#/components/schemas/PresencaContagens' }

    PainelAlteracao:
      type: object
      description: Uma linha de "Últimas alterações" (vem do log de auditoria).
      required: [quandoUtc, autor, descricao]
      properties:
        quandoUtc: { type: string, format: date-time }
        autor: { type: string, description: 'Texto pronto: "Ana Souza (RH)", "Carlos Ribeiro (gestor)" ou "Sistema".' }
        descricao: { type: string, description: 'Frase pronta ("Alterou o cargo de Bruno Lima de Analista para Analista pleno"). Nunca traz valores de campos sensíveis.' }

    PainelRh:
      type: object
      required: [totalPendencias, pendencias, proximosDias, treinamentosEmAndamento, presencaAgora, ultimasAlteracoes]
      properties:
        totalPendencias: { type: integer, minimum: 0 }
        pendencias:
          type: array
          items: { $ref: '#/components/schemas/PainelPendenciaResumo' }
        proximosDias:
          type: array
          items: { $ref: '#/components/schemas/PainelProximoDia' }
        treinamentosEmAndamento:
          type: array
          items: { $ref: '#/components/schemas/PainelTreinamentoAndamento' }
        presencaAgora: { $ref: '#/components/schemas/PainelPresencaAgora' }
        ultimasAlteracoes:
          type: array
          items: { $ref: '#/components/schemas/PainelAlteracao' }

    PainelSemRegistroItem:
      description: Uma pessoa sem registro de ponto hoje (`FuncionarioResumo` mais a `SituacaoHoje` dela, sempre `SEM_REGISTRO` nesta lista).
      allOf:
        - $ref: '#/components/schemas/FuncionarioResumo'
        - type: object
          required: [situacaoHoje]
          properties:
            situacaoHoje: { $ref: '#/components/schemas/SituacaoHoje' }

    PainelSemRegistroLista:
      description: Lista paginada de pessoas sem registro hoje.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/PainelSemRegistroItem' }

    PainelSetor:
      type: object
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }

    PainelAjusteDePontoPendente:
      type: object
      description: |
        Resumo de um pedido de ajuste de ponto que espera o gestor (os mesmos dados de um item de
        `GET /api/gestor/ponto/pedidos-de-ajuste`, fatia 3). A decisão usa as rotas do gestor da fatia 3, com `pedidoId`.
      required: [pedidoId, funcionario, data, resumoDaCorrecao, justificativa, criadoEmUtc]
      properties:
        pedidoId: { type: integer, description: 'O id do pedido na fatia 3 (o `id` do item).' }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        data: { type: string, format: date, description: 'O dia do ponto a corrigir ("de 05/10").' }
        resumoDaCorrecao:
          type: string
          description: 'O mesmo `resumoDaCorrecao` da fatia 3 ("Incluir o período 13:05 - 17:50"). O cartão mostra "{nome} pediu: {resumoDaCorrecao}".'
        justificativa: { type: string, description: 'O texto entre aspas do cartão (texto, nunca HTML).' }
        criadoEmUtc: { type: string, format: date-time, description: Quando a pessoa fez o pedido. }

    PainelAvaliacaoDoCiclo:
      type: object
      description: O botão "Avaliar a equipe (ciclo 2026.2)", que abre a avaliação `GESTOR_AVALIA_EQUIPE` aberta (fatia 5).
      required: [ciclo, formularioId]
      properties:
        ciclo: { type: string, description: 'Rótulo do ciclo, por exemplo "2026.2" (na fatia 5 ele aparece no título do formulário: "Avaliação da equipe, ciclo 2026.2").' }
        formularioId: { type: integer, description: O id do formulário de avaliação (fatia 5). }
      x-provisorio: "Como o ciclo de avaliação (rótulo '2026.2') é definido depende da fatia 5 (avaliações por ciclo); o banco não tem coluna de ciclo e a fatia 5 o põe no título do formulário. Se o dono definir o ciclo de outro modo, muda só a origem de 'ciclo'."

    PainelPontoHoje:
      type: object
      description: |
        A coluna "Ponto hoje" da tabela de pessoas. A situação é a `SituacaoHoje` (`CONVENCOES.md`, seção 10): `TRABALHANDO` ("Entrada
        08:01", com `horario` da primeira entrada de hoje), `FERIAS` ("De férias até 17/10", com `feriasAte`), `ATESTADO`,
        `SEM_REGISTRO` ("Sem registro", em destaque), `AINDA_NAO_COMECOU` e `SEM_EXPEDIENTE` (sábado, domingo ou feriado). O horário
        e a data de volta são apoio para o texto da coluna.
      required: [situacaoHoje, horario, feriasAte]
      properties:
        situacaoHoje: { $ref: '#/components/schemas/SituacaoHoje' }
        horario:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Horário do dia (`HH:mm`, fuso de São Paulo) da primeira entrada de hoje. Só em `TRABALHANDO`.
        feriasAte: { type: [string, 'null'], format: date, description: 'Último dia das férias. Só em `FERIAS`.' }

    PainelPessoaDaEquipe:
      type: object
      description: Uma linha da tabela "Pessoas da equipe". Não traz CPF, endereço, holerite nem documentos.
      required: [funcionario, pontoHoje, bancoDeHorasMinutos, feriasDisponiveisDias, avaliacaoSituacao, advertencias]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        pontoHoje: { $ref: '#/components/schemas/PainelPontoHoje' }
        bancoDeHorasMinutos:
          type: integer
          description: Saldo do banco de horas em minutos (negativo é débito). O front mostra "+2h10" e "-1h30"; saldo consolidado até ontem (fatia 3).
        feriasDisponiveisDias: { type: integer, description: 'Soma dos dias disponíveis de todos os períodos fechados (o mesmo `diasDisponiveis` de `FeriasResumo`).' }
        avaliacaoSituacao:
          type: [string, 'null']
          description: A coluna "Avaliação 2026.2". `null` quando não há ciclo aberto (a coluna some).
          enum: [RESPONDIDA, PENDENTE, NAO_SE_APLICA, null]
        advertencias:
          type: integer
          minimum: 0
          description: Advertências da pessoa **não canceladas e do ano corrente** (2026; a mesma contagem em todas as fatias, fatia 4). Zero aparece como "Nenhuma".

    PainelGestorAprovacoes:
      type: object
      description: Os cartões de "Esperando sua aprovação".
      required: [ferias, ajustesDePonto]
      properties:
        ferias:
          type: array
          items: { $ref: '#/components/schemas/FeriasPedidoAnalise' }
        ajustesDePonto:
          type: array
          items: { $ref: '#/components/schemas/PainelAjusteDePontoPendente' }

    PainelGestor:
      type: object
      required: [setor, totalPessoas, aguardandoAprovacao, avaliacao, pessoas]
      properties:
        setor:
          description: 'O setor do gestor ("Equipe Comercial"). **Um só**: um gestor responde por um setor. `null` se ele não tem setor.'
          oneOf:
            - $ref: '#/components/schemas/PainelSetor'
            - { type: 'null' }
        totalPessoas: { type: integer, description: 'O "8 pessoas" do subtítulo (o mesmo `total` de `GET /api/gestor/equipe`).' }
        aguardandoAprovacao: { $ref: '#/components/schemas/PainelGestorAprovacoes' }
        avaliacao:
          oneOf:
            - $ref: '#/components/schemas/PainelAvaliacaoDoCiclo'
            - { type: 'null' }
        pessoas:
          type: array
          items: { $ref: '#/components/schemas/PainelPessoaDaEquipe' }

    PainelBeneficioResumo:
      type: object
      description: Uma linha do cartão "Seus benefícios" da tela inicial.
      required: [adesaoId, nome, detalhe]
      properties:
        adesaoId: { type: integer }
        nome: { type: string }
        detalhe:
          type: [string, 'null']
          description: 'Texto curto montado pela API com o que o banco sabe: "Você e 1 dependente" (quando há dependentes aprovados) e as linhas do trajeto (vale-transporte). `null` sem detalhe.'

    PainelFeriasResumo:
      type: object
      description: O cartão "Férias disponíveis" da tela inicial.
      required: [diasDisponiveis, prazoParaTirarSaldo]
      properties:
        diasDisponiveis: { type: integer }
        prazoParaTirarSaldo: { type: [string, 'null'], format: date, description: 'O "Vencem em 13/03/2027" (o `prazoParaTirar` do período do saldo: 12 meses depois do fim dele; o Figma da tela 46 escreve 14/03, mas a regra dá 13/03); `null` sem saldo.' }

    PainelFuncionario:
      type: object
      required: [ferias, proximoPagamento, beneficios]
      properties:
        ferias: { $ref: '#/components/schemas/PainelFeriasResumo' }
        proximoPagamento: { $ref: '#/components/schemas/PagamentoProximo' }
        beneficios:
          type: array
          items: { $ref: '#/components/schemas/PainelBeneficioResumo' }

    PainelContadoresFuncionario:
      type: object
      required: [avisosNaoLidos, formulariosPendentes, documentosPendentes]
      properties:
        avisosNaoLidos: { type: integer, minimum: 0 }
        formulariosPendentes: { type: integer, minimum: 0 }
        documentosPendentes: { type: integer, minimum: 0, description: 'Documentos que o RH pediu e a pessoa ainda não enviou (`PENDENTE` em `GET /api/eu/documentos`, fatia 1). Bolinha do item "Meus documentos".' }

    PainelContadoresGestor:
      type: object
      required: [pendenciasDaEquipe, pedidosDeAjusteDePonto]
      properties:
        pendenciasDaEquipe: { type: integer, minimum: 0, description: 'Pedidos de férias `COM_O_GESTOR` mais pedidos de ajuste de ponto na etapa do gestor (o que ele pode decidir agora).' }
        pedidosDeAjusteDePonto: { type: integer, minimum: 0, description: 'Só os pedidos de ajuste de ponto na etapa do gestor.' }

    PainelContadoresRh:
      type: object
      required: [pedidosDeAjusteDePonto]
      properties:
        pedidosDeAjusteDePonto: { type: integer, minimum: 0 }
