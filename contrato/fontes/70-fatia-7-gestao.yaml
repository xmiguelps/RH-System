  /api/rh/ferias/{feriasId}/confirmar:
    post:
      tags: [Férias]
      operationId: confirmarFeriasComoRh
      summary: O RH confirma o pedido de férias (segunda etapa); o pedido fica aprovado.
      description: |
        O pedido vira `APROVADA` (`etapa: CONCLUIDA`). Só vale com o pedido na etapa do RH (`etapa: RH`, `situacao: COM_O_RH`).
        **Não existe "o RH aprova direto":** com o pedido ainda na etapa do gestor (`COM_O_GESTOR` ou `SUGESTAO_DE_DATA`) a resposta
        é 409 `PEDIDO_ETAPA_INCORRETA`; com o pedido já decidido, 409 `PEDIDO_JA_DECIDIDO`. Se o gestor está ausente, o RH liga
        "gestor ausente" em `PUT /api/rh/gestores/{gestorId}/ausencia` (**rota da fatia 1**, vale para qualquer pedido, a qualquer
        momento): ao ligar, a etapa do gestor dos pedidos já parados nele é aprovada na hora, menos os pedidos em
        `SUGESTAO_DE_DATA` (detalhes em `pedirFerias`). `decisaoRh` passa a `APROVADA`. **Manda e-mail à pessoa** com o resultado (lista
        fechada, `CONVENCOES.md`, seção 12), e ela também o vê em `GET /api/eu/ferias`.

        **Quem do RH pode decidir.** O banco (trigger `TRG_FERIAS_BEFORE_UPDATE`, `Criacao_Triggers:966-979`) exige, na decisão
        final (`APROVADA` ou `REJEITADA`), um gestor gravado no pedido (`ID_GESTOR`) que **não seja a própria pessoa do pedido**.
        Com etapa do gestor, esse gestor é o que analisou (ou o ausente). **Sem etapa do gestor** (pedido de quem é gestor, de quem
        não tem gestor ativo ou tem o gestor desligado), quem grava essa coluna é a pessoa do RH que decide, e por isso ela
        precisa ter linha ativa em `GESTORES`: senão, 422 `PEDIDO_RH_FORA_DE_GESTORES` ("Informe o gestor responsavel pela analise
        das ferias.") e `podeDecidir` falso para ela. Se ela é a dona do pedido, 422 `PEDIDO_PROPRIO` ("O gestor nao pode analisar
        as proprias ferias."): outra pessoa do RH, também em `GESTORES`, decide (se só uma pessoa do RH está em `GESTORES`, ninguém
        decide o pedido dela até o RH cadastrar outra como gestora). **O RH pode confirmar o próprio pedido** quando ele tem a etapa
        do gestor feita por outra pessoa (decisão do dono, 2026-10-29: o banco não impede, porque o gestor gravado é outro).
      x-perfis: [RH]
      parameters:
        - { name: feriasId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Férias confirmadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeriasPedidoAnalise' }
              example:
                id: 338
                funcionario: { id: 25, nome: Fernanda Lopes, cargo: Executiva de contas, setor: Comercial, ativo: true }
                periodoAquisitivo: { inicio: '2025-05-04', fim: '2026-05-03' }
                dataInicio: '2026-11-09'
                dataFim: '2026-11-23'
                dias: 15
                abonoPecuniario: true
                diasAbono: 5
                adiantar13Salario: true
                status: APROVADA
                etapa: CONCLUIDA
                podeDecidir: false
                motivoNaoPodeDecidir: Este pedido já foi decidido.
                situacao: APROVADA
                solicitadaEmUtc: '2026-09-28T13:00:00Z'
                observacao: Combinado com o gestor em 25/09.
                gestorResponsavel: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                decisaoGestor: { decisao: APROVADA, decididaPor: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }, decididaEmUtc: '2026-09-29T12:00:00Z', automatica: false, observacao: null }
                decisaoRh: { decisao: APROVADA, decididaPor: { id: 1, nome: Ana Souza, cargo: Gerente de RH, setor: Recursos Humanos, ativo: true }, decididaEmUtc: '2026-10-07T12:42:00Z', automatica: false, observacao: null }
                sugestao: null
