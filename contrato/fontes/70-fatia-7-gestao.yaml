                dias: 18
                abonoPecuniario: false
                diasAbono: 0
                adiantar13Salario: false
                status: APROVADA
                etapa: CONCLUIDA
                podeDecidir: false
                motivoNaoPodeDecidir: Este pedido já foi decidido.
