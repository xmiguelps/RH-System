                treinamentoConcluido: true
                treinamento:
                  id: 2
                  titulo: LGPD na prática
                  descricao: 'Como a empresa trata dados pessoais e o que cada pessoa deve fazer.'
                  obrigatorio: true
                  onboarding: false
                  situacao: CONCLUIDO
                  encerrado: false
                  comecaEm: '2026-08-01'
                  totalModulos: 4
                  duracaoTotalMinutos: 70
                  modulosConcluidos: 4
                  progressoPercentual: 100
                  moduloAtual: null
                  iniciadoEm: '2026-08-02'
                  concluidoEmUtc: '2026-09-15T14:05:00Z'
                  certificado: { numero: CERT-2026-00482, codigoValidacao: a7f3c1d2-5e9b-4c68-b2d1-8f04e6a93b57, emitidoEm: '2026-09-15' }
                  modulos:
