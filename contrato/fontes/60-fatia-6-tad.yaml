  /api/eu/treinamentos/{treinamentoId}/modulos/{moduloId}/concluir:
    post:
      tags: [Treinamentos]
      operationId: concluirModuloDeTreinamento
      summary: Marca um módulo como concluído; ao concluir o último, conclui o treinamento.
      description: |
        Grava uma linha em `TREINAMENTOS_MODULOS_PROGRESSO` (só existe linha de módulo concluído). **Não há rota
        "concluir treinamento"**: quando o módulo concluído era o último que faltava, a própria API atualiza a linha de
        `TREINAMENTOS_FUNCIONARIOS` para `CONCLUIDO`, sem nota (a API nunca grava nota; o trigger só recusa nota abaixo de
        70, e nota vazia passa). O trigger do banco então preenche `DATA_CONCLUSAO` e **cria a linha do certificado** com
        `CODIGO_VALIDACAO = UUID()` (versão 1): a API **não insere** certificado (colidiria com a chave única); ela
        **troca esse código por um UUID versão 4** (aleatório, não enumerável; ver `validarCertificado`) e, se
        `emiteCertificado` for verdadeiro, gera o PDF e grava o caminho nessa linha; se for falso, deixa a linha sem uso.
        `treinamentoConcluido` diz se foi este módulo que fechou o treinamento (o front então mostra o certificado).
        A primeira conclusão em `INSCRITO` também inicia o treinamento (`EM_ANDAMENTO`, `DATA_INICIO` = hoje).
        Repetir é inofensivo: módulo já concluído devolve o estado atual, sem erro e sem tocar no banco (o banco recusa mudar um
        `CONCLUIDO`: "Treinamento concluido nao pode mudar de status."). Duas conclusões simultâneas dos últimos módulos
        resultam em um só `CONCLUIDO` e um só certificado.
        Opcional sem inscrição: 422 `INSCRICAO_PENDENTE`. Treinamento que o RH encerrou e que a pessoa ainda não tinha
        começado: 422 `TREINAMENTO_ENCERRADO` (quem já estava `EM_ANDAMENTO` conclui normalmente e recebe o certificado; o encerramento
        depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`)). Módulo de outro treinamento: 404. `concluidoEmUtc` do treinamento é o instante em que o
        último módulo foi concluído.
      x-provisorio: >-
        Formato do `numero` do certificado e modelo do PDF (roadmap, fatia 6).
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/TreinamentoModuloId' }
