  # ---------------------------------------------------------------- RH: quem fez
  /api/rh/treinamentos/{treinamentoId}/participantes:
    get:
      tags: [Treinamentos]
      operationId: listarParticipantesDeTreinamento
      summary: Lista quem fez, quem está fazendo e quem não começou um treinamento.
      description: |
        Tela 22, seção "Quem fez" (botão "Ver quem fez"). Lista só quem tem linha no treinamento (obrigatório: o
        público inteiro; opcional: quem se inscreveu). `situacao` é a aba (`CONCLUIDO` = "Concluíram",
        `EM_ANDAMENTO`, `INSCRITO` = "Não iniciaram"); `setorId` é o filtro "Todos os setores" (a lista de setores vem de
        `GET /api/rh/setores`); `busca` procura no nome. `contagens` ignora `situacao` e respeita `setorId` e `busca`.
        `ordenarPor` aceita `NOME` (padrão), `SETOR`, `SITUACAO`, `INICIO` e `CONCLUSAO`; `direcao` padrão `ASC`.
        Não há coluna Nota. O botão "Baixar" do certificado só aparece quando `certificadoDisponivel` é verdadeiro.
        Rascunho não tem participantes (lista vazia). O resultado de pessoas inativas continua na lista (`funcionario.ativo`).
        Treinamento encerrado continua consultável: quem não começou aparece como "Não iniciado" e quem terminou depois do
        encerramento aparece como `CONCLUIDO` (o encerramento depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`)). A linha de resumo sob o título (o Figma: "Obrigatório para todos, com
        certificado. 01/08 a 31/10/2026") perde o fim: use `comecaEm` ("desde 01/08") e, se houver, `encerradoEmUtc`.
        `concluidoEmUtc` é o instante em que a pessoa concluiu (o front mostra só o dia, em `America/Sao_Paulo`).
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - { $ref: '#/components/parameters/Busca' }
        - { $ref: '#/components/parameters/Direcao' }
        - name: situacao
          in: query
          description: Aba da lista. Sem o parâmetro, todos.
          schema: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        - name: setorId
          in: query
          description: Só as pessoas deste setor.
          schema: { type: integer }
        - name: ordenarPor
          in: query
          schema: { type: string, enum: [NOME, SETOR, SITUACAO, INICIO, CONCLUSAO], default: NOME }
      responses:
        '200':
          description: Página de participantes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoParticipantesLista' }
              example:
                treinamento: { id: 2, titulo: LGPD na prática, obrigatorio: true, onboarding: false, emiteCertificado: true, situacao: EM_ANDAMENTO, comecaEm: '2026-08-01', encerradoEmUtc: null, publico: TODOS, totalModulos: 4 }
                contagens: { total: 101, concluidos: 63, emAndamento: 21, naoIniciados: 17 }
                itens:
                  - { funcionario: { id: 12, nome: Bruno Lima, cargo: Analista pleno, setor: Financeiro, ativo: true }, situacao: CONCLUIDO, iniciadoEm: '2026-08-02', concluidoEmUtc: '2026-09-15T14:05:00Z', modulosConcluidos: 4, certificadoDisponivel: true }
                  - { funcionario: { id: 4, nome: Carla Mendes, cargo: Assistente administrativa, setor: Administrativo, ativo: true }, situacao: CONCLUIDO, iniciadoEm: '2026-08-05', concluidoEmUtc: '2026-08-20T12:00:00Z', modulosConcluidos: 4, certificadoDisponivel: true }
                  - { funcionario: { id: 21, nome: Diego Farias, cargo: Vendedor, setor: Comercial, ativo: true }, situacao: INSCRITO, iniciadoEm: null, concluidoEmUtc: null, modulosConcluidos: 0, certificadoDisponivel: false }
                  - { funcionario: { id: 40, nome: João Pedro Alves, cargo: Desenvolvedor, setor: Tecnologia, ativo: true }, situacao: EM_ANDAMENTO, iniciadoEm: '2026-09-12', concluidoEmUtc: null, modulosConcluidos: 2, certificadoDisponivel: false }
                pagina: 1
                tamanhoPagina: 20
                total: 101
                totalPaginas: 6
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/{treinamentoId}/participantes/exportacao:
    get:
      tags: [Treinamentos]
      operationId: exportarParticipantesDeTreinamento
      summary: Baixa a lista de quem fez o treinamento em CSV.
      description: |
        Botão "Baixar lista" da tela 22. Aceita os mesmos filtros da lista (`situacao`, `setorId`, `busca`) e devolve **todas**
        as linhas, sem paginação, com `Content-Disposition: attachment`. CSV em UTF-8 com BOM, separador `;`, colunas
        `Pessoa;Setor;Situação;Início;Conclusão` (datas `dd/MM/aaaa`; situação em português: Concluído, Em andamento,
        Não iniciado). Célula que começa com `=`, `+`, `-` ou `@` é neutralizada (roadmap, decisão 9).
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/Busca' }
        - name: situacao
          in: query
          schema: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        - name: setorId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Arquivo CSV.
          headers:
            Content-Disposition:
              description: Sempre `attachment; filename="treinamento-lgpd-na-pratica.csv"` (nome com o título).
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
              example: "Pessoa;Setor;Situação;Início;Conclusão\r\nBruno Lima;Financeiro;Concluído;02/08/2026;15/09/2026\r\nDiego Farias;Comercial;Não iniciado;;\r\n"
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/{treinamentoId}/participantes/{funcionarioId}/certificado/download:
    get:
      tags: [Certificados]
      operationId: baixarCertificadoDeParticipante
      summary: Dá um link temporário para baixar o certificado em PDF de uma pessoa.
      description: |
        Botão "Baixar" da coluna Certificado (tela 22) e do histórico na ficha. Devolve `LinkTemporario`; o PDF baixa como
        anexo (o `url` é uma URL assinada genérica, sem caminho interno de armazenamento). 404 se a pessoa não concluiu, ou
        se o treinamento tem `emiteCertificado` falso (o trigger do banco cria a linha do certificado de qualquer jeito, mas
        a API a trata como inexistente).
        O PDF é gerado quando o treinamento vira `CONCLUIDO`, atualizando a linha que o trigger criou (a API nunca insere
        outro certificado); se a linha ainda estiver sem arquivo, este download gera o PDF na hora, uma vez.
      x-provisorio: >-
        Modelo visual do certificado e formato do número (roadmap, fatia 6). O PDF segue o modelo simples que o back-end escolher; o dono pode trocar o layout e o formato de `numero` sem mudar este contrato.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/TreinamentoFuncionarioId' }
      responses:
        '200':
          description: Link temporário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkTemporario' }
              example:
                url: 'https://arquivos.exemplo.com.br/download/5b8e2c91d7a04f36?assinatura=exemplo'
                expiraEmUtc: '2026-10-07T12:57:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- RH: ficha da pessoa
  /api/rh/funcionarios/{funcionarioId}/treinamentos:
    get:
      tags: [Treinamentos]
      operationId: listarTreinamentosDeFuncionario
      summary: Mostra os treinamentos de uma pessoa, para a aba Treinamentos da ficha.
      description: |
        Aba da ficha da pessoa (RH). O Figma não desenha esta aba para o RH (só para o gestor, tela 52); o contrato a
        oferece no mesmo formato, com o botão de certificado. Lista as linhas da pessoa em treinamentos publicados cuja data
        de início já chegou (a mesma visibilidade que ela tem: treinamento encerrado só aparece se ela começou ou
        concluiu), obrigatórios primeiro e depois por `comecaEm` (o mais antigo primeiro).
        `resumo.pendentes`: pendências pela definição única da tag Treinamentos (obrigatório `EM_ANDAMENTO` em que ela
        está `INSCRITO` ou `EM_ANDAMENTO`); opcional nunca é pendência. Treinamento não tem prazo, então não há "prazo
        vencido" nem data final nos itens. `concluidoEmUtc` é o instante em que concluiu (o front mostra só o dia).
        O certificado de cada item se baixa com `baixarCertificadoDeParticipante`.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoFuncionarioId' }
      responses:
        '200':
          description: Treinamentos da pessoa (sem paginação; lista curta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoFichaRhResposta' }
              example:
                resumo: { pendentes: 1, emAndamento: 1, concluidos: 1 }
                itens:
                  - { treinamentoId: 2, titulo: LGPD na prática, obrigatorio: true, onboarding: false, situacao: CONCLUIDO, iniciadoEm: '2026-08-02', concluidoEmUtc: '2026-09-15T14:05:00Z', modulosConcluidos: 4, totalModulos: 4, certificadoDisponivel: true }
                  - { treinamentoId: 3, titulo: Segurança da informação, obrigatorio: true, onboarding: false, situacao: EM_ANDAMENTO, iniciadoEm: '2026-10-05', concluidoEmUtc: null, modulosConcluidos: 3, totalModulos: 5, certificadoDisponivel: false }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/funcionarios/{funcionarioId}/treinamentos/onboarding:
    post:
      tags: [Treinamentos]
      operationId: incluirFuncionarioNoOnboarding
      summary: Inclui uma pessoa no treinamento de onboarding (liga a caixa "Incluir no treinamento" do cadastro).
      description: |
        **É esta a regra por trás da caixa "Incluir no treinamento Onboarding 2026"** do cadastro. O cadastro
        (`POST /api/rh/funcionarios`) e a confirmação da importação (`POST /api/rh/importacoes/{importacaoId}/confirmar`)
        aceitam `incluirNoOnboarding` e aplicam **esta mesma regra por dentro**, depois de gravar a pessoa (a importação
        usa a tabela nova da aplicação `IMPORTACOES`, script `V001`, descrita na fatia 2); nesses dois fluxos o front não
        chama esta rota. Ela existe para incluir depois uma pessoa já cadastrada (por exemplo, a partir da
        ficha) e é a referência do efeito e dos erros.
        Cria uma linha `INSCRITO` em `TREINAMENTOS_FUNCIONARIOS` para a pessoa em cada treinamento de onboarding em vigor
        (publicado e **não encerrado**; ver `listarTreinamentosDeOnboarding`; o encerramento depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`)), qualquer que seja o público; assim o
        treinamento aparece para ela quando `comecaEm` chegar. Quem já tem linha não muda e vem com
        `jaEstavaIncluida: true` (a chamada é repetível). Sem treinamento de onboarding em vigor: 422
        `SEM_TREINAMENTO_DE_ONBOARDING` (no cadastro, que grava tudo ou nada como diz a fatia 1, o mesmo 422 recusa o
        cadastro inteiro). Pessoa inativa: 422 `FUNCIONARIO_INATIVO` (o trigger do banco também recusa: "Nao e possivel
        inscrever funcionario inativo em treinamento.").
      x-provisorio: >-
        Como o RH marca qual treinamento é o de onboarding (ver `listarTreinamentosDeOnboarding`). Se a regra mudar, muda quem é incluído, não a forma de chamar.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoFuncionarioId' }
      responses:
        '200':
          description: Pessoa incluída (ou já estava).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoOnboardingInclusaoResposta' }
              example:
                funcionarioId: 104
                treinamentos:
                  - { treinamentoId: 1, titulo: Onboarding 2026, jaEstavaIncluida: false }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: Não há treinamento de onboarding em vigor, ou a pessoa está inativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                semOnboarding:
                  summary: Nenhum treinamento de onboarding publicado
                  value:
                    title: Operação recusada.
                    status: 422
                    codigo: SEM_TREINAMENTO_DE_ONBOARDING
                    detail: Não há treinamento de onboarding publicado.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                inativo:
                  summary: Pessoa inativa
                  value:
                    title: Operação recusada.
                    status: 422
                    codigo: FUNCIONARIO_INATIVO
                    detail: Não é possível incluir uma pessoa inativa em treinamento.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    regraDoBanco: Nao e possivel inscrever funcionario inativo em treinamento.
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- EU: meus treinamentos (telas 41 e 42)
  /api/eu/treinamentos:
    get:
      tags: [Treinamentos]
      operationId: listarMeusTreinamentos
      summary: Lista os meus treinamentos, em cartões, por aba.
      description: |
        Telas 41 e 42 ("Meus treinamentos"), para qualquer perfil (gestor e RH também fazem os treinamentos deles). Só
        aparecem treinamentos **publicados cuja data de início já chegou**; rascunho e agendado não vêm (o cartão "Em breve"
        do Figma não existe). Entram os treinamentos em que a pessoa tem linha e os **opcionais do público dela** que ela
        ainda não escolheu (`situacao = DISPONIVEL`). Treinamento **encerrado** só aparece para quem já começou (continua
        e termina) ou concluiu; para quem estava `INSCRITO` e não começou, e para o opcional ainda não escolhido, ele some (o
        encerramento depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`)).
        `aba`: `TODOS` (padrão; tudo que ainda **não** foi concluído, como diz a nota "Os treinamentos que você já concluiu ficam
        na aba Concluídos"), `DISPONIVEIS` (`DISPONIVEL` e `NAO_INICIADO`), `EM_ANDAMENTO` e `CONCLUIDOS`. `obrigatorio`
        é o filtro "Obrigatórios e opcionais" (sem ele, os dois). `busca` procura no título e na descrição. O filtro "Todos
        os tipos" não existe. `contagens` traz o número de cada aba, ignora `aba` e respeita `busca` e `obrigatorio`.
        Ordem fixa: obrigatórios primeiro, depois `comecaEm` mais antigo (o que espera há mais tempo), depois título.
        **Sem prazo:** o cartão não tem "Até 15/11" nem "De 20/10 a 20/11"; o selo é só "Obrigatório", "Opcional" ou
        "Onboarding".
        A faixa "Sua parte" do gestor (tela 58) é o primeiro item obrigatório, com `encerrado` falso e `situacao`
        `NAO_INICIADO` ou `EM_ANDAMENTO`, desta lista ("Você está no módulo `moduloAtual` de `totalModulos`"; o "O prazo é
        15/11" do Figma não existe). Se não há item assim, a faixa não aparece. `encerrado` verdadeiro só vem em cartão
        `EM_ANDAMENTO` ou `CONCLUIDO` (o RH encerrou o treinamento; quem já começou continua e termina).
        O desenho do cartão (ícone e cor) é decorativo e não vem da API.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - { $ref: '#/components/parameters/Busca' }
        - name: aba
