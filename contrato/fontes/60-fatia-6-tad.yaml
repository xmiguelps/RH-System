# Fatia 6: TAD (treinamentos). Roadmap, linhas 225 a 248; telas 22 a 26 (RH), 41 e 42 (funcionário), 58 (gestor).
# Banco: TREINAMENTOS, TREINAMENTOS_FUNCIONARIOS, TREINAMENTOS_CERTIFICADOS (Criacao_Tabelas:403-464),
# módulos e progresso, rascunho, público, certificado e as três caixas da publicação (tudo no V001).
tags:
  - name: Treinamentos
    description: |
      Treinamentos com módulos (TAD): o RH cria, publica e acompanha; a pessoa avança módulo a módulo e, ao
      concluir o último, o treinamento fica `CONCLUIDO` e sai o certificado em PDF (se o RH deixou marcado).

      **Treinamento não tem prazo** (decisão do dono, 2026-10-30; `CONVENCOES.md`, seção 13): fica disponível para quem
      entrar na empresa. Não existe data final, "atrasada", "Prazos até" nem lembrete antes do fim. Existe publicar, a data
      de início (só libera o acesso, quando ela é no futuro) e o RH poder **encerrar** a qualquer momento ou **excluir**
      enquanto nenhum certificado foi emitido, com a confirmação `CONFIRMACAO_NECESSARIA` quando há gente que ainda não
      concluiu (ver "Encerrar e excluir", abaixo).

      **O que o Figma mostra e NÃO existe** (decisões do dono, 2026-10-29 e 2026-10-30): quiz, "Terminar com um quiz", nota,
      "Nota mínima para concluir", a coluna Nota e o texto "Concluído com nota 9,0"; prova final; turma presencial,
      módulo "Aula presencial", "Híbrido" e "Presencial"; o campo "Tipo" do passo Detalhes e o filtro "Todos os tipos"
      (todo treinamento é online, não há campo de modalidade); o cartão "Em breve / Abre em 15/10" (o treinamento só
      aparece para a pessoa quando a data de início chega); tudo que é prazo (o "Período 01/01 a 31/12/2026" da lista, o
      "Prazos até 31/10", o "Até 15/11" e o "De 20/10 a 20/11" dos cartões, o "O prazo é 15/11" da faixa "Sua parte" e o
      "faltam 24 dias" da tela 58, e as caixas "Termina em", "Avisar por e-mail ao publicar" e "Lembrar quem não começou 7
      dias antes do fim"); os botões "Lembrar quem não terminou" (tela 22) e "Lembrar quem falta por e-mail" (tela 58),
      porque esta fatia não envia e-mail nenhum. Onde o Figma diz "quiz final e certificado", leia só
      "certificado" (e só quando `emiteCertificado` é verdadeiro). O passo "Avaliação" do assistente sobra só com a caixa
      "Emitir certificado" (o front pode chamá-lo de "Certificado"); o aviso "O quiz ainda não foi criado" some.

      **Situação do treinamento** (`TreinamentoSituacao`, calculada pela API com a data de hoje no fuso -03:00; não existe
      coluna): `RASCUNHO` (não publicado), `AGENDADO` (publicado, ainda não chegou `comecaEm`), `EM_ANDAMENTO`
      (publicado, `comecaEm` já chegou e o RH não encerrou) e `ENCERRADO` (o RH encerrou; `encerradoEmUtc` diz quando).
      Não há mais situação por data final. `ENCERRADO` e `encerradoEmUtc` dependem da coluna nova
      `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver "Banco: o que é novo", abaixo).

      **Situação da pessoa no treinamento** (`TreinamentoParticipanteSituacao`): `INSCRITO` (tem linha em
      `TREINAMENTOS_FUNCIONARIOS` e ainda não começou; o Figma chama de "Não iniciado"), `EM_ANDAMENTO` e `CONCLUIDO`.
      Os valores `REPROVADO` e `CANCELADO` existem no banco, mas a API nunca os grava nem os devolve.

      **Quem tem linha:** treinamento **obrigatório** cria uma linha (`INSCRITO`) para cada pessoa do público no momento
      da publicação (só pessoas ativas cuja admissão já ocorreu; o trigger do banco recusa inativo). Treinamento
      **opcional** só tem linha de quem se inscreveu (`POST /api/eu/treinamentos/{treinamentoId}/inscricao`).

      **A tela de execução do treinamento não existe no Figma** (o que abre em "Começar", "Continuar" e "Rever conteúdo").
      O contrato supõe uma tela simples: lista de módulos com o andamento, o conteúdo do módulo escolhido e o botão
      "Concluir módulo". A política de segurança do site (`default-src 'self'`) impede incorporar vídeo ou página
      externa: vídeo e link abrem em nova aba.

      **Pendente** (uma definição só, usada nos indicadores da tela 22, nas fichas, na faixa "Sua parte" e no painel
      inicial): treinamento **obrigatório** `EM_ANDAMENTO` em que a pessoa tem linha `INSCRITO` ou `EM_ANDAMENTO`. Não é
      pendência: treinamento opcional, agendado (ninguém o vê ainda) ou encerrado (o RH o fechou).

      **Encerrar e excluir** (só o RH; o menu "..." da linha na tela 22 tem **Editar**, **Encerrar** e **Excluir**).
      **Encerrar** (`encerrarTreinamento`) fecha as entradas: quem já começou continua e termina, quem não começou perde o
      treinamento da lista e não pode mais começar, ninguém novo entra (decisão do dono, 2026-10-30). Os certificados já
      emitidos continuam valendo. **Excluir** (`excluirTreinamento`) apaga o treinamento e todo o andamento, **mas só
      quando nenhum certificado foi emitido** (decisão do dono, 2026-10-30): "certificado emitido" é a conclusão de uma
      pessoa num treinamento com `emiteCertificado` verdadeiro (o certificado que a conferência pública aceita). Havendo
      um, a exclusão é recusada com 422 `TREINAMENTO_COM_CERTIFICADOS` (o RH só pode **encerrar**), mesmo com
      `confirmar=true`. Um certificado emitido nunca some. Sem certificado emitido, as duas operações, quando há pessoas
      com linha ainda não concluída, respondem 409 `CONFIRMACAO_NECESSARIA` com `pendentes` (e `emAndamento` e
      `naoIniciaram`) e só executam quando a chamada é repetida com `confirmar=true`.

      **Banco: o que é novo** (scripts já escritos em `Banco de Dados/Scripts`): a coluna `TREINAMENTOS.ENCERRADO_EM` (`V001`;
      instante do encerramento; dela dependem a situação `ENCERRADO` e `encerradoEmUtc`); a coluna
      `TREINAMENTOS_MODULOS.NOME_ARQUIVO_ORIGINAL` (`V001`; alimenta `nomeArquivo` do módulo de PDF); a mudança do padrão de
      `AVISA_POR_EMAIL` e `LEMBRA_ANTES_DO_FIM` para `FALSE` (`V001`); e a **auditoria**, que é tabela nova da aplicação (`V001`) e
      recebe os eventos de publicar (criação das linhas em lote), encerrar e excluir. A `description` de cada operação que
      depende de uma delas diz isso.

      **Códigos de erro desta fatia** (cada um com um sentido só):
      - 422 `TREINAMENTO_JA_PUBLICADO`: só em `publicarTreinamento`, quando o treinamento já está publicado (inclusive o
        encerrado).
      - 422 `TREINAMENTO_CAMPO_TRAVADO`: um campo que não muda depois de publicado: em `atualizarTreinamento`, o público, a
        obrigatoriedade, o onboarding e o certificado (e a data de início quando já não está agendado); em
        `atualizarModuloDeTreinamento`, o `tipo` do módulo.
      - 422 `TREINAMENTO_MODULOS_TRAVADOS`: a lista de módulos não muda depois de publicado (acrescentar, reordenar ou
        excluir módulo; vale também para o encerrado).
      - 422 `TREINAMENTO_ENCERRADO`: o treinamento está encerrado e a operação não vale mais (editar os dados, encerrar de
        novo; e, nas rotas `/api/eu`, inscrever-se, começar ou concluir módulo quem ainda não tinha começado).
      - 422 `TREINAMENTO_NAO_ESTA_EM_ANDAMENTO`: encerrar um rascunho ou um agendado (esses se excluem).
      - 422 `TREINAMENTO_COM_CERTIFICADOS`: excluir um treinamento com certificado emitido (só se encerra).
      - 422 `TREINAMENTO_NAO_E_OPCIONAL`, `INSCRICAO_PENDENTE`, `SEM_TREINAMENTO_DE_ONBOARDING` e `FUNCIONARIO_INATIVO`:
        descritos na operação que os devolve.
      - 409 `CONFIRMACAO_NECESSARIA`: encerrar ou excluir com pessoas que ainda não concluíram (nunca com certificado
        emitido na exclusão: esse caso é o 422).

      **E-mails:** esta fatia não envia nenhum (`CONVENCOES.md`, seção 12): sem aviso de treinamento publicado, sem
      lembrete (do RH, do gestor ou automático) e sem e-mail de encerramento. Quem quiser avisar as pessoas usa um Aviso
      (fatia 4), à mão.
  - name: Certificados
    description: |
      Certificado de conclusão de treinamento. O código de validação é um **UUID versão 4** (aleatório, não enumerável)
      **gerado pela aplicação** ao criar o certificado: quando o treinamento vira `CONCLUIDO`, o trigger do banco cria a
      linha com um UUID versão 1 (`UUID()`), e a aplicação o troca por um versão 4 antes de o código aparecer em qualquer
      resposta ou PDF. O contrato **não promete** "o UUID que o banco gerou". O número amigável (`numero`) aparece à parte.
      A conferência pública mostra o mínimo de dados.
      Um certificado emitido nunca é apagado: o treinamento que o emitiu só se encerra, não se exclui (422
      `TREINAMENTO_COM_CERTIFICADOS`).

paths:
  # ---------------------------------------------------------------- RH: lista, indicadores e apoio do assistente
  /api/rh/treinamentos:
    get:
      tags: [Treinamentos]
      operationId: listarTreinamentos
      summary: Lista os treinamentos com o andamento de cada um, em abas por situação.
      description: |
        Tela 22, tabela de cima. `busca` procura no título. `situacao` é a aba (sem ela, "Todos", que inclui os
        rascunhos). `ordenarPor` aceita `TITULO` e `COMECA_EM` (padrão); `direcao` padrão `DESC`.
        `contagens` traz o número de cada aba, ignora `situacao` e respeita `busca`.
        Em cada linha: obrigatório mostra "`concluidos` de `totalParticipantes` concluíram" com a barra;
        opcional mostra "`totalParticipantes` inscritos". Rascunho tem `totalParticipantes` e `concluidos` zerados.
        A coluna "Período" do Figma (início e fim) vira só a data de início (`comecaEm`, "Começa em"; vazia em rascunho
        sem data) e, no encerrado, a data de `encerradoEmUtc`: treinamento não tem fim (seção 13 das convenções).
        `ENCERRADO`, `encerradoEmUtc` e a aba "Encerrados" dependem da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script
        `V001`; ver `encerrarTreinamento`).
        O Figma não desenha a aba "Rascunhos", mas ela é necessária para o RH retomar o que salvou: acrescente-a.
        O menu "..." da linha tem **Editar** (`obterTreinamento` e `atualizarTreinamento`), **Encerrar**
        (`encerrarTreinamento`, só em `EM_ANDAMENTO`) e **Excluir** (`excluirTreinamento`). Com `certificadosEmitidos`
        maior que zero, o front deixa "Excluir" desabilitado e explica "Treinamento com certificado emitido só pode ser
        encerrado" (a API recusaria com 422 `TREINAMENTO_COM_CERTIFICADOS`); nos demais casos "Excluir" abre a confirmação.
        Não há "Duplicar" nem "Lembrar".
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - { $ref: '#/components/parameters/Busca' }
        - { $ref: '#/components/parameters/Direcao' }
        - name: situacao
          in: query
          description: Aba da lista. Sem o parâmetro, todos.
          schema: { $ref: '#/components/schemas/TreinamentoSituacao' }
        - name: ordenarPor
          in: query
          schema: { type: string, enum: [TITULO, COMECA_EM], default: COMECA_EM }
      responses:
        '200':
          description: Página de treinamentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoRhLista' }
              example:
                itens:
                  - { id: 1, titulo: Onboarding 2026, obrigatorio: true, onboarding: true, emiteCertificado: true, situacao: EM_ANDAMENTO, comecaEm: '2026-01-01', encerradoEmUtc: null, publico: PESSOAS, totalModulos: 6, totalParticipantes: 24, concluidos: 18, certificadosEmitidos: 18 }
                  - { id: 2, titulo: LGPD na prática, obrigatorio: true, onboarding: false, emiteCertificado: true, situacao: EM_ANDAMENTO, comecaEm: '2026-08-01', encerradoEmUtc: null, publico: TODOS, totalModulos: 4, totalParticipantes: 101, concluidos: 63, certificadosEmitidos: 63 }
                  - { id: 3, titulo: Segurança da informação, obrigatorio: true, onboarding: false, emiteCertificado: true, situacao: EM_ANDAMENTO, comecaEm: '2026-09-15', encerradoEmUtc: null, publico: TODOS, totalModulos: 5, totalParticipantes: 101, concluidos: 41, certificadosEmitidos: 41 }
                  - { id: 4, titulo: Atendimento ao cliente, obrigatorio: false, onboarding: false, emiteCertificado: true, situacao: AGENDADO, comecaEm: '2026-11-03', encerradoEmUtc: null, publico: SETORES, totalModulos: 3, totalParticipantes: 0, concluidos: 0, certificadosEmitidos: 0 }
                  - { id: 5, titulo: Armazenagem segura (NR-11), obrigatorio: true, onboarding: false, emiteCertificado: true, situacao: ENCERRADO, comecaEm: '2026-03-10', encerradoEmUtc: '2026-03-14T20:00:00Z', publico: SETORES, totalModulos: 2, totalParticipantes: 12, concluidos: 12, certificadosEmitidos: 12 }
                  - { id: 6, titulo: Prevenção de assédio no trabalho, obrigatorio: true, onboarding: false, emiteCertificado: true, situacao: RASCUNHO, comecaEm: '2026-11-16', encerradoEmUtc: null, publico: TODOS, totalModulos: 3, totalParticipantes: 0, concluidos: 0, certificadosEmitidos: 0 }
                pagina: 1
                tamanhoPagina: 20
                total: 6
                totalPaginas: 1
                contagens: { todos: 6, rascunhos: 1, agendados: 1, emAndamento: 3, encerrados: 1 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Treinamentos]
      operationId: criarTreinamento
      summary: Cria um treinamento como rascunho.
      description: |
        Assistente "Novo treinamento", passo Detalhes ("Próximo" ou "Salvar rascunho e sair"). Só o `titulo` é
        obrigatório: o treinamento nasce **rascunho** (`PUBLICADO` falso) e o RH completa os outros passos depois com
        `PUT /api/rh/treinamentos/{treinamentoId}`. O `id` devolvido é usado para cadastrar os módulos. Quem está no
        assistente chama este `POST` na primeira vez que sai do passo 1 e o `PUT` nas seguintes.
        Ninguém vê o treinamento antes de `publicar`. `incluiAdmitidos` e `emiteCertificado` têm padrão verdadeiro no
        banco; a API sempre grava o valor recebido (não declare o padrão no mapeamento do EF; ver `Scripts\LEIA-ME.md`).
        **Sem prazo** (seção 13 das convenções): não há `terminaEm`. As colunas `DATA_FIM`, `AVISA_POR_EMAIL` e
        `LEMBRA_ANTES_DO_FIM` (V001) deixam de ter uso: a API deixa `DATA_FIM` `NULL`; nas outras duas **o banco nasce com
        `FALSE`** (o padrão no `V001` é `FALSE`) **e a API não manda e-mail** (nem aviso
        de publicação nem lembrete); nenhum agendador as lê.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreinamentoComando' }
            example:
              titulo: Prevenção de assédio no trabalho
              descricao: Como reconhecer, prevenir e denunciar situações de assédio moral e sexual, e quais canais a empresa oferece.
              comecaEm: '2026-11-16'
              obrigatorio: true
              onboarding: false
              emiteCertificado: true
              publico: TODOS
              setorIds: []
              funcionarioIds: []
              incluiAdmitidos: true
      responses:
        '201':
          description: Rascunho criado, ainda sem módulos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoRh' }
              example:
                id: 6
                titulo: Prevenção de assédio no trabalho
                descricao: Como reconhecer, prevenir e denunciar situações de assédio moral e sexual, e quais canais a empresa oferece.
                comecaEm: '2026-11-16'
                encerradoEmUtc: null
                obrigatorio: true
                onboarding: false
                emiteCertificado: true
                publicado: false
                situacao: RASCUNHO
                publico: TODOS
                setores: []
                pessoas: []
                incluiAdmitidos: true
                modulos: []
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/resumo:
    get:
      tags: [Treinamentos]
      operationId: obterIndicadoresDeTreinamentos
      summary: Mostra os quatro números do topo da tela de treinamentos.
      description: |
        Tela 22, faixa de indicadores. `emAndamento`: treinamentos `EM_ANDAMENTO` (publicados, já liberados, não
        encerrados). `obrigatorios`: treinamentos obrigatórios publicados, em qualquer situação (agendado e encerrado
        entram; o Figma conta o encerrado também). `certificadosEmitidosNoAno`: certificados com `DATA_EMISSAO` no ano
        corrente, só de treinamentos com `emiteCertificado` verdadeiro. `pessoasComObrigatorioPendente`: pessoas
        distintas com **pendência** (definição única, na descrição da tag Treinamentos: treinamento obrigatório
        `EM_ANDAMENTO` em que a pessoa tem linha `INSCRITO` ou `EM_ANDAMENTO`). O "Prazos até 31/10" que o Figma mostra
        sob esse número **não existe** (treinamento não tem prazo): o cartão mostra só o número. Separar o encerrado do
        em andamento depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`).
      x-perfis: [RH]
      responses:
        '200':
          description: Indicadores.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoRhIndicadores' }
              example:
                emAndamento: 3
                obrigatorios: 4
                certificadosEmitidosNoAno: 134
                ano: 2026
                pessoasComObrigatorioPendente: 72
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/onboarding:
    get:
      tags: [Treinamentos]
      operationId: listarTreinamentosDeOnboarding
      summary: Lista os treinamentos de onboarding em vigor, para a caixa "Incluir no treinamento" do cadastro.
      description: |
        Tela 02 (adicionar colaborador, "Depois de salvar"): o texto da caixa é "Incluir no treinamento
        {`titulo`}". Em vigor = publicado, marcado como `onboarding` e **não encerrado** (pode ser agendado; um
        treinamento de onboarding encerrado deixa de receber gente nova; depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`)).
        Normalmente vem um só item. Lista vazia: o front deixa a caixa desligada, com a dica "Nenhum treinamento de
        onboarding publicado". Mais de um item: o texto vira "Incluir nos treinamentos de onboarding" e o cadastro
        inclui a pessoa em todos. Marcada a caixa, o front manda `incluirNoOnboarding: true` no cadastro (fatia 1); ver
        `incluirFuncionarioNoOnboarding` para o efeito.
      x-provisorio: >-
        Como o RH marca qual treinamento é o de onboarding. O Figma só mostra a caixa "Incluir no treinamento Onboarding 2026" e o selo "Onboarding" no cartão (tela 42), sem dizer como se escolhe. Hoje o contrato supõe a caixa `onboarding` no passo Detalhes, guardada em `TREINAMENTOS.TIPO_TREINAMENTO` (valor `ONBOARDING`, coluna livre que já existe), sem script novo. Se o dono quiser outra regra (por exemplo, um só treinamento por ano), muda `TreinamentoComando.onboarding` e esta rota.
      x-perfis: [RH]
      responses:
        '200':
          description: Treinamentos de onboarding em vigor (sem paginação; lista curta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoOnboardingLista' }
              example:
                itens:
                  - { id: 1, titulo: Onboarding 2026, comecaEm: '2026-01-01' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/publico/contagem:
    get:
      tags: [Treinamentos]
      operationId: contarPublicoDeTreinamento
      summary: Conta quantas pessoas o público escolhido alcança.
      description: |
        Passo Publicação ("Todos: 101 pessoas") e a nota "Aparece em Meus treinamentos de 101 pessoas a partir de
        15/10". Conta só pessoas **ativas cuja admissão já ocorreu** (as "Em admissão" entram depois, pela caixa
        `incluiAdmitidos`). `publico=TODOS` ignora as listas; `SETORES` usa `setorIds`; `PESSOAS` usa `funcionarioIds`.
        Para escolher setores o front usa `GET /api/rh/setores` e para marcar pessoas, `GET /api/rh/funcionarios`
        (fatia 1); esta rota só devolve o número.
      x-perfis: [RH]
      parameters:
        - name: publico
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TreinamentoPublico' }
        - name: setorIds
          in: query
          description: Ids dos setores (repita o parâmetro).
          schema: { type: array, items: { type: integer }, maxItems: 100 }
        - name: funcionarioIds
          in: query
          description: Ids das pessoas (repita o parâmetro).
          schema: { type: array, items: { type: integer }, maxItems: 500 }
      responses:
        '200':
          description: Número de pessoas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoPublicoContagem' }
              example: { total: 101 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- RH: um treinamento
  /api/rh/treinamentos/{treinamentoId}:
    get:
      tags: [Treinamentos]
      operationId: obterTreinamento
      summary: Mostra um treinamento completo, com os módulos, para editar.
      description: |
        Abre o assistente em edição ("Editar" no menu "..." da tela 22) e retoma um rascunho. Devolve os módulos com o
