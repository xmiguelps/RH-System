  # ---------------------------------------------------------------- RH: módulos
  /api/rh/treinamentos/{treinamentoId}/modulos:
    post:
      tags: [Treinamentos]
      operationId: adicionarModuloDeTreinamento
      summary: Acrescenta um módulo (vídeo, texto, link ou PDF) ao treinamento.
      description: |
        Passo Conteúdo, botões "Vídeo", "Arquivo PDF", "Texto" e "Link" (o botão "Aula presencial" não existe). Envio em
        `multipart/form-data`. O módulo entra no fim (`ordem` = último + 1). O que cada `tipo` exige (o banco confere, V001,
        `CHK_TREINAMENTOS_MODULOS_CONTEUDO`) e o que recusa com 400 em `errors`:
        `VIDEO`: `urlExterna`; `TEXTO`: `conteudoTexto` (texto ou markdown, nunca HTML);
        `LINK`: `urlExterna`; `PDF`: `arquivo` (PDF de até 10 MB, conferido pelo conteúdo e não só pela extensão).
        Campo que não pertence ao tipo é recusado. `urlExterna` precisa começar com `http://` ou `https://`.
        Só em **rascunho**: depois de publicado (inclusive o encerrado), 422 `TREINAMENTO_MODULOS_TRAVADOS` (a conclusão é
        por módulo e `CONCLUIDO` é definitivo; um módulo novo não reabriria quem já concluiu). O arquivo só é gravado no
        Blob depois de o banco aceitar o módulo. No módulo `PDF`, a API grava `CAMINHO_ARQUIVO` e `NOME_ARQUIVO_ORIGINAL`
        juntos (o nome que a pessoa deu ao arquivo, `V001`) e devolve só o nome, em `nomeArquivo`.
      x-provisorio: >-
        Duas decisões abertas. (1) Onde ficam os vídeos, arquivo no Blob ou link externo (roadmap, fatia 6): o contrato supõe a hipótese mais simples, só link externo; se o dono escolher o Blob, `VIDEO` passa a aceitar `arquivo` (a coluna `CAMINHO_ARQUIVO` já existe em V001). (2) Acrescentar módulo depois de publicado: hoje proibido; o dono pode preferir permitir, avisando o RH de que quem concluiu não volta.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/TreinamentoModuloComando' }
            encoding:
              arquivo: { contentType: application/pdf }
            example:
              titulo: Canais de denúncia da empresa
              tipo: PDF
              duracaoMinutos: 5
              arquivo: canais-de-denuncia.pdf
      responses:
        '201':
          description: Módulo criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoModuloRh' }
              example: { id: 23, ordem: 3, titulo: Canais de denúncia da empresa, tipo: PDF, duracaoMinutos: 5, urlExterna: null, conteudoTexto: null, nomeArquivo: canais-de-denuncia.pdf }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422': { $ref: '#/components/responses/TreinamentoErro422ModulosTravados' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

