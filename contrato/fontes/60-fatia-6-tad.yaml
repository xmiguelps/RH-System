  # ---------------------------------------------------------------- PÚBLICO: validar certificado
  /api/publico/certificados/{codigoValidacao}:
    get:
      tags: [Certificados]
      operationId: validarCertificado
      summary: Confere um certificado pelo código, sem precisar de login.
      description: |
        Pública. O código (`CODIGO_VALIDACAO`) é um **UUID versão 4** (aleatório, não enumerável) **gerado pela aplicação** ao
        criar o certificado, nunca o número sequencial do certificado. O trigger do banco cria a linha com `UUID()`, que é
        **versão 1** e **quase sequencial** (a parte de tempo cresce a cada código emitido e o resto é igual no mesmo
        servidor, então daria para adivinhar o vizinho de um código); por isso a aplicação **troca** esse código por um
        versão 4 antes de ele aparecer em qualquer resposta ou PDF. **O contrato não promete "o UUID que o banco gerou"**: o
        que vale é o código que a aplicação gravou. Além disso há o limite de consultas (10 por minuto por IP, 429), e a
        resposta mostra só o mínimo: quem recebeu, o treinamento e a data.
        Código que não existe, de treinamento com `emiteCertificado` falso ou de uma conclusão sem certificado: a mesma
        resposta 404 ("Certificado não encontrado"). **Certificado emitido nunca é apagado**: o treinamento que o emitiu
        não pode ser excluído (`excluirTreinamento`, 422 `TREINAMENTO_COM_CERTIFICADOS`; só se encerra), e encerrar não
        afeta o certificado. Por isso o caso "certificado apagado" não existe aqui e um código válido continua válido.
        Não existe tela para isso no Figma; sugere-se uma página pública simples com um campo de código e o resultado.
      x-provisorio: >-
        Modelo visual do certificado e formato do número (roadmap, fatia 6). O PDF deve trazer o código e o endereço da página de conferência; o texto exato é do back-end.
      x-perfis: [Publico]
      security: []
      parameters:
        - name: codigoValidacao
          in: path
          required: true
          description: Código de validação impresso no certificado (UUID versão 4, gerado pela aplicação).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Certificado válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificadoValidacaoResposta' }
              example:
                codigoValidacao: a7f3c1d2-5e9b-4c68-b2d1-8f04e6a93b57
                titularNome: Bruno Lima
                treinamentoTitulo: LGPD na prática
                emitidoEm: '2026-09-15'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '404':
          description: Certificado não encontrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Certificado não encontrado.
                status: 404
                detail: Não encontramos um certificado com este código.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
        '429': { $ref: '#/components/responses/Erro429MuitasTentativas' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

components:
  parameters:
    TreinamentoId:
      name: treinamentoId
      in: path
      required: true
      schema: { type: integer }
    TreinamentoModuloId:
      name: moduloId
      in: path
      required: true
      schema: { type: integer }
    TreinamentoFuncionarioId:
      name: funcionarioId
      in: path
      required: true
      description: Id da pessoa.
      schema: { type: integer }
    TreinamentoConfirmar:
      name: confirmar
      in: query
      description: |
        Confirmação do RH (seção 13 das convenções). Sem ele (ou `false`), a operação só executa quando não há nada a
        perder; havendo gente que ainda não concluiu, responde 409 `CONFIRMACAO_NECESSARIA`. Com `true`, executa.
        Não contorna a exclusão de treinamento com certificado emitido (422 `TREINAMENTO_COM_CERTIFICADOS`, que vale com
        ou sem este parâmetro).
      schema: { type: boolean, default: false }

  responses:
    TreinamentoErro422ModulosTravados:
      description: O treinamento já foi publicado e a lista de módulos não muda mais (acrescentar, reordenar ou excluir módulo); vale também para o encerrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Operação recusada.
            status: 422
            codigo: TREINAMENTO_MODULOS_TRAVADOS
            detail: Este treinamento já foi publicado. Não dá mais para acrescentar, reordenar nem excluir módulos; só corrigir o conteúdo deles.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    TreinamentoErro422ModuloCampoTravado:
      description: O treinamento já foi publicado e o tipo do módulo não muda mais (os outros campos do módulo ainda se corrigem).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Operação recusada.
            status: 422
            codigo: TREINAMENTO_CAMPO_TRAVADO
            detail: Depois de publicado, o tipo do módulo não muda. Dá para corrigir o título, a duração e o conteúdo.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    TreinamentoErro422InscricaoPendente:
      description: Treinamento opcional em que a pessoa ainda não se inscreveu.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          example:
            title: Operação recusada.
            status: 422
            codigo: INSCRICAO_PENDENTE
            detail: Inscreva-se no treinamento antes de começar.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    TreinamentoErro409ConfirmacaoEncerrar:
      description: Há pessoas que ainda não concluíram; nada foi encerrado. Repita a chamada com `confirmar=true` para encerrar.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TreinamentoProblemaConfirmacao' }
          example:
            title: Confirmação necessária.
            status: 409
            codigo: CONFIRMACAO_NECESSARIA
            detail: 38 pessoas ainda não concluíram este treinamento. Confirme para encerrar.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            pendentes: 38
            emAndamento: 21
            naoIniciaram: 17
    TreinamentoErro409ConfirmacaoExcluir:
      description: O treinamento não emitiu certificado, mas há pessoas que ainda não concluíram; nada foi excluído. Repita a chamada com `confirmar=true` para excluir.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TreinamentoProblemaConfirmacao' }
          example:
            title: Confirmação necessária.
            status: 409
            codigo: CONFIRMACAO_NECESSARIA
            detail: 9 pessoas ainda não concluíram este treinamento. Confirme para excluir.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            pendentes: 9
            emAndamento: 4
            naoIniciaram: 5
    TreinamentoErro422ComCertificados:
      description: O treinamento já emitiu certificado e não pode ser excluído (só encerrado); nada foi excluído, com ou sem `confirmar=true`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TreinamentoProblemaComCertificados' }
          example:
            title: Operação recusada.
            status: 422
            codigo: TREINAMENTO_COM_CERTIFICADOS
            detail: Este treinamento já emitiu 63 certificados e não pode ser excluído. Encerre o treinamento para que ninguém novo entre.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            certificadosEmitidos: 63

  schemas:
    # ------------------------------------------------------------ enums
    TreinamentoSituacao:
      type: string
      description: Situação do treinamento, calculada com a data de hoje (-03:00). `RASCUNHO` não está publicado; `AGENDADO` está publicado e `comecaEm` ainda não chegou; `EM_ANDAMENTO` está publicado, `comecaEm` já chegou e o RH não encerrou; `ENCERRADO` o RH encerrou (`encerradoEmUtc`; depende da coluna nova `TREINAMENTOS.ENCERRADO_EM`, script `V001`). Não há situação por data final (treinamento não tem prazo).
      enum: [RASCUNHO, AGENDADO, EM_ANDAMENTO, ENCERRADO]
    TreinamentoPublico:
      type: string
      description: Para quem vale o treinamento (`TREINAMENTOS.PUBLICO`, V001). Não existe "por cargo".
      enum: [TODOS, SETORES, PESSOAS]
    TreinamentoModuloTipo:
      type: string
      description: Tipo do módulo (V001). `Aula presencial` do Figma não existe.
      enum: [VIDEO, TEXTO, LINK, PDF]
    TreinamentoParticipanteSituacao:
      type: string
      description: Situação da pessoa num treinamento, igual a `STATUS_TREINAMENTO`. `INSCRITO` é "Não iniciado" no Figma. `REPROVADO` e `CANCELADO` existem no banco e a API não os usa.
      enum: [INSCRITO, EM_ANDAMENTO, CONCLUIDO]
    TreinamentoMinhaSituacao:
      type: string
      description: |
        Situação para a pessoa logada. `DISPONIVEL`: opcional do público dela em que ainda não se inscreveu (botão "Quero me
        inscrever"). `NAO_INICIADO`: tem linha `INSCRITO` ("Começar"). `EM_ANDAMENTO` ("Continuar"; vale também para quem
        estava em andamento quando o RH encerrou o treinamento). `CONCLUIDO`. Não há valor "encerrado": o treinamento
        encerrado some para quem não o começou (ver `encerrarTreinamento`).
      enum: [DISPONIVEL, NAO_INICIADO, EM_ANDAMENTO, CONCLUIDO]
    TreinamentoAbaMeus:
      type: string
      description: Abas da tela "Meus treinamentos". `TODOS` não inclui os concluídos.
      enum: [TODOS, DISPONIVEIS, EM_ANDAMENTO, CONCLUIDOS]

    # ------------------------------------------------------------ RH: criar e editar
    TreinamentoComando:
      type: object
      description: |
        Dados do treinamento (passos Detalhes, Avaliação e certificado e Publicação do assistente). Só `titulo` é
        obrigatório para guardar como rascunho; para publicar, ver `publicarTreinamento`.
      required: [titulo]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 200 }
        descricao: { type: [string, 'null'], maxLength: 2000, description: Texto ou markdown (nunca HTML). }
        comecaEm: { type: [string, 'null'], format: date, description: 'Data em que o acesso é liberado ("Começa em"; `DATA_INICIO`). Data futura deixa o treinamento `AGENDADO` até lá. Não é prazo: treinamento não tem data final (o campo "Termina em" do Figma não existe).' }
        obrigatorio:
          type: boolean
          default: false
          description: Obrigatório. Quem não concluir aparece como pendente para o RH e para o gestor enquanto o treinamento está em andamento (o "até o fim" do texto do Figma não existe).
        onboarding:
          type: boolean
          default: false
          description: É o treinamento de onboarding (alvo da caixa "Incluir no treinamento" do cadastro).
          x-provisorio: >-
            Como o RH marca o treinamento de onboarding; o Figma não desenha esta caixa. Guardada em `TREINAMENTOS.TIPO_TREINAMENTO` (valor `ONBOARDING`), sem script novo.
        emiteCertificado:
          type: boolean
          default: true
          description: Caixa "Emitir certificado com código de validação ao concluir". Não muda depois de publicado.
        publico:
          oneOf:
            - { $ref: '#/components/schemas/TreinamentoPublico' }
            - { type: 'null' }
          description: Para quem vale ("Quem deve fazer"). `null` enquanto o RH não escolheu (só em rascunho).
        setorIds:
          type: array
          description: Só com `publico = SETORES`. Um ou mais setores.
          items: { type: integer }
          uniqueItems: true
          maxItems: 100
          default: []
        funcionarioIds:
          type: array
          description: Só com `publico = PESSOAS`. As pessoas escolhidas.
          items: { type: integer }
          uniqueItems: true
          maxItems: 500
          default: []
        incluiAdmitidos: { type: boolean, default: true, description: 'Caixa "Incluir quem for admitido depois" (o Figma diz "até o fim"; sem prazo, vale enquanto o treinamento não for encerrado). Só tem efeito em obrigatório.' }

    TreinamentoSetorResumo:
      type: object
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }

    TreinamentoModuloRh:
      type: object
      description: Módulo, como o RH o vê (com o conteúdo, para editar).
      required: [id, ordem, titulo, tipo, duracaoMinutos, urlExterna, conteudoTexto, nomeArquivo]
      properties:
        id: { type: integer }
        ordem: { type: integer, minimum: 1, description: "Posição, a partir de 1, sem buracos." }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TreinamentoModuloTipo' }
        duracaoMinutos: { type: [integer, 'null'], minimum: 1, description: 'Duração estimada ("15 minutos").' }
        urlExterna: { type: [string, 'null'], description: Endereço do vídeo ou do link. }
        conteudoTexto: { type: [string, 'null'], description: "Texto do módulo (texto ou markdown, nunca HTML)." }
        nomeArquivo: { type: [string, 'null'], description: 'Nome que a pessoa deu ao PDF enviado, guardado em `TREINAMENTOS_MODULOS.NOME_ARQUIVO_ORIGINAL` (script `V001`); `null` em módulo sem arquivo (vídeo, texto e link). Não vem do `CAMINHO_ARQUIVO`, que é interno e nunca é devolvido.' }

    TreinamentoModulosRh:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoModuloRh' }

    TreinamentoModuloComando:
      type: object
      description: |
        Corpo `multipart/form-data` de um módulo. O que cada `tipo` pede: `VIDEO` e `LINK` pedem `urlExterna`; `TEXTO`
        pede `conteudoTexto`; `PDF` pede `arquivo` (PDF de até 10 MB). Campo de outro tipo é recusado com 400.
      required: [titulo, tipo]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        tipo: { $ref: '#/components/schemas/TreinamentoModuloTipo' }
        duracaoMinutos: { type: [integer, 'null'], minimum: 1, maximum: 32767 }
        urlExterna: { type: [string, 'null'], maxLength: 500, pattern: '^https?://', description: "Começa com http:// ou https://." }
        conteudoTexto: { type: [string, 'null'], maxLength: 50000, description: Texto ou markdown (nunca HTML). }
        arquivo: { type: string, format: binary, description: PDF de até 10 MB. }

    TreinamentoModulosOrdemComando:
      type: object
      required: [moduloIds]
      properties:
        moduloIds:
          type: array
          description: Todos os ids dos módulos, na nova ordem.
          items: { type: integer }
          minItems: 1
          uniqueItems: true

    TreinamentoRh:
      type: object
      description: Treinamento completo, como o RH o vê.
      required: [id, titulo, obrigatorio, onboarding, emiteCertificado, publicado, situacao, encerradoEmUtc, setores, pessoas, incluiAdmitidos, modulos]
      properties:
        id: { type: integer }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        comecaEm: { type: [string, 'null'], format: date }
        encerradoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que o RH encerrou o treinamento (`encerrarTreinamento`); `null` enquanto não encerrado. Depende da coluna nova `TREINAMENTOS.ENCERRADO_EM` (script `V001`; ver `encerrarTreinamento`).' }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        emiteCertificado: { type: boolean }
        publicado: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoSituacao' }
        publico:
          oneOf:
            - { $ref: '#/components/schemas/TreinamentoPublico' }
            - { type: 'null' }
        setores:
          type: array
          description: Setores escolhidos (com `publico = SETORES`); senão, vazio.
          items: { $ref: '#/components/schemas/TreinamentoSetorResumo' }
        pessoas:
          type: array
          description: Pessoas escolhidas (com `publico = PESSOAS`); senão, vazio.
          items: { $ref: '#/components/schemas/FuncionarioResumo' }
        incluiAdmitidos: { type: boolean }
        modulos:
          type: array
          description: Módulos em ordem.
          items: { $ref: '#/components/schemas/TreinamentoModuloRh' }

    # ------------------------------------------------------------ RH: lista, indicadores, quem fez
    TreinamentoRhResumo:
      type: object
      description: Uma linha da lista de treinamentos (tela 22).
      required: [id, titulo, obrigatorio, onboarding, emiteCertificado, situacao, comecaEm, encerradoEmUtc, publico, totalModulos, totalParticipantes, concluidos, certificadosEmitidos]
      properties:
        id: { type: integer }
        titulo: { type: string }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        emiteCertificado: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoSituacao' }
        comecaEm: { type: [string, 'null'], format: date }
        encerradoEmUtc: { type: [string, 'null'], format: date-time, description: 'Quando o RH encerrou; `null` enquanto não encerrado (coluna nova `TREINAMENTOS.ENCERRADO_EM`, script `V001`).' }
        publico:
          oneOf:
            - { $ref: '#/components/schemas/TreinamentoPublico' }
            - { type: 'null' }
        totalModulos: { type: integer, minimum: 0 }
        totalParticipantes: { type: integer, minimum: 0, description: Pessoas com linha no treinamento. }
        concluidos: { type: integer, minimum: 0, description: Pessoas com `CONCLUIDO`. }
        certificadosEmitidos: { type: integer, minimum: 0, description: 'Certificados já emitidos: igual a `concluidos` quando `emiteCertificado` é verdadeiro e **0** quando é falso (o trigger do banco cria a linha do certificado em toda conclusão, mas a API a trata como inexistente quando o treinamento não emite). Maior que zero: "Excluir" fica desabilitado no menu "..." ("Treinamento com certificado emitido só pode ser encerrado"), porque `excluirTreinamento` responderia 422 `TREINAMENTO_COM_CERTIFICADOS`.' }

    TreinamentoRhContagens:
      type: object
      description: Número de cada aba da lista.
      required: [todos, rascunhos, agendados, emAndamento, encerrados]
      properties:
        todos: { type: integer, minimum: 0 }
        rascunhos: { type: integer, minimum: 0 }
        agendados: { type: integer, minimum: 0 }
        emAndamento: { type: integer, minimum: 0 }
        encerrados: { type: integer, minimum: 0 }

    TreinamentoRhLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, contagens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/TreinamentoRhResumo' }
            contagens: { $ref: '#/components/schemas/TreinamentoRhContagens' }

    TreinamentoRhIndicadores:
      type: object
      required: [emAndamento, obrigatorios, certificadosEmitidosNoAno, ano, pessoasComObrigatorioPendente]
      properties:
        emAndamento: { type: integer, minimum: 0 }
        obrigatorios: { type: integer, minimum: 0 }
        certificadosEmitidosNoAno: { type: integer, minimum: 0 }
        ano: { type: integer, description: 'Ano de `certificadosEmitidosNoAno` (o "em 2026" do rótulo).' }
        pessoasComObrigatorioPendente: { type: integer, minimum: 0, description: 'Pessoas distintas com pendência (definição única na tag Treinamentos). Sem prazo, o cartão não tem o "Prazos até".' }

    TreinamentoPublicoContagem:
      type: object
      required: [total]
      properties:
        total: { type: integer, minimum: 0 }

    TreinamentoParticipantesCabecalho:
      type: object
      description: O treinamento aberto em "Quem fez" (título e a linha "Obrigatório para todos, com certificado, desde 01/08"; o fim do período do Figma não existe).
      required: [id, titulo, obrigatorio, onboarding, emiteCertificado, situacao, comecaEm, encerradoEmUtc, publico, totalModulos]
      properties:
        id: { type: integer }
        titulo: { type: string }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        emiteCertificado: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoSituacao' }
        comecaEm: { type: [string, 'null'], format: date }
        encerradoEmUtc: { type: [string, 'null'], format: date-time, description: 'Quando o RH encerrou; `null` enquanto não encerrado.' }
        publico:
          oneOf:
            - { $ref: '#/components/schemas/TreinamentoPublico' }
            - { type: 'null' }
        totalModulos: { type: integer, minimum: 0 }

    TreinamentoParticipantesContagens:
      type: object
      description: Os três números do topo de "Quem fez" e o total.
      required: [total, concluidos, emAndamento, naoIniciados]
      properties:
        total: { type: integer, minimum: 0 }
        concluidos: { type: integer, minimum: 0, description: '"Concluíram".' }
        emAndamento: { type: integer, minimum: 0, description: '"Em andamento".' }
        naoIniciados: { type: integer, minimum: 0, description: '"Não iniciaram" (`INSCRITO`).' }

    TreinamentoParticipante:
      type: object
      description: Uma linha de "Quem fez" (RH).
      required: [funcionario, situacao, iniciadoEm, concluidoEmUtc, modulosConcluidos, certificadoDisponivel]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        situacao: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        iniciadoEm: { type: [string, 'null'], format: date, description: '`DATA_INICIO` da linha (o banco guarda só o dia).' }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu (a hora em que concluiu o último módulo, `TREINAMENTOS_MODULOS_PROGRESSO.DATA_CONCLUSAO`). Conclusão anterior aos módulos (sem linha de progresso): o dia de `DATA_CONCLUSAO` à 00:00 no fuso -03:00. O front mostra só o dia, em `America/Sao_Paulo`.' }
        modulosConcluidos: { type: integer, minimum: 0 }
        certificadoDisponivel: { type: boolean, description: Verdadeiro só quando concluiu e o treinamento emite certificado (mostra "Baixar"). }

    TreinamentoParticipantesLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [treinamento, contagens, itens]
          properties:
            treinamento: { $ref: '#/components/schemas/TreinamentoParticipantesCabecalho' }
            contagens: { $ref: '#/components/schemas/TreinamentoParticipantesContagens' }
            itens:
              type: array
              items: { $ref: '#/components/schemas/TreinamentoParticipante' }

    TreinamentoProblemaConfirmacao:
      description: |
        Corpo do 409 `CONFIRMACAO_NECESSARIA` ao encerrar ou excluir um treinamento (seção 13 das convenções). Nada foi
        feito: o front mostra os números e, se o RH confirmar, repete a chamada com `confirmar=true`. A forma é a mesma
        nas duas operações: ao excluir, o caso de certificado emitido **não** é 409, é o 422
        `TREINAMENTO_COM_CERTIFICADOS` (`TreinamentoProblemaComCertificados`).
      allOf:
        - $ref: '#/components/schemas/ProblemaDeApi'
        - type: object
          required: [pendentes, emAndamento, naoIniciaram]
          properties:
            codigo: { type: string, enum: [CONFIRMACAO_NECESSARIA] }
            pendentes: { type: integer, minimum: 0, description: 'Pessoas com linha `INSCRITO` ou `EM_ANDAMENTO` num treinamento já liberado (é `emAndamento` + `naoIniciaram`). Treinamento ainda agendado tem 0: ninguém o viu.' }
            emAndamento: { type: integer, minimum: 0, description: 'Pessoas que já começaram e não terminaram. Ao encerrar, continuam e terminam; ao excluir, perdem o andamento.' }
            naoIniciaram: { type: integer, minimum: 0, description: 'Pessoas inscritas que não começaram. Ao encerrar, deixam de poder começar; ao excluir, a linha some.' }

    TreinamentoProblemaComCertificados:
      description: |
        Corpo do 422 `TREINAMENTO_COM_CERTIFICADOS` ao excluir um treinamento que já emitiu certificado (só se encerra).
        Nada foi apagado e o `confirmar=true` não contorna.
      allOf:
        - $ref: '#/components/schemas/ProblemaDeRegraDeNegocio'
        - type: object
          required: [certificadosEmitidos]
          properties:
            codigo: { type: string, enum: [TREINAMENTO_COM_CERTIFICADOS] }
            certificadosEmitidos: { type: integer, minimum: 1, description: 'Certificados já emitidos (conclusões num treinamento que emite certificado): o mesmo número de `certificadosEmitidos` da linha em `listarTreinamentos`.' }

    # ------------------------------------------------------------ RH: ficha, onboarding
    TreinamentoFichaResumo:
      type: object
      required: [pendentes, emAndamento, concluidos]
      properties:
        pendentes: { type: integer, minimum: 0, description: "Pendências pela definição única da tag Treinamentos: obrigatório `EM_ANDAMENTO` em que a pessoa está `INSCRITO` ou `EM_ANDAMENTO`. Treinamento não tem prazo." }
        emAndamento: { type: integer, minimum: 0 }
        concluidos: { type: integer, minimum: 0 }

    TreinamentoFichaRhItem:
      type: object
      description: Um treinamento na aba da ficha, para o RH.
      required: [treinamentoId, titulo, obrigatorio, onboarding, situacao, iniciadoEm, concluidoEmUtc, modulosConcluidos, totalModulos, certificadoDisponivel]
      properties:
        treinamentoId: { type: integer }
        titulo: { type: string }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        iniciadoEm: { type: [string, 'null'], format: date }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu (mesma regra de `TreinamentoParticipante.concluidoEmUtc`).' }
        modulosConcluidos: { type: integer, minimum: 0 }
        totalModulos: { type: integer, minimum: 0 }
        certificadoDisponivel: { type: boolean }

    TreinamentoFichaRhResposta:
      type: object
      required: [resumo, itens]
      properties:
        resumo: { $ref: '#/components/schemas/TreinamentoFichaResumo' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoFichaRhItem' }

    TreinamentoOnboardingItem:
      type: object
      required: [id, titulo, comecaEm]
      properties:
        id: { type: integer }
        titulo: { type: string }
        comecaEm: { type: [string, 'null'], format: date }

    TreinamentoOnboardingLista:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoOnboardingItem' }

    TreinamentoOnboardingInclusaoItem:
      type: object
      required: [treinamentoId, titulo, jaEstavaIncluida]
      properties:
        treinamentoId: { type: integer }
        titulo: { type: string }
        jaEstavaIncluida: { type: boolean }

    TreinamentoOnboardingInclusaoResposta:
      type: object
      required: [funcionarioId, treinamentos]
      properties:
        funcionarioId: { type: integer }
        treinamentos:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoOnboardingInclusaoItem' }

    # ------------------------------------------------------------ EU: cartões, módulos, certificado
    CertificadoResumo:
      type: object
      description: O certificado da pessoa neste treinamento (só existe quando concluiu e o treinamento emite certificado).
      required: [numero, codigoValidacao, emitidoEm]
      properties:
        numero:
          type: string
          description: >-
            Número amigável mostrado na tela e no PDF: `CERT-{ano de emissão}-{id do certificado com 5 dígitos}`, calculado sem coluna nova.
            Decisão do dono (2026-11-02): fica este formato, sem sigla por treinamento (o Figma mostra `LGPD-2026-00482`, que exigiria uma sigla que o banco não guarda).
        codigoValidacao: { type: string, format: uuid, description: 'UUID versão 4 gerado pela aplicação ao criar o certificado (`CODIGO_VALIDACAO`); é o que a conferência pública aceita. Não é o UUID versão 1 que o trigger do banco gera: a aplicação o troca (ver `validarCertificado`).' }
        emitidoEm: { type: string, format: date, description: '`DATA_EMISSAO`.' }

    TreinamentoMeuCartao:
      type: object
      description: Cartão de "Meus treinamentos".
      required: [id, titulo, descricao, obrigatorio, onboarding, situacao, encerrado, comecaEm, totalModulos, duracaoTotalMinutos, modulosConcluidos, progressoPercentual, moduloAtual, iniciadoEm, concluidoEmUtc, certificado]
      properties:
        id: { type: integer }
        titulo: { type: string }
        descricao: { type: [string, 'null'] }
        obrigatorio: { type: boolean, description: O selo é "Obrigatório" ou "Opcional"; com `onboarding` verdadeiro o selo é "Onboarding". }
        onboarding: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoMinhaSituacao' }
        encerrado: { type: boolean, description: 'Verdadeiro quando o RH encerrou o treinamento (`encerrarTreinamento`). Só vem verdadeiro em cartão `EM_ANDAMENTO` (a pessoa continua e termina) ou `CONCLUIDO`. O front pode avisar "Encerrado pelo RH; você ainda pode terminar". A pendência e a faixa "Sua parte" ignoram cartão encerrado.' }
        comecaEm: { type: [string, 'null'], format: date, description: 'Dia em que o acesso foi liberado. Não é prazo: o cartão não tem "Até 15/11" nem "De 20/10 a 20/11".' }
        totalModulos: { type: integer, minimum: 0, description: '"5 módulos" (o Figma às vezes diz "aulas": use "módulos").' }
        duracaoTotalMinutos: { type: [integer, 'null'], minimum: 0, description: 'Soma das durações dos módulos que têm duração ("1h40"); `null` se nenhum tem.' }
        modulosConcluidos: { type: integer, minimum: 0 }
        progressoPercentual: { type: integer, minimum: 0, maximum: 100, description: '`modulosConcluidos` / `totalModulos`, arredondado para baixo.' }
        moduloAtual: { type: [integer, 'null'], minimum: 1, description: '`ordem` do primeiro módulo ainda não concluído; `null` quando todos foram.' }
        iniciadoEm: { type: [string, 'null'], format: date }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu o treinamento (mesma regra de `TreinamentoParticipante.concluidoEmUtc`); `null` se não concluiu. O front mostra só o dia.' }
        certificado:
          oneOf:
            - { $ref: '#/components/schemas/CertificadoResumo' }
            - { type: 'null' }

    TreinamentoMeusContagens:
      type: object
      description: Número de cada aba de "Meus treinamentos".
      required: [todos, disponiveis, emAndamento, concluidos]
      properties:
        todos: { type: integer, minimum: 0, description: Tudo que ainda não foi concluído. }
        disponiveis: { type: integer, minimum: 0 }
        emAndamento: { type: integer, minimum: 0 }
        concluidos: { type: integer, minimum: 0 }

    TreinamentoMeuLista:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, contagens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/TreinamentoMeuCartao' }
            contagens: { $ref: '#/components/schemas/TreinamentoMeusContagens' }

    TreinamentoModuloEu:
      type: object
      description: Um módulo na lista da tela de execução (sem o conteúdo).
      required: [id, ordem, titulo, tipo, duracaoMinutos, concluido, concluidoEmUtc]
      properties:
        id: { type: integer }
        ordem: { type: integer, minimum: 1 }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TreinamentoModuloTipo' }
        duracaoMinutos: { type: [integer, 'null'], minimum: 1 }
        concluido: { type: boolean }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: '`DATA_CONCLUSAO` do progresso do módulo (instante; o banco guarda em -03:00 e a API converte para UTC).' }

    TreinamentoMeuDetalhe:
      allOf:
        - $ref: '#/components/schemas/TreinamentoMeuCartao'
        - type: object
          required: [modulos]
          properties:
            modulos:
              type: array
              items: { $ref: '#/components/schemas/TreinamentoModuloEu' }

    TreinamentoModuloConteudo:
      type: object
      description: O módulo aberto na tela de execução.
      required: [id, ordem, titulo, tipo, duracaoMinutos, conteudoTexto, urlExterna, temArquivo, concluido, concluidoEmUtc]
      properties:
        id: { type: integer }
        ordem: { type: integer, minimum: 1 }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TreinamentoModuloTipo' }
        duracaoMinutos: { type: [integer, 'null'], minimum: 1 }
        conteudoTexto: { type: [string, 'null'], description: "Só em `TEXTO` (texto ou markdown, nunca HTML)." }
        urlExterna: { type: [string, 'null'], description: Só em `VIDEO` e `LINK`; abre em nova aba. }
        temArquivo: { type: boolean, description: Verdadeiro em `PDF`; o arquivo vem por `baixarArquivoDeModulo`. }
        concluido: { type: boolean }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu este módulo; `null` se ainda não concluiu.' }

    TreinamentoModuloConclusaoResposta:
      type: object
      required: [moduloId, treinamentoConcluido, treinamento]
      properties:
        moduloId: { type: integer }
        treinamentoConcluido: { type: boolean, description: Verdadeiro quando este módulo era o último que faltava e o treinamento passou a `CONCLUIDO`. }
        treinamento: { $ref: '#/components/schemas/TreinamentoMeuDetalhe' }

    # ------------------------------------------------------------ GESTOR
    TreinamentoGestorResumo:
      type: object
      description: Um treinamento na lista da equipe (tela 58).
      required: [id, titulo, obrigatorio, onboarding, situacao, comecaEm, totalNaEquipe, concluiram, inscritos]
      properties:
        id: { type: integer }
        titulo: { type: string }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoSituacao' }
        comecaEm: { type: [string, 'null'], format: date, description: 'Dia da liberação ("Começa em 03/11" no agendado). Não há data final.' }
        totalNaEquipe: { type: integer, minimum: 0, description: 'Obrigatório: pessoas da equipe com linha. Opcional: pessoas do setor que estão no público.' }
        concluiram: { type: integer, minimum: 0 }
        inscritos: { type: integer, minimum: 0, description: Pessoas da equipe com linha (em obrigatório é igual a `totalNaEquipe`). }

    TreinamentoGestorLista:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoGestorResumo' }

    TreinamentoGestorPessoa:
      type: object
      description: Uma pessoa da equipe em "Quem fez" (sem nota e sem certificado).
      required: [funcionario, situacao, concluidoEmUtc, modulosConcluidos, totalModulos, moduloAtual, emFeriasAte]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        situacao: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu (mesma regra de `TreinamentoParticipante.concluidoEmUtc`); o front mostra "em 20/08".' }
        modulosConcluidos: { type: integer, minimum: 0 }
        totalModulos: { type: integer, minimum: 0 }
        moduloAtual: { type: [integer, 'null'], minimum: 1, description: '`ordem` do primeiro módulo ainda não concluído; `null` quando concluiu.' }
        emFeriasAte: { type: [string, 'null'], format: date, description: "Último dia das férias, se a pessoa está de férias hoje (lido de `FERIAS`)." }

    TreinamentoGestorEquipeResposta:
      type: object
      required: [treinamento, concluiram, faltamConcluir, itens]
      properties:
        treinamento: { $ref: '#/components/schemas/TreinamentoGestorResumo' }
        concluiram: { type: integer, minimum: 0 }
        faltamConcluir: { type: integer, minimum: 0 }
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoGestorPessoa' }

    TreinamentoFichaGestorItem:
      type: object
      description: Um treinamento na aba da ficha, para o gestor (sem certificado).
      required: [treinamentoId, titulo, obrigatorio, onboarding, situacao, iniciadoEm, concluidoEmUtc, modulosConcluidos, totalModulos]
      properties:
        treinamentoId: { type: integer }
        titulo: { type: string }
        obrigatorio: { type: boolean }
        onboarding: { type: boolean }
        situacao: { $ref: '#/components/schemas/TreinamentoParticipanteSituacao' }
        iniciadoEm: { type: [string, 'null'], format: date }
        concluidoEmUtc: { type: [string, 'null'], format: date-time, description: 'Instante em que a pessoa concluiu (mesma regra de `TreinamentoParticipante.concluidoEmUtc`).' }
        modulosConcluidos: { type: integer, minimum: 0 }
        totalModulos: { type: integer, minimum: 0 }

    TreinamentoFichaGestorResposta:
      type: object
      required: [resumo, itens]
      properties:
        resumo: { $ref: '#/components/schemas/TreinamentoFichaResumo' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/TreinamentoFichaGestorItem' }

    # ------------------------------------------------------------ PÚBLICO
    CertificadoValidacaoResposta:
      type: object
      description: O mínimo que a conferência pública mostra.
      required: [codigoValidacao, titularNome, treinamentoTitulo, emitidoEm]
      properties:
        codigoValidacao: { type: string, format: uuid }
        titularNome: { type: string, description: Nome de quem concluiu. }
        treinamentoTitulo: { type: string }
        emitidoEm: { type: string, format: date }
