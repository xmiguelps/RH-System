  /api/rh/treinamentos/{treinamentoId}/encerrar:
    post:
      tags: [Treinamentos]
      operationId: encerrarTreinamento
      summary: Encerra o treinamento (ninguém novo entra; quem já começou pode terminar).
      description: |
        Item "Encerrar" do menu "..." da tela 22. Só vale para treinamento `EM_ANDAMENTO` (publicado, já liberado, não
        encerrado): rascunho e agendado se excluem (`excluirTreinamento`), e não se encerra de novo (422
        `TREINAMENTO_NAO_ESTA_EM_ANDAMENTO` e `TREINAMENTO_ENCERRADO`). Sem corpo. Grava `encerradoEmUtc` (agora) e a
        situação passa a `ENCERRADO`, na hora, sem agendador. **Não há rota para reabrir.**

        **Confirmação** (seção 13 das convenções): se há pessoas com linha `INSCRITO` ou `EM_ANDAMENTO` (`pendentes`), a
        primeira chamada devolve 409 `CONFIRMACAO_NECESSARIA` com `pendentes`, `emAndamento` e `naoIniciaram`, sem
        encerrar. O front mostra o aviso e repete a chamada com `confirmar=true`, que executa. Sem pendentes, encerra
        direto.

        **O que acontece depois** (decidido pelo dono, 2026-10-30):
        - **Quem já começou (`EM_ANDAMENTO`) continua e termina:** conclui os módulos e, ao concluir o último, recebe o
          certificado (se `emiteCertificado`) e aparece em "Quem fez" como `CONCLUIDO`. O cartão dele em "Meus
          treinamentos" passa a vir com `encerrado: true`.
        - **Quem estava `INSCRITO` e não começou deixa de poder começar:** o treinamento some de "Meus treinamentos" dele
          e `iniciarMeuTreinamento` e `concluirModuloDeTreinamento` respondem 422 `TREINAMENTO_ENCERRADO`. A linha fica
          no banco e em "Quem fez" como "Não iniciado".
        - **Ninguém novo entra:** o treinamento opcional não aceita inscrição (422 `TREINAMENTO_ENCERRADO`), a caixa
          `incluiAdmitidos` deixa de incluir quem for admitido e ele sai de `listarTreinamentosDeOnboarding` (o
          cadastro e a importação não o incluem mais).
        - **Deixa de ser pendência:** ninguém aparece como pendente por causa dele (indicadores, fichas, painel).
        - Os certificados já emitidos continuam valendo e o conteúdo continua aberto a quem tem acesso ("Rever
          conteúdo"). Como um certificado emitido impede a exclusão (`excluirTreinamento`), **encerrar é a única saída**
          de um treinamento que já emitiu certificado. O evento entra na auditoria (`TREINAMENTOS`, `ALTEROU`; a
          auditoria é tabela nova da aplicação, script `V001`).

        **Depende do script `V001`**: `TREINAMENTOS.ENCERRADO_EM DATETIME NULL` (o banco guarda o horário em -03:00; a
        conversão para `encerradoEmUtc` é do back-end; um `CHECK` só deixa encerrar o que foi publicado). A coluna
        `DATA_FIM` ("prazo", V001) fica sem uso e nula.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/TreinamentoConfirmar' }
      responses:
        '200':
          description: Treinamento encerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoRh' }
              example:
                id: 5
                titulo: Armazenagem segura (NR-11)
                descricao: Regras de circulação, carga e uso seguro de empilhadeira no armazém.
                comecaEm: '2026-03-10'
                encerradoEmUtc: '2026-03-14T20:00:00Z'
                obrigatorio: true
                onboarding: false
                emiteCertificado: true
                publicado: true
                situacao: ENCERRADO
                publico: SETORES
                setores:
                  - { id: 6, nome: Logística }
                pessoas: []
                incluiAdmitidos: false
                modulos:
                  - { id: 51, ordem: 1, titulo: Regras de circulação no armazém, tipo: TEXTO, duracaoMinutos: 20, urlExterna: null, conteudoTexto: "Sentido das vias, velocidade máxima e prioridade de quem está carregado.", nomeArquivo: null }
                  - { id: 52, ordem: 2, titulo: Checklist de inspeção da empilhadeira, tipo: PDF, duracaoMinutos: 10, urlExterna: null, conteudoTexto: null, nomeArquivo: checklist-empilhadeira.pdf }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/TreinamentoErro409ConfirmacaoEncerrar' }
        '422':
          description: O treinamento não está em andamento (é rascunho ou agendado) ou já foi encerrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
