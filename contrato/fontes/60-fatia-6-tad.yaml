    delete:
      tags: [Treinamentos]
      operationId: excluirTreinamento
      summary: Exclui um treinamento que ainda não emitiu certificado, com confirmação quando há gente que não terminou.
      description: |
        Item "Excluir" do menu "..." da tela 22. A exclusão é **física** (não há ocultação) e apaga tudo, e **só vale
        enquanto nenhum certificado foi emitido** (decisão do dono, 2026-10-30; `CONVENCOES.md`, seção 13):

        - **Com certificado emitido** (o treinamento tem `emiteCertificado` verdadeiro e pelo menos uma pessoa o
          concluiu; é o número `certificadosEmitidos` da linha em `listarTreinamentos`): 422
          `TREINAMENTO_COM_CERTIFICADOS`, sem apagar nada, **mesmo com `confirmar=true`**. O RH só pode **encerrar**
          (`encerrarTreinamento`). Por isso um certificado emitido nunca some e a conferência pública
          (`validarCertificado`) não tem o caso "certificado apagado". Esta conferência vem **antes** da confirmação
          abaixo.
        - **Rascunho e agendado:** ninguém chegou a ver o treinamento (nem pode ter concluído); apaga direto (204), sem
          confirmação.
        - **Em andamento ou encerrado, sem certificado emitido:** se há pessoas com linha ainda não concluída
          (`INSCRITO` ou `EM_ANDAMENTO`; `pendentes`), a primeira chamada devolve 409 `CONFIRMACAO_NECESSARIA`, sem apagar
          nada. O front mostra o aviso ("9 pessoas ainda não concluíram este treinamento") e repete a chamada com
          `confirmar=true`, que executa. Sem pendentes, apaga direto.
        - **Treinamento que não emite certificado** (`emiteCertificado` falso) pode ser excluído mesmo que alguém já o tenha
          concluído: o andamento e as conclusões somem junto, e a confirmação só conta quem **não** concluiu (não há
          certificado emitido a proteger).

        **O que a exclusão faz:** numa única transação (a API trava o treinamento para escrita, para que uma conclusão no
        mesmo instante não seja apagada sem ter sido conferida), apaga o progresso dos módulos, os módulos, as linhas de
        certificado (que o trigger cria a cada conclusão, mesmo sem `emiteCertificado`; nenhuma é de certificado emitido
        quando se chega aqui), as linhas dos participantes, o público escolhido e o treinamento; depois apaga do
        armazenamento de arquivos os PDFs dos módulos. Quem tinha o treinamento deixa de vê-lo e perde o andamento. O evento
        entra na auditoria (`TREINAMENTOS`, `EXCLUIU`) com o título e o número de `pendentes` (a auditoria é tabela nova da
        aplicação, script `V001`).

        **O que li no banco:** `TREINAMENTOS_FUNCIONARIOS`, `TREINAMENTOS_CERTIFICADOS`, `TREINAMENTOS_MODULOS` e
        `TREINAMENTOS_PUBLICO` têm chave estrangeira para `TREINAMENTOS` sem `ON DELETE` (no MySQL/InnoDB isso é
        `RESTRICT`: o banco recusa apagar o treinamento enquanto houver linha filha, por isso a API apaga os filhos
        antes, na ordem acima), e `TREINAMENTOS_MODULOS_PROGRESSO` aponta para `TREINAMENTOS_MODULOS` do mesmo jeito
        (`Criacao_Tabelas`:403-464, V001). Não há trigger de `DELETE` em nenhuma dessas tabelas (os de `DELETE`
        do banco são só os de `FUNCIONARIOS`, `HOLERITES`, `ADVERTENCIAS` e `FORMULARIOS_PERGUNTAS`). Logo o banco aceita
        a exclusão física. Li também que os triggers `TRG_TREINAMENTOS_FUNCIONARIOS_AFTER_INSERT` e `_AFTER_UPDATE`
        (`Criacao_Triggers`:768-791) criam a linha em `TREINAMENTOS_CERTIFICADOS` sempre que a pessoa vira `CONCLUIDO`,
        inclusive com `emiteCertificado` falso (V001, "SOBRE EMITE_CERTIFICADO = FALSO"): por isso, para a API, "certificado
        emitido" é a conclusão em treinamento que emite certificado, e não a mera existência da linha. Não existe coluna
        para ocultar ou arquivar treinamento.
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
        - { $ref: '#/components/parameters/TreinamentoConfirmar' }
      responses:
        '204': { description: Treinamento excluído. }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/TreinamentoErro409ConfirmacaoExcluir' }
        '422': { $ref: '#/components/responses/TreinamentoErro422ComCertificados' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/treinamentos/{treinamentoId}/publicar:
    post:
      tags: [Treinamentos]
      operationId: publicarTreinamento
      summary: Publica o treinamento (acesso liberado na data de início).
      description: |
        Último passo do assistente, "Publicar treinamento" (a opção "Salvar como rascunho" não chama esta rota: o
        `PUT` já guardou tudo). Sem corpo: publica o que está salvo.

        **Exige** (400 com `errors` por campo): `titulo`; `comecaEm` preenchido (pode ser hoje ou uma data passada, que
        libera na hora, ou uma data futura, que deixa o treinamento `AGENDADO`); `publico` escolhido (`SETORES` com pelo
        menos um setor em `setorIds`, `PESSOAS` com pelo menos uma pessoa em `funcionarioIds`); pelo menos um módulo
        (`errors.modulos`). Não há data final.

        **Efeitos:** marca `PUBLICADO` verdadeiro (a pessoa só passa a ver o treinamento quando `comecaEm` chega, sem
        agendador para isso). Treinamento **obrigatório** cria uma linha `INSCRITO` em `TREINAMENTOS_FUNCIONARIOS` para
        cada pessoa ativa do público (setor resolvido em pessoas na hora; o trigger do banco recusa inativo, por isso a API
        os pula); `TODOS` não guarda linhas em `TREINAMENTOS_PUBLICO`. Opcional não cria linhas. Com `incluiAdmitidos`, o
        agendador inclui depois, enquanto o treinamento não for encerrado, quem for admitido e estiver no público (só
        obrigatório). **Nenhum e-mail sai** (seção 12 das convenções): publicar não avisa ninguém; o RH usa um Aviso, se
        quiser.
        A criação em lote das linhas entra na auditoria como evento explícito (roadmap, decisão 5; a auditoria é tabela
        nova da aplicação, script `V001`).
        Publicar de novo, inclusive um treinamento já encerrado: 422 `TREINAMENTO_JA_PUBLICADO` (código só desta rota; o
        `PUT` e as rotas de módulo usam outros). Não existe "despublicar": publicado não volta a rascunho (depois só se
        encerra e, sem certificado emitido, se exclui).
      x-perfis: [RH]
      parameters:
        - { $ref: '#/components/parameters/TreinamentoId' }
