          schema: { $ref: '#/components/schemas/TreinamentoAbaMeus' }
        - name: obrigatorio
          in: query
          description: "`true` só os obrigatórios, `false` só os opcionais."
          schema: { type: boolean }
      responses:
        '200':
          description: Página de cartões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinamentoMeuLista' }
              example:
                itens:
                  - { id: 3, titulo: Segurança da informação, descricao: 'Senhas, golpes por e-mail e cuidado com dados.', obrigatorio: true, onboarding: false, situacao: EM_ANDAMENTO, comecaEm: '2026-09-15', encerrado: false, totalModulos: 5, duracaoTotalMinutos: 100, modulosConcluidos: 3, progressoPercentual: 60, moduloAtual: 4, iniciadoEm: '2026-10-05', concluidoEmUtc: null, certificado: null }
                  - { id: 7, titulo: Excel para relatórios financeiros, descricao: 'Tabelas dinâmicas, PROCV e gráficos para o fechamento do mês.', obrigatorio: false, onboarding: false, situacao: DISPONIVEL, comecaEm: '2026-10-01', encerrado: false, totalModulos: 8, duracaoTotalMinutos: 180, modulosConcluidos: 0, progressoPercentual: 0, moduloAtual: 1, iniciadoEm: null, concluidoEmUtc: null, certificado: null }
                pagina: 1
