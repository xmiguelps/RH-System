        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/advertencias/{advertenciaId}/resposta:
    post:
      tags: [Advertências]
      operationId: responderContestacaoDeAdvertencia
      summary: O RH responde à contestação, mantendo a advertência ou acatando a contestação.
      description: |
        Só o RH. Só vale para advertência `CONTESTADA`; qualquer outra situação devolve 422 `ADVERTENCIA_NAO_ESTA_CONTESTADA`.

        - `decisao: MANTER`: a advertência volta a `APLICADA` (`desfechoDaContestacao: MANTIDA`).
        - `decisao: ACATAR`: a advertência passa a `CANCELADA` (`desfechoDaContestacao: ACATADA`); cancelada não muda mais de status (trigger do banco).
        - `resposta` é o texto que o RH escreve para a pessoa: **vai por e-mail** à pessoa e **não fica guardado** no banco (o Kauan decide se guarda;
          ver `V014`), só na auditoria. Por isso a pessoa não vê a resposta na tela, só a nova situação.
        Não há outra forma de cancelar uma advertência.
      x-perfis: [RH]
      x-provisorio: >-
        Decisão do dono (roadmap, fatia 4, "o que acontece depois da contestação"): hipótese mais simples, o RH mantém (volta a `APLICADA`) ou acata
        (`CANCELADA`) e responde por e-mail, sem guardar a resposta. Se o dono quiser outro desfecho (por exemplo, a resposta aparecer na tela da pessoa,
        ou um status próprio para "contestação negada"), muda o corpo desta rota e o schema da advertência (`respostaDoRh`).
      parameters:
        - $ref: '#/components/parameters/AdvertenciaIdCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvertenciaRespostaComando' }
            example:
              decisao: ACATAR
              resposta: Conferimos as mensagens e o registro do gestor. A troca de plantão foi combinada, então cancelamos a advertência.
      responses:
        '200':
          description: Contestação respondida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaDetalheRh' }
              example:
                id: 109
                data: '2026-09-15'
                funcionario: { id: 44, nome: Vanessa Lima, cargo: Assistente administrativa, setor: Administrativo, ativo: true }
                tipo: ESCRITA
                motivo: Falta sem justificativa em 12/09
                aplicadaPor: { tipo: RH, nome: null }
                situacao: CANCELADA
                descricao: Não houve registro de ponto nem aviso prévio no sábado, 12/09, dia de escala da pessoa.
                dataCienciaUtc: null
                textoContestacao: Troquei o plantão de 12/09 com a colega Júlia por mensagem e avisei o gestor na sexta; posso mostrar a conversa.
                dataContestacaoUtc: '2026-09-17T13:05:00Z'
                desfechoDaContestacao: ACATADA
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A advertência não está contestada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Só uma advertência contestada pode receber resposta.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ADVERTENCIA_NAO_ESTA_CONTESTADA
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/funcionarios/{funcionarioId}/advertencias:
    parameters:
      - name: funcionarioId
        in: path
        required: true
        description: Identificador da pessoa.
        schema: { type: integer }
    get:
      tags: [Advertências]
      operationId: listarAdvertenciasDoFuncionario
      summary: Lista as advertências de uma pessoa, para a aba Advertências da ficha (tela 11).
      description: |
        Só o RH. Todas as advertências da pessoa, de todos os anos e **inclusive as canceladas**, da data do ocorrido mais recente para a mais antiga.
        O botão "Abrir" usa `GET /api/rh/advertencias/{advertenciaId}`. Funciona também para pessoa inativa. O número "Advertências" do resumo da
        ficha (`advertenciasQuantidade`, fatia 1) é outra conta: só as **não canceladas do ano corrente**, por isso pode ser menor que o `total` desta lista.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de advertências da pessoa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaLista' }
              example:
                pagina: 1
                tamanhoPagina: 20
                total: 1
                totalPaginas: 1
                itens:
                  - id: 96
                    data: '2026-06-02'
                    funcionario: { id: 24, nome: Pedro Santos, cargo: Vendedor, setor: Comercial, ativo: true }
                    tipo: VERBAL
                    motivo: Faltou à escala de sábado sem avisar
                    aplicadaPor: { tipo: GESTOR, nome: Carlos Ribeiro }
                    situacao: APLICADA
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Advertências]
      operationId: registrarAdvertencia
      summary: O RH registra uma advertência para uma pessoa (telas 11 e 15).
      description: |
        Só o RH. Serve ao botão "Registrar advertência" da ficha (tela 11) e ao "Nova advertência" da lista (tela 15, que antes pede à pessoa
        uma lista de colaboradores: use a lista de funcionários da fatia 1). A advertência nasce `PENDENTE` ("Aguardando ciência").

        - `dataDoOcorrido`: dia do fato, hoje ou antes (futura: 400).
        - `aplicadaPor`: `GESTOR_DO_COLABORADOR` registra em nome do gestor da pessoa (o gestor ativo dela; se ela não tem gestor, ou o gestor foi
          desligado, 422 `ADVERTENCIA_SEM_GESTOR`); `RH` registra em nome do RH (a lista mostra "RH").
        - `motivo`: resumo de uma linha (até 255 caracteres). `descricao`: o que aconteceu, quando e qual regra foi descumprida.
        - **E-mail:** **só a pessoa** recebe, **sempre**, o e-mail de "advertência registrada" (CONVENCOES, seção 12). O gestor dela **não** recebe
          cópia quando o RH registra (decisão do dono, 2026-10-30), nem quando `aplicadaPor` é `GESTOR_DO_COLABORADOR`: quem registra é o RH. Não existe
          opção para não avisar. A caixa "Avisar o colaborador e o gestor por e-mail" que o Figma mostra na tela 15 fica escondida (o contrato não
          avisa o gestor).
        - Pessoa inativa não recebe advertência (422 `FUNCIONARIO_INATIVO`).
        Entra na auditoria. A pessoa vê a advertência em `/api/eu/advertencias` e confirma a ciência ou contesta.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvertenciaRegistroRhComando' }
            example:
              dataDoOcorrido: '2026-10-05'
              tipo: ESCRITA
              aplicadaPor: GESTOR_DO_COLABORADOR
              motivo: Atrasos repetidos sem justificativa
              descricao: Nas últimas três semanas houve cinco atrasos na abertura da loja (22/09, 25/09, 29/09, 01/10 e 03/10), sem justificativa e sem pedido de ajuste no ponto. Abrir a loja no horário faz parte da escala do dia.
      responses:
        '201':
          description: Advertência registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaDetalheRh' }
              example:
                id: 118
                data: '2026-10-05'
                funcionario: { id: 21, nome: Diego Farias, cargo: Vendedor, setor: Comercial, ativo: true }
                tipo: ESCRITA
                motivo: Atrasos repetidos sem justificativa
                aplicadaPor: { tipo: GESTOR, nome: Carlos Ribeiro }
                situacao: PENDENTE
                descricao: Nas últimas três semanas houve cinco atrasos na abertura da loja (22/09, 25/09, 29/09, 01/10 e 03/10), sem justificativa e sem pedido de ajuste no ponto. Abrir a loja no horário faz parte da escala do dia.
                dataCienciaUtc: null
                textoContestacao: null
                dataContestacaoUtc: null
                desfechoDaContestacao: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: |
            Recusada por regra de negócio ou do banco. `FUNCIONARIO_INATIVO` (código único em todas as fatias; trigger: `Nao e possivel registrar advertencia para funcionario inativo.`),
            `ADVERTENCIA_SEM_GESTOR` (a pessoa não tem gestor ativo e `aplicadaPor` é `GESTOR_DO_COLABORADOR`) e `ADVERTENCIA_GESTOR_ADVERTE_A_SI_MESMO`
            (trigger: `O gestor nao pode advertir a si mesmo.`, quando a pessoa é o próprio gestor).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                inativo:
                  summary: Pessoa inativa
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Não é possível registrar advertência para uma pessoa inativa.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_INATIVO
                    regraDoBanco: Nao e possivel registrar advertencia para funcionario inativo.
                semGestor:
                  summary: Pessoa sem gestor ativo
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Esta pessoa não tem gestor ativo. Escolha "RH" em "Aplicada por".
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: ADVERTENCIA_SEM_GESTOR
        '500': { $ref: '#/components/responses/Erro500Interno' }

