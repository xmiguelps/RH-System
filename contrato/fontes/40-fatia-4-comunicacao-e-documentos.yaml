                expiraEmUtc: '2026-10-07T12:52:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- HOLERITES (a própria pessoa)
  /api/eu/holerites:
    get:
      tags: [Holerites]
      operationId: listarMeusHolerites
      summary: Lista os holerites da pessoa logada (telas 36 e 49).
      description: |
        Qualquer perfil, sempre os **da própria pessoa** (o gestor vê os dele aqui; **não existe** rota para o gestor ver os holerites da equipe).
        Só aparecem holerites **já publicados** e só a **versão atual** de cada (ano, mês, tipo). Os agendados e as versões substituídas não aparecem.
        Não há marca de "novo" nem de "visto" (decisão do dono, 2026-10-28; o "Novo" que o Figma mostra na tela 36 fica escondido).

        `ano` (padrão: o ano atual) é o seletor "2026" e filtra a lista **e** as contagens; `tipo` é a aba escolhida.
        `contagens` (`Todos 10`, `Mensais 9`, `Férias 1`, `13º salário 0`) vale para o `ano` pedido e não depende de `tipo`;
        `anosDisponiveis` são os anos com algum holerite, do mais recente para o mais antigo (opções do seletor). `total` é "10 holerites em 2026".
        Ordem: mais recente primeiro (ano, mês e, no mesmo mês, publicação mais recente).

        **Cartão "Próximo pagamento"** (telas 36 e 49, "até 6 de novembro"): o dado **não vem desta rota**. A tela chama `GET /api/eu/pagamento/proximo`
        (fatia 7, qualquer perfil), que devolve `pagamento` (a data do próximo pagamento: `data` no formato `2026-11-06`, mais `ano`, `mes`, `origem`
        `REGRA` ou `EXCECAO` e `ajustes`) e `competencia` (`ano` e `mes` do holerite a que o pagamento se refere, "Holerite de outubro").
        Se a empresa ainda não configurou o dia do pagamento, os dois vêm `null` (regra da rota, fatia 7) e o cartão não aparece.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - name: ano
          in: query
          description: Ano de competência. Padrão o ano atual.
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: tipo
          in: query
          description: Só holerites deste tipo (as abas Mensais, Férias e 13º salário). Sem o parâmetro, todos.
          schema: { $ref: '#/components/schemas/HoleriteTipo' }
      responses:
        '200':
          description: Página de holerites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoleriteListaEu' }
              example:
                pagina: 1
                tamanhoPagina: 20
                total: 10
                totalPaginas: 1
                ano: 2026
                anosDisponiveis: [2026, 2025]
                contagens: { todos: 10, mensais: 9, ferias: 1, decimoTerceiro: 0 }
                itens:
                  - { id: 5121, tipo: MENSAL, mes: 9, ano: 2026, publicadoEmUtc: '2026-10-05T14:30:00Z' }
                  - { id: 4987, tipo: MENSAL, mes: 8, ano: 2026, publicadoEmUtc: '2026-09-04T13:10:00Z' }
                  - { id: 4410, tipo: FERIAS, mes: 1, ano: 2026, publicadoEmUtc: '2026-01-02T12:00:00Z' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/holerites/{holeriteId}/download:
    get:
      tags: [Holerites]
      operationId: obterLinkDeDownloadDoMeuHolerite
      summary: Devolve um link temporário para baixar o PDF de um holerite da própria pessoa.
      description: |
        Qualquer perfil, só para holerite **da própria pessoa**, já **publicado** e na **versão atual**. Outro holerite, agendado ou versão substituída:
        404 (a API não revela se existe), inclusive para o gestor. Devolve o `LinkTemporario`; o arquivo vem como anexo, nunca por link público,
        e o link vence em poucos minutos. A `url` é uma URL assinada e opaca (o front só a abre; o caminho do arquivo não sai da API).
        O acesso entra na auditoria.
      x-perfis: [Funcionario, Gestor, RH]
      x-provisorio: >-
        A tela 36 tem dois botões, "Ver" e "Baixar PDF". Pela regra de arquivos (roadmap, decisão 7) o PDF sempre baixa como anexo, então o contrato tem uma
        só rota e os dois botões usariam o mesmo link. Se o dono quiser que "Ver" abra o PDF na tela do navegador, esta rota ganha um parâmetro
        (por exemplo `abrirNoNavegador=true`) para o link vir sem forçar o download.
      parameters:
        - $ref: '#/components/parameters/HoleriteIdCaminho'
      responses:
        '200':
          description: Link temporário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkTemporario' }
              example:
                url: https://arquivos.exemplo.com.br/download/c41e08b2-91d7-4f6a-8b35-0e7f2a9d6c14?expira=2026-10-07T12%3A52%3A00Z&assinatura=assinatura-de-exemplo
                expiraEmUtc: '2026-10-07T12:52:00Z'
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- ADVERTÊNCIAS (RH)
  /api/rh/advertencias:
    get:
      tags: [Advertências]
      operationId: listarAdvertencias
      summary: Lista as advertências de todos os setores, com filtros (tela 14).
      description: |
        Só o RH. A lista é **de um ano** (`ano`, padrão o ano atual; "Mostrando 6 de 9 em 2026") pela **data do ocorrido**. As abas são valores de `situacao`
        (Todas = sem o parâmetro; Aguardando ciência = `PENDENTE`; Ciente = `APLICADA`; Contestada = `CONTESTADA`; `CANCELADA` existe mas não tem aba no Figma).
        `busca` procura no **nome do colaborador** e no **motivo**; `setorId` é "Todos os setores"; `tipo` é "Todos os tipos".
        Ordem: data do ocorrido mais recente primeiro, depois o mais recente registrado. O botão "Abrir" usa `GET /api/rh/advertencias/{advertenciaId}`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
        - name: ano
          in: query
          description: Ano da data do ocorrido. Padrão o ano atual.
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: situacao
          in: query
          description: Só advertências nesta situação.
          schema: { $ref: '#/components/schemas/AdvertenciaSituacao' }
        - name: setorId
          in: query
          description: Só advertências de pessoas deste setor (o setor atual da pessoa).
          schema: { type: integer }
        - name: tipo
          in: query
          description: Só advertências deste tipo.
          schema: { $ref: '#/components/schemas/AdvertenciaTipo' }
      responses:
        '200':
          description: Página de advertências.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaLista' }
              example:
                pagina: 1
                tamanhoPagina: 20
                total: 9
                totalPaginas: 1
                itens:
                  - id: 118
                    data: '2026-10-05'
                    funcionario: { id: 21, nome: Diego Farias, cargo: Vendedor, setor: Comercial, ativo: true }
                    tipo: ESCRITA
                    motivo: Atrasos repetidos sem justificativa
                    aplicadaPor: { tipo: GESTOR, nome: Carlos Ribeiro }
                    situacao: PENDENTE
                  - id: 112
                    data: '2026-09-29'
                    funcionario: { id: 31, nome: Thiago Mello, cargo: Auxiliar de logística, setor: Logística, ativo: true }
                    tipo: VERBAL
                    motivo: Uso de celular durante a operação da empilhadeira
                    aplicadaPor: { tipo: GESTOR, nome: Paulo Vieira }
                    situacao: APLICADA
                  - id: 109
                    data: '2026-09-15'
                    funcionario: { id: 44, nome: Vanessa Lima, cargo: Assistente administrativa, setor: Administrativo, ativo: true }
                    tipo: ESCRITA
                    motivo: Falta sem justificativa em 12/09
                    aplicadaPor: { tipo: RH, nome: null }
                    situacao: CONTESTADA
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/advertencias/resumo:
    get:
      tags: [Advertências]
      operationId: obterResumoDasAdvertencias
      summary: Mostra os números do topo da tela de advertências e a contagem de cada aba.
      description: |
        Só o RH (tela 14). Os números são de **um ano** (`ano`, padrão o ano atual) pela data do ocorrido e não dependem de busca nem de filtro.
        `contagens` são as das abas da lista (e o "Registradas em 2026"): `todas` soma as quatro situações e **inclui as canceladas**, como a lista faz.
        `setorComMaisRegistros` é o setor atual com mais advertências **não canceladas** do ano (a regra de contagem das advertências, a mesma da
        tela do gestor; empate: o primeiro em ordem alfabética); `null` quando não há advertência não cancelada no ano.
      x-perfis: [RH]
      parameters:
        - name: ano
