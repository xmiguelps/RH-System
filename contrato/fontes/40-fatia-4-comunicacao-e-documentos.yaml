                    codigoDoErro: null
                    mensagemDoErro: null
                  - funcionarioId: 21
                    nomeDoArquivo: diego-farias.pdf
                    sucesso: true
                    holerite: { id: 5231, funcionarioId: 21, tipo: MENSAL, mes: 10, ano: 2026, versao: 1, versaoAtual: true, situacao: AGENDADO, publicacaoEmUtc: '2026-11-06T03:00:00Z' }
                    codigoDoErro: null
                    mensagemDoErro: null
                  - funcionarioId: 24
                    nomeDoArquivo: pedro-santos.pdf
                    sucesso: false
                    holerite: null
