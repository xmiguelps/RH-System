      description: |
        Só o gestor, só a equipe dele (tela 59). Os números são de **um ano** (`ano`, padrão o ano atual) pela data do ocorrido.

        **Regra da contagem** (a mesma em todas as fatias): conta **advertência não cancelada** (`PENDENTE`, `APLICADA` ou `CONTESTADA`) do ano pedido
        (padrão o ano corrente). `registradas` é "Registradas em 2026", `pessoasComAdvertencia` é a "2" de "2 de 8" e cada `quantidade` de `porPessoa`
        usam essa regra; a soma das quantidades de `porPessoa` é `registradas`. A lista `GET /api/gestor/advertencias` mostra também as canceladas
        (use `situacao=CANCELADA`), por isso o `total` dela pode ser maior que `registradas`.
        `aguardandoCiencia` traz quantas e **quais pessoas** têm advertência `PENDENTE`; `totalDaEquipe` é o "8" de "2 de 8" (as pessoas ativas do setor,
        **sem o gestor**: a mesma equipe de `GET /api/gestor/equipe`, fatia 1); `porPessoa` traz **todas** as pessoas da equipe (inclusive com 0), da que
        tem mais advertências para a que tem menos e, no empate, por nome. O indicador `advertenciasQuantidade` da ficha da pessoa (fatia 1) usa a
        mesma regra, sempre do ano corrente.
