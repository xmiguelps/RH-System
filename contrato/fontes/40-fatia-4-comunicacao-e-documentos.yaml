  # ---------------------------------------------------------------- HOLERITES (RH)
  /api/rh/funcionarios/{funcionarioId}/holerites:
    parameters:
      - name: funcionarioId
        in: path
        required: true
        description: Identificador da pessoa.
        schema: { type: integer }
    get:
      tags: [Holerites]
      operationId: listarHoleritesDoFuncionario
      summary: Lista os holerites de uma pessoa, para a aba Holerites da ficha (tela 07).
      description: |
        Só o RH. Sem `todasAsVersoes`, devolve só a **versão atual** de cada (ano, mês, tipo); com `todasAsVersoes=true`, devolve também as versões
        antigas (o histórico do holerite substituído). Inclui os holerites `AGENDADO` (ainda não visíveis para a pessoa).
        Ordem: competência mais recente primeiro (ano, mês), depois a versão mais nova, depois o mais recente cadastrado.

        `ultimoPublicado` é o holerite **já publicado** mais recentemente (por data de publicação), sem considerar os filtros: é a linha
        "Último holerite enviado: Setembro de 2026, publicado em 05/10/2026" do modal de envio (tela 08). `null` se nenhum foi publicado.
        Funciona para pessoa inativa (o RH guarda os holerites de quem saiu).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - name: ano
          in: query
          description: Só holerites deste ano de competência.
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: tipo
          in: query
          description: Só holerites deste tipo.
          schema: { $ref: '#/components/schemas/HoleriteTipo' }
        - name: todasAsVersoes
          in: query
          description: '`true` inclui as versões substituídas. Padrão `false`.'
          schema: { type: boolean }
      responses:
        '200':
          description: Página de holerites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoleriteListaRh' }
              example:
                pagina: 1
                tamanhoPagina: 20
                total: 2
                totalPaginas: 1
                ultimoPublicado:
                  id: 5121
                  funcionarioId: 12
                  tipo: MENSAL
                  mes: 9
                  ano: 2026
                  versao: 1
                  versaoAtual: true
                  situacao: PUBLICADO
                  publicacaoEmUtc: '2026-10-05T14:30:00Z'
                itens:
                  - id: 5121
                    funcionarioId: 12
                    tipo: MENSAL
                    mes: 9
                    ano: 2026
                    versao: 1
                    versaoAtual: true
                    situacao: PUBLICADO
                    publicacaoEmUtc: '2026-10-05T14:30:00Z'
                  - id: 4987
                    funcionarioId: 12
                    tipo: MENSAL
                    mes: 8
                    ano: 2026
                    versao: 1
                    versaoAtual: true
                    situacao: PUBLICADO
                    publicacaoEmUtc: '2026-09-04T13:10:00Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Holerites]
      operationId: enviarHolerite
      summary: Publica ou agenda o PDF do holerite de uma pessoa (modal "Enviar holerite", tela 08).
      description: |
        Só o RH. `multipart/form-data`. Campos: `mes` (1 a 12), `ano`, `tipo` (`MENSAL`, `DECIMO_TERCEIRO` ou `FERIAS`), `arquivo` e, para escolher
        quando publicar, **um** destes dois: `publicarEm` (uma data) **ou** `noDiaDoPagamento: true`. Os dois juntos: 400.

        - **Arquivo:** só PDF (a API confere o conteúdo, não só a extensão), **até 5 MB (5 × 1024 × 1024 bytes)**; senão, 400 com o erro em `arquivo`.
          O arquivo só é guardado depois de a regra do banco aprovar.
        - **Quando publicar** ("Quando publicar" da tela 08):
          - **Agora:** nenhum dos dois campos, ou `publicarEm` com o dia de hoje.
          - **Numa data:** `publicarEm` é um dia futuro; o holerite fica `AGENDADO` e a pessoa só o vê, e só recebe o e-mail, a partir do início
            desse dia (00:00, fuso -03:00). Dia no passado: 400.
          - **No dia do pagamento** ("Agendar para o dia do pagamento"): `noDiaDoPagamento: true`. **O sistema calcula a data**: é a do próximo
            pagamento da empresa, a mesma que `GET /api/eu/pagamento/proximo` (fatia 7) devolve em `pagamento.data` (de hoje em diante; se hoje é o
            dia do pagamento, publica agora). A resposta traz o resultado em `publicacaoEmUtc` e `situacao`, para a tela mostrar a data que o sistema
            escolheu. Empresa sem dia de pagamento configurado: 422 `EMPRESA_NAO_CONFIGURADA` (o RH configura em Cadastros > Empresa, fatia 1).
        - **E-mail:** a pessoa recebe um e-mail **sempre** que um holerite é publicado (na hora, ou no dia agendado); não existe opção para não avisar
          (CONVENCOES, seção 12). A caixa "Avisar por e-mail quando publicar" que o Figma mostra na tela 08 fica escondida.
        - **Competência futura** só é aceita no tipo `FERIAS` (o holerite de férias é pago antes das férias). Competência anterior à admissão
          ou posterior ao desligamento é recusada.
        - **Já existe holerite dessa pessoa, nesse mês e tipo:** 409 `HOLERITE_JA_EXISTE`. Para corrigir um holerite errado use
          `POST /api/rh/holerites/{holeriteId}/versoes` (o banco não deixa apagar holerite).
        - A ação entra na auditoria. O retorno é o holerite criado (versão 1).
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/HoleriteEnvioComando' }
            examples:
              publicarAgora:
                summary: Publicar agora
                value: { mes: 10, ano: 2026, tipo: MENSAL, arquivo: holerite-bruno-lima-2026-10.pdf }
              agendar:
                summary: Agendar para uma data
                value: { mes: 10, ano: 2026, tipo: MENSAL, arquivo: holerite-bruno-lima-2026-10.pdf, publicarEm: '2026-11-06' }
              noDiaDoPagamento:
                summary: Publicar no dia do pagamento (o sistema calcula a data)
                value: { mes: 10, ano: 2026, tipo: MENSAL, arquivo: holerite-bruno-lima-2026-10.pdf, noDiaDoPagamento: true }
      responses:
        '201':
          description: Holerite guardado (publicado ou agendado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoleriteItemRh' }
              example:
                id: 5230
                funcionarioId: 12
                tipo: MENSAL
                mes: 10
                ano: 2026
                versao: 1
                versaoAtual: true
                situacao: AGENDADO
                publicacaoEmUtc: '2026-11-06T03:00:00Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409':
          description: Já existe holerite dessa pessoa nesse mês e tipo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Conflito.
                status: 409
                detail: Já existe um holerite mensal de outubro de 2026 para esta pessoa. Para corrigir, envie uma nova versão.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: HOLERITE_JA_EXISTE
        '422':
          description: |
            Recusado por regra do banco. Mensagens do trigger de holerite (`regraDoBanco`) e o `codigo` de cada uma:
            `Nao e possivel cadastrar holerite de competencia futura.` (`HOLERITE_COMPETENCIA_FUTURA`);
            `A competencia do holerite e anterior a admissao.` (`HOLERITE_COMPETENCIA_ANTERIOR_A_ADMISSAO`);
            `A competencia do holerite e posterior ao desligamento.` (`HOLERITE_COMPETENCIA_POSTERIOR_AO_DESLIGAMENTO`).
            Com `noDiaDoPagamento: true` e a empresa sem dia de pagamento configurado: `EMPRESA_NAO_CONFIGURADA` (regra da API, sem `regraDoBanco`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                empresaSemDiaDePagamento:
                  summary: Publicar no dia do pagamento sem dia de pagamento configurado
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: A empresa ainda não tem o dia do pagamento configurado. Configure em Cadastros > Empresa ou escolha uma data.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: EMPRESA_NAO_CONFIGURADA
                competenciaFutura:
                  summary: Competência futura em holerite que não é de férias
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: Só o holerite de férias pode ter competência futura.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: HOLERITE_COMPETENCIA_FUTURA
                    regraDoBanco: Nao e possivel cadastrar holerite de competencia futura.
                anteriorAAdmissao:
                  summary: Competência anterior à admissão
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: A competência do holerite é anterior à admissão da pessoa.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: HOLERITE_COMPETENCIA_ANTERIOR_A_ADMISSAO
                    regraDoBanco: A competencia do holerite e anterior a admissao.
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/holerites/lote:
    post:
      tags: [Holerites]
      operationId: enviarHoleritesEmLote
      summary: Publica ou agenda vários holerites de uma vez, um PDF por pessoa.
      description: |
        Só o RH. O envio em lote **entra** (decisão do dono, 2026-10-30): um envio com vários PDFs, um por pessoa. `multipart/form-data`.
        Os campos `mes`, `ano`, `tipo` e `publicarEm` **ou** `noDiaDoPagamento` valem para **todos** os holerites do envio e seguem as regras
        de `POST /api/rh/funcionarios/{funcionarioId}/holerites` (PDF até 5 MB cada, competência futura só em férias, agendamento, o sistema calcula a data
        de `noDiaDoPagamento`, e o e-mail sai sempre ao publicar).

        **Como cada PDF é ligado a uma pessoa:** `itens` (uma lista em JSON) traz uma linha por arquivo, com `nomeDoArquivo` (o nome do arquivo enviado
        em `arquivos`) e `funcionarioId` (a pessoa dona do holerite). Quem escolhe a pessoa de cada arquivo é o RH, na tela do lote (que o Figma não desenha;
        a lista de pessoas vem da fatia 1); a API **não** adivinha a pessoa pelo conteúdo nem pelo nome do arquivo.

        **Cada item é independente:** um item inválido não impede os outros. A resposta é sempre 200 com o resultado de cada item (publicado, agendado ou o erro dele).
        Se a pessoa já tem holerite do mesmo mês e tipo, o item volta com `HOLERITE_JA_EXISTE` (o lote não cria versões).
        Limites: até 200 PDFs por envio e 100 MB no total; acima disso, 400. Nome de arquivo repetido em `itens`, ou arquivo sem item (e item sem arquivo), é 400.
        Erro que vale para o lote todo (e não para um item) recusa o envio inteiro: `publicarEm` e `noDiaDoPagamento` juntos, ou `publicarEm` no passado, é 400;
        `noDiaDoPagamento` sem dia de pagamento configurado na empresa é 422 `EMPRESA_NAO_CONFIGURADA`. O lote inteiro entra na auditoria.
      x-perfis: [RH]
      x-provisorio: >-
        Só o **formato** do lote está em aberto (a decisão de ter lote está tomada). Hipótese: um envio com vários PDFs e a lista `itens` que liga cada
        arquivo a uma pessoa (`nomeDoArquivo` e `funcionarioId`), cada item validado sozinho (sem tudo ou nada). Se o dono quiser outro formato (por exemplo
        "tudo ou nada", ou o nome do arquivo trazendo a matrícula da pessoa), o corpo e a resposta mudam. Não há tela desenhada para o lote.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/HoleriteLoteComando' }
            encoding:
              itens: { contentType: application/json }
              arquivos: { contentType: application/pdf }
            example:
              mes: 10
              ano: 2026
              tipo: MENSAL
              noDiaDoPagamento: true
              itens:
                - { funcionarioId: 12, nomeDoArquivo: bruno-lima.pdf }
                - { funcionarioId: 21, nomeDoArquivo: diego-farias.pdf }
                - { funcionarioId: 24, nomeDoArquivo: pedro-santos.pdf }
              arquivos: [bruno-lima.pdf, diego-farias.pdf, pedro-santos.pdf]
      responses:
        '200':
          description: Resultado de cada item do lote.
          content:
