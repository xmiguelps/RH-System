# Fatia 4: comunicação e documentos (avisos, holerites, advertências e aniversariantes).
# Roadmap: docs/superpowers/plans/2026-10-28-roadmap-completo.md, fatia 4 (linhas 176 a 199).
# Telas (16): RH 07, 08 (holerites), 11, 14, 15 (advertências), 27, 28 (avisos); funcionário 36 (holerites),
# 37, 38 (avisos), 43 (advertências); gestor 49 (holerites), 50 (avisos), 53, 59, 60 (advertências).
# As telas 49 e 50 do gestor reutilizam as do funcionário (rotas /api/eu/...), como manda o roadmap (decisão 14).
# Aniversariantes: só a API; a tela é da fatia 7d.
tags:
  - name: Avisos
    description: O RH publica avisos (simples ou detalhados) e acompanha quem leu; todos leem os seus avisos.
  - name: Holerites
    description: O RH publica o PDF do holerite de cada pessoa (um a um ou em lote); cada pessoa vê e baixa só os seus.
  - name: Advertências
    description: Advertências verbais e escritas, com ciência, contestação e resposta do RH.
  - name: Aniversariantes
    description: Quem faz aniversário nos próximos dias (a tela é da fatia 7d).

paths:
  # ---------------------------------------------------------------- AVISOS (RH)
  /api/rh/avisos:
    get:
      tags: [Avisos]
      operationId: listarAvisos
      summary: Lista os avisos do RH por situação (ativos, agendados, expirados e rascunhos).
      description: |
        Só o RH (tela 27). Cada aba da tela é um valor de `situacao`; sem `situacao`, devolve os ativos.
        `busca` procura no título e no conteúdo. `tipo` filtra "Todos os tipos".

        **Ordem fixa:** ativos e expirados, da publicação mais recente para a mais antiga; agendados, do que publica
        primeiro; rascunhos, do criado mais recentemente para o mais antigo.

        `leitura` só vem preenchida nos avisos `ATIVO` e `EXPIRADO`; em rascunho e agendado é `null`.
        Todo aviso é para todos os funcionários ativos: não há público por setor nem anexo PDF (decisão do dono, 2026-10-28).
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/Busca'
        - name: situacao
          in: query
          description: Aba da tela. Padrão `ATIVO`.
          schema: { $ref: '#/components/schemas/AvisoSituacao' }
        - name: tipo
          in: query
          description: Só avisos deste tipo. Sem o parâmetro, todos.
          schema: { $ref: '#/components/schemas/AvisoTipo' }
      responses:
        '200':
          description: Página de avisos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoListaRh' }
              example:
                pagina: 1
                tamanhoPagina: 20
                total: 4
                totalPaginas: 1
                itens:
                  - id: 412
                    tipo: SIMPLES
                    titulo: Cantina com novo horário
                    previa: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde continua às 15:30.
                    situacao: ATIVO
                    fixado: false
                    publicacaoEmUtc: '2026-10-07T11:00:00Z'
                    expiraEmUtc: '2026-10-21T02:59:59Z'
                    autorNome: Ana Souza
                    leitura: { viram: 41, total: 101 }
                  - id: 409
                    tipo: DETALHADO
                    titulo: Política de trabalho remoto atualizada
                    previa: Quem trabalha nos setores administrativos pode pedir até 2 dias de trabalho remoto por semana, combinados com o gestor.
                    situacao: ATIVO
                    fixado: true
                    publicacaoEmUtc: '2026-10-06T12:00:00Z'
                    expiraEmUtc: '2026-11-07T02:59:59Z'
                    autorNome: Ana Souza
                    leitura: { viram: 73, total: 101 }
                  - id: 405
                    tipo: SIMPLES
                    titulo: Expediente no feriado de 12/10
                    previa: Segunda-feira, 12/10, é feriado. Não haverá expediente e o ponto não precisa ser registrado.
                    situacao: ATIVO
                    fixado: false
                    publicacaoEmUtc: '2026-10-01T11:00:00Z'
                    expiraEmUtc: '2026-10-13T02:59:59Z'
                    autorNome: Ana Souza
                    leitura: { viram: 97, total: 101 }
                  - id: 377
                    tipo: SIMPLES
                    titulo: Novo convênio com academia
                    previa: Colaboradores têm desconto na mensalidade da academia parceira. Peça o código ao RH.
                    situacao: ATIVO
                    fixado: false
                    publicacaoEmUtc: '2026-09-22T11:00:00Z'
                    expiraEmUtc: null
                    autorNome: Ana Souza
                    leitura: { viram: 88, total: 101 }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Avisos]
      operationId: criarAviso
      summary: Cria um aviso, salvando como rascunho ou publicando (agora ou numa data futura).
      description: |
        Só o RH (tela 28). `publicar: false` é o botão "Salvar rascunho"; `publicar: true` é "Publicar aviso".

        - **Simples:** texto puro de até 280 caracteres. **Detalhado:** texto longo em **markdown** (`format: markdown`), com seções
          feitas por títulos (`## Como pedir`). **HTML nunca é interpretado**: se for escrito, aparece como texto
          (roadmap, decisão 6). Não há anexo.
        - Publicando: `publicarEmUtc` vazio (ou no passado) publica agora; no futuro, o aviso fica `AGENDADO` e a API o publica na hora.
          **O e-mail para todos os funcionários ativos sai sempre na publicação** (agora ou na data agendada; não existe a opção
          "enviar por e-mail também"). O aviso é sempre para todos os funcionários ativos.
        - Rascunho: não sai e-mail e ninguém vê. `publicarEmUtc`, se vier, é só a data prevista.
        - `expiraEm` é o último dia em que o aviso vale (fim desse dia, fuso -03:00); vazio = não expira. Não pode ser anterior ao dia da publicação (400; o trigger
          do banco também recusa, com `A expiracao do aviso nao pode ser anterior a publicacao.`, mas a API valida antes).
        - `fixado`: o aviso fica no topo da tela inicial até expirar.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoCriacaoComando' }
            examples:
              publicarAgora:
                summary: Aviso simples publicado agora
                value:
                  tipo: SIMPLES
                  titulo: Inventário de estoque no sábado, 17/10
                  conteudo: O inventário começa às 07:00 e vai até 13:00. As horas entram no banco de horas.
                  expiraEm: '2026-10-18'
                  fixado: false
                  publicar: true
              rascunhoDetalhado:
                summary: Aviso detalhado salvo como rascunho
                value:
                  tipo: DETALHADO
                  titulo: Campanha de vacinação contra a gripe
                  conteudo: "## Quando\nDias 13 e 14/10, das 09:00 às 16:00, na sala de treinamento.\n\n## Quem pode\nTodos os colaboradores. Dependentes podem se inscrever com o RH até 10/10."
                  publicarEmUtc: '2026-10-09T11:00:00Z'
                  expiraEm: '2026-10-15'
                  fixado: true
                  publicar: false
      responses:
        '201':
          description: Aviso criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoDetalheRh' }
              example:
                id: 413
                tipo: SIMPLES
                titulo: Inventário de estoque no sábado, 17/10
                previa: O inventário começa às 07:00 e vai até 13:00. As horas entram no banco de horas.
                situacao: ATIVO
                fixado: false
                publicacaoEmUtc: '2026-10-07T12:42:00Z'
                expiraEmUtc: '2026-10-19T02:59:59Z'
                autorNome: Ana Souza
                leitura: { viram: 0, total: 101 }
                conteudo: O inventário começa às 07:00 e vai até 13:00. As horas entram no banco de horas.
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/avisos/resumo:
    get:
      tags: [Avisos]
      operationId: obterResumoDosAvisos
      summary: Mostra os números do topo da tela de avisos e a contagem de cada aba.
      description: |
        Só o RH (tela 27). Os números não dependem de busca nem de filtro.

        - `contagens`: quantos avisos há em cada aba (`Ativos 4`, `Agendados 1`, `Expirados 12`, `Rascunhos 1`).
        - `leituraMediaDosAtivosPercentual`: média, entre os avisos ativos, de `viram ÷ total`, arredondada para inteiro (0 a 100);
          `null` quando não há aviso ativo.
        - `expiramNosProximos7Dias` e `proximoAExpirar`: avisos ativos que expiram nos próximos 7 dias (o card "Expiram nesta semana") e o que expira primeiro.
      x-perfis: [RH]
      responses:
        '200':
          description: Números dos avisos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoPainelRh' }
              example:
                contagens: { ativos: 4, agendados: 1, expirados: 12, rascunhos: 1 }
                leituraMediaDosAtivosPercentual: 74
                expiramNosProximos7Dias: 1
                proximoAExpirar: { avisoId: 405, titulo: Expediente no feriado de 12/10, expiraEmUtc: '2026-10-13T02:59:59Z' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/avisos/{avisoId}:
    parameters:
      - $ref: '#/components/parameters/AvisoIdCaminho'
    get:
      tags: [Avisos]
      operationId: obterAviso
      summary: Mostra um aviso inteiro, com o conteúdo, para o painel de detalhes do RH.
      description: Só o RH (tela 27). Vale para qualquer situação, inclusive rascunho. 404 se o aviso não existe.
      x-perfis: [RH]
      responses:
        '200':
          description: O aviso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoDetalheRh' }
              example:
                id: 409
                tipo: DETALHADO
                titulo: Política de trabalho remoto atualizada
                previa: Quem trabalha nos setores administrativos pode pedir até 2 dias de trabalho remoto por semana, combinados com o gestor.
                situacao: ATIVO
                fixado: true
                publicacaoEmUtc: '2026-10-06T12:00:00Z'
                expiraEmUtc: '2026-11-07T02:59:59Z'
                autorNome: Ana Souza
                leitura: { viram: 73, total: 101 }
                conteudo: |
                  ## O que mudou
                  Quem trabalha nos setores administrativos pode pedir até 2 dias de trabalho remoto por semana, combinados com o gestor.

                  ## Como pedir
                  Pelo portal, com pelo menos 2 dias úteis de antecedência. O gestor aprova ou recusa em até 1 dia útil.

                  ## Quem continua presencial
                  Loja, logística e recepção, por causa do atendimento ao público.
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    put:
      tags: [Avisos]
      operationId: editarAviso
      summary: Edita o título, o conteúdo, a data de publicação, a expiração e o "fixar" de um aviso.
      description: |
        Só o RH (botão "Editar" da tela 27). O **tipo não muda** depois de criado. Vale em qualquer situação; editar **não reenvia o e-mail**.
        A regra de conteúdo é a da criação (simples: até 280 caracteres, sem markdown; detalhado: markdown).

        - `publicarEmUtc` só pode mudar enquanto o aviso é `RASCUNHO` ou `AGENDADO`; nos demais, vazio ou igual ao valor atual
          (qualquer outro valor devolve 422 `AVISO_PUBLICACAO_NAO_EDITAVEL`).
        - Editar um aviso `EXPIRADO` com nova data de expiração futura volta a deixá-lo `ATIVO`.
        - `expiraEm` vazio tira a expiração.
        - Para publicar um rascunho, depois de salvar, use `POST /api/rh/avisos/{avisoId}/publicar`.
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoEdicaoComando' }
            example:
              titulo: Cantina com novo horário (atualizado)
              conteudo: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde passa para as 15:45.
              expiraEm: '2026-10-20'
              fixado: false
      responses:
        '200':
          description: Aviso atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoDetalheRh' }
              example:
                id: 412
                tipo: SIMPLES
                titulo: Cantina com novo horário (atualizado)
                previa: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde passa para as 15:45.
                situacao: ATIVO
                fixado: false
                publicacaoEmUtc: '2026-10-07T11:00:00Z'
                expiraEmUtc: '2026-10-21T02:59:59Z'
                autorNome: Ana Souza
                leitura: { viram: 41, total: 101 }
                conteudo: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde passa para as 15:45.
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A data de publicação não pode mudar nesta situação do aviso.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Este aviso já foi publicado; a data de publicação não pode mudar.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: AVISO_PUBLICACAO_NAO_EDITAVEL
        '500': { $ref: '#/components/responses/Erro500Interno' }
    delete:
      tags: [Avisos]
      operationId: excluirAviso
      summary: Exclui um aviso que ainda não foi publicado (rascunho ou agendado).
      description: |
        Só o RH (tela 27). Sem corpo. Só vale para aviso `RASCUNHO` ou `AGENDADO`: ninguém o viu e o e-mail dele ainda não saiu.
        Aviso já publicado (`ATIVO` ou `EXPIRADO`) **não se exclui**: devolve 422 `AVISO_NAO_PODE_SER_EXCLUIDO`; para tirá-lo do ar
        use `POST /api/rh/avisos/{avisoId}/encerrar`. Resposta 204. A exclusão é **física** (o aviso e as linhas de leitura dele somem) e entra
        na auditoria (área `AVISOS`, ação `EXCLUIU`). O Figma não desenha o botão "Excluir": a tela do RH precisa dele nos avisos
        rascunho e agendado.

        **O que se leu no banco** (`Criacao_Tabelas`, `Criacao_Triggers` e `V013`): `AVISOS` só tem triggers de `INSERT`, nada trava o `DELETE`;
        `AVISOS_VISUALIZACOES` tem chave estrangeira para `AVISOS` sem `ON DELETE CASCADE`, e o trigger `TRG_AVISOS_AFTER_INSERT` cria uma linha
        dessas por funcionário ativo já na criação do aviso (inclusive do rascunho). Por isso a API apaga primeiro essas linhas (todas "não lidas",
        porque aviso não publicado não pode ser aberto) e depois o aviso, na mesma transação. Nenhuma outra tabela aponta para `AVISOS`.
      x-perfis: [RH]
      responses:
        '204': { description: Aviso excluído. }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: O aviso já foi publicado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Só é possível excluir um aviso que ainda não foi publicado. Para tirar um aviso do ar, encerre-o.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: AVISO_NAO_PODE_SER_EXCLUIDO
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/avisos/{avisoId}/publicar:
    post:
      tags: [Avisos]
      operationId: publicarAviso
      summary: Publica um rascunho (agora ou na data prevista, se for futura).
      description: |
        Só o RH. Sem corpo. Usa a `publicarEmUtc` guardada no rascunho: vazia ou no passado publica agora; futura deixa o aviso `AGENDADO`.
        Ao publicar, o e-mail sai para todos os funcionários ativos (agora ou na data agendada) e a data de publicação gravada é a efetiva, não a
        do momento em que o rascunho foi criado. Se `expiraEm` ficou anterior à publicação, devolve 400.

        Só vale para rascunho: aviso já publicado devolve 422 `AVISO_JA_PUBLICADO`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/AvisoIdCaminho'
      responses:
        '200':
          description: Aviso publicado ou agendado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoDetalheRh' }
              example:
                id: 398
                tipo: DETALHADO
                titulo: Campanha de vacinação contra a gripe
                previa: Dias 13 e 14/10, das 09:00 às 16:00, na sala de treinamento. Todos os colaboradores. Dependentes podem se inscrever com o RH até 10/10.
                situacao: AGENDADO
                fixado: true
                publicacaoEmUtc: '2026-10-09T11:00:00Z'
                expiraEmUtc: '2026-10-16T02:59:59Z'
                autorNome: Ana Souza
                leitura: null
                conteudo: "## Quando\nDias 13 e 14/10, das 09:00 às 16:00, na sala de treinamento.\n\n## Quem pode\nTodos os colaboradores. Dependentes podem se inscrever com o RH até 10/10."
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: O aviso já foi publicado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Este aviso já foi publicado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: AVISO_JA_PUBLICADO
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/avisos/{avisoId}/encerrar:
    post:
      tags: [Avisos]
      operationId: encerrarAviso
      summary: Encerra um aviso ativo agora ("Encerrar agora").
      description: |
        Só o RH (tela 27). Sem corpo. Grava a expiração como o momento atual e o aviso passa a `EXPIRADO`; as leituras já feitas continuam na contagem.
        Só vale para aviso `ATIVO`: rascunho, agendado ou já expirado devolve 422 `AVISO_NAO_ESTA_ATIVO`.
        O aviso já publicado só se encerra, nunca se exclui; o que ainda não foi publicado (rascunho ou agendado) se exclui com
        `DELETE /api/rh/avisos/{avisoId}`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/AvisoIdCaminho'
      responses:
        '200':
          description: Aviso encerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoDetalheRh' }
              example:
                id: 412
                tipo: SIMPLES
                titulo: Cantina com novo horário
                previa: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde continua às 15:30.
                situacao: EXPIRADO
                fixado: false
                publicacaoEmUtc: '2026-10-07T11:00:00Z'
                expiraEmUtc: '2026-10-07T12:42:00Z'
                autorNome: Ana Souza
                leitura: { viram: 52, total: 101 }
                conteudo: A partir de 13/10, o almoço é servido das 11:30 às 14:00. O café da tarde continua às 15:30.
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: O aviso não está ativo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Só um aviso ativo pode ser encerrado.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: AVISO_NAO_ESTA_ATIVO
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/avisos/{avisoId}/leituras:
    get:
      tags: [Avisos]
      operationId: listarLeiturasDoAviso
      summary: Mostra quem viu e quem ainda não viu um aviso ("Quem viu").
      description: |
        Só o RH (tela 27). `viram` e `aindaNaoViram` são os totais do aviso e **não** mudam com `situacao`; `itens` é a lista pedida
        (a tela mostra os que ainda não viram: use `situacao=NAO_LIDO` e `tamanhoPagina=5`; "E mais 23 pessoas" = `total` − 5).
        Sem `situacao`, devolve todos. Ordem: nome.

        Quem **abre** o aviso conta como "viu" (ver `POST /api/eu/avisos/{avisoId}/leitura`). A contagem considera os funcionários ativos
        no momento em que o aviso foi criado, mais quem foi admitido depois e abriu o aviso.

        Só vale para aviso já publicado (`ATIVO`, `EXPIRADO`) e para `AGENDADO`/`RASCUNHO` devolve 422 `AVISO_AINDA_NAO_PUBLICADO`.
      x-perfis: [RH]
      parameters:
        - $ref: '#/components/parameters/AvisoIdCaminho'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - name: situacao
          in: query
