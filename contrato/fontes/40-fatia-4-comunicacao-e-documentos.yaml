        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '422':
          description: '`noDiaDoPagamento` com a empresa sem dia de pagamento configurado: o lote inteiro é recusado e nenhum item é processado.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: A empresa ainda não tem o dia do pagamento configurado. Configure em Cadastros > Empresa ou escolha uma data.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMPRESA_NAO_CONFIGURADA
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/holerites/{holeriteId}/versoes:
    post:
      tags: [Holerites]
      operationId: substituirHolerite
      summary: Corrige um holerite enviado errado, guardando uma nova versão no lugar dele.
      description: |
        Só o RH. `multipart/form-data`: `arquivo` (PDF até 5 MB) e, para escolher quando publicar, `publicarEm` **ou** `noDiaDoPagamento: true`
        (mesmas regras do envio individual, inclusive o 422 `EMPRESA_NAO_CONFIGURADA`; sem nenhum dos dois, publica agora).
        O holerite não se apaga (o banco proíbe): cria a **versão seguinte** (maior versão + 1) da mesma pessoa, competência e tipo. A pessoa passa a ver só a
        maior versão **já publicada** de cada (ano, mês, tipo); a versão antiga continua no histórico do RH. Se a nova for agendada, a antiga segue valendo até o dia.
        A pessoa recebe um novo e-mail **sempre** que a nova versão é publicada (na hora ou no dia agendado).

        `{holeriteId}` precisa ser a **versão atual**; se já existe versão mais nova, 409 `HOLERITE_VERSAO_DESATUALIZADA`.
        Esta ação **não existe no Figma**: a tela do RH precisa de um botão "Substituir" na lista da aba Holerites.
      x-perfis: [RH]
      x-provisorio: >-
        A correção por nova versão (em vez de apagar e reenviar) é decisão da sessão por delegação do dono (2026-10-29) e o dono pode discordar.
      parameters:
        - $ref: '#/components/parameters/HoleriteIdCaminho'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/HoleriteNovaVersaoComando' }
            example: { arquivo: holerite-bruno-lima-2026-09-corrigido.pdf }
      responses:
        '201':
          description: Nova versão guardada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoleriteItemRh' }
              example:
                id: 5240
                funcionarioId: 12
                tipo: MENSAL
                mes: 9
                ano: 2026
                versao: 2
                versaoAtual: true
                situacao: PUBLICADO
                publicacaoEmUtc: '2026-10-07T12:42:00Z'
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409':
          description: Já existe uma versão mais nova deste holerite.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Conflito.
                status: 409
                detail: Este holerite já foi substituído por uma versão mais nova. Atualize a lista.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: HOLERITE_VERSAO_DESATUALIZADA
        '422':
          description: |
            Recusada por regra do banco (as mesmas mensagens do envio individual, por exemplo se a pessoa foi desligada com data anterior à competência):
            `HOLERITE_COMPETENCIA_ANTERIOR_A_ADMISSAO`, `HOLERITE_COMPETENCIA_POSTERIOR_AO_DESLIGAMENTO`; e, com `noDiaDoPagamento: true` e a empresa
            sem dia de pagamento configurado, `EMPRESA_NAO_CONFIGURADA`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: A competência do holerite é posterior ao desligamento da pessoa.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: HOLERITE_COMPETENCIA_POSTERIOR_AO_DESLIGAMENTO
                regraDoBanco: A competencia do holerite e posterior ao desligamento.
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/holerites/{holeriteId}/download:
    get:
      tags: [Holerites]
      operationId: obterLinkDeDownloadDoHolerite
      summary: Devolve um link temporário para baixar o PDF de um holerite (RH).
      description: |
        Só o RH ("Baixar PDF" da tela 07). Vale para qualquer versão, publicada ou agendada. Devolve o `LinkTemporario`; o arquivo
        vem pelo link, como anexo, e nunca por link público. A `url` é uma URL assinada e opaca (o front só a abre; nunca a monta nem lê o
