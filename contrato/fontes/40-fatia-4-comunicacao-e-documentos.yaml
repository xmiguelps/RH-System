      summary: A pessoa confirma que tomou ciência da advertência ("Confirmar ciência").
      description: |
        Qualquer perfil, só para advertência **da própria pessoa** (de outra pessoa: 404). Sem corpo. A advertência passa de `PENDENTE` para `APLICADA`
        ("Ciente") e grava a data da ciência. Confirmar a ciência **não** quer dizer que a pessoa concorda.
        Só vale para `PENDENTE`; qualquer outra situação (inclusive repetir o clique) devolve 422 `ADVERTENCIA_NAO_ESTA_PENDENTE`.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/AdvertenciaIdCaminho'
      responses:
        '200':
          description: Ciência registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaEu' }
              example:
                id: 118
                data: '2026-10-05'
                tipo: ESCRITA
                motivo: Atrasos repetidos sem justificativa
                descricao: Nas últimas três semanas houve cinco atrasos na abertura da loja (22/09, 25/09, 29/09, 01/10 e 03/10), sem justificativa e sem pedido de ajuste no ponto. Abrir a loja no horário faz parte da escala do dia.
                aplicadaPor: { tipo: GESTOR, nome: Carlos Ribeiro }
                situacao: APLICADA
                dataCienciaUtc: '2026-10-07T12:41:00Z'
                textoContestacao: null
                dataContestacaoUtc: null
                desfechoDaContestacao: null
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A advertência não está aguardando ciência.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Esta advertência já teve ciência ou contestação.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ADVERTENCIA_NAO_ESTA_PENDENTE
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/advertencias/{advertenciaId}/contestacao:
    post:
      tags: [Advertências]
      operationId: contestarAdvertencia
      summary: A pessoa contesta a advertência, explicando o motivo ("Contestar").
      description: |
        Qualquer perfil, só para advertência **da própria pessoa** (de outra pessoa: 404). A advertência passa de `PENDENTE` para `CONTESTADA` e grava o texto e a
        data da contestação. O RH analisa e responde **por e-mail** (`POST /api/rh/advertencias/{advertenciaId}/resposta`); o RH a encontra na aba
        "Contestada" da lista dele (não há e-mail ao RH no momento da contestação: não está entre os eventos aprovados).
        Só vale para `PENDENTE`: contestar de novo, ou depois de dar ciência, devolve 422 `ADVERTENCIA_NAO_ESTA_PENDENTE` (a primeira contestação nunca é sobrescrita).
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/AdvertenciaIdCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvertenciaContestacaoComando' }
            example:
              texto: Em duas dessas datas eu estava com a chave da loja emprestada ao gerente, e avisei por mensagem. Posso mostrar a conversa.
      responses:
        '200':
          description: Contestação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertenciaEu' }
              example:
                id: 118
                data: '2026-10-05'
                tipo: ESCRITA
                motivo: Atrasos repetidos sem justificativa
                descricao: Nas últimas três semanas houve cinco atrasos na abertura da loja (22/09, 25/09, 29/09, 01/10 e 03/10), sem justificativa e sem pedido de ajuste no ponto. Abrir a loja no horário faz parte da escala do dia.
                aplicadaPor: { tipo: GESTOR, nome: Carlos Ribeiro }
                situacao: CONTESTADA
                dataCienciaUtc: null
                textoContestacao: Em duas dessas datas eu estava com a chave da loja emprestada ao gerente, e avisei por mensagem. Posso mostrar a conversa.
                dataContestacaoUtc: '2026-10-07T12:42:00Z'
                desfechoDaContestacao: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '422':
          description: A advertência não está aguardando ciência.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Operação recusada.
                status: 422
                detail: Esta advertência já teve ciência ou contestação.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: ADVERTENCIA_NAO_ESTA_PENDENTE
        '500': { $ref: '#/components/responses/Erro500Interno' }

  # ---------------------------------------------------------------- ANIVERSARIANTES (só a API; a tela é da fatia 7d)
  /api/eu/aniversariantes:
    get:
      tags: [Aniversariantes]
      operationId: listarAniversariantes
      summary: Lista quem faz aniversário hoje e nos próximos 14 dias (cartão da tela inicial, fatia 7d).
      description: |
        Qualquer perfil: todos veem os aniversariantes da empresa inteira (não só do setor). Só pessoas **ativas** com data de nascimento.
        Janela: de **hoje até 14 dias à frente** (`diasAte` de 0 a 14), pela data de hoje no fuso -03:00. Ordem: data do aniversário, depois nome.
        Quem nasceu em 29/02 comemora em 28/02 nos anos que não são bissextos. A lista é curta e **não é paginada**.

        `aniversarioEm` é a próxima data do aniversário (`diasAte: 0` é hoje: a tela diz "Ninguém faz aniversário hoje" quando nenhum item tem `diasAte: 0`).
        O **ano de nascimento e a idade não são expostos**. Esta rota é só da API; a tela é da fatia 7d.
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: Aniversariantes dos próximos dias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AniversariantesResposta' }
              example:
                dias: 14
                itens:
                  - funcionario: { id: 8, nome: Marina Costa, cargo: Gerente financeira, setor: Financeiro, ativo: true }
                    aniversarioEm: '2026-10-15'
                    diasAte: 8
                  - funcionario: { id: 24, nome: Pedro Santos, cargo: Vendedor, setor: Comercial, ativo: true }
                    aniversarioEm: '2026-10-19'
                    diasAte: 12
                  - funcionario: { id: 2, nome: Sofia Ramos, cargo: Analista de RH, setor: Recursos Humanos, ativo: true }
                    aniversarioEm: '2026-10-21'
                    diasAte: 14
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

components:
  parameters:
    AvisoIdCaminho:
      name: avisoId
      in: path
      required: true
      description: Identificador do aviso.
      schema: { type: integer }
    HoleriteIdCaminho:
      name: holeriteId
      in: path
      required: true
      description: Identificador do holerite (cada versão tem o seu).
      schema: { type: integer }
    AdvertenciaIdCaminho:
      name: advertenciaId
      in: path
      required: true
      description: Identificador da advertência.
      schema: { type: integer }

  schemas:
    # ------------------------------------------------------------ avisos
    AvisoTipo:
      type: string
      description: |
        `SIMPLES`: título e mensagem curta (texto puro, até 280 caracteres). `DETALHADO`: texto longo em markdown, com seções.
        (Decisão desta fatia: o banco guarda o tipo em `AVISOS.TIPO_AVISO`, que é texto livre, e usa estes dois valores.)
      enum: [SIMPLES, DETALHADO]

    AvisoSituacao:
      type: string
      description: |
        Calculada pela API, nunca enviada pelo front. `RASCUNHO`: salvo e não publicado. `AGENDADO`: publicado com data futura (ninguém vê ainda).
        `ATIVO`: no ar. `EXPIRADO`: passou da expiração ou foi encerrado.
      enum: [RASCUNHO, AGENDADO, ATIVO, EXPIRADO]

    AvisoLeituraContagem:
      type: object
      description: Quantas pessoas já abriram o aviso ("41 de 101 viram").
      required: [viram, total]
      properties:
        viram: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, description: Quantas pessoas deveriam ver o aviso. }

    AvisoItemRh:
      type: object
      description: Um aviso na lista do RH, sem o conteúdo inteiro.
      required: [id, tipo, titulo, previa, situacao, fixado, publicacaoEmUtc, expiraEmUtc, autorNome, leitura]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/AvisoTipo' }
        titulo: { type: string, maxLength: 200 }
        previa:
          type: string
          description: |
            Aviso simples: a mensagem inteira (até 280 caracteres). Aviso detalhado: o início do conteúdo em texto puro (sem markdown), até 200 caracteres.
            A tela corta com reticências conforme o espaço.
        situacao: { $ref: '#/components/schemas/AvisoSituacao' }
        fixado: { type: boolean, description: O aviso fica no topo da tela inicial até expirar. }
        publicacaoEmUtc:
          type: [string, 'null']
          format: date-time
          description: |
            Quando foi publicado, ou quando será (agendado). No rascunho é a data prevista, se alguém informou; senão `null`.
        expiraEmUtc:
          type: [string, 'null']
          format: date-time
          description: Quando expira (ou expirou). `null` = não expira.
        autorNome:
          type: [string, 'null']
          description: Quem criou o aviso ("Publicado por Ana Souza").
        leitura:
          oneOf:
            - $ref: '#/components/schemas/AvisoLeituraContagem'
            - type: 'null'
          description: Só nos avisos `ATIVO` e `EXPIRADO`; `null` em rascunho e agendado.

    AvisoDetalheRh:
      description: Um aviso com o conteúdo inteiro, para o painel de detalhes do RH.
      allOf:
        - $ref: '#/components/schemas/AvisoItemRh'
        - type: object
          required: [conteudo]
          properties:
            conteudo:
              type: string
              description: 'Simples, texto puro; detalhado, **markdown** (`format: markdown`). HTML nunca é interpretado.'

    AvisoListaRh:
      description: Página de avisos do RH.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AvisoItemRh' }

    AvisoPainelRh:
      type: object
      description: Números do topo da tela de avisos do RH e contagem de cada aba.
      required: [contagens, leituraMediaDosAtivosPercentual, expiramNosProximos7Dias, proximoAExpirar]
      properties:
        contagens:
          type: object
          required: [ativos, agendados, expirados, rascunhos]
          properties:
            ativos: { type: integer, minimum: 0 }
            agendados: { type: integer, minimum: 0 }
            expirados: { type: integer, minimum: 0 }
            rascunhos: { type: integer, minimum: 0 }
        leituraMediaDosAtivosPercentual:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Média de viram ÷ total entre os avisos ativos, arredondada. `null` sem aviso ativo.
        expiramNosProximos7Dias: { type: integer, minimum: 0 }
        proximoAExpirar:
          type: [object, 'null']
          description: O aviso ativo que expira primeiro, entre os que expiram nos próximos 7 dias. `null` se nenhum.
          required: [avisoId, titulo, expiraEmUtc]
          properties:
            avisoId: { type: integer }
            titulo: { type: string }
            expiraEmUtc: { type: string, format: date-time }

    AvisoCriacaoComando:
      type: object
      description: Corpo para criar um aviso (rascunho ou publicado).
      required: [tipo, titulo, conteudo, fixado, publicar]
      properties:
        tipo: { $ref: '#/components/schemas/AvisoTipo' }
        titulo: { type: string, minLength: 1, maxLength: 200 }
        conteudo:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            `format: markdown` no detalhado; texto puro no simples. **Simples: até 280 caracteres** (400 acima disso). Detalhado: até 10.000 caracteres.
            HTML nunca é interpretado.
        publicarEmUtc:
          type: [string, 'null']
          format: date-time
          description: |
            Com `publicar: true`: vazio ou no passado publica agora; no futuro agenda. Com `publicar: false`: a data prevista (opcional).
        expiraEm:
          type: [string, 'null']
          format: date
          description: Último dia em que o aviso vale (até o fim desse dia, fuso -03:00). Vazio = não expira.
        fixado: { type: boolean, description: Fixa no topo da tela inicial até expirar. }
        publicar: { type: boolean, description: '`false` salva como rascunho; `true` publica (ou agenda).' }

    AvisoEdicaoComando:
      type: object
      description: Corpo para editar um aviso. O tipo não muda.
      required: [titulo, conteudo, fixado]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        conteudo:
          type: string
          minLength: 1
          maxLength: 10000
          description: 'Mesma regra da criação (simples: até 280 caracteres; detalhado: markdown, até 10.000).'
        publicarEmUtc:
          type: [string, 'null']
          format: date-time
          description: Só muda em rascunho e agendado. Nos demais, vazio ou igual ao atual.
        expiraEm:
          type: [string, 'null']
          format: date
          description: Último dia em que o aviso vale. Vazio tira a expiração.
        fixado: { type: boolean }

    AvisoLeituraItem:
      type: object
      description: Uma pessoa na lista "Quem viu".
      required: [funcionario, lido, lidoEmUtc]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        lido: { type: boolean }
        lidoEmUtc: { type: [string, 'null'], format: date-time }

    AvisoLeituras:
      description: Totais de leitura do aviso e uma página da lista de pessoas.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [viram, aindaNaoViram, itens]
          properties:
            viram: { type: integer, minimum: 0 }
            aindaNaoViram: { type: integer, minimum: 0 }
            itens:
              type: array
              items: { $ref: '#/components/schemas/AvisoLeituraItem' }

    AvisoLembreteResultado:
      type: object
      required: [quantidadeDeEmails]
      properties:
        quantidadeDeEmails: { type: integer, minimum: 0, description: Quantos e-mails de lembrete foram enfileirados. }

    AvisoItemEu:
      type: object
      description: Um aviso vigente na lista de quem está logado.
      required: [id, tipo, titulo, previa, fixado, publicadoEmUtc, expiraEmUtc, autorNome, lido]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/AvisoTipo' }
        titulo: { type: string }
        previa: { type: string, description: 'Aviso simples: a mensagem inteira (até 280 caracteres). Detalhado: o início do conteúdo em texto puro (sem markdown), até 200 caracteres.' }
        fixado: { type: boolean }
        publicadoEmUtc: { type: string, format: date-time }
        expiraEmUtc: { type: [string, 'null'], format: date-time }
        autorNome: { type: [string, 'null'] }
        lido: { type: boolean, description: Se a pessoa já abriu o aviso. }

    AvisoDetalheEu:
      description: Um aviso vigente com o conteúdo inteiro.
      allOf:
        - $ref: '#/components/schemas/AvisoItemEu'
        - type: object
          required: [lidoEmUtc, conteudo]
          properties:
            lidoEmUtc: { type: [string, 'null'], format: date-time }
            conteudo:
              type: string
              description: 'Simples, texto puro; detalhado, **markdown** (`format: markdown`). O front mostra sem interpretar HTML.'

    AvisoListaEu:
      description: Página de avisos vigentes e as contagens das abas.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, contagens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AvisoItemEu' }
            contagens:
              type: object
              description: Não depende de `busca` nem de `apenasNaoLidos`.
              required: [naoLidos, total]
              properties:
                naoLidos: { type: integer, minimum: 0, description: Avisos vigentes que a pessoa ainda não abriu (também o número do menu). }
                total: { type: integer, minimum: 0, description: Todos os avisos vigentes. }

    # ------------------------------------------------------------ holerites
    HoleriteTipo:
      type: string
      description: Tipo do holerite (valores de `HOLERITES.TIPO_HOLERITE`, `V012`). Mensal, 13º salário ou férias.
      enum: [MENSAL, DECIMO_TERCEIRO, FERIAS]

    HoleriteSituacao:
      type: string
      description: '`PUBLICADO`: a pessoa já vê. `AGENDADO`: a publicação (e o e-mail) está marcada para um dia futuro.'
      enum: [PUBLICADO, AGENDADO]

    HoleriteItemRh:
      type: object
      description: Um holerite (uma versão) como o RH vê.
      required: [id, funcionarioId, tipo, mes, ano, versao, versaoAtual, situacao, publicacaoEmUtc]
      properties:
        id: { type: integer }
        funcionarioId: { type: integer }
        tipo: { $ref: '#/components/schemas/HoleriteTipo' }
        mes: { type: integer, minimum: 1, maximum: 12, description: Mês de competência. }
        ano: { type: integer, minimum: 2000, maximum: 2100, description: Ano de competência. }
        versao: { type: integer, minimum: 1, description: 1 é o envio original; cada correção cria a versão seguinte. }
        versaoAtual: { type: boolean, description: '`true` na maior versão da competência e tipo (a que a pessoa vê, depois de publicada).' }
        situacao: { $ref: '#/components/schemas/HoleriteSituacao' }
        publicacaoEmUtc: { type: string, format: date-time, description: 'Quando foi publicado ou quando será (agendado, sempre o começo do dia agendado).' }

    HoleriteListaRh:
      description: Página de holerites da pessoa, como o RH vê.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, ultimoPublicado]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/HoleriteItemRh' }
            ultimoPublicado:
              oneOf:
                - $ref: '#/components/schemas/HoleriteItemRh'
                - type: 'null'
              description: O holerite já publicado mais recentemente, ignorando filtros e página. `null` se nenhum.

    HoleriteItemEu:
      type: object
      description: Um holerite na lista da própria pessoa (só publicados, só a versão atual).
      required: [id, tipo, mes, ano, publicadoEmUtc]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/HoleriteTipo' }
        mes: { type: integer, minimum: 1, maximum: 12 }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        publicadoEmUtc: { type: string, format: date-time }

    HoleriteListaEu:
      description: Página de holerites da própria pessoa, com as contagens das abas e os anos do seletor.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, ano, anosDisponiveis, contagens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/HoleriteItemEu' }
            ano: { type: integer, description: 'O ano de competência usado (o pedido, ou o ano atual).' }
            anosDisponiveis:
              type: array
              description: Anos com algum holerite publicado, do mais recente para o mais antigo.
              items: { type: integer }
            contagens:
              type: object
              description: Do `ano` pedido; não depende de `tipo`.
              required: [todos, mensais, ferias, decimoTerceiro]
              properties:
                todos: { type: integer, minimum: 0 }
                mensais: { type: integer, minimum: 0 }
                ferias: { type: integer, minimum: 0 }
                decimoTerceiro: { type: integer, minimum: 0 }

    HoleriteEnvioComando:
      type: object
      description: Corpo (`multipart/form-data`) do envio de um holerite.
      required: [mes, ano, tipo, arquivo]
      properties:
        mes: { type: integer, minimum: 1, maximum: 12, description: Mês de competência. }
        ano: { type: integer, minimum: 2000, maximum: 2100, description: Ano de competência. }
        tipo: { $ref: '#/components/schemas/HoleriteTipo' }
        arquivo:
          type: string
          format: binary
          description: PDF do holerite. Só `application/pdf`, até 5 MB (5 × 1024 × 1024 bytes).
        publicarEm:
          type: string
          format: date
          description: |
            Para agendar numa data: dia da publicação, hoje ou futuro (fuso -03:00); publica no começo desse dia. Vazio ou hoje = publica agora.
            Dia passado: 400. **Exclusivo com `noDiaDoPagamento`** (os dois juntos: 400).
        noDiaDoPagamento:
          type: boolean
          description: |
            `true` agenda para o dia do próximo pagamento da empresa: o sistema calcula a data (a de `pagamento.data` em `GET /api/eu/pagamento/proximo`,
            fatia 7; se hoje é o dia do pagamento, publica agora). **Exclusivo com `publicarEm`** (os dois juntos: 400). Vazio ou `false`: vale `publicarEm`.
            Empresa sem dia de pagamento configurado: 422 `EMPRESA_NAO_CONFIGURADA`.

    HoleriteNovaVersaoComando:
      type: object
      description: Corpo (`multipart/form-data`) da correção de um holerite.
      required: [arquivo]
      properties:
        arquivo:
          type: string
          format: binary
          description: PDF corrigido. Só `application/pdf`, até 5 MB.
        publicarEm:
          type: string
          format: date
          description: Como no envio individual. Exclusivo com `noDiaDoPagamento`. Vazio (e sem `noDiaDoPagamento`) = publica agora.
        noDiaDoPagamento:
          type: boolean
          description: Como no envio individual (`HoleriteEnvioComando.noDiaDoPagamento`). Exclusivo com `publicarEm`.

    HoleriteLoteItemComando:
      type: object
      required: [funcionarioId, nomeDoArquivo]
      properties:
        funcionarioId: { type: integer }
        nomeDoArquivo: { type: string, minLength: 1, description: 'Nome do arquivo, como enviado em `arquivos`. Não pode repetir no lote.' }

    HoleriteLoteComando:
      type: object
      description: Corpo (`multipart/form-data`) do envio em lote. `itens` vai como JSON; `arquivos` repete o campo, um PDF por parte.
      required: [mes, ano, tipo, itens, arquivos]
      properties:
        mes: { type: integer, minimum: 1, maximum: 12 }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        tipo: { $ref: '#/components/schemas/HoleriteTipo' }
        publicarEm:
          type: string
          format: date
          description: Como no envio individual; vale para todos os itens. Exclusivo com `noDiaDoPagamento`.
        noDiaDoPagamento:
          type: boolean
          description: Como no envio individual (`HoleriteEnvioComando.noDiaDoPagamento`); vale para todos os itens. Exclusivo com `publicarEm`.
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/HoleriteLoteItemComando' }
        arquivos:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: binary, description: 'PDF de até 5 MB.' }

    HoleriteLoteItemResultado:
      type: object
      required: [funcionarioId, nomeDoArquivo, sucesso, holerite, codigoDoErro, mensagemDoErro]
      properties:
        funcionarioId: { type: integer }
        nomeDoArquivo: { type: string }
        sucesso: { type: boolean }
        holerite:
          oneOf:
            - $ref: '#/components/schemas/HoleriteItemRh'
            - type: 'null'
          description: O holerite criado; `null` se o item falhou.
        codigoDoErro:
          type: [string, 'null']
          description: |
            Se falhou: o `codigo` que a operação individual daria (`HOLERITE_JA_EXISTE`, `HOLERITE_COMPETENCIA_FUTURA`, `HOLERITE_COMPETENCIA_ANTERIOR_A_ADMISSAO`,
            `HOLERITE_COMPETENCIA_POSTERIOR_AO_DESLIGAMENTO`) ou `ARQUIVO_INVALIDO` (não é PDF, ou passa de 5 MB) ou `FUNCIONARIO_NAO_ENCONTRADO`.
        mensagemDoErro: { type: [string, 'null'], description: Texto em português para mostrar ao RH. }

    HoleriteLoteResultado:
      type: object
      required: [total, enviados, comErro, itens]
      properties:
        total: { type: integer, minimum: 0 }
        enviados: { type: integer, minimum: 0, description: Publicados mais agendados. }
        comErro: { type: integer, minimum: 0 }
        itens:
          type: array
          items: { $ref: '#/components/schemas/HoleriteLoteItemResultado' }

    # ------------------------------------------------------------ advertências
    AdvertenciaTipo:
      type: string
      description: '`VERBAL` ou `ESCRITA`. O banco guarda em `ADVERTENCIAS.TIPO_ADVERTENCIA`, que é texto livre; estes são os valores usados.'
      x-provisorio: >-
        Decisão do dono (roadmap, fatia 4, "tipos de advertência"): o spec e o Figma só têm verbal e escrita. Hipótese: só estes dois. Se houver mais
        (por exemplo suspensão), este enum cresce.
      enum: [VERBAL, ESCRITA]

    AdvertenciaSituacao:
      type: string
      description: |
        Valores do banco (`ADVERTENCIAS.STATUS_ADVERTENCIA`, `V014`). `PENDENTE`: "Aguardando ciência". `APLICADA`: "Ciente". `CONTESTADA`: "Contestada",
        esperando o RH. `CANCELADA`: contestação acatada; não muda mais.
        Fluxo: `PENDENTE` → `APLICADA` ou `CONTESTADA`; `CONTESTADA` → `APLICADA` (mantida) ou `CANCELADA` (acatada).
      enum: [PENDENTE, APLICADA, CONTESTADA, CANCELADA]

    AdvertenciaDesfecho:
      type: string
      description: 'O que o RH decidiu sobre a contestação. `MANTIDA`: a advertência continua (`APLICADA`). `ACATADA`: foi cancelada (`CANCELADA`).'
      enum: [MANTIDA, ACATADA]

    AdvertenciaAplicadaPor:
      type: object
      description: Quem aplicou a advertência.
      required: [tipo, nome]
      x-provisorio: >-
        O banco só guarda o gestor (`ADVERTENCIAS.ID_GESTOR`); não guarda qual pessoa do RH registrou. Hipótese: quando o RH registra, `tipo` é `RH` e `nome` é
        `null` (a tela mostra "RH"). Se o dono quiser o nome da pessoa do RH na coluna "Aplicada por", falta uma coluna nova (pedir ao Kauan) e `nome` passa a vir preenchido.
      properties:
        tipo: { type: string, enum: [GESTOR, RH] }
        nome: { type: [string, 'null'], description: Nome do gestor; `null` quando foi o RH. }

    AdvertenciaItem:
      type: object
      description: Uma advertência numa lista (RH, gestor ou ficha), sem a descrição.
      required: [id, data, funcionario, tipo, motivo, aplicadaPor, situacao]
      properties:
        id: { type: integer }
        data: { type: string, format: date, description: Data do ocorrido (`DATA_ADVERTENCIA`). }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        tipo: { $ref: '#/components/schemas/AdvertenciaTipo' }
        motivo: { type: string, maxLength: 255, description: Resumo de uma linha. }
        aplicadaPor: { $ref: '#/components/schemas/AdvertenciaAplicadaPor' }
        situacao: { $ref: '#/components/schemas/AdvertenciaSituacao' }

    AdvertenciaLista:
      description: Página de advertências.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AdvertenciaItem' }

    AdvertenciaDetalheRh:
      description: Uma advertência inteira, como o RH vê (com a contestação).
      allOf:
        - $ref: '#/components/schemas/AdvertenciaItem'
        - type: object
          required: [descricao, dataCienciaUtc, textoContestacao, dataContestacaoUtc, desfechoDaContestacao]
          properties:
            descricao: { type: string, description: 'O que aconteceu, quando e qual regra foi descumprida.' }
            dataCienciaUtc: { type: [string, 'null'], format: date-time }
            textoContestacao: { type: [string, 'null'], description: O texto que a pessoa escreveu ao contestar. }
            dataContestacaoUtc: { type: [string, 'null'], format: date-time }
            desfechoDaContestacao:
              oneOf:
                - $ref: '#/components/schemas/AdvertenciaDesfecho'
                - type: 'null'
              description: Preenchido depois que o RH responde; `null` antes disso ou se nunca houve contestação.

    AdvertenciaDetalheGestor:
      description: Uma advertência inteira de pessoa da equipe, como o gestor vê (sem o texto da contestação).
      x-provisorio: >-
        Decisão do dono: o gestor vê o texto da contestação e o desfecho? O roadmap só diz que o gestor vê as advertências da equipe. Hipótese: ele vê
        `situacao` (inclusive `CONTESTADA`), mas não o texto da pessoa nem a resposta do RH. Se vir, acrescentar `textoContestacao`, `dataContestacaoUtc` e
        `desfechoDaContestacao` a este schema.
      allOf:
        - $ref: '#/components/schemas/AdvertenciaItem'
        - type: object
          required: [descricao, dataCienciaUtc]
          properties:
            descricao: { type: string }
            dataCienciaUtc: { type: [string, 'null'], format: date-time }

    AdvertenciaEu:
      type: object
      description: Uma advertência da própria pessoa, completa (a lista dela já traz tudo).
      required: [id, data, tipo, motivo, descricao, aplicadaPor, situacao, dataCienciaUtc, textoContestacao, dataContestacaoUtc, desfechoDaContestacao]
      properties:
        id: { type: integer }
        data: { type: string, format: date, description: Data do ocorrido. }
        tipo: { $ref: '#/components/schemas/AdvertenciaTipo' }
        motivo: { type: string }
        descricao: { type: string }
        aplicadaPor: { $ref: '#/components/schemas/AdvertenciaAplicadaPor' }
        situacao: { $ref: '#/components/schemas/AdvertenciaSituacao' }
        dataCienciaUtc: { type: [string, 'null'], format: date-time }
        textoContestacao: { type: [string, 'null'] }
        dataContestacaoUtc: { type: [string, 'null'], format: date-time }
        desfechoDaContestacao:
          oneOf:
            - $ref: '#/components/schemas/AdvertenciaDesfecho'
            - type: 'null'
          description: Preenchido depois que o RH responde à contestação.

    AdvertenciaListaEu:
      description: Página de advertências da própria pessoa.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AdvertenciaEu' }

    AdvertenciaResumoRh:
      type: object
      description: |
        Números do topo da tela de advertências do RH e contagem de cada aba, de um ano. `contagens` são as das abas (incluem as canceladas, como a lista);
        `setorComMaisRegistros` conta só as advertências não canceladas do ano.
      required: [ano, contagens, setorComMaisRegistros]
      properties:
        ano: { type: integer }
        contagens:
          type: object
          required: [todas, pendentes, aplicadas, contestadas, canceladas]
          properties:
            todas: { type: integer, minimum: 0, description: 'Registradas no ano (todas as situações, inclusive as canceladas).' }
            pendentes: { type: integer, minimum: 0, description: Aguardando ciência. }
            aplicadas: { type: integer, minimum: 0, description: Ciente. }
            contestadas: { type: integer, minimum: 0 }
            canceladas: { type: integer, minimum: 0 }
        setorComMaisRegistros:
          type: [object, 'null']
          description: O setor atual com mais advertências **não canceladas** no ano; `null` se não há nenhuma.
          required: [setor, quantidade]
          properties:
            setor: { type: string }
            quantidade: { type: integer, minimum: 1 }

    AdvertenciaResumoGestor:
      type: object
      description: |
        Números do topo da tela de advertências do setor e o quadro "Por pessoa", de um ano. Todas as contagens usam a mesma regra: só advertência
        **não cancelada** (`PENDENTE`, `APLICADA` ou `CONTESTADA`) do ano pedido (padrão o ano corrente).
      required: [ano, registradas, aguardandoCiencia, pessoasComAdvertencia, totalDaEquipe, porPessoa]
      properties:
        ano: { type: integer }
        registradas: { type: integer, minimum: 0, description: 'Advertências não canceladas do ano para a equipe ("Registradas em 2026"). É a soma das quantidades de `porPessoa`.' }
        aguardandoCiencia:
          type: object
          required: [quantidade, pessoas]
          properties:
            quantidade: { type: integer, minimum: 0, description: Advertências `PENDENTE` da equipe. }
            pessoas:
              type: array
              description: Pessoas com advertência `PENDENTE`, sem repetir.
              items: { $ref: '#/components/schemas/FuncionarioResumo' }
        pessoasComAdvertencia: { type: integer, minimum: 0, description: Pessoas da equipe com pelo menos uma advertência não cancelada no ano. }
        totalDaEquipe: { type: integer, minimum: 0, description: 'Pessoas ativas da equipe, sem o gestor (o "8" de "2 de 8"; é o total de `GET /api/gestor/equipe`, fatia 1).' }
        porPessoa:
          type: array
          description: Todas as pessoas da equipe, da que tem mais advertências para a que tem menos e, no empate, por nome.
          items:
            type: object
            required: [funcionario, quantidade]
            properties:
              funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
              quantidade: { type: integer, minimum: 0, description: Advertências não canceladas dessa pessoa no ano. }

    AdvertenciaRegistroRhComando:
      type: object
      description: Corpo para o RH registrar uma advertência.
      required: [dataDoOcorrido, tipo, aplicadaPor, motivo, descricao]
      properties:
        dataDoOcorrido: { type: string, format: date, description: Dia do fato; hoje ou antes. }
        tipo: { $ref: '#/components/schemas/AdvertenciaTipo' }
        aplicadaPor:
          type: string
          enum: [GESTOR_DO_COLABORADOR, RH]
          description: Em nome de quem a advertência é registrada. `GESTOR_DO_COLABORADOR` exige que a pessoa tenha gestor ativo.
          x-provisorio: >-
            O print da tela 15 mostra só "Gestor do colaborador" selecionado; as outras opções do campo "Aplicada por" não aparecem. O contrato supõe duas:
            o gestor da pessoa e o RH (spec 13.3: "aplicadas pelo RH ou pelo gestor"). Se a lista for outra, este enum muda.
        motivo: { type: string, minLength: 1, maxLength: 255, description: Resumo de uma linha. }
        descricao: { type: string, minLength: 1, maxLength: 5000, description: 'O que aconteceu, quando e qual regra foi descumprida.' }

    AdvertenciaRegistroGestorComando:
      type: object
      description: Corpo para o gestor registrar uma advertência para a equipe dele. Quem aplica é sempre o gestor logado.
      required: [dataDoOcorrido, tipo, motivo, descricao]
      properties:
        dataDoOcorrido: { type: string, format: date, description: Dia do fato; hoje ou antes. }
        tipo: { $ref: '#/components/schemas/AdvertenciaTipo' }
        motivo: { type: string, minLength: 1, maxLength: 255, description: Resumo de uma linha. }
        descricao: { type: string, minLength: 1, maxLength: 5000, description: 'O que aconteceu, quando e qual regra foi descumprida.' }

    AdvertenciaContestacaoComando:
      type: object
      required: [texto]
      properties:
        texto: { type: string, minLength: 10, maxLength: 2000, description: O que a pessoa quer explicar ("explique o que aconteceu"). }

    AdvertenciaRespostaComando:
      type: object
      required: [decisao, resposta]
      properties:
        decisao:
          type: string
          enum: [MANTER, ACATAR]
          description: '`MANTER`: a advertência continua (`APLICADA`). `ACATAR`: a contestação é aceita e a advertência é cancelada (`CANCELADA`).'
        resposta: { type: string, minLength: 1, maxLength: 2000, description: Texto enviado por e-mail à pessoa. Não fica guardado no banco. }

    # ------------------------------------------------------------ aniversariantes
    AniversarianteItem:
      type: object
      required: [funcionario, aniversarioEm, diasAte]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        aniversarioEm: { type: string, format: date, description: 'Próxima data do aniversário (dia e mês de nascimento, no ano de hoje).' }
        diasAte: { type: integer, minimum: 0, maximum: 14, description: Dias até o aniversário; 0 é hoje. }

    AniversariantesResposta:
      type: object
      required: [dias, itens]
      properties:
        dias: { type: integer, description: 'Tamanho da janela, em dias à frente de hoje. Fixo em 14.' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/AniversarianteItem' }
