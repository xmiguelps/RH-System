  /api/rh/ponto/folha/exportacao:
    get:
      tags: [Ponto]
      operationId: exportarPontoParaFolha
      summary: Baixa o CSV de ponto do mês para a folha de pagamento (botão "Exportar para a folha").
      description: |
        Botão "Exportar para a folha" da tela 12. **Só o RH**. Devolve o arquivo direto (`.../exportacao`,
        `CONVENCOES.md` seção 11; `text/csv`, UTF-8 com BOM,
        separador `;`, com `Content-Disposition: attachment; filename="ponto-AAAA-MM.csv"`), **uma linha por pessoa
        ativa no mês**. O sistema não integra com a folha: gera só este arquivo (spec, seção 9).

        Colunas, nesta ordem: `matricula`, `nome`, `setor`, `cargo`, `dias_trabalhados`, `horas_trabalhadas_min`,
        `horas_previstas_min`, `atrasos`, `faltas`, `faltas_compensadas`, `banco_credito_do_mes_min`,
        `banco_debito_do_mes_min`. `dias_trabalhados` conta os dias com batidas fechadas; `horas_previstas_min` é a
        soma de `cargaMinutos` dos dias do mês; `faltas` são os dias `SEM_REGISTRO` já passados;
        `faltas_compensadas` são os dias `FALTA_COMPENSADA`; as duas últimas colunas somam os lançamentos do banco
        de horas cujo `diaReferencia` cai no mês. Durações em minutos inteiros. Débito e crédito vão em colunas separadas e
        **nenhum número é negativo**, para a regra de segurança do CSV não estragar o valor: células de texto que
        começam com `=`, `+`, `-` ou `@` recebem um apóstrofo na frente (roadmap, decisão 9); como nenhum número
        começa com `-`, a regra vale igual para todas as células.
      x-provisorio: "Formato do 'exportar para a folha' (decisão aberta do roadmap, fatia 3): quais colunas a folha precisa, separador, horas em minutos ou em decimal, e por pessoa ou por dia. O contrato assume o CSV de uma linha por pessoa descrito aqui. Mudar o formato muda só o arquivo, não as rotas."
      x-perfis: [RH]
      parameters:
        - { name: ano, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: mes, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: O arquivo CSV.
          headers:
            Content-Disposition:
              description: Sempre como anexo.
              schema: { type: string, example: 'attachment; filename="ponto-2026-09.csv"' }
          content:
            text/csv:
              schema: { type: string }
              example: |
                matricula;nome;setor;cargo;dias_trabalhados;horas_trabalhadas_min;horas_previstas_min;atrasos;faltas;faltas_compensadas;banco_credito_do_mes_min;banco_debito_do_mes_min
