  /api/gestor/ponto/pedidos-de-ajuste/{pedidoId}/aprovar:
    post:
      tags: [Pedidos de ajuste de ponto]
      operationId: aprovarPedidoDeAjusteComoGestor
      summary: Aprova o pedido na etapa do gestor (depois dele, o RH confirma).
      description: |
        Botão "Aprovar" da tela 55 (que diz "Depois de você, o RH confirma o ajuste"). **Só o gestor da equipe**
        (outra equipe, pedido de outro gestor ou pedido do próprio gestor: 404). Grava `decisaoGestor` com `decisao:
        APROVADA`; o pedido continua `PENDENTE` e passa para a `etapa: RH`. Nenhuma batida é alterada ainda. **A pessoa
        recebe e-mail com o resultado** (a decisão do gestor, `CONVENCOES.md`, seção 12; o envio passa pela fila de
        e-mails, tabela nova da aplicação, script `V035`) e vê o resultado em "Meus pedidos de ajuste".
        `observacao` é opcional, vai em `decisaoGestor.observacao` e aparece para a pessoa.

        Erros, os mesmos das férias (`CONVENCOES.md`, seção 9):
        - 409 `PEDIDO_JA_DECIDIDO`: o pedido já foi decidido (`status` diferente de `PENDENTE`);
        - 409 `PEDIDO_ETAPA_INCORRETA`: o pedido segue `PENDENTE`, mas já não está na etapa do gestor (está com o
          RH: outra aba decidiu, ou o gestor ausente já o passou adiante).
      x-perfis: [Gestor]
      parameters:
        - { name: pedidoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PontoPedidoDecisao' }
            example: { observacao: Conferido com a escala do dia. }
      responses:
        '200':
          description: Pedido na etapa do RH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PontoPedidoAjuste' }
              example:
                id: 303
                funcionario: { id: 22, nome: Júlia Nunes, cargo: Vendedora, setor: Comercial, ativo: true }
                data: '2026-10-05'
                criadoEmUtc: '2026-10-06T13:10:00Z'
                justificativa: Esqueci de registrar quando voltei do almoço. Estava no atendimento ao cliente na loja. Voltei às 13:05 e saí às 17:50.
                status: PENDENTE
                etapa: RH
                gestorResponsavel: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                decisaoGestor:
                  decisao: APROVADA
                  decididaPor: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                  decididaEmUtc: '2026-10-07T12:42:00Z'
                  automatica: false
                  observacao: Conferido com a escala do dia.
                decisaoRh: null
                itens:
                  - { id: 702, marcacaoId: null, tipo: ENTRADA, instanteUtc: '2026-10-05T16:05:00Z' }
                  - { id: 703, marcacaoId: null, tipo: SAIDA, instanteUtc: '2026-10-05T20:50:00Z' }
                resumoDaCorrecao: Incluir o período 13:05 - 17:50
                periodosDoDia:
                  - entrada: { id: 9311, ordem: 1, tipo: ENTRADA, rotulo: Entrada, instanteUtc: '2026-10-05T11:02:00Z', origem: SISTEMA, corrigidaEmUtc: null }
                    saida: { id: 9312, ordem: 2, tipo: SAIDA, rotulo: Saída almoço, instanteUtc: '2026-10-05T15:00:00Z', origem: SISTEMA, corrigidaEmUtc: null }
                podeDecidir: false
                motivoNaoPodeDecidir: Aguardando a análise do RH.
