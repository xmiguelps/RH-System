  /api/eu/ponto/banco-de-horas:
    get:
      tags: [Banco de horas]
      operationId: obterMeuBancoDeHoras
      summary: Mostra o saldo e o extrato do banco de horas da própria pessoa.
      description: |
        Bloco "Banco de horas" de "Meu ponto" (telas 33 e 47: os 4 últimos lançamentos, `tamanhoPagina=4`) e
        "Ver extrato completo". **Própria pessoa**, qualquer perfil. Mais recente primeiro, ordem fixa
        (`diaReferencia` decrescente).

        O extrato tem **só `CREDITO` e `DEBITO`** (decisão do dono, design seção 7: sem folga nem compensação; o
        "Compensação, folga de meio período" do Figma é só um Débito). Não existe lançamento manual: os lançamentos
        vêm da **consolidação diária** do agendador (tarefas agendadas: tabela nova da aplicação, script `V036`), que:
        - grava no máximo **uma linha por pessoa e por dia** (`diaReferencia`); rodar duas vezes não duplica;
        - ao subir depois de uma parada, recupera todos os dias que ficaram para trás;
        - recalcula o dia quando um ajuste de ponto é aprovado ou o RH corrige o dia;
        - compara as horas trabalhadas com a carga do dia (cargo semanal ÷ 5), que já vem **sem** o dia de férias
          aprovadas, de feriado, de folga e das horas cobertas por atestado validado (dia inteiro: esperado zero);
        - lança `CREDITO` (saldo positivo) ou `DEBITO` (saldo negativo ou falta); dia com saldo zero não gera
          linha (se um recálculo zerar uma linha existente, ela some);
        - **não lança** o dia com situação `INCOMPLETO` ou `AJUSTE_EM_ANALISE`: ele entra quando for resolvido
          (escolha minha, apoiada na tela 33, onde o dia 02/10 em análise não tem lançamento);
        - para quem está de saída, o banco recusa lançamento de funcionário inativo; a consolidação do último dia
          roda antes de a data de desligamento ser gravada.

        `saldoMinutos` é a **soma dos minutos de cada linha** do banco de horas (créditos menos débitos, de todos os
        lançamentos, não só da página). O banco guarda cada linha em **horas** (`BANCOS_HORAS.QUANTIDADE`, duas casas
        decimais): a API converte **cada linha** para minutos inteiros e **depois** soma. Somar as horas e converter
        no fim erra até alguns minutos (`Scripts\LEIA-ME.md`, "Armadilhas novas"); e `FN_CALCULAR_SALDO_BANCO_HORAS`,
        a função do banco, soma horas, então **não** deve ser usada para este campo.
        `atualizadoAte` é o **último dia consolidado**: o dia de referência da consolidação diária mais recente que
        terminou (tarefa agendada de consolidação do banco de horas, `TAREFAS_AGENDADAS`, script `V036`). É um valor
        **global** (o mesmo para todas as pessoas, não é por pessoa) e normalmente é ontem. **Dia com saldo zero não
        tem linha** no banco: `atualizadoAte` não depende de a pessoa ter lançamento naquele dia. Só é `null` se a
        consolidação nunca rodou.
      x-provisorio: "Regras de hora extra e de tolerância de atraso (decisão aberta do roadmap, fatia 3). O contrato assume que todo saldo positivo do dia vira Crédito, sem adicional, e que a tolerância só serve para marcar o atraso no espelho, não para abonar minutos do saldo. Se o dono decidir outra regra, mudam os valores e as descrições dos lançamentos, não os campos."
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanhoPagina'
        - $ref: '#/components/parameters/BancoHorasDe'
        - $ref: '#/components/parameters/BancoHorasAte'
        - $ref: '#/components/parameters/BancoHorasTipo'
      responses:
        '200':
          description: Saldo e página do extrato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BancoHorasExtrato' }
              example:
                saldoMinutos: 380
                atualizadoAte: '2026-10-06'
                itens:
                  - { id: 5120, diaReferencia: '2026-10-06', tipo: CREDITO, quantidadeMinutos: 12, descricao: Hora extra }
                  - { id: 5111, diaReferencia: '2026-10-05', tipo: DEBITO, quantidadeMinutos: 2, descricao: Saldo negativo do dia }
                  - { id: 5090, diaReferencia: '2026-10-01', tipo: CREDITO, quantidadeMinutos: 6, descricao: Hora extra }
                  - { id: 5013, diaReferencia: '2026-09-25', tipo: DEBITO, quantidadeMinutos: 240, descricao: Saldo negativo do dia }
                pagina: 1
                tamanhoPagina: 4
                total: 31
                totalPaginas: 8
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

