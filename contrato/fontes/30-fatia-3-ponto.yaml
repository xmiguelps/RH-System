      summary: Recusa o pedido na etapa do RH (nenhuma batida muda).
      description: |
        Botão "Recusar" da tela 13. **Só o RH**. **O RH pode recusar o que o gestor aprovou** (decisão do dono,
        2026-10-30). Mesmas condições e mesmos erros da aprovação (etapa do RH, `podeDecidir`): 409
        `PEDIDO_ETAPA_INCORRETA` se o gestor ainda não analisou, 409 `PEDIDO_JA_DECIDIDO`, 422
        `PEDIDO_RH_FORA_DE_GESTORES` e 422 `PEDIDO_PROPRIO` como na aprovação (o trigger também roda quando o
        status vira `REJEITADA`). Grava `status: REJEITADA`, `etapa: CONCLUIDA` e `decisaoRh` (`decisao: REJEITADA`, quem
        do RH e quando); nenhuma batida é alterada. **A pessoa recebe e-mail com o resultado** (a decisão do RH,
        `CONVENCOES.md`, seção 12; fila de e-mails, tabela nova da aplicação, script `V035`). `observacao` é
