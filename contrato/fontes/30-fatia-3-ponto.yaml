    post:
      tags: [Pedidos de ajuste de ponto]
      operationId: criarPedidoDeAjuste
      summary: Pede o ajuste das batidas de um dia (uma ou várias batidas no mesmo pedido).
      description: |
        Botão "Pedir ajuste" (telas 33 e 47, e o link do cartão da tela 32). **Própria pessoa**, qualquer perfil.
        O modal tem "Dia do ponto", a correção (uma batida, ou um período = uma entrada e uma saída, ou várias) e a
        justificativa. Um pedido cobre **um dia**; a correção é uma lista de batidas (`itens`): batida nova
        (`marcacaoId` vazio) ou correção de uma batida existente do mesmo dia (`marcacaoId`).

        Regras (422 com `codigo`, salvo onde dito; cada uma tem um exemplo de erro abaixo):
        - o dia (`data`) precisa já ter passado (antes de hoje, fuso -03:00): `PONTO_PEDIDO_DIA_NAO_PASSOU`. Por isso
          todo pedido é criado **depois** do dia a que se refere (`criadoEmUtc` cai em dia posterior a `data`);
        - nenhum instante pode estar no futuro: `PONTO_INSTANTE_NO_FUTURO`;
        - cada instante cai no próprio dia ou no dia seguinte (jornada que atravessa a meia-noite):
          `PONTO_INSTANTE_FORA_DO_DIA`;
        - o dia, **depois de aplicar os itens**, precisa fechar em pares `ENTRADA` e `SAIDA` alternados e em ordem
          (a validação da sequência fica com a aplicação): `PONTO_SEQUENCIA_INVALIDA`;
        - só um pedido em análise por dia: 409 `PONTO_PEDIDO_JA_EM_ANALISE`. A regra vale **também no banco** (script
          `V040`): só pode haver **um** pedido `PENDENTE` por dia e por pessoa (a chave é o registro de ponto da pessoa
          naquele dia). Por isso a **segunda tentativa simultânea** (duplo clique, duas abas) cai **no mesmo 409
          `PONTO_PEDIDO_JA_EM_ANALISE`**: a API continua conferindo antes de gravar e, se o banco recusar por essa chave,
          devolve o mesmo erro, nunca um 500;
        - a pessoa inativa não pede: `FUNCIONARIO_INATIVO` (recusa do banco, em `regraDoBanco`).

        **Não existe erro "pessoa sem gestor"**: o pedido sempre é aceito e a API decide a etapa (regras completas
        na descrição da tag "Pedidos de ajuste de ponto"):
        - quem pede é gestor, ou o setor dela não tem gestor, ou o gestor do setor está desligado: o pedido nasce
          com `etapa: RH` (sem etapa do gestor: `gestorResponsavel: null`, `decisaoGestor: null`) e só o RH decide;
        - senão, nasce com `etapa: GESTOR` e `gestorResponsavel` é o gestor do setor;
        - **a não ser que** esse gestor esteja **ausente** (ausência ligada em `PUT /api/rh/gestores/{gestorId}/ausencia`,
          fatia 1): então o pedido já nasce com a etapa do gestor aprovada sozinha (`decisaoGestor` com `decisao:
          APROVADA`, `automatica: true`, `decididaPor: null`) e `etapa: RH`.

        Se o dia ainda não tem registro de ponto, ele é criado junto (a coluna do pedido exige o dia). O banco
        pode recusar por `Nao e possivel registrar ponto de funcionario inativo.` ou `A data do ponto e anterior a
        admissao.` (`regraDoBanco`). Nada é aplicado às batidas até o RH aprovar. **Criar o pedido não manda e-mail**: o
        e-mail de resultado sai a cada decisão (gestor e RH), não na criação (`CONVENCOES.md`, seção 12).
      x-provisorio: "Existe prazo máximo para pedir o ajuste de um dia antigo, e quem pode registrar ponto retroativo (decisão aberta do roadmap, fatia 3)? O contrato não tem prazo: qualquer dia passado serve. Se houver prazo, entra um erro 422 novo e `podePedirAjuste` passa a considerá-lo."
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PontoPedidoAjusteCriar' }
            example:
              data: '2026-10-05'
              justificativa: Esqueci de registrar quando voltei do almoço. Estava no atendimento ao cliente na loja. Voltei às 13:05 e saí às 17:50.
              itens:
                - { tipo: ENTRADA, instanteUtc: '2026-10-05T16:05:00Z', marcacaoId: null }
                - { tipo: SAIDA, instanteUtc: '2026-10-05T20:50:00Z', marcacaoId: null }
      responses:
        '201':
          description: Pedido criado. A etapa depende de quem pede (ver a descrição da operação).
