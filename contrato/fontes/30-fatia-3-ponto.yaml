        "Aguardando você") e `motivoNaoPodeDecidir`. O pedido do próprio gestor, o de outro gestor e o de gente de
        outro setor **não** aparecem aqui: o de gestor não tem etapa do gestor, vai direto ao RH, e o do próprio gestor é
        visto por `/api/eu/ponto/pedidos-de-ajuste`. `resumo` conta os pedidos da equipe em análise (etapa do gestor e
