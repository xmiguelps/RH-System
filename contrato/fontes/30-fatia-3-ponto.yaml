                data: '2026-10-06'
                criadoEmUtc: '2026-10-07T11:15:00Z'
                justificativa: Esqueci de registrar a entrada e a saída da manhã. Trabalhei das 08:00 às 12:00.
                status: REJEITADA
                etapa: CONCLUIDA
                gestorResponsavel: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                decisaoGestor:
                  decisao: REJEITADA
                  decididaPor: { id: 7, nome: Carlos Ribeiro, cargo: Gerente comercial, setor: Comercial, ativo: true }
                  decididaEmUtc: '2026-10-07T12:42:00Z'
                  automatica: false
                  observacao: Não bate com o registro da portaria. Fale comigo.
                decisaoRh: null
                itens:
                  - { id: 704, marcacaoId: null, tipo: ENTRADA, instanteUtc: '2026-10-06T11:00:00Z' }
                  - { id: 709, marcacaoId: null, tipo: SAIDA, instanteUtc: '2026-10-06T15:00:00Z' }
