  /api/eu/ponto/pedidos-de-ajuste:
    get:
      tags: [Pedidos de ajuste de ponto]
      operationId: listarMeusPedidosDeAjuste
      summary: Lista os pedidos de ajuste de ponto da própria pessoa.
      description: |
        Bloco "Meus pedidos de ajuste" de "Meu ponto" (telas 33 e 47) e o aviso "Seu pedido de ajuste ... está em
        análise" da tela inicial (`status=PENDENTE`). **Própria pessoa**, qualquer perfil.

        Cada pedido mostra "Aguardando a análise de ...": na etapa `GESTOR` o nome vem de `gestorResponsavel`; na etapa
        `RH` o texto é "Aguardando a análise do RH" (o banco não guarda uma pessoa do RH responsável, então o nome
        que o Figma mostra na tela 47 não existe no contrato); `etapa: CONCLUIDA` é pedido já decidido (`status`
        `APROVADA` ou `REJEITADA`; quem decidiu e a observação estão em `decisaoGestor` e `decisaoRh`). Sem filtro, vêm
        todos os pedidos, do mais recente ao mais antigo.

        Nesta rota `podeDecidir` é sempre `false` (quem pede não decide pela própria tela) e
        `motivoNaoPodeDecidir` diz em que ponto o pedido está (ver `PontoPedidoAjuste`).
