  /api/rh/ponto/atestados/{atestadoId}/download:
    get:
      tags: [Atestados]
      operationId: baixarAtestado
      summary: Devolve o link temporário do arquivo de um atestado.
      description: |
        **Só o RH.** O arquivo é dado de saúde: cada link gerado fica **registrado na auditoria** (quem, quando,
        qual atestado, IP e origem; tabela nova da aplicação, script `V037`; área `ATESTADOS`, ação `BAIXOU`). Nunca há
        link público; o link vale pouco tempo e baixa como anexo.
      x-perfis: [RH]
      parameters:
        - { name: atestadoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Link temporário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkTemporario' }
              example: { url: 'https://armazenamento.exemplo.com.br/download?assinatura=5d2e71c9f843', expiraEmUtc: '2026-10-07T12:57:00Z' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/ponto/atestados/{atestadoId}/validar:
    post:
      tags: [Atestados]
      operationId: validarAtestado
      summary: Valida o atestado (o dia vira "Falta compensada").
      description: |
        **Só o RH** valida (o gestor só vê). Muda `ENVIADO` para `VALIDADO`, grava quem do RH decidiu e quando.
        Efeito: o dia (ou as horas cobertas) deixa de contar como falta e **não desconta** do banco de horas: o
        espelho mostra `FALTA_COMPENSADA` (dia inteiro) ou reduz `cargaMinutos` (atestado de horas), e a
        consolidação do banco de horas recalcula os dias do atestado. O atestado de dias inteiros validado que cobre
        hoje faz a pessoa aparecer como `ATESTADO` em `SituacaoHoje` (só depois de validado: enquanto `ENVIADO`, como o 43
        da Carla Mendes e o 44 do João Pedro Alves hoje, a pessoa não aparece como `ATESTADO`). O RH pode validar o
        próprio atestado (o dono aceitou que o RH confirme o próprio pedido, `Scripts\LEIA-ME.md:98`). Não há e-mail
        para o atestado (lista fechada, `CONVENCOES.md`, seção 12).
        409 `ATESTADO_JA_DECIDIDO` se já foi validado ou recusado (código do atestado, que tem uma só decisão; não é o
        `PEDIDO_JA_DECIDIDO` dos pedidos em duas etapas).
      x-perfis: [RH]
      parameters:
        - { name: atestadoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Atestado validado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atestado' }
              example:
                id: 43
                funcionario: { id: 4, nome: Carla Mendes, cargo: Assistente administrativa, setor: Administrativo, ativo: true }
                dataInicio: '2026-10-01'
                dataFim: '2026-10-02'
                horaInicio: null
                horaFim: null
                situacao: VALIDADO
                nomeArquivo: atestado-carla.pdf
                enviadoEmUtc: '2026-10-07T11:30:00Z'
                decididoEmUtc: '2026-10-07T12:42:00Z'
                decididoPorNome: Roberto Alves
                motivoRecusa: null
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/AtestadoErro409JaDecidido' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/rh/ponto/atestados/{atestadoId}/recusar:
    post:
      tags: [Atestados]
      operationId: recusarAtestado
      summary: Recusa o atestado com um motivo (o dia segue como falta).
      description: |
        **Só o RH** recusa. Muda `ENVIADO` para `RECUSADO`, com o `motivo` obrigatório (o banco exige). A pessoa
        vê "recusado" e o motivo, e o dia segue como falta. 409 `ATESTADO_JA_DECIDIDO` se já foi decidido.
      x-perfis: [RH]
      parameters:
        - { name: atestadoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtestadoRecusar' }
            example: { motivo: O documento não informa o horário da consulta. Envie outro com o horário. }
      responses:
        '200':
          description: Atestado recusado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atestado' }
              example:
                id: 33
                funcionario: { id: 12, nome: Bruno Lima, cargo: Analista pleno, setor: Financeiro, ativo: true }
                dataInicio: '2026-09-25'
                dataFim: '2026-09-25'
                horaInicio: '13:00'
                horaFim: '17:48'
                situacao: RECUSADO
                nomeArquivo: declaracao-consulta.jpg
                enviadoEmUtc: '2026-09-25T20:30:00Z'
                decididoEmUtc: '2026-09-28T12:15:00Z'
                decididoPorNome: Roberto Alves
                motivoRecusa: O documento não informa o horário da consulta. Envie outro com o horário.
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409': { $ref: '#/components/responses/AtestadoErro409JaDecidido' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

components:
  parameters:
    PontoAno:
      name: ano
      in: query
      description: Ano do espelho. Sem `ano` e `mes`, vale o mês atual (fuso -03:00).
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    PontoMes:
      name: mes
      in: query
      description: Mês do espelho (1 a 12). Sem `ano` e `mes`, vale o mês atual (fuso -03:00).
      schema: { type: integer, minimum: 1, maximum: 12 }
    PontoPedidoStatusFiltro:
      name: status
      in: query
      description: Filtra pelo status do pedido (valores do banco). Sem ele, vêm todos.
      schema: { $ref: '#/components/schemas/PontoPedidoStatus' }
    PontoPedidoEtapaFiltro:
      name: etapa
      in: query
      description: Filtra pela etapa em que o pedido está (`GESTOR`, `RH`; `CONCLUIDA` é o pedido já decidido). Combina com `status`.
      schema: { $ref: '#/components/schemas/EtapaDoPedido' }
    PontoFuncionarioIdFiltro:
      name: funcionarioId
      in: query
      description: Filtra por uma pessoa (id do funcionário). O gestor só enxerga a equipe dele.
      schema: { type: integer }
    PontoPedidoOrdenarPor:
      name: ordenarPor
      in: query
      description: Campo da ordenação (a direção vem em `direcao`; padrão `DESC`).
      schema: { type: string, enum: [CRIADO_EM, DIA_DO_PONTO], default: CRIADO_EM }
    BancoHorasDe:
      name: de
      in: query
      description: Só lançamentos com `diaReferencia` a partir deste dia (inclusive).
      schema: { type: string, format: date }
    BancoHorasAte:
      name: ate
      in: query
      description: Só lançamentos com `diaReferencia` até este dia (inclusive).
      schema: { type: string, format: date }
    BancoHorasTipo:
      name: tipo
      in: query
      description: Só créditos ou só débitos.
      schema: { $ref: '#/components/schemas/BancoHorasTipoLancamento' }
    AtestadoSituacaoFiltro:
      name: situacao
      in: query
      description: Filtra pela situação do atestado. Sem ele, vêm todos.
      schema: { $ref: '#/components/schemas/AtestadoSituacao' }

  responses:
    PontoErro409Decisao:
      description: O pedido já foi decidido (`PEDIDO_JA_DECIDIDO`) ou não está na etapa de quem decide (`PEDIDO_ETAPA_INCORRETA`). Nada foi alterado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          examples:
            jaDecidido:
              summary: O pedido já foi decidido
              value:
                title: Pedido já decidido.
                status: 409
                detail: Este pedido já foi respondido. Atualize a lista.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_JA_DECIDIDO
            etapaIncorreta:
              summary: O pedido não está na etapa de quem decide
              value:
                title: Pedido fora da vez.
                status: 409
                detail: Este pedido não está mais na etapa em que você pode decidir. Atualize a lista.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_ETAPA_INCORRETA
    PontoErro422DecisaoRh:
      description: Quem decide não está cadastrado como gestor (`PEDIDO_RH_FORA_DE_GESTORES`) ou é a própria pessoa do pedido (`PEDIDO_PROPRIO`). Nada foi alterado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
          examples:
            rhForaDeGestores:
              summary: 'Pedido sem etapa do gestor, decidido por alguém do RH que não está em GESTORES'
              value:
                title: Quem decide precisa ser gestor também.
                status: 422
                detail: Este pedido não tem etapa do gestor. Para decidi-lo, você precisa estar cadastrado também como gestor.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_RH_FORA_DE_GESTORES
                regraDoBanco: Informe o gestor responsavel pela analise.
            pedidoProprio:
              summary: 'Quem decide é a própria pessoa do pedido'
              value:
                title: Você não pode decidir o próprio pedido.
                status: 422
                detail: A operação foi recusada por uma regra do banco de dados.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_PROPRIO
                regraDoBanco: O gestor nao pode analisar a propria solicitacao.
    AtestadoErro409JaDecidido:
      description: |
        O atestado já foi validado ou recusado (`ATESTADO_JA_DECIDIDO`). É o código do **atestado**, que tem uma só
        decisão do RH; os pedidos em duas etapas (ajuste de ponto e férias) usam `PEDIDO_JA_DECIDIDO`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeApi' }
          example:
            title: Atestado já decidido.
            status: 409
            detail: Este atestado já foi respondido. Atualize a lista.
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: ATESTADO_JA_DECIDIDO

  schemas:
    # ---------------------------------------------------------------- batidas, dia e espelho
    PontoTipoMarcacao:
      type: string
      description: Tipo da batida (valores do banco, `PONTOS_MARCACOES.TIPO_MARCACAO`).
      enum: [ENTRADA, SAIDA]

    PontoOrigemMarcacao:
      type: string
      description: |
        `SISTEMA`: a própria pessoa bateu. `CORRIGIDA_RH`: o RH incluiu ou corrigiu a batida (por um pedido aprovado
        ou direto pela ficha). Valores do banco (`PONTOS_MARCACOES.ORIGEM`).
      enum: [SISTEMA, CORRIGIDA_RH]

    PontoMarcacao:
      type: object
      description: Uma batida de ponto.
      required: [id, ordem, tipo, rotulo, instanteUtc, origem, corrigidaEmUtc]
      properties:
        id: { type: integer }
        ordem:
          type: integer
          minimum: 1
          description: Posição da batida no dia, em ordem de horário (1 é a primeira).
        tipo: { $ref: '#/components/schemas/PontoTipoMarcacao' }
        rotulo:
          type: string
          description: |
            Nome da batida para mostrar, calculado pela API: `ordem` 1 `ENTRADA` = "Entrada"; 2 `SAIDA` = "Saída
            almoço"; 3 `ENTRADA` = "Volta"; 4 `SAIDA` = "Saída". Da quinta batida em diante, ou quando o tipo não
            combina com a posição (sequência quebrada), é só "Entrada" ou "Saída" pelo `tipo`.
        instanteUtc: { type: string, format: date-time, description: Momento da batida em UTC; o front mostra em America/Sao_Paulo. }
        origem: { $ref: '#/components/schemas/PontoOrigemMarcacao' }
        corrigidaEmUtc:
          type: [string, 'null']
          format: date-time
          description: |
            Quando o RH corrigiu ou incluiu a batida; `null` se `origem` é `SISTEMA`. A fonte é a **coluna**
            `PONTOS_MARCACOES.DATA_CORRECAO` (script `V039`), não o log de auditoria: a coluna `ORIGEM` diz quem e
            `DATA_CORRECAO` diz quando, e um `CHECK` do banco as amarra (`CORRIGIDA_RH` tem a data, `SISTEMA` não tem).
            A aplicação grava as duas juntas, no mesmo `INSERT` ou `UPDATE`, tanto na correção direta do RH
            (`PUT .../ponto/dias/{dia}`) quanto na aprovação de um pedido de ajuste. O banco guarda a coluna em -03:00 e a
            API a converte para UTC aqui. O front monta o texto da linha: "{rotulo} corrigida pelo RH em {dd/MM}" (por
            exemplo "Saída corrigida pelo RH em 07/10").

    PontoPeriodo:
      type: object
      description: |
        Uma `ENTRADA` e a `SAIDA` seguinte. A API pareia as batidas em ordem: `ENTRADA` abre um período e a `SAIDA`
        seguinte o fecha. Período com `saida: null` é "sem saída" (em aberto, hoje, ou esquecido, em dia passado).
        Num dia com a sequência quebrada, uma `ENTRADA` seguida de outra deixa a primeira sem saída, e uma `SAIDA` sem
        entrada vira um período com `entrada: null`.
      required: [entrada, saida]
      properties:
        entrada:
          oneOf:
            - { $ref: '#/components/schemas/PontoMarcacao' }
            - { type: 'null' }
        saida:
          oneOf:
            - { $ref: '#/components/schemas/PontoMarcacao' }
            - { type: 'null' }

    PontoProximaMarcacao:
      type: object
      description: A batida que o botão do cartão vai fazer agora.
      required: [tipo, rotulo, textoDoBotao]
      properties:
        tipo: { $ref: '#/components/schemas/PontoTipoMarcacao' }
        rotulo: { type: string, description: 'Mesmo critério de `PontoMarcacao.rotulo`, para a batida que ainda vai acontecer.' }
        textoDoBotao: { type: string, description: 'Texto do botão: "Registrar entrada", "Registrar saída para almoço", "Registrar volta" ou "Registrar saída".' }

    PontoJornada:
      type: object
      description: |
        Jornada da pessoa: carga do cargo e horário padrão da empresa (um só para todos). Tudo `null` quando o cargo
        não tem carga horária (`cargaSemanalMinutos`, `cargaDiariaMinutos`) ou a empresa ainda não configurou o horário
        (`horarioEntrada`, `horarioSaida`, `toleranciaAtrasoMinutos`); sem horário padrão não há cálculo de atraso.
      required: [cargaSemanalMinutos, cargaDiariaMinutos, horarioEntrada, horarioSaida, toleranciaAtrasoMinutos]
      properties:
        cargaSemanalMinutos: { type: [integer, 'null'], minimum: 1, description: 'Carga semanal do cargo (44 h = 2640). Texto da tela: "Jornada de 44 horas semanais".' }
        cargaDiariaMinutos: { type: [integer, 'null'], minimum: 1, description: 'Carga do dia = semanal dividida por 5 (44 h = 528, "8h48").' }
        horarioEntrada: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Horário padrão de entrada, "HH:mm" sem fuso.' }
        horarioSaida: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Horário padrão de saída, "HH:mm" sem fuso.' }
        toleranciaAtrasoMinutos: { type: [integer, 'null'], minimum: 0, maximum: 120 }

    PontoBancoHoras:
      type: object
      description: Saldo atual do banco de horas.
      required: [saldoMinutos, atualizadoAte]
      properties:
        saldoMinutos: { type: integer, description: 'Soma dos minutos de cada linha do banco de horas (cada linha convertida de horas para minutos e depois somada; créditos menos débitos). Negativo é devedor. Ver `GET /api/eu/ponto/banco-de-horas`.' }
        atualizadoAte: { type: [string, 'null'], format: date, description: 'Último dia consolidado ("Atualizado até ontem"): valor global (o mesmo para todas as pessoas), tirado da tarefa agendada de consolidação do banco de horas (`TAREFAS_AGENDADAS`, script `V036`). `null` só se a consolidação nunca rodou.' }

    PontoHoje:
      type: object
      description: Cartão "Seu ponto hoje" da própria pessoa.
      required: [dataDoPonto, agoraUtc, jornada, periodos, proximaMarcacao, bancoHoras]
      properties:
        dataDoPonto: { type: string, format: date, description: 'Dia do ponto a que `periodos` pertence (normalmente hoje, fuso -03:00).' }
        agoraUtc: { type: string, format: date-time, description: Relógio do servidor. }
        jornada: { $ref: '#/components/schemas/PontoJornada' }
        periodos: { type: array, items: { $ref: '#/components/schemas/PontoPeriodo' } }
        proximaMarcacao: { $ref: '#/components/schemas/PontoProximaMarcacao' }
        bancoHoras: { $ref: '#/components/schemas/PontoBancoHoras' }

    PontoMarcacaoRegistrar:
      type: object
      required: [tipoEsperado]
      properties:
        tipoEsperado:
          $ref: '#/components/schemas/PontoTipoMarcacao'

    PontoDiaDaSemana:
      type: string
      enum: [SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO]

    PontoDiaSituacao:
      type: string
      description: |
        Situação do dia, que vira a etiqueta da linha. **Precedência:**
        1. há pedido de ajuste `PENDENTE` do dia: `AJUSTE_EM_ANALISE` (mesmo sem batida);
        2. com batidas, sem pedido: hoje = `EM_ANDAMENTO`; dia passado com a sequência quebrada (entrada sem saída,
           entrada seguida de entrada, saída sem entrada; é o que a função `FN_VERIFICAR_CONSISTENCIA_PONTO` do grupo
           chama de inconsistente) = `INCOMPLETO`; senão, com atraso = `ATRASO`; senão `NORMAL`;
        3. sem batida e sem pedido, nesta ordem: `FOLGA` (sábado e domingo, "Sem expediente"), `FERIADO`,
           `FERIAS` (férias `APROVADA`, `EM_GOZO` ou `CONCLUIDA` cobrindo o dia), `FALTA_COMPENSADA` (atestado
           `VALIDADO` de dia inteiro) e, no resto, `SEM_REGISTRO` (dia com expediente sem nenhuma batida, inclusive
           hoje; no dia passado conta como falta).
        Etiquetas do Figma: `NORMAL` "Normal", `ATRASO` "Atraso de N min" (`atrasoMinutos`), `AJUSTE_EM_ANALISE`
        "Ajuste em análise" (tela 12: "Ajuste pendente"), `EM_ANDAMENTO` "Hoje" ou "Em andamento", `FOLGA` "Folga",
        `SEM_REGISTRO` "Sem registro". Sem etiqueta no Figma: `INCOMPLETO` "Incompleto", `FERIADO` (mostre
        `nomeFeriado`), `FERIAS` "Férias", `FALTA_COMPENSADA` "Falta compensada".

        **Não é a `SituacaoHoje` da base** (`CONVENCOES.md`, seção 10). Esta é a situação **de um dia do espelho**,
        hoje ou passado, e tem valores que a outra não tem. A `SituacaoHoje` é a situação **de hoje** (cartões e
        listas "agora") e separa `SEM_REGISTRO` (depois do horário de entrada mais a tolerância) de
        `AINDA_NAO_COMECOU` (antes disso); aqui, hoje sem batida é `SEM_REGISTRO` em qualquer hora, porque o espelho não
        faz essa distinção. Quem mostra o dia no espelho usa este enum; quem mostra "hoje" usa `SituacaoHoje`.
      x-provisorio: "Quando um dia com batidas é incompleto? O Figma (telas 55 e 56) mostra 'volta sem registro' para um dia com só entrada e saída da manhã, e as horas e o saldo vazios, mas essa sequência é consistente para a função do grupo. O contrato só chama de INCOMPLETO a sequência quebrada; o dia com 2 batidas fechadas vem NORMAL, com as horas calculadas. Se o dono decidir que o dia precisa de 4 batidas (ou de outra regra), muda a regra de INCOMPLETO e o texto, não os campos."
      enum: [NORMAL, ATRASO, INCOMPLETO, AJUSTE_EM_ANALISE, EM_ANDAMENTO, SEM_REGISTRO, FOLGA, FERIADO, FERIAS, FALTA_COMPENSADA]

    PontoEspelhoDia:
      type: object
      description: Um dia do espelho de ponto.
      required: [data, diaDaSemana, ehHoje, situacao, nomeFeriado, periodos, horasMinutos, cargaMinutos, saldoMinutos, atrasoMinutos, pedidoEmAnaliseId]
      properties:
        data: { type: string, format: date, description: Dia de calendário (fuso -03:00). }
        diaDaSemana: { $ref: '#/components/schemas/PontoDiaDaSemana' }
        ehHoje: { type: boolean }
        situacao: { $ref: '#/components/schemas/PontoDiaSituacao' }
        nomeFeriado: { type: [string, 'null'], description: 'Nome do feriado, se o dia é feriado (mesmo que a pessoa tenha batido ponto nele).' }
        periodos:
          type: array
          description: Períodos do dia, em ordem. `[]` sem batida. As colunas Entrada, Saída almoço, Volta e Saída da tela 12 são as batidas de `ordem` 1 a 4.
          items: { $ref: '#/components/schemas/PontoPeriodo' }
        horasMinutos:
          type: [integer, 'null']
          minimum: 0
          description: |
            Horas trabalhadas no dia, em minutos (soma dos períodos fechados; os segundos são descartados). `null`
            (a tela mostra "—") quando não há o que calcular: hoje, `INCOMPLETO`, e dia sem expediente e sem batida.
            No dia passado `SEM_REGISTRO` vem `0`.
        cargaMinutos: { type: integer, minimum: 0, description: 'Horas esperadas no dia: a carga do dia (cargo semanal ÷ 5) nos dias com expediente; `0` em folga, feriado, férias e falta compensada (dia inteiro) e quando o cargo não tem carga; menos as horas cobertas por atestado de horas validado. A tela mostra "—" quando é `0`.' }
        saldoMinutos: { type: [integer, 'null'], description: '`horasMinutos` menos `cargaMinutos` (negativo é saldo devedor); `null` quando `horasMinutos` é `null`.' }
        atrasoMinutos:
          type: [integer, 'null']
          minimum: 1
          description: |
            Minutos de atraso da primeira `ENTRADA` do dia em relação ao horário padrão de entrada da empresa, **só
            quando passa da tolerância** (conta o atraso inteiro, não só o que passou da tolerância: 08:14 contra
            08:00 é 14). `null` sem atraso, sem batida, em dia sem expediente ou sem horário padrão configurado.
            Vem preenchido também quando a `situacao` é outra (por exemplo `AJUSTE_EM_ANALISE`).
          x-provisorio: "Como a tolerância de atraso e a hora extra entram na conta (decisão aberta do roadmap, fatia 3)? O contrato assume: atraso = entrada depois do horário padrão acrescido da tolerância, contando os minutos desde o horário padrão. Se o dono decidir outra regra, mudam os valores, não os campos."
        pedidoEmAnaliseId: { type: [integer, 'null'], description: 'Id do pedido de ajuste `PENDENTE` do dia, se houver (o RH abre no "Revisar pedido").' }

    PontoEspelhoDiaProprio:
      description: Dia do espelho da própria pessoa, com a permissão do botão "Pedir ajuste".
      allOf:
        - $ref: '#/components/schemas/PontoEspelhoDia'
        - type: object
          required: [podePedirAjuste]
          properties:
            podePedirAjuste:
              type: boolean
              description: |
                `true` quando a linha mostra o botão "Pedir ajuste": o dia já passou (antes de hoje), não tem pedido
                em análise e é dia com expediente ou com batidas (folga, feriado, férias e falta compensada sem batida
                não têm botão).

    PontoResumoMes:
      type: object
      description: Os cartões do topo do espelho.
      required: [horasTrabalhadasNoMesMinutos, saldoBancoHorasMinutos, pedidosEmAnalise, atrasos, faltas]
      properties:
        horasTrabalhadasNoMesMinutos: { type: integer, minimum: 0, description: 'Soma de `horasMinutos` dos dias do mês (os `null` não entram: hoje e dias incompletos).' }
        saldoBancoHorasMinutos: { type: integer, description: 'Saldo total do banco de horas hoje (não só do mês); o mesmo de `bancoHoras.saldoMinutos` (soma dos minutos de cada linha, ver `PontoBancoHoras`).' }
        pedidosEmAnalise: { type: integer, minimum: 0, description: 'Pedidos de ajuste da pessoa `PENDENTE` (qualquer etapa e qualquer mês).' }
        atrasos: { type: integer, minimum: 0, description: 'Dias do mês com `atrasoMinutos` preenchido.' }
        faltas: { type: integer, minimum: 0, description: 'Dias passados do mês com situação `SEM_REGISTRO` (não conta hoje).' }

    PontoEspelho:
      type: object
      description: Espelho de ponto do mês de uma pessoa (visão do gestor e do RH).
      required: [funcionario, ano, mes, jornada, resumo, dias]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        ano: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }
        jornada: { $ref: '#/components/schemas/PontoJornada' }
        resumo: { $ref: '#/components/schemas/PontoResumoMes' }
        dias: { type: array, items: { $ref: '#/components/schemas/PontoEspelhoDia' } }

    PontoEspelhoProprio:
      type: object
      description: Espelho de ponto do mês da própria pessoa.
      required: [ano, mes, jornada, resumo, dias]
      properties:
        ano: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }
        jornada: { $ref: '#/components/schemas/PontoJornada' }
        resumo: { $ref: '#/components/schemas/PontoResumoMes' }
        dias: { type: array, items: { $ref: '#/components/schemas/PontoEspelhoDiaProprio' } }

    PontoDiaCorrigirMarcacao:
      type: object
      required: [tipo, instanteUtc]
      properties:
        id: { type: [integer, 'null'], description: Id da batida existente; vazio ou ausente é batida nova. }
        tipo: { $ref: '#/components/schemas/PontoTipoMarcacao' }
        instanteUtc: { type: string, format: date-time }

    PontoDiaCorrigir:
      type: object
      description: A lista completa de batidas que o dia deve ter depois da correção (substitui a atual).
      required: [marcacoes]
      properties:
        marcacoes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PontoDiaCorrigirMarcacao' }

    # ---------------------------------------------------------------- pedidos de ajuste
    PontoPedidoStatus:
      type: string
      description: Status do pedido (valores do banco, `PONTOS_MANUTENCOES.STATUS_SOLICITACAO`). Só muda na decisão final; as etapas ficam em `etapa`.
      enum: [PENDENTE, APROVADA, REJEITADA]

    PontoPedidoItem:
      type: object
      description: Uma batida pedida (nova ou correção de uma existente).
      required: [id, marcacaoId, tipo, instanteUtc]
      properties:
        id: { type: integer }
        marcacaoId: { type: [integer, 'null'], description: A batida existente que o item corrige; `null` é batida nova. }
        tipo: { $ref: '#/components/schemas/PontoTipoMarcacao' }
        instanteUtc: { type: string, format: date-time }

    PontoPedidoItemEnviar:
      type: object
      required: [tipo, instanteUtc]
      properties:
        tipo: { $ref: '#/components/schemas/PontoTipoMarcacao' }
        instanteUtc: { type: string, format: date-time, description: 'O horário que a pessoa digitou no dia, convertido de -03:00 para UTC.' }
        marcacaoId: { type: [integer, 'null'], description: 'Batida existente do mesmo dia a corrigir; vazio ou ausente é batida nova.' }

    PontoPedidoAjusteCriar:
      type: object
      required: [data, justificativa, itens]
      properties:
        data: { type: string, format: date, description: 'Dia do ponto ("Dia do ponto"), fuso -03:00. Já tem que ter passado.' }
        justificativa: { type: string, minLength: 5, maxLength: 500 }
        itens:
          type: array
          minItems: 1
          maxItems: 10
          description: As batidas pedidas. Uma batida ou um período (entrada e saída) são 1 ou 2 itens; podem ser várias.
          items: { $ref: '#/components/schemas/PontoPedidoItemEnviar' }

    PontoPedidoAjuste:
      type: object
      description: |
        Um pedido de ajuste de ponto, com tudo o que os modais das telas 13 e 55 mostram. É o mesmo modelo de pedido
        das férias (`CONVENCOES.md`, seção 9): `status` é o do banco (nunca renomeado), `etapa` diz onde o pedido está,
        `gestorResponsavel`, `decisaoGestor` e `decisaoRh` contam as duas etapas (forma única, `DecisaoDeEtapa` da base) e
        `podeDecidir` e `motivoNaoPodeDecidir` dizem se **quem está consultando** pode decidir agora, para o front
        habilitar ou desabilitar os botões sem adivinhar. Os `id` de `gestorResponsavel` e de `decididaPor` são
        `funcionarioId` (nunca `gestorId`).
      required: [id, funcionario, data, criadoEmUtc, justificativa, status, etapa, gestorResponsavel, decisaoGestor, decisaoRh, itens, resumoDaCorrecao, periodosDoDia, podeDecidir, motivoNaoPodeDecidir]
      properties:
        id: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        data: { type: string, format: date, description: Dia do ponto (fuso -03:00). }
        criadoEmUtc: { type: string, format: date-time, description: '"Pedido em" (o banco preenche). Sempre depois do fim do dia a que o pedido se refere (`data`): só se pede ajuste de um dia que já passou.' }
        justificativa: { type: string }
        status: { $ref: '#/components/schemas/PontoPedidoStatus' }
        etapa:
          description: |
            Onde o pedido está (`EtapaDoPedido` da base). `GESTOR`: aguarda o gestor do setor. `RH`: aguarda o RH
            (o gestor já aprovou, o gestor ausente aprovou sozinho, ou o pedido **não tem etapa do gestor**: é de quem
            é gestor, de um setor sem gestor ou de um gestor desligado). `CONCLUIDA`: já foi decidido (`status` é
            `APROVADA` ou `REJEITADA`). Nunca é `null`. A etapa **nasce** em `GESTOR` ou em `RH` e **só avança**: se o
            setor ganhar um gestor depois, o pedido que nasceu em `RH` continua em `RH` (ver a tag "Pedidos de ajuste de
            ponto").
          $ref: '#/components/schemas/EtapaDoPedido'
        gestorResponsavel:
          description: |
            O gestor da etapa do gestor: enquanto o pedido espera, o gestor atual do setor; depois, o que analisou ou, na
            aprovação automática, o gestor ausente. `null` nos pedidos **sem etapa do gestor**. O `id` é o
            `funcionarioId` do gestor. (O banco grava, na decisão do RH desses pedidos, a linha de `GESTORES` de quem do
            RH decidiu, porque o trigger exige; isso **não** aparece aqui, quem decidiu está em `decisaoRh.decididaPor`.)
          oneOf:
            - { $ref: '#/components/schemas/FuncionarioResumo' }
            - { type: 'null' }
        decisaoGestor:
          description: |
            O que o gestor decidiu (`DecisaoDeEtapa` da base); `null` enquanto ele não decidiu e **nos pedidos sem etapa
            do gestor**. `decisao` é `APROVADA` (no banco, `RESULTADO_GESTOR = APROVOU`) ou `REJEITADA` (`RECUSOU`, que
            encerra o pedido: `etapa: CONCLUIDA`, `decisaoRh: null`). Quando a etapa foi aprovada sozinha porque o gestor
            estava ausente (`PUT /api/rh/gestores/{gestorId}/ausencia`, fatia 1, no pedido novo ou ao ligar a ausência
            com o pedido já parado), vem `automatica: true` e `decididaPor: null`, e `decididaEmUtc` é o momento em que ela
            valeu. A `observacao` segue a regra da descrição do pedido: some quando o RH decide.
          oneOf:
            - { $ref: '#/components/schemas/DecisaoDeEtapa' }
            - { type: 'null' }
        decisaoRh:
          description: |
            O que o RH decidiu (`DecisaoDeEtapa` da base, sempre `automatica: false`); `null` enquanto o RH não decidiu e
            quando o gestor recusou. `decisao` é `APROVADA` (o pedido vira `APROVADA` e as batidas são corrigidas) ou
            `REJEITADA` (inclusive o que o gestor tinha aprovado). `decididaPor` é quem do RH confirmou. **Observação:** o
            banco guarda uma só por pedido (`PONTOS_MANUTENCOES.OBSERVACAO`); ao decidir, a do RH substitui a do gestor, e
            por isso `decisaoGestor.observacao` volta `null` num pedido que o RH já decidiu (a do gestor fica no log de
            auditoria).
          oneOf:
            - { $ref: '#/components/schemas/DecisaoDeEtapa' }
            - { type: 'null' }
        itens: { type: array, items: { $ref: '#/components/schemas/PontoPedidoItem' } }
        resumoDaCorrecao:
          type: string
          description: |
            "Correção pedida", em texto pronto, com horários em -03:00: batida nova isolada "Incluir a entrada às
            HH:mm" ou "Incluir a saída às HH:mm"; entrada e saída novas juntas "Incluir o período HH:mm - HH:mm";
            batida existente "Corrigir a entrada para HH:mm" ou "Corrigir a saída para HH:mm". Várias partes separadas por "; ".
        periodosDoDia: { type: array, items: { $ref: '#/components/schemas/PontoPeriodo' }, description: '"Registro atual": as batidas do dia **agora** (depois de aprovado, já com a correção).' }
        podeDecidir:
          type: boolean
          description: |
            `true` quando **quem está consultando** pode decidir o pedido agora, pela tela do perfil dele: o gestor do
            setor na etapa `GESTOR`; o RH na etapa `RH` (e, no pedido sem etapa do gestor, só quem do RH também está em
            `GESTORES` e não é a própria pessoa do pedido). Nas rotas `/api/eu/...` (a pessoa vendo o próprio pedido)
            é sempre `false`.
        motivoNaoPodeDecidir:
          type: [string, 'null']
          description: |
            Texto em português, pronto para mostrar, de por que os botões estão desabilitados; `null` quando
            `podeDecidir` é `true`. São **cinco textos fixos** (a API devolve exatamente estes; a fatia 7 os copia para as
            férias):
            - etapa `GESTOR`, para o RH ou para a própria pessoa: "Aguardando a análise do gestor.";
            - etapa `RH`, para o gestor ou para a própria pessoa: "Aguardando a análise do RH.";
            - etapa `CONCLUIDA`: "Este pedido já foi decidido.";
            - etapa `RH` sem etapa do gestor, para quem do RH não está em `GESTORES`: "Este pedido não passa pelo gestor
              e o banco exige que quem decide também esteja cadastrado como gestor. Peça a outra pessoa do RH.";
            - etapa `RH` sem etapa do gestor, para a própria pessoa do pedido (que é gestor): "Você não pode decidir o
              seu próprio pedido." (vale antes do texto anterior).

    PontoPedidoAjustePagina:
      description: Página de pedidos.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens: { type: array, items: { $ref: '#/components/schemas/PontoPedidoAjuste' } }

    PontoPedidoFilaResumo:
      type: object
      description: Quantos pedidos estão em análise, por etapa (independe da página e de `status`/`etapa`, mas respeita o escopo do perfil).
      required: [comGestor, comRh]
      properties:
        comGestor: { type: integer, minimum: 0, description: 'Pedidos `PENDENTE` na etapa do gestor.' }
        comRh: { type: integer, minimum: 0, description: 'Pedidos `PENDENTE` na etapa do RH.' }

    PontoPedidoAjusteFilaPagina:
      description: Página de pedidos para gestor e RH, com a contagem por etapa.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens, resumo]
          properties:
            itens: { type: array, items: { $ref: '#/components/schemas/PontoPedidoAjuste' } }
            resumo: { $ref: '#/components/schemas/PontoPedidoFilaResumo' }

    PontoPedidoDecisao:
      type: object
      properties:
        observacao: { type: [string, 'null'], maxLength: 500, description: '"Observação para {nome} (opcional)". A pessoa a lê junto da resposta.' }

    # ---------------------------------------------------------------- equipe (gestor)
    PontoEquipeFerias:
      type: object
      required: [funcionario, ate]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        ate: { type: string, format: date, description: Último dia das férias em curso. }

    PontoEquipeResumo:
      type: object
      description: |
        Os quatro cartões da tela 54. As contagens usam o `PresencaContagens` da base (a única forma de contar situações de
        hoje) e a definição de cada situação é a `SituacaoHoje` (`CONVENCOES.md`, seção 10); `diaUtil` fica ao lado delas e as
        listas de nomes vão em campos separados.
      required: [contagensHoje, diaUtil, pessoasSemRegistro, pessoasDeFerias, pedidosParaAnalisar]
      properties:
        contagensHoje:
          description: |
            Quantas pessoas da equipe estão em cada `SituacaoHoje` (a soma dos seis valores é o número de pessoas da equipe).
            O cartão "Trabalhando agora" é `contagensHoje.trabalhando`: pessoas que **já registraram entrada hoje**, mesmo que já
            tenham saído. Só existe para **hoje**: vem `null` quando a consulta é de um dia passado (não há "situação de hoje" de
            outro dia; os cartões usam as listas abaixo).
          oneOf:
            - { $ref: '#/components/schemas/PresencaContagens' }
            - { type: 'null' }
        diaUtil:
          type: boolean
          description: 'Se o dia consultado tem expediente. `false` em sábado, domingo ou feriado: o cartão mostra "Hoje não há expediente" (hoje, quem já bateu entrada fica `TRABALHANDO` e os demais `SEM_EXPEDIENTE`; `CONVENCOES.md`, seção 10).'
        pessoasSemRegistro:
          type: array
          items: { $ref: '#/components/schemas/FuncionarioResumo' }
          description: 'As **pessoas** sem registro: hoje, `situacaoHoje: SEM_REGISTRO` (não inclui `AINDA_NAO_COMECOU`); num dia passado, `situacaoDoDia: SEM_REGISTRO`. Nesta fatia é lista; o painel da fatia 7 só mostra o número. `[]` em dia sem expediente.'
        pessoasDeFerias:
          type: array
          items: { $ref: '#/components/schemas/PontoEquipeFerias' }
          description: 'As pessoas de férias no dia consultado (hoje, `situacaoHoje: FERIAS`; dia passado, `situacaoDoDia: FERIAS`). `[]` em dia sem expediente, porque `SEM_EXPEDIENTE` vem antes de `FERIAS` na precedência.'
        pedidosParaAnalisar: { type: integer, minimum: 0, description: 'Pedidos da equipe na etapa do gestor.' }

    PontoEquipeItem:
      type: object
      description: Uma linha de "Hoje no setor".
      required: [funcionario, periodos, horasAteAgoraMinutos, saldoBancoHorasMinutos, situacaoHoje, situacaoDoDia, periodoAberto]
      properties:
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        periodos: { type: array, items: { $ref: '#/components/schemas/PontoPeriodo' }, description: '"Períodos de hoje" (do dia consultado). `[]` mostra "Nenhum registro".' }
        horasAteAgoraMinutos: { type: [integer, 'null'], minimum: 0 }
        saldoBancoHorasMinutos: { type: integer, description: 'Coluna "Banco de horas" (saldo total: soma dos minutos de cada linha, ver `PontoBancoHoras`).' }
        situacaoHoje:
          description: |
            A situação **de hoje** da pessoa (`SituacaoHoje` da base): é o chip "Trabalhando", "Férias", "Sem registro"
            etc. `TRABALHANDO` é "já registrou entrada hoje", mesmo que já tenha saído. **`null` quando a consulta é de
            um dia passado** (não existe situação "de hoje" de outro dia): então o chip vem de `situacaoDoDia`.
            Se a pessoa já registrou entrada, vale `TRABALHANDO` (mesma precedência do espelho, em que a batida vence),
            mesmo em férias, folga ou feriado; sem entrada, valem nesta ordem `SEM_EXPEDIENTE`, `FERIAS`, `ATESTADO`
            (atestado validado de dia inteiro; o de algumas horas não gera `ATESTADO`), `SEM_REGISTRO` e
            `AINDA_NAO_COMECOU` (a precedência é a de `CONVENCOES.md`, seção 10). Só o atestado **validado** entra: o
            `ENVIADO` ainda não faz a pessoa ficar `ATESTADO`. Num dia sem expediente (sábado, domingo ou feriado), quem
            já bateu entrada fica `TRABALHANDO` e as demais pessoas `SEM_EXPEDIENTE`.
          oneOf:
            - { $ref: '#/components/schemas/SituacaoHoje' }
            - { type: 'null' }
        situacaoDoDia:
          description: 'A situação do **dia consultado no espelho** (`PontoDiaSituacao`, outro conceito, com enum próprio: tem `ATRASO`, `EM_ANDAMENTO`, `AJUSTE_EM_ANALISE` etc.). É a mesma do espelho da pessoa para esse dia. Serve de chip quando `situacaoHoje` é `null`.'
          $ref: '#/components/schemas/PontoDiaSituacao'
        periodoAberto:
          type: boolean
          description: 'Campo de apoio: `true` quando a última batida do dia consultado é uma `ENTRADA` sem saída (hoje, a pessoa está dentro agora; num dia passado, a saída foi esquecida). `situacaoHoje: TRABALHANDO` com `periodoAberto: false` quer dizer que a pessoa já saiu (almoço ou fim do dia): mostre "Saiu".'

    PontoEquipeDia:
      type: object
      description: Tela "Ponto da equipe".
      required: [data, resumo, itens]
      properties:
        data: { type: string, format: date }
        resumo: { $ref: '#/components/schemas/PontoEquipeResumo' }
        itens: { type: array, items: { $ref: '#/components/schemas/PontoEquipeItem' } }

    # ---------------------------------------------------------------- banco de horas
    BancoHorasTipoLancamento:
      type: string
      description: Tipo do lançamento (valores do banco). Só existem estes dois (decisão do dono, design seção 7).
      enum: [CREDITO, DEBITO]

    BancoHorasLancamento:
      type: object
      description: Um lançamento automático do banco de horas (uma linha por pessoa e por dia).
      required: [id, diaReferencia, tipo, quantidadeMinutos, descricao]
      properties:
        id: { type: integer }
        diaReferencia: { type: string, format: date, description: O dia trabalhado a que o lançamento se refere (o "06/10" do extrato). }
        tipo: { $ref: '#/components/schemas/BancoHorasTipoLancamento' }
        quantidadeMinutos: { type: integer, minimum: 1, description: Sempre positiva; o sinal vem do `tipo`. }
        descricao: { type: string, description: 'Texto da linha, gerado pela consolidação: "Hora extra" (crédito), "Saldo negativo do dia" (débito) ou "Falta" (débito de dia sem batida).' }

    BancoHorasExtrato:
      description: Saldo do banco de horas e uma página do extrato (mais recente primeiro).
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [saldoMinutos, atualizadoAte, itens]
          properties:
            saldoMinutos: { type: integer, description: 'Soma dos minutos de cada linha do banco de horas, de todos os lançamentos (não só os filtrados): cada linha é convertida de horas para minutos e depois somada; créditos menos débitos.' }
            atualizadoAte: { type: [string, 'null'], format: date, description: 'Último dia consolidado: valor global (o mesmo para todas as pessoas), da tarefa agendada de consolidação do banco de horas (`TAREFAS_AGENDADAS`, script `V036`). `null` só se a consolidação nunca rodou.' }
            itens: { type: array, items: { $ref: '#/components/schemas/BancoHorasLancamento' } }

    # ---------------------------------------------------------------- feriados
    FeriadoTipo:
      type: string
      description: Tipo (valores do banco). Só `MUNICIPAL` se cadastra pela tela; `EMPRESA` existe no banco, mas o Figma não o oferece.
      enum: [NACIONAL, ESTADUAL, MUNICIPAL, EMPRESA]

    Feriado:
      type: object
      required: [id, nome, data, tipo, uf, municipio, repeteTodoAno, ativo, podeEditar]
      properties:
        id: { type: integer }
        nome: { type: string }
        data: { type: string, format: date }
        tipo: { $ref: '#/components/schemas/FeriadoTipo' }
        uf: { type: [string, 'null'], description: 'Preenchida em `ESTADUAL` e `MUNICIPAL`.' }
        municipio: { type: [string, 'null'], description: 'Preenchido em `MUNICIPAL`.' }
        repeteTodoAno: { type: boolean }
        ativo: { type: boolean }
        podeEditar: { type: boolean, description: '`true` só em `MUNICIPAL`. A tela escreve "Nacional, importado automaticamente" e "Municipal" pelo `tipo`. O Figma diz também "adicionado por Ana Souza", mas o banco não guarda quem cadastrou (só a auditoria), então o contrato não traz isso.' }

    FeriadoLista:
      type: object
      description: Lista curta, sem paginação.
      required: [itens]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Feriado' } }

    FeriadoCriar:
      type: object
      required: [nome, data]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100 }
        data: { type: string, format: date }
        repeteTodoAno: { type: boolean, default: false, description: '"Repetir todos os anos". Só para feriado de data fixa; 29/02 não se repete em ano não bissexto.' }

    FeriadoEditar:
      type: object
      required: [nome, data, repeteTodoAno, ativo]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100 }
        data: { type: string, format: date }
        repeteTodoAno: { type: boolean }
        ativo: { type: boolean, description: '`false` desativa o feriado sem apagá-lo.' }

    # ---------------------------------------------------------------- atestados
    AtestadoSituacao:
      type: string
      description: Situação do atestado (valores do banco, `STATUS_ATESTADO`). `ENVIADO` aguarda o RH.
      enum: [ENVIADO, VALIDADO, RECUSADO]

    Atestado:
      type: object
      description: Um atestado. Não guarda diagnóstico (CID) e nunca traz o caminho do arquivo (o download é por link temporário).
      required: [id, funcionario, dataInicio, dataFim, horaInicio, horaFim, situacao, nomeArquivo, enviadoEmUtc, decididoEmUtc, decididoPorNome, motivoRecusa]
      properties:
        id: { type: integer }
        funcionario: { $ref: '#/components/schemas/FuncionarioResumo' }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date, description: 'Igual a `dataInicio` para um dia só.' }
        horaInicio: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Só no atestado de horas (então `dataInicio` = `dataFim`).' }
        horaFim: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        situacao: { $ref: '#/components/schemas/AtestadoSituacao' }
        nomeArquivo: { type: [string, 'null'], description: Nome do arquivo como a pessoa enviou. }
        enviadoEmUtc: { type: string, format: date-time }
        decididoEmUtc: { type: [string, 'null'], format: date-time }
        decididoPorNome: { type: [string, 'null'], description: Quem do RH decidiu. }
        motivoRecusa: { type: [string, 'null'], description: 'Obrigatório quando `RECUSADO`.' }

    AtestadoPagina:
      description: Página de atestados.
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          required: [itens]
          properties:
            itens: { type: array, items: { $ref: '#/components/schemas/Atestado' } }

    AtestadoEnviar:
      type: object
      required: [dataInicio, dataFim, arquivo]
      properties:
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date, description: Não pode ser antes de `dataInicio`. }
        horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Só no atestado de horas; vem junto com `horaFim`.' }
        horaFim: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Depois de `horaInicio`; só com `dataInicio` = `dataFim`.' }
        arquivo: { type: string, format: binary, description: 'PDF, JPG ou PNG, até 5 MB.' }

    AtestadoRecusar:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 500 }
