  /api/rh/ponto/pedidos-de-ajuste/{pedidoId}/aprovar:
    post:
      tags: [Pedidos de ajuste de ponto]
      operationId: aprovarPedidoDeAjusteComoRh
      summary: Aprova o pedido na etapa do RH e corrige o ponto.
      description: |
        Botão "Aprovar e corrigir o ponto" da tela 13. **Só o RH**. Segunda etapa: só vale depois de o gestor
        aprovar (ou de o gestor ausente ter aprovado a etapa dele), ou no pedido **sem etapa do gestor** (de quem é
        gestor, de setor sem gestor ou de gestor desligado). `podeDecidir` diz se o botão vale agora.

        Efeitos, **todos ou nenhum** (uma transação): aplica **todas** as batidas do pedido ao dia (batida nova vira
        linha nova; item com `marcacaoId` altera a batida existente), todas com `origem: CORRIGIDA_RH`; grava
        `status: APROVADA`, `etapa: CONCLUIDA` e `decisaoRh` (`decisao: APROVADA`, quem do RH confirmou, quando e a
        `observacao`, que substitui a do gestor); recalcula o banco de horas do dia; registra na auditoria (tabela nova da
        aplicação, script `V037`; a batida antiga fica no log). **A pessoa recebe e-mail com o resultado**
        (a decisão do RH, `CONVENCOES.md`, seção 12; fila de e-mails, tabela nova da aplicação, script `V035`). As
        batidas aplicadas levam também a data da correção em `DATA_CORRECAO` (`V039`).

        Recusas (os mesmos códigos das férias, `CONVENCOES.md`, seções 9 e 11):
        - 409 `PEDIDO_ETAPA_INCORRETA`: o pedido ainda está na etapa do gestor (`podeDecidir` é `false`);
        - 409 `PEDIDO_JA_DECIDIDO`: o pedido já foi decidido (outra aba ou outro RH);
        - 422 `PEDIDO_RH_FORA_DE_GESTORES`: o pedido não passou pelo gestor e quem decide **não está cadastrado
          como gestor** (o banco exige um `ID_GESTOR`, diferente da pessoa do pedido, na decisão final);
        - 422 `PEDIDO_PROPRIO`, com `regraDoBanco: O gestor nao pode analisar a propria solicitacao.`: o pedido não
          passou pelo gestor e quem do RH decide é a própria pessoa do pedido (que é gestor). Se o pedido passou
          pelo gestor, o RH **pode** confirmar o próprio pedido (ver a descrição da tag "Pedidos de ajuste de
          ponto"). Quando os dois casos valem ao mesmo tempo, vale `PEDIDO_PROPRIO`;
        - 422 `PONTO_SEQUENCIA_INVALIDA`: o dia mudou desde o pedido e, com os itens, não fecha mais em pares;
        - 409 `PONTO_BATIDA_DUPLICADA`: um dos instantes pedidos já existe no dia (o mesmo código do duplo clique ao
          bater ponto e da correção direta: já existe uma batida da pessoa nesse instante).
