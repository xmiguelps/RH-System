  # ------------------------------------------------------------------ GESTOR (/api/gestor)
  /api/gestor/ponto/equipe:
    get:
      tags: [Ponto]
      operationId: obterPontoDaEquipe
      summary: Mostra o ponto de hoje (ou de um dia) de toda a equipe do gestor.
      description: |
        Tela "Ponto da equipe" (54): os quatro cartões do topo e a tabela "Hoje no setor". **Só o gestor**, sobre
        **a equipe dele**: as pessoas **ativas** do setor de que ele é o gestor (um gestor responde por **um**
        setor), **sem o próprio gestor** (que usa `/api/eu/ponto`; a tela 54 conta 8 pessoas e não lista o gestor).
        É a mesma equipe de `GET /api/gestor/equipe` (fatia 1). Lista sem paginação (é limitada ao setor),
        ordenada por nome.

        **Situação de hoje.** Cada linha traz `situacaoHoje` (`SituacaoHoje` da base, `CONVENCOES.md` seção 10): é o
        chip "Trabalhando", "Férias", "Sem registro" etc. `TRABALHANDO` quer dizer **já registrou entrada hoje**,
        mesmo que já tenha saído. `periodoAberto` é um campo de apoio: `true` quando a última batida do dia é uma
        `ENTRADA` sem saída (a pessoa está dentro agora); `TRABALHANDO` com `periodoAberto: false` é "Saiu".
        `situacaoDoDia` é a situação **do dia no espelho** (`PontoDiaSituacao`, outro conceito: ver a tag "Ponto").

        `data` é opcional (padrão: hoje, fuso -03:00; não pode ser futura): é o campo "Hoje, 7 de outubro" da tela.
        **Para um dia passado** não existe "situação de hoje": `situacaoHoje` vem `null` em todas as linhas, a tela
        mostra `situacaoDoDia`, e `resumo.contagensHoje` é `null`. `horasAteAgoraMinutos` conta o período aberto até o
        relógio do servidor (hoje) ou é a soma do dia (dia passado); é `null` sem batida. O botão "Baixar espelho do
        setor" **não existe** (decisão do dono, design seção 7).

        **Cartões (`resumo`).** `contagensHoje` é o `PresencaContagens` da base, calculado desta mesma lista (o mesmo número de
        `GET /api/gestor/equipe`, fatia 1); o cartão "Trabalhando agora" é `contagensHoje.trabalhando`. `diaUtil` diz se o dia
        tem expediente. **Num dia sem expediente** (sábado, domingo ou feriado) o cartão mostra "Hoje não há expediente": quem já
        bateu entrada fica `TRABALHANDO` (a batida vence) e todas as outras pessoas ficam `SEM_EXPEDIENTE`. `pessoasSemRegistro`
        e `pessoasDeFerias` trazem as **pessoas** (nesta fatia são listas; o painel da fatia 7 só mostra o número): hoje
        são as de `situacaoHoje` `SEM_REGISTRO` e `FERIAS` (`AINDA_NAO_COMECOU` **não** entra em `pessoasSemRegistro`); num dia
        passado, as de `situacaoDoDia` `SEM_REGISTRO` e `FERIAS`. A tela mostra o primeiro nome e o resto é "e mais N".
        `pedidosParaAnalisar` conta os pedidos de ajuste que aguardam **este** gestor (`etapa=GESTOR`).
      x-perfis: [Gestor]
      parameters:
        - name: data
          in: query
          description: Dia consultado (fuso -03:00). Padrão hoje; não pode ser futuro.
