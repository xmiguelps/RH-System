      description: |
        Botão "Recusar" da tela 55. **Só o gestor da equipe** (outra equipe, pedido de outro gestor ou pedido do próprio
        gestor: 404). Se o gestor recusa, o pedido **acaba na hora**: `status: REJEITADA`, `etapa: CONCLUIDA`,
        `decisaoGestor` com `decisao: REJEITADA` e `decisaoRh: null`, e o RH não confirma. Nenhuma batida é alterada.
        **A pessoa recebe e-mail com o resultado** (`CONVENCOES.md`, seção 12; fila de e-mails, tabela nova da aplicação,
        script `V035`). `observacao` é opcional, vai em `decisaoGestor.observacao` e aparece para a pessoa. Mesmos
        erros da aprovação: 409 `PEDIDO_JA_DECIDIDO` e 409 `PEDIDO_ETAPA_INCORRETA`.
