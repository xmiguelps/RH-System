# Fatia 3: ponto (bater ponto, espelho, ajustes em duas etapas, feriados, banco de horas e atestado).
# Fontes: roadmap (fatia 3, linhas 145 a 175, e "Antes do congelamento"), spec 13.3/13.6, design seção 7,
# telas 04, 12, 13, 32 (cartão), 33, 47, 54, 55, 56 e os scripts V007 a V011, V023 e V028.
# Convenção de tempo (CONVENCOES.md, seção 3): instante = UTC terminando em Z; dia de calendário = date no fuso -03:00;
# horário do dia = HH:mm sem fuso; duração = minutos inteiros.
# Aprovação em duas etapas: CONVENCOES.md, seção 9 (um só modelo para o ponto e para as férias). Situação de hoje: seção 10.
# Hoje nos exemplos: 2026-10-07T12:42Z (09:42 em Brasília), com o elenco de ELENCO.md. Esta fonte é a dona dos pedidos de ajuste
# (301 a 307) e dos atestados (41 a 45) do "Cenário de hoje" do ELENCO.md; as outras fatias copiam os números daqui.
tags:
  - name: Ponto
    description: |
      Bater ponto, cartão "Seu ponto hoje", espelho do mês (próprio, da equipe e de qualquer pessoa, para o RH),
      correção direta de batidas pelo RH e exportação para a folha.
      **Tempo:** `data` é o dia de calendário no fuso -03:00 (`date`); `instanteUtc`, `agoraUtc` e os demais
      instantes vêm em UTC com `Z` e o front mostra em `America/Sao_Paulo`; `horarioEntrada` e `horarioSaida`
      são `HH:mm` sem fuso; durações são minutos inteiros (`Minutos`). O horário de cada batida é sempre o do
      servidor, nunca o do navegador. Por dentro, as colunas `DATETIME` do banco ficam em -03:00 e a API converte
      na fronteira (roadmap, decisão 4 de "Decisões que atravessam fatias").

      **Dois conceitos de "situação", que não se misturam:**
      - `SituacaoHoje` (definida em `00-base.yaml`, `CONVENCOES.md` seção 10) é a situação de uma pessoa **hoje**,
        para cartões e listas ("Hoje no setor", "presença agora"): `TRABALHANDO` é "já registrou entrada hoje"
        (mesmo que já tenha saído). Só existe para o dia de hoje.
      - `PontoDiaSituacao` é a situação **de um dia do espelho** (hoje ou qualquer dia passado), com valores que
        `SituacaoHoje` não tem (`ATRASO`, `INCOMPLETO`, `AJUSTE_EM_ANALISE`, `FALTA_COMPENSADA`...). Hoje, sem batida
        e antes do horário de entrada mais a tolerância, o espelho diz `SEM_REGISTRO` (ainda não há batida) e
        `SituacaoHoje` diz `AINDA_NAO_COMECOU`: o espelho não faz essa distinção.

      **Tabelas novas da aplicação** (scripts já escritos em `Banco de Dados/Scripts`): a **auditoria** (`V037`; a batida, a
      correção do RH e o acesso ao arquivo do atestado vão para ela), a **fila de e-mails** (`V035`; e-mail de resultado do
      pedido de ajuste) e as **tarefas agendadas** (`V036`; consolidação diária do banco de horas, importação e repetição
      anual de feriados). **Colunas novas** de tabelas do grupo: `PONTOS_MARCACOES.DATA_CORRECAO` (`V039`; o "quando" da
      correção do RH em `corrigidaEmUtc`) e `PONTOS_MANUTENCOES.CHAVE_PENDENTE` (`V040`; um só pedido pendente por dia e
      por pessoa).
  - name: Pedidos de ajuste de ponto
    description: |
      A pessoa pede a correção de um dia (uma ou várias batidas, um dia por pedido). Duas etapas: o gestor da
      equipe e depois o RH (`CONVENCOES.md`, seção 9: o mesmo modelo das férias). O `status` é o do banco
      (`PENDENTE`, `APROVADA`, `REJEITADA`) e só muda na decisão final; a `etapa` (`GESTOR`, `RH` ou `CONCLUIDA`) diz
      onde o pedido está.

      **Forma única das etapas** (a mesma das férias): todo pedido traz `gestorResponsavel` (`FuncionarioResumo` ou
      `null`), `decisaoGestor` e `decisaoRh` (as duas do schema `DecisaoDeEtapa` da base, `null` enquanto a etapa não foi
      decidida). Não há campos soltos de resultado, de data ou de observação fora delas: quem decidiu, quando e a
      observação da decisão estão dentro de cada uma. O instante em que o pedido acabou é o da última decisão
      (`decisaoRh.decididaEmUtc` ou, se o gestor recusou, `decisaoGestor.decididaEmUtc`).

      **Quando se pede e quando se decide:** o pedido é sempre criado **depois do dia a que se refere** (o dia precisa
      já ter passado) e decidido depois de criado.

      **Quem é gestor** (usado nas regras abaixo): quem tem uma linha em `GESTORES` (a lista de
      `GET /api/rh/gestores`, fatia 1). Li `Criacao_Tabelas:129-138` e o `V011`: `GESTORES` não tem coluna de situação; a
      linha vale enquanto a pessoa está ativa (`FUNCIONARIOS.ATIVO`), porque o banco recusa cadastrar gestor inativo
      (`Criacao_Triggers:154-168`). **O gestor de uma pessoa** é o gestor do setor dela (`SETORES.ID_GESTOR`, fatia 1;
      um gestor responde por **um** setor). **Só quem tem perfil `Gestor` é gestor de setor** (422
      `GESTOR_PRECISA_TER_PERFIL_GESTOR` na fatia 1): Ana Souza e Sofia Ramos, do RH, têm linha em `GESTORES` apenas para
      poderem decidir pedidos que não passam por gestor; não são gestoras de setor e não usam `/api/gestor/...`.

      **Sem etapa do gestor** (o pedido nasce com `etapa: RH`, `gestorResponsavel: null`, `decisaoGestor: null`): (1) o
      pedido é de quem é gestor (tem linha em `GESTORES`, como Carlos Ribeiro, Marina Costa, Paulo Vieira, Ana Souza e
      Sofia Ramos); (2) a pessoa está num setor sem gestor (Recursos Humanos, Administrativo, Tecnologia e Compras:
      Carla Mendes, João Pedro Alves, Vanessa Lima...); (3) o gestor do setor está desligado (inativo). Só o RH decide, e
      quem do RH decide precisa estar **também em `GESTORES`**: o trigger do banco exige um `ID_GESTOR` na decisão final
      e recusa quando ele é a própria pessoa do pedido (`Criacao_Triggers:547-561`; `V011`, linhas 27-30 e 46-52). Nos
      demais casos o pedido nasce com `etapa: GESTOR`.

      **Gestor ausente** (a ausência que antes se chamava "chave de aprovação automática"): é ligada pelo RH em
      `PUT /api/rh/gestores/{gestorId}/ausencia` (rota **da fatia 1**, Cadastros, tela 29; vale para o ponto e para as
      férias, por qualquer motivo, a qualquer momento). Esta fonte só descreve o efeito sobre os pedidos de ajuste:
      - com a ausência valendo, o pedido novo nasce com a etapa do gestor aprovada sozinha (`decisaoGestor` com
        `decisao: APROVADA`, `automatica: true` e `decididaPor: null`; `gestorResponsavel` é o gestor ausente) e já vai
        à etapa do RH;
      - **ao ligar**, a API aprova do mesmo jeito a etapa do gestor de **todos** os pedidos de ajuste dele que
        estavam parados (`etapa: GESTOR`), de qualquer dia: `decisaoGestor.decididaEmUtc` é o momento em que a ausência
        foi ligada. Escolha de engenharia (`CONVENCOES.md`, seção 9), a avisar o dono;
      - **ao desligar** (ou quando chega a data de volta: a ausência vale até o dia anterior a ela), os pedidos já
        aprovados seguem aprovados; só os pedidos novos voltam a esperar o gestor;
      - o gestor que tenta decidir um pedido que a ausência já passou adiante recebe 409 `PEDIDO_ETAPA_INCORRETA`.

      **Se o setor ficar sem gestor ativo** (gestor desligado, gestor tirado ou trocado no cadastro do setor, ou gestor
      que sai do setor: tudo isso é da fatia 1) enquanto um pedido espera o gestor, o pedido passa para `etapa: RH` sem
      etapa do gestor (`gestorResponsavel: null`, `decisaoGestor: null`), para não ficar parado para sempre. **Escolha
      minha** (os documentos não dizem), a avisar o dono.

      **A `etapa` é fixada na criação e só avança.** O pedido nasce em `GESTOR` ou em `RH` (pelas regras acima, olhando
      quem é o gestor **naquele momento**) e daí em diante só anda para frente: `GESTOR` para `RH` para `CONCLUIDA`.
      Nunca volta. Por isso, **se o setor ganhar um gestor depois**, o pedido que nasceu em `RH` **continua em `RH`**
      (com `gestorResponsavel: null` e `decisaoGestor: null`): o novo gestor não o recebe, e só o RH o decide. As
      **únicas** passagens de `GESTOR` para `RH` sem decisão do gestor são as dos parágrafos acima (gestor ausente e
      setor que fica sem gestor ativo).

      **Erros iguais nas duas fatias** (`CONVENCOES.md`, seções 9 e 11): decidir fora da vez é 409
      `PEDIDO_ETAPA_INCORRETA`; pedido que já foi decidido é 409 `PEDIDO_JA_DECIDIDO`; decidir o próprio pedido é 422
      `PEDIDO_PROPRIO`, **só onde o trigger recusa** (abaixo); decidir sem etapa do gestor sem estar em `GESTORES` é 422
      `PEDIDO_RH_FORA_DE_GESTORES`. **Nas rotas `/api/gestor/...`, o pedido de um gestor, o pedido do próprio gestor e o
      de outra equipe são 404** (fora do escopo, nunca 422). Decisão do dono (2026-10-30): **o RH pode recusar o que o
      gestor aprovou**. O atestado tem o código próprio `ATESTADO_JA_DECIDIDO` (ver a tag "Atestados").

      **O RH e o próprio pedido** (conferi `Criacao_Triggers:535-567`, `V011` e `Scripts\LEIA-ME.md:98`; as duas
      coisas valem). O trigger só compara o **`ID_GESTOR`** com a pessoa do pedido
      (`O gestor nao pode analisar a propria solicitacao.`); nenhuma regra do banco compara `ID_FUNCIONARIO_RH`
      (quem do RH confirmou) com ela, e o `LEIA-ME.md:98` diz que o dono aceitou "o RH pode confirmar o próprio
      pedido" e que por isso nenhum `CHECK` foi criado. Efeito, **inferido** dessas leituras (não rodei o banco):
      se o pedido **passou pelo gestor**, o `ID_GESTOR` é o do gestor e o RH, mesmo sendo a pessoa do pedido, confirma;
      se o pedido **não passou pelo gestor**, o `ID_GESTOR` vira o de quem do RH decide, e quem é a pessoa do pedido
      não pode decidi-lo (422 `PEDIDO_PROPRIO`). Se a **única** pessoa do RH cadastrada em `GESTORES` é também quem
      pediu, ninguém consegue decidir o pedido dela (aviso do `V011`, linhas 50-52).

      **Textos de `motivoNaoPodeDecidir`:** são **cinco textos fixos**, definidos no schema `PontoPedidoAjuste`; a
      fatia 7 os copia, palavra por palavra, para as férias.

      **Observação:** o banco guarda **uma só** observação por pedido (`PONTOS_MANUTENCOES.OBSERVACAO`, li
      `Criacao_Tabelas:301-311`). Enquanto o pedido espera o RH, ou depois de o gestor recusar, ela é a do gestor e vem em
      `decisaoGestor.observacao`; quando o RH decide, a dele a substitui: vem em `decisaoRh.observacao` e
      `decisaoGestor.observacao` passa a `null` (a do gestor fica no log de auditoria). Mostrar as duas ao mesmo tempo
      pediria uma coluna nova (script a numerar pelo dono), o que não foi pedido.

      **E-mail de resultado** (`CONVENCOES.md`, seção 12): a pessoa recebe um e-mail **a cada decisão**, ao aprovar ou ao
      recusar: a do gestor (aprovar passa o pedido ao RH; recusar o encerra) e a do RH. **Criar** o pedido não manda
      e-mail. A etapa do gestor aprovada sozinha pelo "gestor ausente" não é decisão de ninguém e **não** manda e-mail
      (escolha minha, a avisar o dono): a pessoa só recebe quando o RH decide. A correção direta do RH
      (`PUT .../ponto/dias/{dia}`) também **não** manda. O e-mail leva o resultado, quem decidiu e a observação, se houver;
      o envio passa pela **fila de e-mails** (tabela nova da aplicação, script `V035`) e uma falha de envio
      não desfaz a decisão. A pessoa vê o resultado também em "Meus pedidos de ajuste".
  - name: Banco de horas
    description: Saldo e extrato do banco de horas. Só lançamentos automáticos (Crédito e Débito); não há lançamento manual, folga nem compensação.
  - name: Feriados
    description: Feriados nacionais e estaduais (automáticos, UF da empresa) e municipais (cadastrados pelo RH; valem para todos, sem unidades).
  - name: Atestados
    description: |
      O funcionário envia o atestado (dado de saúde); o gestor da equipe vê o arquivo; só o RH valida ou recusa.
      Validado vira "Falta compensada". O acesso ao arquivo fica registrado na auditoria (tabela nova da aplicação,
      script `V037`), na área `ATESTADOS` (`AuditoriaArea`, fatia 1; ação `BAIXOU`). **Só o atestado validado, de dia inteiro, faz a pessoa aparecer como `ATESTADO` em
      `SituacaoHoje`**: enquanto está `ENVIADO` (esperando o RH) ela não aparece (hoje, Carla Mendes e João Pedro Alves,
      atestados 43 e 44).

      **Código de erro:** `ATESTADO_JA_DECIDIDO` (409) é do atestado, que tem **uma só** decisão (validar ou recusar). É
      outra coisa que `PEDIDO_JA_DECIDIDO`, que é dos pedidos em duas etapas (ajuste de ponto e férias, `CONVENCOES.md`,
      seção 9) e não se usa aqui.

paths:
  # ------------------------------------------------------------------ A PRÓPRIA PESSOA (/api/eu)
  /api/eu/ponto/hoje:
    get:
      tags: [Ponto]
      operationId: obterPontoHoje
      summary: Mostra o cartão "Seu ponto hoje" (batidas do dia, próxima batida e saldo do banco de horas).
      description: |
        Dados da **própria pessoa logada** (qualquer perfil, inclusive gestor e RH). Alimenta o cartão da tela
        inicial (tela 32) e o cabeçalho de "Meu ponto" (telas 33 e 47).

        - `agoraUtc` é o relógio do servidor; o front usa para o relógio grande e para somar o tempo desde a
          última batida. O relógio do navegador nunca decide nada.
        - `dataDoPonto` é o dia do ponto a que `periodos` pertence: normalmente hoje (fuso -03:00). Só é o dia
          anterior no caso da jornada que atravessa a meia-noite (ver `proximaMarcacao`).
        - `proximaMarcacao.tipo` é `ENTRADA` quando o dia não tem batida ou a última é `SAIDA`, e `SAIDA` quando
          a última é `ENTRADA`. Se o dia anterior terminou com uma `ENTRADA` sem saída, ainda não houve batida
          hoje e essa entrada foi há menos de 12 horas, a próxima é a `SAIDA` desse dia anterior.
        - O cartão tem quatro lugares (Entrada, Saída almoço, Volta, Saída), preenchidos pela `ordem` 1 a 4 das
          batidas; a tela 33 mostra uma versão reduzida (só entrada e saída) com o mesmo dado.
        - `bancoHoras.saldoMinutos` é a **soma dos minutos de cada linha** do banco de horas: cada linha
          (`BANCOS_HORAS.QUANTIDADE`, em horas) é convertida para minutos e só depois somada (`CREDITO` soma,
          `DEBITO` subtrai). Somar as horas e converter no fim erra até alguns minutos. A função do banco
          `FN_CALCULAR_SALDO_BANCO_HORAS` soma horas, por isso **não** serve para este campo. Detalhes em
          `GET /api/eu/ponto/banco-de-horas`.
        - `bancoHoras.atualizadoAte` é o **último dia consolidado**, **global** (o mesmo para todas as pessoas; não é
          por pessoa), e vem da tarefa agendada de consolidação do banco de horas (`TAREFAS_AGENDADAS`, script
          `V036`). Ver `GET /api/eu/ponto/banco-de-horas`. É o "Atualizado até ontem".
      x-perfis: [Funcionario, Gestor, RH]
      responses:
        '200':
          description: O cartão de hoje.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PontoHoje' }
              example:
                dataDoPonto: '2026-10-07'
                agoraUtc: '2026-10-07T12:42:10Z'
                jornada: { cargaSemanalMinutos: 2640, cargaDiariaMinutos: 528, horarioEntrada: '08:00', horarioSaida: '17:48', toleranciaAtrasoMinutos: 10 }
                periodos: []
                proximaMarcacao: { tipo: ENTRADA, rotulo: Entrada, textoDoBotao: Registrar entrada }
                bancoHoras: { saldoMinutos: 380, atualizadoAte: '2026-10-06' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/ponto/marcacoes:
    post:
      tags: [Ponto]
      operationId: registrarMarcacaoDePonto
      summary: Bate o ponto agora (entrada ou saída), com a hora do servidor.
      description: |
        Para a **própria pessoa logada** (qualquer perfil). O horário é o do servidor; o corpo só diz **qual
        batida a pessoa acha que está fazendo** (`tipoEsperado`, o que o botão do cartão mostrava).

        - Se o tipo que o servidor calcularia agora (ver `proximaMarcacao` em `GET /api/eu/ponto/hoje`) é outro
          (a pessoa bateu em outra aba, por exemplo), nada é gravado: 409 `PONTO_SEQUENCIA_MUDOU`, e o front
          recarrega o cartão.
        - Duas batidas no mesmo segundo (duplo clique): 409 `PONTO_BATIDA_DUPLICADA` (o mesmo código de "já existe uma
          batida da pessoa neste instante", também usado na correção direta do RH e na aprovação de pedido). O front
          também desabilita o botão enquanto a chamada está em andamento.
        - O dia do ponto é criado junto, vazio, se ainda não existir. A carga do dia vem do cargo (semanal ÷ 5).
        - Bater em feriado, folga ou férias é aceito (a batida entra como qualquer outra e vira hora extra).
          **Escolha minha:** os documentos não proíbem e um teste do roadmap cobre "ponto em feriado".
        - A batida é registrada na auditoria (com IP e origem; tabela nova da aplicação, script `V037`).
        - A primeira entrada do dia faz a pessoa passar a `TRABALHANDO` em `SituacaoHoje` (e continua assim mesmo
          depois da saída).
        - Recusas do banco (422, mensagem original em `regraDoBanco`): `Nao e possivel registrar ponto de
          funcionario inativo.` (com `codigo: FUNCIONARIO_INATIVO`, o mesmo de todas as fatias), `A data do ponto e
          anterior a admissao.`, `A data do ponto e posterior ao desligamento.`
      x-provisorio: "Jornada que atravessa a meia-noite: até quantas horas depois de uma entrada sem saída a próxima batida ainda conta como a saída daquele dia? O contrato assume 12 horas. Se o dono decidir outro valor, mudam só `proximaMarcacao` e a regra do dia do ponto, não os campos."
      x-perfis: [Funcionario, Gestor, RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PontoMarcacaoRegistrar' }
            example: { tipoEsperado: ENTRADA }
      responses:
        '201':
          description: Batida gravada; devolve o cartão já atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PontoHoje' }
              example:
                dataDoPonto: '2026-10-07'
                agoraUtc: '2026-10-07T12:42:40Z'
                jornada: { cargaSemanalMinutos: 2640, cargaDiariaMinutos: 528, horarioEntrada: '08:00', horarioSaida: '17:48', toleranciaAtrasoMinutos: 10 }
                periodos:
                  - entrada: { id: 8816, ordem: 1, tipo: ENTRADA, rotulo: Entrada, instanteUtc: '2026-10-07T12:42:40Z', origem: SISTEMA, corrigidaEmUtc: null }
                    saida: null
                proximaMarcacao: { tipo: SAIDA, rotulo: Saída almoço, textoDoBotao: Registrar saída para almoço }
                bancoHoras: { saldoMinutos: 380, atualizadoAte: '2026-10-06' }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '409':
          description: A sequência mudou ou a batida é duplicada. Nada foi gravado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              examples:
                sequenciaMudou:
                  summary: O próximo tipo não é o que a pessoa esperava
                  value:
                    title: A sequência do ponto mudou.
                    status: 409
                    detail: O seu ponto mudou desde a última vez que você abriu a tela. Confira e tente de novo.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_SEQUENCIA_MUDOU
                duplicada:
                  summary: Duas batidas no mesmo segundo
                  value:
                    title: Batida duplicada.
                    status: 409
                    detail: O seu ponto já foi registrado agora há pouco.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_BATIDA_DUPLICADA
        '422':
          description: O banco recusou (funcionário inativo, dia anterior à admissão ou posterior ao desligamento).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                funcionarioInativo:
                  summary: A pessoa está inativa
                  value:
                    title: Colaborador inativo.
                    status: 422
                    detail: Este colaborador está inativo e não pode registrar ponto.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_INATIVO
                    regraDoBanco: Nao e possivel registrar ponto de funcionario inativo.
                anteriorAAdmissao:
                  summary: O dia é anterior à admissão
                  value:
                    title: Operação recusada.
                    status: 422
                    detail: A operação foi recusada por uma regra do banco de dados.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    regraDoBanco: A data do ponto e anterior a admissao.
        '500': { $ref: '#/components/responses/Erro500Interno' }

  /api/eu/ponto/espelho:
    get:
      tags: [Ponto]
      operationId: obterMeuEspelhoDePonto
      summary: Mostra o espelho de ponto do mês da própria pessoa.
      description: |
        Tela "Meu ponto" (33 e 47) e a lista curta do mês. **Própria pessoa**, qualquer perfil.
        `ano` e `mes` são opcionais (padrão: o mês atual no fuso -03:00). Os dias vêm em ordem crescente, do dia 1
        até hoje (mês corrente) ou até o último dia (mês passado); mês futuro devolve `dias: []`. Dias antes da
        admissão e depois do desligamento não aparecem. As regras de cada campo do dia estão em
        `PontoEspelhoDia` e `PontoDiaSituacao`.

        `podePedirAjuste` diz se a linha mostra o botão "Pedir ajuste" (dia que já passou, sem pedido em análise e
        com expediente ou com batidas). O botão "Pedir ajuste" do topo abre o mesmo pedido, com o campo "Dia do
        ponto" para escolher qualquer dia passado.
      x-perfis: [Funcionario, Gestor, RH]
      parameters:
        - $ref: '#/components/parameters/PontoAno'
        - $ref: '#/components/parameters/PontoMes'
      responses:
        '200':
          description: O espelho do mês.
