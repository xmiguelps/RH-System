  /api/rh/funcionarios/{funcionarioId}/ponto/dias/{dia}:
    put:
      tags: [Ponto]
      operationId: corrigirMarcacoesDoDia
      summary: O RH corrige direto as batidas de um dia (botão "Editar" do espelho).
      description: |
        Botão "Editar" da tela 12 (o modal de edição não está no Figma; esta é a forma mais simples). **Só o RH**.
        Corrigir batida **não passa pela segunda etapa** (decisão do dono, 2026-10-29) e **não manda e-mail** (o e-mail
        de resultado é só dos pedidos de ajuste decididos, `CONVENCOES.md`, seção 12). Substitui a lista de batidas
        do dia pelo que vem em `marcacoes`:
        - item com `id`: é a batida existente; se `tipo` ou `instanteUtc` mudou, ela vira `origem: CORRIGIDA_RH`;
        - item sem `id`: batida nova, já com `origem: CORRIGIDA_RH`;
        - batida existente que **não vem** na lista é removida (é como o RH tira uma batida duplicada).
        O dia, depois da correção, precisa fechar em pares `ENTRADA`/`SAIDA` alternados e em ordem
        (422 `PONTO_SEQUENCIA_INVALIDA`); cada instante cai no dia ou no dia seguinte
        (422 `PONTO_INSTANTE_FORA_DO_DIA`) e não pode ser futuro (422 `PONTO_INSTANTE_NO_FUTURO`).

        - 409 `PONTO_DIA_COM_PEDIDO_EM_ANALISE`: o dia tem pedido de ajuste em análise; decida o pedido antes
          (na linha o botão é "Revisar pedido", não "Editar").
        - 409 `PONTO_BATIDA_DUPLICADA`: dois instantes iguais no dia (é o mesmo código do duplo clique em
          `registrarMarcacaoDePonto` e da aprovação de pedido: já existe uma batida da pessoa nesse instante);
        - 409 `PONTO_MARCACAO_EM_USO`: remover uma batida que um pedido de ajuste já usou como alvo (o banco
          impede apagar essa batida).

        Depois de gravar, o banco de horas do dia é recalculado e o fato vai para a auditoria (tabela nova da aplicação,
        script `V037`; a batida antiga fica no log). As batidas corrigidas ou incluídas levam `origem: CORRIGIDA_RH` e a
        data da correção na coluna `DATA_CORRECAO` (`V039`), gravadas juntas. Devolve o dia já corrigido. O banco ainda recusa dia anterior à admissão e
        funcionário inativo (422, `regraDoBanco`; o de pessoa inativa traz `codigo: FUNCIONARIO_INATIVO`).
      x-perfis: [RH]
      parameters:
        - { name: funcionarioId, in: path, required: true, schema: { type: integer } }
        - { name: dia, in: path, required: true, description: 'Dia do ponto (fuso -03:00).', schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PontoDiaCorrigir' }
            example:
              marcacoes:
                - { id: 8812, tipo: ENTRADA, instanteUtc: '2026-10-06T10:58:00Z' }
                - { id: 8813, tipo: SAIDA, instanteUtc: '2026-10-06T15:00:00Z' }
                - { id: 8814, tipo: ENTRADA, instanteUtc: '2026-10-06T16:00:00Z' }
                - { id: 8815, tipo: SAIDA, instanteUtc: '2026-10-06T20:58:00Z' }
      responses:
        '200':
          description: O dia depois da correção.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PontoEspelhoDia' }
              example:
                data: '2026-10-06'
                diaDaSemana: TERCA
                ehHoje: false
                situacao: NORMAL
                nomeFeriado: null
                periodos:
                  - entrada: { id: 8812, ordem: 1, tipo: ENTRADA, rotulo: Entrada, instanteUtc: '2026-10-06T10:58:00Z', origem: SISTEMA, corrigidaEmUtc: null }
                    saida: { id: 8813, ordem: 2, tipo: SAIDA, rotulo: Saída almoço, instanteUtc: '2026-10-06T15:00:00Z', origem: SISTEMA, corrigidaEmUtc: null }
                  - entrada: { id: 8814, ordem: 3, tipo: ENTRADA, rotulo: Volta, instanteUtc: '2026-10-06T16:00:00Z', origem: SISTEMA, corrigidaEmUtc: null }
                    saida: { id: 8815, ordem: 4, tipo: SAIDA, rotulo: Saída, instanteUtc: '2026-10-06T20:58:00Z', origem: CORRIGIDA_RH, corrigidaEmUtc: '2026-10-07T12:20:00Z' }
                horasMinutos: 540
                cargaMinutos: 528
                saldoMinutos: 12
                atrasoMinutos: null
                pedidoEmAnaliseId: null
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '404': { $ref: '#/components/responses/Erro404NaoEncontrado' }
        '409':
          description: O dia tem pedido em análise, instantes repetidos ou uma batida em uso por um pedido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              examples:
                pedidoEmAnalise:
                  summary: O dia tem pedido de ajuste em análise
                  value:
                    title: O dia tem um pedido em análise.
                    status: 409
                    detail: Responda o pedido de ajuste deste dia antes de editar as batidas.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_DIA_COM_PEDIDO_EM_ANALISE
                marcacaoEmUso:
                  summary: A batida removida é alvo de um pedido de ajuste
                  value:
                    title: Batida em uso.
                    status: 409
                    detail: Esta batida está ligada a um pedido de ajuste e não pode ser removida.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_MARCACAO_EM_USO
                batidaDuplicada:
                  summary: 'Dois horários iguais no mesmo dia'
                  value:
                    title: Batida duplicada.
                    status: 409
                    detail: Há duas batidas no mesmo horário neste dia. Corrija os horários.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_BATIDA_DUPLICADA
        '422':
          description: Sequência inválida, instante fora do dia ou no futuro, ou recusa do banco.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              examples:
                sequenciaInvalida:
                  summary: Com estas batidas o dia continuaria com ponto aberto
                  value:
                    title: Batidas inconsistentes.
                    status: 422
                    detail: Com estas batidas o dia continua com uma entrada sem saída. Confira os horários.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: PONTO_SEQUENCIA_INVALIDA
                funcionarioInativo:
                  summary: A pessoa está inativa
                  value:
                    title: Colaborador inativo.
                    status: 422
                    detail: Este colaborador está inativo e o ponto dele não pode mais ser alterado.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                    codigo: FUNCIONARIO_INATIVO
                    regraDoBanco: Nao e possivel registrar ponto de funcionario inativo.
        '500': { $ref: '#/components/responses/Erro500Interno' }

