  /api/rh/ponto/feriados:
    get:
      tags: [Feriados]
      operationId: listarFeriados
      summary: Lista os feriados do mês (ou do ano) que valem para a empresa.
      description: |
        Bloco "Feriados deste mês" da tela 12. **Só o RH**. Devolve os que valem para a empresa: nacionais,
        estaduais da UF da empresa e municipais do município da empresa (configuração da empresa, fatia 1c), mais
        os do tipo `EMPRESA` se existirem. Lista curta, **sem paginação**, por data. `mes` vazio devolve o ano
        todo. Só `ativo: true`, a menos que `incluirInativos=true`. Nacionais e estaduais "entram sozinhos"
        (importados automaticamente pelo agendador, que depende da tabela nova de tarefas agendadas da aplicação, script
        `V036`) e não se editam (`podeEditar: false`). A tabela do banco já
        traz os nacionais de 2026 sem acento nos nomes; a API devolve os nomes como estão guardados. Se a empresa
        ainda não tem UF e município configurados (Cadastros > Empresa, fatia 1), esta lista **não dá erro**: vêm só
        os nacionais e os do tipo `EMPRESA` (**escolha minha**, para a tela abrir numa instalação nova). O erro
        `EMPRESA_NAO_CONFIGURADA` fica para quem precisa dessa configuração para gravar (cadastrar feriado municipal).
      x-perfis: [RH]
      parameters:
        - { name: ano, in: query, required: true, description: 'Ano dos feriados.', schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: mes, in: query, description: 'Mês (1 a 12). Sem ele, o ano todo.', schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: incluirInativos, in: query, description: 'Inclui os feriados desativados.', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Os feriados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeriadoLista' }
              example:
                itens:
                  - { id: 6, nome: Nossa Senhora Aparecida, data: '2026-10-12', tipo: NACIONAL, uf: null, municipio: null, repeteTodoAno: false, ativo: true, podeEditar: false }
                  - { id: 41, nome: Dia de São Judas Tadeu, data: '2026-10-28', tipo: MUNICIPAL, uf: SP, municipio: São Paulo, repeteTodoAno: true, ativo: true, podeEditar: true }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '500': { $ref: '#/components/responses/Erro500Interno' }
    post:
      tags: [Feriados]
      operationId: criarFeriado
      summary: Cadastra um feriado municipal (vale para todos).
      description: |
        Formulário "Adicionar feriado municipal" da tela 12 (nome, data, "Repetir todos os anos"). **Só o RH**.
        O tipo é sempre `MUNICIPAL`; UF e município vêm da **configuração da empresa** (o campo "Vale para: Todas
        as unidades" do Figma não existe, porque não há unidades). Sem configuração da empresa, 422
        `EMPRESA_NAO_CONFIGURADA` (o mesmo código da leitura da empresa na fatia 1, que lá devolve 404; aqui é uma
        operação que precisa da configuração, então é 422, `CONVENCOES.md`, seção 11). "Repetir todos os anos" só faz sentido para feriado de data fixa: o agendador
        cria o registro do ano seguinte copiando nome, dia, mês, UF e município, sem duplicar o que já existe.
        Já existir um feriado com a mesma data e o mesmo nome: 409 `FERIADO_DUPLICADO` (chave única do banco).
      x-perfis: [RH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeriadoCriar' }
            example: { nome: Dia de São Judas Tadeu, data: '2026-10-28', repeteTodoAno: true }
      responses:
        '201':
          description: Feriado cadastrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feriado' }
              example: { id: 41, nome: Dia de São Judas Tadeu, data: '2026-10-28', tipo: MUNICIPAL, uf: SP, municipio: São Paulo, repeteTodoAno: true, ativo: true, podeEditar: true }
        '400': { $ref: '#/components/responses/Erro400Validacao' }
        '401': { $ref: '#/components/responses/Erro401NaoAutenticado' }
        '403': { $ref: '#/components/responses/Erro403SemPermissao' }
        '409':
          description: Já existe feriado com a mesma data e o mesmo nome.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeApi' }
              example:
                title: Feriado repetido.
                status: 409
                detail: Já existe um feriado com este nome nesta data.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: FERIADO_DUPLICADO
        '422':
          description: A empresa ainda não tem configuração (UF e município).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaDeRegraDeNegocio' }
              example:
                title: Empresa não configurada.
                status: 422
                detail: Cadastre a UF e o município da empresa antes de criar feriados municipais.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: EMPRESA_NAO_CONFIGURADA
        '500': { $ref: '#/components/responses/Erro500Interno' }

