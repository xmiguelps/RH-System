        Botão "Enviar atestado" (telas 32, 33 e 47). **Própria pessoa**, qualquer perfil. `multipart/form-data`.

        - Arquivo: PDF, JPG ou PNG, até 5 MB (**escolha minha**; o roadmap só fixa 5 MB para holerite). O arquivo
          só é guardado depois de a regra do banco aprovar; sobras são limpas por um job.
        - Atestado de **dias inteiros**: `dataInicio` e `dataFim` (iguais para um dia só), sem horas.
        - Atestado de **algumas horas**: `horaInicio` e `horaFim` juntas, só com `dataInicio` = `dataFim`, e
          `horaFim` depois de `horaInicio`; só esse período é compensado.
        - A aplicação não guarda diagnóstico (CID). Nasce `ENVIADO` (aguardando o RH).
        - Erros de campo vêm em 400 (`errors`): fim antes do início, horas sem o par, horas com mais de um dia,
          arquivo de tipo ou tamanho não aceito.
