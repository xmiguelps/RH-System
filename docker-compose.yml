# MySQL local para desenvolvimento e para a integração do front.
# O banco nasce VAZIO: quem cria as tabelas é o executor de scripts da API (back-end/), não este compose.
# Os parâmetros do servidor valem também para os testes (MySqlFixture) e para o Azure:
#   --default-time-zone=-03:00            os triggers do grupo usam CURDATE() e NOW() (Brasil, sem horário de verão)
#   --log-bin-trust-function-creators=1   com o log binário ligado (padrão do mysql:8.4), o usuário restrito do banco
#                                         recebe o erro 1419 ao criar o primeiro trigger sem este parâmetro
services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-03:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rh_system}
    ports:
      - "${MYSQL_PORTA:-3306}:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 evita o servidor temporário de inicialização, que só atende por socket.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Captador de e-mail de desenvolvimento: a API envia por SMTP para cá e os e-mails aparecem em http://localhost:8025 (nada sai para a internet).
  # Versão estável fixada (conferida em 2026-11-04, v1.31.6 de 15/10/2026); nunca "latest". Os testes usam a mesma imagem (MailpitFixture).
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_SMTP_PORTA:-1025}:1025"
      - "${MAILPIT_UI_PORTA:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mysql_dados:
